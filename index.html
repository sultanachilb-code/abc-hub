<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABC Operations Hub</title>
<meta name="theme-color" content="#2A0F45">
<script>/* theme before first paint — Light unless the person chose Dark or Automatic */try{var t=localStorage.getItem("hub.theme");try{t=JSON.parse(t)}catch(e){}if(!t)t="light";if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<meta name="description" content="ABC Operations — all operational systems in one app">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/abc-48.png">
<link rel="apple-touch-icon" href="icons/abc-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A0F45; --brand:#4A1F73; --brand-2:#7B4BB0; --gold:#C8A24A;
  --paper:#F6F4F9; --surface:#FFFFFF; --line:#E3DCEC; --text:#221A2E; --muted:#6D6479;
  --ok:#2E8B57; --warn:#C07A12; --alert:#C0392B;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bar:52px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#16101F; --surface:#211930; --line:#342A45; --text:#EFEAF5; --muted:#A99EB8; --ok:#5FD08A; --warn:#F0B44C; --alert:#FF7A6B; }
}
:root[data-theme="dark"]{ --paper:#16101F; --surface:#211930; --line:#342A45; --text:#EFEAF5; --muted:#A99EB8; --ok:#5FD08A; --warn:#F0B44C; --alert:#FF7A6B; color-scheme:dark; }
:root[data-theme="light"]{ color-scheme:light; }
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.view{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- shared form bits ---------- */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:.95rem;outline:none}
.field textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:.92rem;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.small{height:34px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:wait}
.msg{font-size:.88rem;padding:10px 12px;border-radius:10px;margin-bottom:14px}
.msg.err{background:rgba(192,57,43,.12);color:var(--alert)}
.msg.okm{background:rgba(46,139,87,.12);color:var(--ok)}

/* ---------- sign-in ---------- */
/* sign-in: a dark atrium — slow rings, a gold arc, a floor scale — with the brand panel on the left and the card on the right */
#auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);align-items:center;gap:clamp(24px,5vw,80px);padding:clamp(20px,5vw,72px);
  background:radial-gradient(1200px 700px at 18% 20%,#4A1F73 0%,rgba(74,31,115,0) 60%),radial-gradient(900px 600px at 90% 110%,#3A1A5E 0%,rgba(58,26,94,0) 55%),#1B0A2E;color:#fff;isolation:isolate;overflow-x:hidden}
.auth-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.auth-bg svg{position:absolute;width:min(1300px,140vw);height:auto;left:-18%;top:50%;transform:translateY(-50%);opacity:.9}
.auth-bg .ring{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.2;transform-origin:600px 600px;animation:authSpin 140s linear infinite}
.auth-bg .ring.r2{stroke:rgba(255,255,255,.05);animation-duration:200s;animation-direction:reverse;stroke-dasharray:2 10}
.auth-bg .ring.r3{stroke:rgba(200,162,74,.18);stroke-width:1.6;stroke-dasharray:520 2400;animation-duration:60s}
.auth-bg .arc{fill:none;stroke:url(#authGold);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:authDraw 2.4s .3s cubic-bezier(.2,.8,.2,1) forwards}
.auth-bg .dots circle{fill:rgba(255,255,255,.16)}
.auth-bg .floors{position:absolute;right:clamp(14px,3vw,40px);top:50%;transform:translateY(-50%);display:grid;gap:14px;font:800 .62rem/1 var(--font);letter-spacing:.2em;color:rgba(255,255,255,.22)}
.auth-bg .floors span{display:flex;gap:8px;align-items:center}.auth-bg .floors span::before{content:"";width:22px;height:1px;background:currentColor}
.auth-bg .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay;opacity:.5}
@keyframes authSpin{to{transform:rotate(360deg)}}
@keyframes authDraw{to{stroke-dashoffset:0}}
@keyframes authUp{from{opacity:0;transform:translateY(14px)}}
.auth-brand{max-width:560px;justify-self:end;animation:authUp .8s .1s cubic-bezier(.2,.8,.2,1) both}
.auth-brand .mark{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;backdrop-filter:blur(6px);margin-bottom:28px}
.auth-brand .mark img{width:46px}
.auth-brand .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.auth-brand h2{font-size:clamp(2rem,3.6vw,3.1rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:10px 0 14px}
.auth-brand h2 em{font-style:normal;background:linear-gradient(90deg,#E9CF8A,#C8A24A);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand p{color:rgba(255,255,255,.72);font-size:1rem;line-height:1.6;max-width:440px}
.auth-brand p[dir=rtl]{font-size:.92rem;margin-top:6px;color:rgba(255,255,255,.55)}
.auth-flags{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 30px}
.auth-flags span{padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font-size:.78rem;font-weight:700;color:rgba(255,255,255,.85)}
.auth-clock{display:flex;gap:16px;align-items:center;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);max-width:440px}
.auth-clock b{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.auth-clock small{display:block;color:rgba(255,255,255,.6);font-size:.8rem;line-height:1.45}
.auth-card{width:min(460px,100%);background:var(--surface);color:var(--text);border-radius:26px;padding:34px 30px;box-shadow:0 30px 80px rgba(8,2,18,.55),0 0 0 1px rgba(255,255,255,.06);animation:authUp .7s .2s cubic-bezier(.2,.8,.2,1) both;position:relative}
.auth-foot{grid-column:1/-1;text-align:center;font-size:.72rem;color:rgba(255,255,255,.4);letter-spacing:.04em;align-self:end}
@media (max-width:900px){
  #auth{grid-template-columns:1fr;justify-items:center;align-content:center;gap:22px}
  .auth-brand{justify-self:center;text-align:center;max-width:460px}
  .auth-brand .mark,.auth-brand p,.auth-flags,.auth-clock{display:none}
  .auth-brand h2{font-size:1.5rem;margin:6px 0 0}
  .auth-bg svg{left:50%;top:-6%;transform:translateX(-50%);width:170vw}
  .auth-bg .floors{display:none}
  .auth-card{padding:28px 22px}
}
@media (min-width:901px){ #authCard > .logo{display:none} }
@media (prefers-reduced-motion:reduce){ .auth-bg .ring,.auth-bg .arc,.auth-brand,.auth-card{animation:none} .auth-bg .arc{stroke-dashoffset:0} }
.auth-card .logo{width:64px;height:64px;border-radius:18px;background:var(--ink);display:grid;place-items:center;margin-bottom:18px}
.auth-card .logo img{width:42px}
.auth-card h1{font-size:1.4rem;font-weight:800}
.auth-card p.sub{color:var(--muted);font-size:.92rem;margin:4px 0 22px;line-height:1.45}
.auth-card .btn{width:100%;margin-top:6px}

/* ---------- Two-step login feature ---------- */
.tf-num{font-size:3.4rem;font-weight:800;letter-spacing:.06em;text-align:center;color:var(--brand);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.tf-wait{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.86rem;margin-bottom:14px}
.tf-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand-2);animation:tfspin 1s linear infinite}
@keyframes tfspin{to{transform:rotate(360deg)}}
.tf-links{display:grid;gap:4px;margin-top:10px;text-align:center}
.tf-links button{color:var(--brand-2);font-weight:700;font-size:.86rem;padding:6px}
.tf-code{font-size:1.5rem!important;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.tf-tick{width:96px;height:96px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;background:#1E9E5A;color:#fff;animation:tfpop .45s cubic-bezier(.2,1.5,.4,1) both}
.tf-tick.no{background:var(--alert)}
.tf-tick svg{width:52px;height:52px;stroke-dasharray:60;stroke-dashoffset:60;animation:tfdraw .5s .2s ease forwards}
@keyframes tfpop{from{transform:scale(.2);opacity:0}}
@keyframes tfdraw{to{stroke-dashoffset:0}}
.tf-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tf-picks button{height:74px;border-radius:18px;border:2px solid var(--line);font-size:1.9rem;font-weight:800;color:var(--text);background:var(--surface)}
.tf-picks button:active{transform:scale(.96);border-color:var(--brand-2)}
.tf-dev{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:6px 0 4px}
.tf-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.tf-row .main{flex:1;min-width:0}.tf-row b{display:block;font-size:.92rem}.tf-row small{color:var(--muted);font-size:.8rem}
.tf-on{font-size:.72rem;font-weight:800;color:var(--ok);background:rgba(46,139,87,.12);border-radius:999px;padding:2px 8px;margin-left:6px}
.pf-mob{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:0}
.pf-mob input{height:34px;width:150px;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:0 10px;font:inherit;font-size:.86rem;text-align:right}
.wl-hero{display:flex;gap:14px;align-items:center;padding:20px 22px;background:linear-gradient(135deg,#2A0F45,#4A1F73);color:#fff}
.wl-hero img{width:46px;height:46px;object-fit:contain}
.wl-hero b{display:block;font-size:1.12rem}
.wl-hero small{display:block;opacity:.85;font-size:.82rem;line-height:1.45;margin-top:3px}
.wl-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.wl-row.ok{background:rgba(46,139,87,.06);border-color:rgba(46,139,87,.3)}
.wl-row .main{flex:1;min-width:0}.wl-row b{display:block;font-size:.92rem}.wl-row small{display:block;color:var(--muted);font-size:.78rem;line-height:1.4}
.wl-ic{font-size:1.4rem;width:36px;text-align:center;flex:none}
.wl-ok{color:var(--ok);font-weight:800;font-size:.84rem;white-space:nowrap}
.wl-na{color:var(--muted);font-size:.74rem;max-width:120px;text-align:right}
.tf-pk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--paper);font-size:.84rem}
.tf-pk small{grid-column:1;color:var(--muted);font-size:.74rem}
.tf-pk .btn{grid-column:2;grid-row:1/3}
.tf-big{width:100%;height:auto!important;min-height:52px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-direction:row;flex-wrap:wrap;font-size:.98rem}
.tf-big small{flex-basis:100%;text-align:center}
.tf-key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.08em;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;margin:8px 0;word-break:break-all}
.tf-qr{display:grid;place-items:center;margin:8px 0}.tf-qr img{width:168px;height:168px;image-rendering:pixelated;background:#fff;padding:6px;border-radius:10px}
.tf-bc{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.tf-bc span{background:var(--paper);border-radius:8px;padding:7px;text-align:center;font-weight:700}
.tf-note{font-size:.8rem;color:var(--muted);line-height:1.45}
.tf-trust{display:flex;align-items:center;gap:8px;font-size:.86rem;margin:10px 0 0;cursor:pointer}
#boot{display:grid;place-items:center;background:var(--ink)}
#boot img{width:64px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.94)}}

/* ---------- masthead ---------- */
.masthead{background:radial-gradient(circle at calc(100% + 100px) -40px,transparent 118px,rgba(123,75,176,.22) 119px,rgba(123,75,176,.22) 170px,transparent 171px),var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 28px 22px;position:relative;z-index:20}
.mh-inner{max-width:1280px;margin:0 auto;position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:14px;min-width:0}
.brandmark img{width:46px;height:46px;object-fit:contain;flex:none}
.brandmark .rule{width:1px;height:38px;background:rgba(255,255,255,.22);flex:none}
.brandmark h1{font-size:1.42rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brandmark p{font-size:.88rem;color:#CDBFE0;margin-top:3px}
.brandmark .chip{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:700;background:rgba(200,162,74,.22);color:#F1D896;padding:2px 8px;border-radius:999px;vertical-align:1px}
.mh-actions{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;font-size:.85rem;font-weight:600;background:rgba(255,255,255,.1);color:#fff}
.pill:hover{background:rgba(255,255,255,.18)}
.pill.gold{background:var(--gold);color:var(--ink)}
.net{width:8px;height:8px;border-radius:50%;background:#5FD08A;display:inline-block}
.net.off{background:#E06666}
.search{display:flex;align-items:center;gap:8px;height:38px;width:230px;padding:0 10px 0 13px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;transition:width .28s cubic-bezier(.2,.8,.2,1),background .2s}
.search:hover{background:rgba(255,255,255,.16)}
.search:focus-within{width:320px;background:#fff;color:#221A2E}
.search svg{flex:none;opacity:.8}
.search input{flex:1;min-width:0;border:0;background:none;font-size:.88rem;outline:none;height:100%}
.search input::placeholder{color:currentColor;opacity:.7}
.search kbd{font:inherit;font-size:.7rem;opacity:.7;border:1px solid currentColor;border-radius:6px;padding:1px 5px;white-space:nowrap}
.search:focus-within kbd{display:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;font-size:.85rem;display:grid;place-items:center;flex:none}
.menu{position:absolute;right:0;top:46px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:220px;z-index:30;box-shadow:0 18px 40px rgba(20,8,34,.25)}
.menu .who{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block;font-size:.92rem}
.menu .who small{color:var(--muted);font-size:.78rem}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:.9rem;font-weight:600}
.menu button:hover{background:var(--paper)}
.umenu{position:relative}

/* ---------- announcements ---------- */
.ann-wrap{max-width:1280px;margin:0 auto;padding:16px 28px 0;display:grid;gap:8px}
.ann{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;font-size:.93rem;line-height:1.4;
  background:rgba(123,75,176,.12);border-left:4px solid var(--brand-2);animation:annIn .4s cubic-bezier(.2,.8,.2,1) both}
.ann.warning{background:rgba(192,122,18,.12);border-left-color:var(--warn)}
.ann.urgent{background:rgba(192,57,43,.12);border-left-color:var(--alert)}
.ann svg{flex:none;width:20px;height:20px}
.ann.info svg{color:var(--brand-2)} .ann.warning svg{color:var(--warn)} .ann.urgent svg{color:var(--alert)}
.ann p{flex:1}
.ann small{display:block;color:var(--muted);font-size:.76rem;margin-top:1px}
.ann .x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ann .x:hover{background:rgba(0,0,0,.06)}
@keyframes annIn{from{opacity:0;transform:translateY(-6px)}}

/* ---------- layout ---------- */
.shell{max-width:1280px;margin:0 auto;padding:8px 28px calc(env(safe-area-inset-bottom,0px) + 40px);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:28px;align-items:start}
main section{margin-top:28px}
main section h2{font-size:1rem;font-weight:700;color:var(--muted);margin-bottom:14px}

/* ---------- daily brief ---------- */
.brief{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.brief-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.brief-h h2{font-size:1.15rem;font-weight:800;color:var(--text);margin:0}
.brief-h p{color:var(--muted);font-size:.84rem;margin-top:2px}
.refresh{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.refresh:hover{background:var(--paper);color:var(--text)}
.refresh.spin svg{animation:sp .8s linear infinite}
.brief-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%;display:block;background:var(--paper)}
button.bcard:hover{border-color:var(--brand-2)}
.bcard-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bcard-h .ico{width:32px;height:32px;border-radius:9px}
.bcard-h .ico svg{width:17px;height:17px}
.bcard-h b{font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat strong{display:block;font-size:1.55rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.75rem;color:var(--muted);margin-top:3px;line-height:1.3}
.tone-warn strong{color:var(--warn)} .tone-alert strong{color:var(--alert)} .tone-ok strong{color:var(--ok)}
.bcard .off{font-size:.82rem;color:var(--muted)}
.sk{height:52px;border-radius:10px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.brief-empty{color:var(--muted);font-size:.9rem;line-height:1.5}

/* brief v2 */
.brief-actions{display:flex;gap:4px;flex:none}
.attn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 10px;border-radius:12px;font-size:.86rem;font-weight:600;text-align:left;
  background:rgba(192,122,18,.12);color:var(--text);border:1px solid rgba(192,122,18,.25)}
.chip.alert{background:rgba(192,57,43,.12);border-color:rgba(192,57,43,.3)}
.chip:hover{filter:brightness(1.08)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.chip.alert i{background:var(--alert)}
.chip b{font-size:1rem;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-weight:500}
.allclear{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(46,139,87,.12);color:var(--ok);font-weight:700;font-size:.92rem;margin-bottom:14px}
.brows{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.brow:hover{border-color:var(--brand-2)}
.brow-h{display:flex;align-items:center;gap:10px;min-width:0}
.brow-h .ico{width:36px;height:36px;border-radius:10px}
.brow-h .ico svg{width:18px;height:18px}
.brow-h b{font-size:.9rem;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.pill-s{display:flex;align-items:baseline;gap:6px;font-size:.8rem;color:var(--muted)}
.pill-s strong{font-size:1.15rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.pill-s.tone-warn strong{color:var(--warn)} .pill-s.tone-alert strong{color:var(--alert)} .pill-s.tone-ok strong{color:var(--ok)}
.prog{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.prog .bar{width:110px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar span{display:block;height:100%;border-radius:99px;background:var(--warn)}
.prog.done .bar span{background:var(--ok)}
.prog strong{color:var(--text);font-variant-numeric:tabular-nums}
.brows.collapsed{display:none}
@media (max-width:700px){.brow{grid-template-columns:1fr}}

/* notification bell */
.bellwrap{position:relative}
.bell{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.bell:hover{background:rgba(255,255,255,.18)}
.bell svg{width:19px;height:19px}
.bell .cnt{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#E5484D;color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--ink)}
.bell.ring svg{animation:ring 1s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.npanel{position:absolute;right:0;top:46px;width:min(400px,calc(100vw - 24px));max-height:min(560px,calc(100vh - 120px));display:flex;flex-direction:column;
  background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;z-index:30;box-shadow:0 18px 40px rgba(20,8,34,.28);overflow:hidden}
.np-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.np-h b{font-size:.98rem}
.np-h button{font-size:.8rem;font-weight:700;color:var(--brand-2);padding:4px 6px;border-radius:8px}
.np-list{overflow-y:auto;padding:6px}
.ni{display:flex;gap:12px;width:100%;text-align:left;padding:10px;border-radius:12px;position:relative}
.ni:hover{background:var(--paper)}
.ni .ico{width:34px;height:34px;border-radius:10px}
.ni .ico svg{width:17px;height:17px}
.ni b{display:block;font-size:.88rem;line-height:1.3}
.ni small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px;line-height:1.35}
.ni time{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}
.ni.unread{background:rgba(123,75,176,.08)}
.ni.unread::after{content:"";position:absolute;right:10px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--brand-2)}
.ni .tn{width:4px;border-radius:4px;flex:none;background:var(--line)}
.ni .tn.alert{background:var(--alert)}.ni .tn.warn{background:var(--warn)}.ni .tn.ok{background:var(--ok)}
.np-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.np-f{padding:10px 16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.np-f button{font-weight:700;color:var(--brand-2)}

/* operations tools: cascade menu from the header button */
.tfab{position:relative;flex:none;margin-right:4px}
.tfab-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--brand-2);position:relative;
  box-shadow:0 0 0 3px rgba(200,162,74,.55);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s}
.tfab-btn:hover{box-shadow:0 0 0 4px rgba(200,162,74,.85)}
.tfab-btn svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.tfab.open .tfab-btn svg{transform:rotate(90deg) scale(.9)}
.tfab.open .tfab-btn{background:var(--gold);color:var(--ink)}
.masthead.tools-open .mh-actions,.masthead.tools-open .brandmark > img,.masthead.tools-open .brandmark > .rule,.masthead.tools-open .brandmark > div:last-child{opacity:.25;transition:opacity .25s;pointer-events:none}
.tfab-cnt{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#E5484D;color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--ink)}
.tfab-panel{position:absolute;left:0;top:0;width:340px;height:0;pointer-events:none;z-index:45}
.tfab-curve{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tfab-curve path{stroke:var(--gold);stroke-width:2;stroke-dasharray:4 6;stroke-linecap:round;opacity:0;transition:opacity .3s}
.tfab.open .tfab-curve path{opacity:.9;animation:tfabDraw .6s ease-out both}
@keyframes tfabDraw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.tfab-it{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;text-align:left;
  transform:translate(var(--x0),var(--y0)) scale(.3);transition:transform .5s cubic-bezier(.2,.9,.3,1.25),opacity .25s}
.tfab.open .tfab-it{opacity:1;pointer-events:auto;transform:translate(var(--x),var(--y)) scale(1)}
.tfab-it .ico{width:50px;height:50px;border-radius:15px;box-shadow:0 0 0 3px var(--paper),0 10px 24px rgba(20,8,34,.28);transition:transform .15s}
.tfab-it:hover .ico,.tfab-it:focus-visible .ico{transform:scale(1.08)}
.tfab-it .lb{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:7px 12px;box-shadow:0 8px 20px rgba(20,8,34,.16);white-space:nowrap}
.tfab-it .lb b{display:block;font-size:.9rem}
.tfab-it .lb small{display:block;font-size:.74rem;color:var(--muted)}
.tfab-it .lb small.hot{color:var(--alert);font-weight:700}
.tfab-veil{position:fixed;inset:0;background:rgba(12,4,24,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
.tfab-veil.on{opacity:1;pointer-events:auto}
@media (max-width:600px){ .tfab-btn{width:44px;height:44px} .tfab-btn svg{width:21px;height:21px} .tfab-it .lb small{display:none} }
@media (prefers-reduced-motion:reduce){ .tfab-it,.tfab-btn svg{transition:none} .tfab.open .tfab-curve path{animation:none} }

/* operations forms: orbit ring of checklists */
.orbit{position:fixed;inset:0;z-index:70;pointer-events:none}
.orbit.on{pointer-events:auto}
.orbit-veil{position:absolute;inset:0;background:rgba(12,4,24,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.orbit.on .orbit-veil{opacity:1}
.orbit-ring{position:absolute;border-radius:50%;border:2px dashed rgba(200,162,74,.55);transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.orbit.on .orbit-ring{transform:translate(-50%,-50%) scale(1);opacity:1}
.orbit-core{overflow:hidden;position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:22px;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 4px rgba(200,162,74,.8),0 18px 40px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.2,.9,.3,1.3)}
.orbit-core svg{width:32px;height:32px}
.orbit.on .orbit-core{transform:rotate(-8deg)}
.orbit-cap{position:absolute;transform:translateX(-50%);color:#fff;text-align:center;font-weight:800;white-space:nowrap}
.orbit-cap small{display:block;font-weight:600;opacity:.75;font-size:.8rem;margin-top:2px}
.orbit-it{position:absolute;width:62px;margin-left:-31px;margin-top:-31px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;
  transform:translate(var(--x0),var(--y0)) rotate(-180deg) scale(.2);transition:transform .6s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.orbit.on .orbit-it{opacity:1;transform:translate(var(--x),var(--y)) rotate(0) scale(1)}
.orbit-it .ico{width:62px;height:62px;border-radius:18px;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 10px 24px rgba(0,0,0,.35)}
.orbit-it .ico svg{width:26px;height:26px}
.ico .logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;background:#fff;z-index:1}
.ico .bdg,.ico .hd{z-index:2}
.orbit-it b{color:#fff;font-size:.8rem;text-align:center;line-height:1.2;max-width:120px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.orbit-it.ph .ico{background:transparent!important;border:2px dashed rgba(255,255,255,.45);box-shadow:none}
.orbit-it.ph b{opacity:.55;font-weight:600}
@media (prefers-reduced-motion:reduce){ .orbit-it,.orbit-ring,.orbit-core{transition:none} }

/* AI quick access */
.aimenu{position:relative}
.ai-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;font-size:.85rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,rgba(123,75,176,.9),rgba(200,162,74,.85))}
.ai-btn:hover{filter:brightness(1.1)}
.ai-btn svg{width:16px;height:16px}
.menu .ai-i{display:flex;align-items:center;gap:12px}
.ai-dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;flex:none}
.menu .ai-i small{display:block;color:var(--muted);font-weight:500;font-size:.76rem}

/* settings */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--paper);border:1px solid var(--line);margin-bottom:18px}
.seg button{padding:10px 8px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(20,8,34,.12)}
.set-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* usage analytics */
.u-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.u-kpi{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.u-kpi strong{display:block;font-size:1.7rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.u-kpi span{font-size:.78rem;color:var(--muted)}
.u-bars{display:grid;gap:8px}
.u-bar{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:.85rem}
.u-bar .tr{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.u-bar .tr span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-2),var(--gold))}
.u-bar b{text-align:right;font-variant-numeric:tabular-nums}
.u-trend{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:8px}
.u-trend i{flex:1;min-width:3px;border-radius:4px 4px 0 0;background:var(--brand-2);opacity:.85;position:relative}
.u-trend i:hover{opacity:1;background:var(--gold)}
.u-mx{width:100%;border-collapse:collapse;font-size:.82rem}
.u-mx th,.u-mx td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.u-mx th:first-child,.u-mx td:first-child{text-align:left}
.u-mx td.h{font-weight:800}
.u-tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.u-tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.u-tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.u-scroll{overflow-x:auto}
@media (max-width:700px){.u-bar{grid-template-columns:110px 1fr 50px}}

/* control sheet */
.cs-group{margin-bottom:18px}
.cs-group h4{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cs-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.cs-row b{display:flex;align-items:center;gap:8px;font-size:.93rem}
.cs-row small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-dot{width:9px;height:9px;border-radius:50%;background:#9A91A6;flex:none}
.cs-dot.up{background:#2EB872}.cs-dot.down{background:#E5484D}
.cs-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lk{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;font-size:.8rem;font-weight:700;border:1px solid var(--line);color:var(--text);text-decoration:none;background:var(--surface)}
.lk:hover{border-color:var(--brand-2)}
.lk svg{width:14px;height:14px}
.lk.off{opacity:.45;border-style:dashed}
@media (max-width:700px){.cs-row{grid-template-columns:1fr}.cs-links{justify-content:flex-start}}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.tile{display:flex;gap:14px;align-items:center;text-align:left;padding:12px;border-radius:18px;width:100%}
.tile:hover{background:var(--surface)}
.tile:active .ico{transform:scale(.94)}
.ico{position:relative;flex:none;width:56px;height:56px;border-radius:15px;display:grid;place-items:center;color:#fff;transition:transform .12s}
.ico svg{width:26px;height:26px}
.bdg{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--alert);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--paper);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.bdg.warn{background:var(--warn)}
.hd{position:absolute;left:-4px;bottom:-4px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--paper);background:#9A91A6}
.hd.up{background:#2EB872}.hd.down{background:#E5484D;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 5px rgba(229,72,77,.25)}}
.downline{margin-top:4px;font-size:.84rem;font-weight:700;color:var(--alert)}
.chk{display:flex;align-items:center;gap:10px;font-size:.92rem;margin-bottom:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brand-2)}
@keyframes pop{from{transform:scale(0)}}
.tile b{display:block;font-weight:700;font-size:.98rem;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.tile .tag{display:inline-block;margin-top:4px;font-size:.72rem;font-weight:600;color:var(--brand-2)}
.tile .live{display:block;margin-top:4px;font-size:.76rem;font-weight:700;color:var(--alert)}
.tile .live.warn{color:var(--warn)}
.tile.locked{opacity:.45;cursor:not-allowed}
.tile.locked:hover{background:none}
/* ---------- Profile feature: menu, profile page, photo ---------- */
.avatar{overflow:hidden;padding:0}
.avatar img,.pf-av img,.pm-av img{width:100%;height:100%;object-fit:cover;display:block}
.menu.pm{min-width:270px;padding:8px;transform-origin:top right;animation:pmIn .32s cubic-bezier(.2,.9,.3,1.18) both}

.pm-head{display:flex;gap:12px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pm-av{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;display:grid;place-items:center;overflow:hidden;flex:none}
.pm-head b{display:block;font-size:.95rem}.pm-head small{color:var(--muted);font-size:.78rem;word-break:break-all}
.menu .pm-i{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;animation:pmItem .34s cubic-bezier(.2,1.2,.4,1) both}

.pm-ic svg{width:19px;height:19px}
.pm-i small{display:block;color:var(--muted);font-weight:500;font-size:.76rem;margin-top:1px}
.menu .pm-i.out .pm-ic{color:var(--alert)}
dialog.pf-sheet{width:min(520px,calc(100% - 20px));max-height:calc(100dvh - 24px);overflow:auto;animation:pfIn .36s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pfIn{from{opacity:0;transform:translateY(26px) scale(.97)}}
.pf-cover{position:relative;height:150px;background:linear-gradient(135deg,#2A0F45,#7B4BB0 60%,#C8A24A);background-size:cover;background-position:center;border-radius:20px 20px 0 0}

.pf-deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

@keyframes pfBrand{from{opacity:0;transform:translate(-50%,-44%) scale(.92)}}

.pf-x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;font-size:1.1rem}

.pf-name{padding-bottom:6px;min-width:0}.pf-name b{display:block;font-size:1.2rem;line-height:1.2}.pf-name small{color:var(--muted);font-size:.84rem}
.pf-rm{font-size:.76rem;color:var(--muted);text-decoration:underline;padding:6px 20px 0}
.pf-rows{border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.pf-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:11px 14px;font-size:.9rem;border-bottom:1px solid var(--line)}

/* ---------- iOS-style folders (Tenant Management, Policies & Procedures) ---------- */
.fold .ico.fico{background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,13px);grid-auto-rows:13px;gap:3px;padding:7px;align-content:center;justify-content:center;box-sizing:border-box}

.folder-box{position:relative;width:min(420px,100%);max-height:calc(100vh - 60px);overflow:auto;border-radius:30px;padding:20px 16px 18px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:0 30px 70px rgba(0,0,0,.35);
  transform:translate(var(--fx),var(--fy)) scale(.18);opacity:0;transition:transform .42s cubic-bezier(.2,.9,.25,1.12),opacity .25s}

.fapp{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 2px;border-radius:14px;opacity:0;transform:scale(.7);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.folder-ov.on .fapp{opacity:1;transform:none}
.fapp .ico{width:62px;height:62px;border-radius:17px}

.fapp.locked{opacity:.4!important;cursor:not-allowed}

.empty{color:var(--muted);padding:24px 0}
footer{margin-top:36px;color:var(--muted);font-size:.8rem}

/* ---------- recent: icons travelling along a curve ---------- */
.rail{position:sticky;top:16px;margin-top:24px;height:min(660px,calc(100vh - 32px));touch-action:none;user-select:none;z-index:1;isolation:isolate}

.rail-empty{position:absolute;right:0;top:45%;width:120px;font-size:.78rem;color:var(--muted);text-align:right;line-height:1.45}
.orb{position:absolute;left:0;top:0;width:52px;height:52px;will-change:transform,opacity;transform-origin:center}
.orb .in{width:52px;height:52px;animation:orbIn .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i) * 70ms)}
.orb .ico{width:52px;height:52px;border-radius:16px;box-shadow:0 0 0 3px var(--paper);transition:box-shadow .2s}
.orb:hover .ico,.orb:focus-visible .ico{box-shadow:0 0 0 3px var(--paper),0 12px 26px rgba(20,8,34,.35)}
.orb .ico svg{width:24px;height:24px}
.orb .site{position:absolute;left:-4px;bottom:-4px;font-size:.58rem;font-weight:800;background:var(--gold);color:var(--ink);border-radius:6px;padding:1px 4px;border:2px solid var(--paper)}
@keyframes orbIn{from{opacity:0;transform:scale(.3)}}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line);font-size:.82rem;font-weight:700;padding:7px 11px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .15s;box-shadow:0 8px 20px rgba(20,8,34,.15)}
.tip.on{opacity:1}

/* ---------- app view ---------- */
#appview{display:flex;flex-direction:column;background:var(--paper);overflow:hidden}

.mq{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.mq .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--mq) 14%,transparent);color:var(--mq)}
.mq .ic svg{width:20px;height:20px}
.mq .tx{flex:1;min-width:180px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}

.rows{display:grid;gap:8px}

async function api(path, body){
  const r = await fetch("/api/" + path, body === undefined ? { credentials: "same-origin" } :
    { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok || !j || !j.ok){ const e = new Error((j && j.error) || `Error ${r.status}`); e.status = r.status; e.data = j || {}; throw e; }

}

/* ---------- icons ---------- */

  megaphone:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 8a5 5 0 0 1 0 8M18 5a9 9 0 0 1 0 14"/>',

  handshake:'<path d="M3 11l4-4 5 2 5-2 4 4"/><path d="M7 7v6l4 4 2-2 2 2 4-4"/><path d="M11 17l-2-2"/>',

};
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]||P.clipboard}</svg>`;
/* system logo (apps.js "logo"): the picture covers the tile; if it cannot load, the drawn icon underneath shows */
const appIcon = a => (a && a.logo ? `<img class="logo" src="${esc(a.logo)}" alt="" loading="lazy" onerror="this.remove()">` : "") + svg(a && a.icon);
const badgeOf = a => BRIEF && BRIEF.systems && BRIEF.systems[a.id] && BRIEF.systems[a.id].ok ? BRIEF.systems[a.id].badge : null;
const icoHTML = (a, withBadge) => {
  const b = withBadge ? badgeOf(a) : null;
  const h = withBadge && HEALTH && HEALTH.systems ? HEALTH.systems[a.id] : null;
  const hTip = !h ? "" : h.state === "up" ? `Up · responded in ${h.ms} ms` : h.state === "down" ? `Not responding${h.status ? " (HTTP " + h.status + ")" : ""}` : (h.note || "Not checked");
  return `<span class="ico" style="background:${esc(a.color||"#4A1F73")}">${appIcon(a)}${b && b.count ? `<span class="bdg ${b.tone === "warn" ? "warn" : ""}">${b.count > 99 ? "99+" : b.count}</span>` : ""}${h ? `<span class="hd ${h.state === "up" ? "up" : h.state === "down" ? "down" : ""}" title="${esc(hTip)}"></span>` : ""}</span>`;
};

/* ---------- helpers ---------- */
const byId = id => APPS.find(a => a.id === id);
const appReady = a => a.sites ? Object.values(a.sites).some(isSet) : isSet(a.url);
const keyOf = (id, site) => site ? `${id}::${site}` : id;
const parseKey = k => { const [id, site] = k.split("::"); return { app: byId(id), site: site || null }; };
const urlOf = (a, site) => site ? a.sites[site] : a.url;
const initials = s => String(s).split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const mySiteName = () => ME && ME.user.siteName;
const show = id => ["boot","auth","home","appview","admin"].forEach(v => $("#" + v).classList.toggle("hidden", v !== id));

/* =====================================================================
   BOOT & SIGN-IN
   ===================================================================== */
async function boot(){
  try {
    ME = await api("me");
  } catch (e){
    if (e.status === 401) return authScreen(e.data.needsSetup ? "setup" : "login");
    return authScreen("error", e.message);
  }
  SITES = ME.sites; ROLES = ME.roles;
  if (ME.user.mustChange) return authScreen("change");
  if (ME.user.twofa && ME.user.twofa.setupNeeded) return twofaSetupScreen();   // Two-step login feature: required for this role
  startHub();
}
function authClock(){
  const t = $("#authTime"); if (!t || $("#auth").classList.contains("hidden")) return;
  const now = new Date(), h = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", hour12: false }).format(now)) % 24;
  t.textContent = now.toLocaleTimeString("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", minute: "2-digit" });
  $("#authDate").innerHTML = `${h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"} · Beirut<br>${now.toLocaleDateString("en-GB", { timeZone: "Asia/Beirut", weekday: "long", day: "numeric", month: "long", year: "numeric" })}`;
}
setInterval(authClock, 20000);
function authScreen(mode, errText){
  show("auth"); authClock();
  const logo = `<div class="logo"><img src="icons/abc-logo-white.png" alt="ABC"></div>`;
  const forms = {
    login: `${logo}<h1>ABC Operations Hub</h1><p class="sub">Sign in to reach every operational system in one place.</p>
      <div id="aMsg"></div>
      <label class="field"><span>Email</span><input id="aEmail" type="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input id="aPass" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="aGo">Sign in</button>`,
    setup: `${logo}<h1>Set up the hub</h1><p class="sub">No accounts exist yet. Create the first administrator account — this screen only appears once.</p>
      <div id="aMsg"></div>
      <label class="field"><span>Full name</span><input id="aName" autocomplete="name"></label>
      <label class="field"><span>Email</span><input id="aEmail" type="email" autocomplete="username"></label>
      <label class="field"><span>Password (8+ characters)</span><input id="aPass" type="password" autocomplete="new-password"></label>
      <button class="btn" id="aGo">Create administrator</button>`,
    change: `${logo}<h1>Choose your password</h1><p class="sub">You signed in with a temporary password. Set your own to continue.</p>
      <div id="aMsg"></div>
      <label class="field"><span>Temporary password</span><input id="aCur" type="password" autocomplete="current-password"></label>
      <label class="field"><span>New password (8+ characters)</span><input id="aPass" type="password" autocomplete="new-password"></label>
      <button class="btn" id="aGo">Save and continue</button>`,
    error: `${logo}<h1>Hub unavailable</h1><p class="sub">${esc(errText || "")}</p><button class="btn" id="aGo">Try again</button>`
  };
  $("#authCard").innerHTML = forms[mode];
  const msg = (t, cls = "err") => { $("#aMsg").innerHTML = t ? `<div class="msg ${cls}">${esc(t)}</div>` : ""; };
  const go = $("#aGo");
  const submit = async () => {
    if (mode === "error") return location.reload();
    go.disabled = true; msg("");
    try {
      if (mode === "login"){ const r = await api("login", { email: $("#aEmail").value, password: $("#aPass").value }); if (r && r.twofa){ tfEmail = $("#aEmail").value.trim().toLowerCase(); return twofaLogin(r.twofa); } }
      if (mode === "setup") await api("setup", { name: $("#aName").value, email: $("#aEmail").value, password: $("#aPass").value });
      if (mode === "change") await api("password", { current: $("#aCur").value, next: $("#aPass").value });
      boot();
    } catch (e){ msg(e.message); go.disabled = false; }
  };
  go.onclick = submit;
  $("#authCard").onkeydown = e => { if (e.key === "Enter") submit(); };
  setTimeout(() => $("#authCard input")?.focus(), 50);
}

/* =====================================================================
   HUB
   ===================================================================== */
function startHub(){
  const role = ME.user.role;
  const fullAccess = ["ADMIN", "ADVISOR", "DIRECTOR", "CDSO"].includes(role);   /* leadership sees every system */
  APPS = ALL_APPS.filter(a => !a.roles || fullAccess || a.roles.includes(role));
  $("#hubTitle").textContent = H.title;
  const hr = new Date().getHours();
  const first = ME.user.name.split(" ")[0];
  $("#greet").innerHTML = `${hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening"}, ${esc(first)}` +
    `<span class="chip">${esc(ME.user.positionLabel || ME.user.roleLabel)}${["DIRECTOR", "CDSO"].includes(ME.user.role) ? " · " + esc(ME.user.sitesLabel) : ME.user.siteName ? " · " + esc(ME.user.siteName) : ""}</span>`;
  paintAvatar();
  $("#foot").textContent = `${H.org} · ${APPS.length} systems available to you`;
  buildMenu();
  renderHome();
  loadAnnouncements();
  loadBrief();
  loadHealth();
  loadNotifications();
  buildToolsMenu();
  loadToolSummary();
  setInterval(() => { if (!document.hidden){ loadHealth(); loadNotifications(); loadToolSummary(); } }, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ loadNotifications(); checkApprovals(); } });
  checkApprovals();
  route();
  setInterval(() => { if (!document.hidden) loadBrief(); }, 5 * 60 * 1000);
  setTimeout(() => { if (!welcomeSeen()) welcomeSheet(); else offerPasskey(); }, 900);   // Welcome feature: first sign-in on this device
}

/* =====================================================================
   WELCOME — first sign-in on a device: what the hub needs, one tap each
   (alerts, install, camera, passkey). Shown once per person and device;
   reopen it from the account menu → "Set up this device".
   ===================================================================== */
const WKEY = () => "hub.welcome." + (ME && ME.user.email);
let welcomeShownSession = false;
function welcomeSeen(){ if (welcomeShownSession) return true; try { return !!localStorage.getItem(WKEY()); } catch { return false; } }
function welcomeDone(){ welcomeShownSession = true; try { localStorage.setItem(WKEY(), new Date().toISOString()); } catch {} }
async function welcomeState(){
  const st = { push: "todo", install: isStandalone() ? "done" : "todo", camera: "todo", passkey: "todo" };
  try { if (!pushSupported()) st.push = iOS && !isStandalone() ? "later" : "na"; else if (Notification.permission === "denied") st.push = "blocked"; else if (Notification.permission === "granted" && await currentSub()) st.push = "done"; } catch {}
  try { const p = navigator.permissions && await navigator.permissions.query({ name: "camera" }); if (p && p.state === "granted") st.camera = "done"; else if (p && p.state === "denied") st.camera = "blocked"; } catch {}
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) st.camera = "na";
  if (pkHere(ME.user.email)) st.passkey = "done";   // passkeys are per device: only this device counts
  if (!window.PublicKeyCredential) st.passkey = "na";
  else try { if (!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) st.passkey = "na"; } catch {}
  return st;
}
async function welcomeSheet(){
  welcomeShownSession = true;
  const first = esc(String(ME.user.name || "").split(" ")[0]);
  const ICON = { push: "🔔", install: "📲", camera: "📷", passkey: "🔑" };
  const ITEMS = [
    ["push", "Alerts on this device", "Emergency alerts, reminders and handovers — even when the hub is closed.", "Allow"],
    ["install", "Install the hub", "Opens like an app from your home screen or taskbar. Needed on iPhone for alerts.", "Install"],
    ["camera", "Camera", "Photos in checklists, works forms and QR scanning.", "Allow"],
    ["passkey", "Face ID / fingerprint / Windows Hello", "Sign in safely without a code — your second step on this device.", "Turn on"]
  ];
  const draw = async () => {
    const st = await welcomeState();
    const row = ([k, t, d, btn]) => { const v = st[k];
      const right = v === "done" ? `<span class="wl-ok">✓ Done</span>` : v === "na" ? `<span class="wl-na">Not on this device</span>`
        : v === "blocked" ? `<span class="wl-na" title="Allow it in the browser's site settings (padlock next to the address)">Blocked — allow in site settings</span>`
        : v === "later" ? `<span class="wl-na">After installing</span>` : `<button class="btn small" data-w="${k}">${btn}</button>`;
      return `<div class="wl-row ${v === "done" ? "ok" : ""}"><span class="wl-ic">${ICON[k]}</span><div class="main"><b>${esc(t)}</b><small>${esc(d)}</small></div>${right}</div>`; };

async function addPasskey(){

    excludeCredentials: (o.excludeCredentials || []).map(c => ({ type: "public-key", id: tfUnb64u(c.id) })) } });
  const spki = cred.response.getPublicKey && cred.response.getPublicKey();
  if (!spki) throw new Error("This device cannot create a passkey here — use the email code instead.");
  const r = await api("2fa/pk/register", { id: tfB64u(cred.rawId), publicKey: tfB64u(spki), alg: cred.response.getPublicKeyAlgorithm ? cred.response.getPublicKeyAlgorithm() : -7,
    clientDataJSON: tfB64u(cred.response.clientDataJSON) });
  if (ME) ME.user.twofa = Object.assign(ME.user.twofa || {}, { on: true, setupNeeded: false });
  if (ME) pkMark(ME.user.email);
  return r;
}

const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function b64ToBytes(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); const b = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function currentSub(){ if (!pushSupported()) return null; const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function pushOn(level){
  if (Notification.permission === "denied") throw new Error("Notifications are blocked for the hub in this browser's site settings. Allow them there, then try again.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Permission was not given.");
  const reg = await navigator.serviceWorker.ready;
  const { key } = await api("push/key");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
  await api("push/subscribe", { subscription: sub.toJSON(), level });
}
async function pushOff(){
  const sub = await currentSub(); if (!sub) return;
  await api("push/unsubscribe", { endpoint: sub.endpoint }).catch(() => {});
  await sub.unsubscribe();
}

/* =====================================================================
   RECENT — icons travelling along a curved line
   ===================================================================== */
const rail = $("#rail"), orbsEl = $("#orbs"), tip = $("#tip");
let REC = [], off = 0, target = 0, G = null, ptr = null, anim = 0, dragging = null, moved = false, snapT = 0;
const horizontal = () => matchMedia("(max-width:900px)").matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function recentList(){
  return store.get("hub.recent", []).map(k => ({ k, ...parseKey(k) }))
    .filter(r => r.app && (r.site ? isSet(r.app.sites?.[r.site]) : isSet(r.app.url))).slice(0, 14);
}
function geometry(){
  const w = rail.clientWidth, h = rail.clientHeight, hz = horizontal();
  if (!w || !h) return null;
  if (!hz){
    const R = h * 0.82, cx = 30 + R, cy = h / 2 + 10;
    const tMax = Math.asin(clamp((h / 2 - 44) / R, 0.2, 0.98));
    return { hz, w, h, R, tMax, SP: 84, pt: t => ({ x: cx - R * Math.cos(t), y: cy + R * Math.sin(t) }) };
  }
  const R = Math.max(w * 1.05, 320), cx = w / 2, cy = 40 + R;
  const tMax = Math.asin(clamp((w / 2 - 34) / R, 0.2, 0.98));
  return { hz, w, h, R, tMax, SP: 72, pt: t => ({ x: cx + R * Math.sin(t), y: cy - R * Math.cos(t) }) };
}
function drawArc(){
  if (!G) return;
  const pts = [], ext = G.tMax + 0.22;
  for (let i = 0; i <= 48; i++){ const p = G.pt(-ext + (2 * ext * i) / 48); pts.push(`${p.x.toFixed(1)} ${p.y.toFixed(1)}`); }
  const d = "M" + pts.join(" L");
  $("#arcLine").setAttribute("d", d); $("#arcGlow").setAttribute("d", d);
  $("#comet").setAttribute("path", d);
  const grad = $("#arcGrad");
  grad.setAttribute("x2", G.hz ? "1" : "0"); grad.setAttribute("y2", G.hz ? "0" : "1");
}
const visibleCount = () => G ? Math.floor((2 * G.tMax * G.R) / G.SP) + 1 : 0;
const maxOff = () => Math.max(0, REC.length - visibleCount());

function renderRail(){
  REC = recentList();
  G = geometry();
  drawArc();
  if (!REC.length){
    orbsEl.innerHTML = `<p class="rail-empty">Systems you open will travel along this line.</p>`;
    return;
  }
  orbsEl.innerHTML = REC.map((r, i) =>
    `<button class="orb" style="--i:${i}" data-k="${esc(r.k)}" aria-label="${esc(r.app.name + (r.site ? " — " + r.site : ""))}">
      <div class="in">${icoHTML(r.app, true)}${r.site ? `<span class="site">${esc(initials(r.site))}</span>` : ""}</div></button>`).join("");

}
function layout(){
  if (!G) return;
  const vis = Math.min(REC.length, visibleCount());
  const pad = (2 * G.tMax * G.R - (vis - 1) * G.SP) / 2;
  const railBox = rail.getBoundingClientRect();
  orbsEl.querySelectorAll(".orb").forEach((el, i) => {
    const t = -G.tMax + ((i - off) * G.SP + pad) / G.R;
    const p = G.pt(t);
    const over = Math.max(0, Math.abs(t) - G.tMax) * G.R;
    const op = clamp(1 - over / 46, 0, 1);
    let s = 1;
    if (ptr && op > 0.3){
      const d = Math.hypot(ptr.x - railBox.left - p.x, ptr.y - railBox.top - p.y);
      s = 1 + 0.62 * Math.max(0, 1 - d / 96) ** 1.5;
    }
    el.style.transform = `translate(${(p.x - 26).toFixed(1)}px,${(p.y - 26).toFixed(1)}px) scale(${s.toFixed(3)})`;
    el.style.opacity = op.toFixed(2);

}
function kick(){ if (!anim) anim = requestAnimationFrame(frame); }

      <small>${esc(u.email)}${d.multiRoles.includes(u.role) ? " · " + esc(u.sitesLabel || "no flagship ticked") : ""}${u.lastLoginAt ? " · last in " + esc(fmtLocal(u.lastLoginAt)) : " · never signed in"}${u.morningEligible ? (u.morningEmail ? " · ✉ morning email" : " · morning email off") : ""}</small></div>
      <div class="acts"><button class="btn small ghost" data-edit="${esc(u.email)}">Edit</button>
        <button class="btn small ghost" data-reset="${esc(u.email)}">Reset</button>
        ${tf.on[u.email] ? `<button class="btn small ghost" data-tfreset="${esc(u.email)}" title="Lost phone: they set two-step up again at the next sign-in">Reset 2-step</button>` : ""}
        ${u.email !== ME.user.email ? `<button class="btn small ghost" data-act="${esc(u.email)}" data-on="${u.active ? 0 : 1}">${u.active ? "Switch off" : "Switch on"}</button>` : ""}</div></div>`;
  const vacant = (label, pre) => `<div class="row-i vac"><span class="avatar" style="width:34px;height:34px;font-size:.75rem;background:var(--paper);color:var(--muted)">—</span>
      <div class="main"><b style="color:var(--muted)">Vacant</b><small>${esc(label)}</small></div>
      <div class="acts"><button class="btn small" data-new='${esc(JSON.stringify(pre))}'>Assign</button></div></div>`;
  const group = (title, list, note, addPre) => `<div class="pg"><div class="pg-h"><h4>${title}</h4>${addPre ? `<button class="btn small ghost" data-new='${esc(JSON.stringify(addPre))}'>+ Add</button>` : ""}</div>
      ${note ? `<p class="pg-n">${note}</p>` : ""}<div class="rows">${list.length ? list.map(row).join("") : `<p class="pg-e">Nobody yet.</p>`}</div></div>`;
  let main;
  if (pplTab === "LEAD"){
    const by = r => U.filter(u => u.role === r);
    main = group("Property Advisor", by("ADVISOR"), ACCESS_NOTE.ADVISOR + " Verdun, Achrafieh, Dbayeh, Verdun DS and Achrafieh DS.", { role: "ADVISOR" })
      + group("Mall Directors", by("DIRECTOR"), ACCESS_NOTE.DIRECTOR.replace(" below", " on each person"), { role: "DIRECTOR" })

    const slotBox = (slot, title) => { const u = inSlot(slot); return u ? row(u) : vacant(d.slots[slot], { role: "MANAGER", site, position: title }); };
    const extraMgr = mgr.filter(u => !(u.active && (inSlot("MM") === u || inSlot("OM") === u)));
    const team = at.filter(u => u.role === "SUPERVISOR");

    const sec = at.filter(u => u.role === "SECURITY"), adm = at.filter(u => u.role === "ADMIN");
    const leaders = U.filter(u => u.active && (d.allSiteRoles.includes(u.role) || d.multiRoles.includes(u.role)) && (u.sites || []).includes(site));
    const noPos = team.filter(u => !u.position);
    /* ABC Operations Groups — the flagship's operations group email; the handover is emailed to it automatically */

    const mm = inSlot("MM"), om = inSlot("OM");
    main = `<div class="pg og"><div class="pg-h"><h4>ABC Operations Groups</h4></div>

        <label class="field"><span>Group email${og.emails.length > 1 ? "s" : ""}</span><input id="ogEmails" type="text" placeholder="e.g. abcverdunoperations@abc.com.lb" value="${esc(og.emails.join(", "))}"></label>
        <label class="chk"><input type="checkbox" id="ogAuto" ${og.auto ? "checked" : ""}> Email the handover automatically when it is handed over</label>

        <div id="ogMsg"></div><button class="btn ghost small" id="ogSave">Save group</button></div>`
      + `<div class="pg"><div class="pg-h"><h4>Flagship management</h4></div><p class="pg-n">${ACCESS_NOTE.MANAGER} One person in each position.</p>
        <div class="rows"><div class="slot-l">${esc(d.slots.MM)}</div>${slotBox("MM", "MM")}<div class="slot-l">${esc(d.slots.OM)}</div>${slotBox("OM", "OM")}
        ${extraMgr.length ? `<div class="slot-l">Management accounts without a position, or switched off</div>${extraMgr.map(row).join("")}` : ""}</div></div>`
      + group("Operations team", team, ACCESS_NOTE.SUPERVISOR + (noPos.length ? ` <b style="color:var(--alert)">${noPos.length} without a position: edit them to add one.</b>` : ""), { role: "SUPERVISOR", site, position: "MO" })

      + `<div class="pg"><div class="pg-h"><h4>Leadership with access</h4></div><p class="pg-n">${leaders.length ? leaders.map(u => `<b>${esc(u.name)}</b> · ${esc(u.roleLabel)}`).join("<br>") : "No Property Advisor, Mall Director or CDSO has this flagship yet."}</p></div>`;

  /* the form */
  const role = e.role || "SUPERVISOR";
  const posField = r => r === "MANAGER" ? `<label class="field"><span>Position</span><select id="uPos">${Object.entries(d.titles).map(([c, t]) => `<option value="${c}" ${e.position === c ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select></label>`
    : r === "SUPERVISOR" ? `<label class="field"><span>Position</span><select id="uPos">${Object.entries(d.positions).map(([c, n]) => `<option value="${c}" ${e.position === c ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>` : "";
  const siteField = r => d.multiRoles.includes(r) ? `<div class="field"><span>Flagships</span><div class="ticks">${FLAG_TABS.filter(t => t[0] !== "LEAD").map(([c, n]) => `<label class="chk"><input type="checkbox" class="uSites" value="${c}" ${(e.sites || []).includes(c) ? "checked" : ""}> ${esc(n)}</label>`).join("")}</div></div>`
    : r === "ADVISOR" ? `<p class="pg-n">All five flagships.</p>`
    : `<label class="field"><span>Flagship${r === "ADMIN" ? " (optional)" : ""}</span><select id="uSite">${r === "ADMIN" ? `<option value="">All flagships</option>` : ""}${FLAG_TABS.filter(t => t[0] !== "LEAD").map(([c, n]) => `<option value="${c}" ${(e.site || (pplTab !== "LEAD" ? pplTab : "")) === c ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>`;

      <label class="field"><span>Email</span><input id="uEmail" type="email" value="${esc(e.email || "")}" ${e.email ? "readonly" : ""}></label>

      <div id="uPosBox">${posField(role)}</div>

    </div>
    <div class="panel"><h3>Two-step login</h3>
      <p class="brief-empty" style="font-size:.86rem;margin-bottom:10px">Required for the roles ticked below: after the password, people approve on their phone (number + Face ID / fingerprint) or type the 6-digit code from an authenticator app. People not set up yet are asked to set it up at their next sign-in.</p>
      <div class="ticks" id="tfRoles">${["ADMIN", "ADVISOR", "DIRECTOR", "CDSO", "MANAGER", "SUPERVISOR", "SECURITY"].map(r => `<label class="chk"><input type="checkbox" value="${r}" ${tf.roles.includes(r) ? "checked" : ""}> ${esc(d.roles[r] || r)}</label>`).join("")}</div>
      <div id="tfPolMsg"></div><button class="btn ghost" id="tfPolSave">Save</button>
    </div>
    <div class="panel"><h3>Morning email · 08:00</h3>
      <p class="brief-empty" style="font-size:.86rem;margin-bottom:12px">${ms && !ms.relay ? `<span style="color:var(--alert)">Mail relay not set up — add MAIL_RELAY_URL and MAIL_RELAY_KEY to the hub.</span>` : last}</p>
      <div id="mMsg"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="mTest">Send me a test now</button><button class="btn ghost" id="eTest">End of Day report test</button></div>
    </div></div>`;
  $("#uRole").onchange = () => { const r = $("#uRole").value; $("#uNote").innerHTML = ACCESS_NOTE[r]; $("#uPosBox").innerHTML = posField(r); $("#uSiteBox").innerHTML = siteField(r); };
  body.onclick = async ev => {
    const msg = (t, c = "err") => { $("#fMsg").innerHTML = `<div class="msg ${c}">${esc(t)}</div>`; };
    const ed = ev.target.closest("[data-edit]"), rs = ev.target.closest("[data-reset]"), ac = ev.target.closest("[data-act]"), nw = ev.target.closest("[data-new]"), pt = ev.target.closest("[data-ptab]");
    if (ev.target.id === "ogSave"){   // ABC Operations Groups
      try { const r = await api("admin/opsgroups", { site: pplTab, emails: $("#ogEmails").value, auto: $("#ogAuto").checked });
        $("#ogMsg").innerHTML = `<div class="msg okm">Saved.</div>`; setTimeout(() => adminUsers(body, editing), 700); }
      catch (er){ $("#ogMsg").innerHTML = `<div class="msg err">${esc(er.message)}</div>`; }
      return;
    }
    /* Two-step login feature */
    if (ev.target.id === "tfPolSave"){
      try { await api("admin/2fa/policy", { roles: [...document.querySelectorAll("#tfRoles input:checked")].map(i => i.value) }); $("#tfPolMsg").innerHTML = `<div class="msg okm">Saved.</div>`; setTimeout(() => adminUsers(body, editing), 800); }
      catch (er){ $("#tfPolMsg").innerHTML = `<div class="msg err">${esc(er.message)}</div>`; }
      return;
    }
    const tr = ev.target.closest("[data-tfreset]");
    if (tr){ if (!confirm("Reset two-step login for " + tr.dataset.tfreset + "? Use this when the phone was lost or changed. They set it up again at the next sign-in.")) return;
      try { await api("admin/2fa/reset", { email: tr.dataset.tfreset }); adminUsers(body, editing); } catch (er){ alert(er.message); } return; }
    try {
      if (pt){ pplTab = pt.dataset.ptab; return adminUsers(body); }
      if (nw){ await adminUsers(body, JSON.parse(nw.dataset.new)); const f = $("#uForm"); f.scrollIntoView({ behavior: "smooth", block: "start" }); $("#uName").focus(); return; }
      if (ed) { await adminUsers(body, d.users.find(u => u.email === ed.dataset.edit)); $("#uForm").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      if (rs){ const p = prompt(`Temporary password for ${rs.dataset.reset} (8+ characters):`); if (!p) return;

      if (ac){ await api("admin/users/active", { email: ac.dataset.act, active: ac.dataset.on === "1" }); return adminUsers(body); }
      if (ev.target.id === "uCancel") return adminUsers(body);
      if (ev.target.id === "eTest"){

        try { const r = await api("admin/eod-test", { site: pplTab !== "LEAD" ? pplTab : "" }); $("#mMsg").innerHTML = `<div class="msg okm">End of Day report for ${esc(FLAG_TABS.find(t => t[0] === pplTab) ? FLAG_TABS.find(t => t[0] === pplTab)[1] : "your flagship")} sent to ${esc(r.to)}.</div>`; }
        catch (er){ $("#mMsg").innerHTML = `<div class="msg err">${esc(er.message)}</div>`; }
        ev.target.disabled = false; ev.target.textContent = "End of Day report test"; return;
      }
      if (ev.target.id === "mTest"){
        ev.target.disabled = true; ev.target.textContent = "Sending…";
        try { const r = await api("admin/morning-test", {}); $("#mMsg").innerHTML = `<div class="msg okm">Test sent to ${esc(r.to)} — check your inbox.</div>`; }
        catch (er){ $("#mMsg").innerHTML = `<div class="msg err">${esc(er.message)}</div>`; }
        ev.target.disabled = false; ev.target.textContent = "Send me a test now"; return;
      }
      if (ev.target.id === "uSave"){
        const r = $("#uRole").value;
        await api("admin/users", { isNew: !e.email, name: $("#uName").value, email: $("#uEmail").value, role: r,
          site: $("#uSite") ? $("#uSite").value : "", sites: [...document.querySelectorAll(".uSites:checked")].map(x => x.value),
          position: $("#uPos") ? $("#uPos").value : "", password: $("#uPass") ? $("#uPass").value : "", morningEmail: $("#uMorning").checked });
        const st = $("#uSite") ? $("#uSite").value : "";
        pplTab = ["ADVISOR", "DIRECTOR", "CDSO"].includes(r) || (r === "ADMIN" && !st) ? "LEAD" : (st || pplTab);
        adminUsers(body);
      }
    } catch (er){ msg(er.message); }
  };
}

/* =====================================================================
   ROUTING, SHORTCUTS, STATUS, INSTALL
   ===================================================================== */
function route(){
  if (!ME) return;
  const h = location.hash;
  const ap = h.match(/^#\/approve\/([\w-]+)$/);
  if (ap){ goHome(); return approveSheet(ap[1]); }   // Two-step login feature: approve a sign-in from the phone
  const m = h.match(/^#\/app\/(.+)$/);
  if (m) return showApp(decodeURIComponent(m[1]));
  if (h === "#/admin") return renderAdmin();
  goHome();
}
addEventListener("hashchange", route);
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); location.hash = "#/"; setTimeout(() => $("#q").focus(), 0); }
  if (e.altKey && e.key.toLowerCase() === "h"){ e.preventDefault(); location.hash = "#/"; }
});
function net(){ const on = navigator.onLine; $("#net").classList.toggle("off", !on); $("#netLbl").textContent = on ? "Online" : "Offline"; }
addEventListener("online", net); addEventListener("offline", net); net();

let deferred = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#installBtn").classList.remove("hidden"); });
addEventListener("appinstalled", () => $("#installBtn").classList.add("hidden"));
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (iOS && !standalone) $("#installBtn").classList.remove("hidden");
$("#installBtn").onclick = async () => {
  if (deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; $("#installBtn").classList.add("hidden"); return; }
  sheet.innerHTML = `<div class="sheet-h"><div><b>Add to Home Screen</b></div></div>
    <p class="sheet-p">In Safari, tap the Share button, then choose “Add to Home Screen”.</p>
    <div class="sheet-f"><button class="btn" data-close>Done</button></div>`;
  sheet.onclick = e => { if (e.target === sheet || e.target.closest("[data-close]")) sheet.close(); };
  sheet.showModal();
};
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* a small bridge for add-on blocks below this script (Emergency Alert feature) */
window.HUBX = { api, me: () => ME, open: id => { const a = byId(id); if (a) launch(a); }, onHome: () => !/^#\/app\//.test(location.hash) };

boot();
})();

<script>
(function(){

  function unlock(){ try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch {} }
  addEventListener("pointerdown", unlock, { passive: true }); addEventListener("keydown", unlock);
  function sirenOn(){
    unlock(); if (!audio || osc) return;
    osc = audio.createOscillator(); const g = audio.createGain(); osc.type = "sawtooth"; g.gain.value = .5;
    osc.connect(g); g.connect(audio.destination); osc.start();
    const sweep = () => { if (!osc) return; const t0 = audio.currentTime; osc.frequency.cancelScheduledValues(t0);
      osc.frequency.setValueAtTime(700, t0); osc.frequency.linearRampToValueAtTime(1350, t0 + .45); osc.frequency.linearRampToValueAtTime(700, t0 + .9); };
    sweep(); timer = setInterval(sweep, 900);
    if (navigator.vibrate) navigator.vibrate([300,120,300,120,300,360,700,160,700,160,700,360,300,120,300,120,300]);
  }
  function sirenOff(){ clearInterval(timer); try { osc && osc.stop(); } catch {} osc = null; if (navigator.vibrate) navigator.vibrate(0); }
  function show(e){
    cur = e; const box = document.getElementById("emg");
    box.innerHTML = `<div class="in"><div class="ic">🚨</div><h2 id="emgT">EMERGENCY · ${esc2(e.type)}</h2>
      <div class="loc">📍 ${esc2(e.location)}</div>${e.note ? `<div class="nt">${esc2(e.note)}</div>` : ""}
      <div class="by">Sent by ${esc2(e.createdName)} · ${new Date(e.createdAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Beirut" })}</div>
      <button class="ok" id="emgOk">I'M ON IT</button>
      <div class="row"><button id="emgMute">Silence siren</button></div>
      <div class="snd" id="emgSnd">${audio && audio.state === "running" ? "" : "Tap anywhere to sound the siren"}</div></div>`;
    box.classList.add("on");
    box.onpointerdown = () => { if (!muted.has(e.id)) { sirenOn(); const s = document.getElementById("emgSnd"); if (s) s.textContent = ""; } };
    document.getElementById("emgOk").onclick = async ev => { ev.stopPropagation(); const b = ev.currentTarget; b.disabled = true; b.textContent = "SENDING…";
      try { await HUBX.api("ops/emergency/ack", { id: e.id }); hide(); check(); }
      catch (x){ b.disabled = false; b.textContent = "I'M ON IT"; } };
    document.getElementById("emgMute").onclick = ev => { ev.stopPropagation(); muted.add(e.id); sirenOff(); ev.currentTarget.textContent = "Siren silenced"; };
    if (!muted.has(e.id)) sirenOn();
  }
  function hide(){ sirenOff(); cur = null; document.getElementById("emg").classList.remove("on"); }
  async function check(){
    if (!window.HUBX || !HUBX.me()) return;
    let r; try { r = await HUBX.api("ops/emergency/active"); } catch { return; }
    const a = r.alerts[0];
    if (a && (!cur || cur.id !== a.id)) show(a);
    if (!a && cur) hide();
    const bar = document.getElementById("emgBar"), o = r.open[0];
    if (o && !a){ bar.textContent = `🚨 ${o.type} · ${o.location} — open board`; bar.classList.add("on");
      bar.onclick = () => HUBX.open("emergency"); }
    else bar.classList.remove("on");
  }
  window.emergencyCheck = check;
  /* the floating button: only for people who can send (Managers, SMS, Admins), on the hub home screen */
  let canSend = false;
  const fab = document.getElementById("emgFab");
  const fabPaint = () => { const home = document.getElementById("home"); fab.classList.toggle("on", canSend && !/^#\/app\//.test(location.hash) && !!home && !home.classList.contains("hidden")); };
  setInterval(fabPaint, 1000);
  fab.onclick = () => HUBX.open("emergency");
  addEventListener("hashchange", fabPaint);
  (async function fabInit(tries){
    if (!window.HUBX || !HUBX.me()){ if (tries < 240) setTimeout(() => fabInit(tries + 1), 500); return; }
    const u = HUBX.me().user || {};
    canSend = ["ADMIN", "ADVISOR", "DIRECTOR", "CDSO", "MANAGER"].includes(u.role);      /* show at once for these; the server confirms (and adds the SMS) */
    fabPaint();
    try { canSend = !!(await HUBX.api("ops/emergency/meta")).can.send; } catch {}
    fabPaint();
  })(0);
  setTimeout(check, 1500);
  setInterval(() => { if (!document.hidden) check(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", ev => { if (ev.data && (ev.data.type === "emergency" || ev.data.type === "allclear")) check(); });
  addEventListener("message", ev => { if (ev.origin === location.origin && ev.data && ev.data.type === "emergency-ack") check(); });
})();
</script>
