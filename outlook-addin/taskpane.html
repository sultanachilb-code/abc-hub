<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC Hub · Outlook</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="/tools/tools.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<!-- Outlook add-in (Oct 2026 redesign) — Follow up (personal flag) + one-tap Works / Handover / Calendar / Feedback.
     See docs/FEATURE-outlook-addin.md and docs/FEATURE-followups.md -->
<style>
body{font-size:14px;background:#F7F5FA;color:#22163A;margin:0}
.hd{background:linear-gradient(135deg,#4A1F73,#2A0F45);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.hd img{width:32px;height:32px}
.hd b{font-size:1rem;letter-spacing:.01em}
.pad{padding:12px}
.ptabs{display:grid;width:100%;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#EDE8F3;border-radius:14px;padding:4px;margin-bottom:12px}
.ptabs button{border:0;border-radius:11px;padding:9px 4px;font:inherit;font-weight:800;font-size:.8rem;background:transparent;color:#5A4E70;cursor:pointer}
.ptabs button.on{background:#fff;color:#4A1F73;box-shadow:0 2px 6px rgba(42,15,69,.12)}
.dates2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pickrow{display:flex;gap:6px;margin-top:6px;align-items:center}
.pickrow input{flex:1;height:40px;border:1.5px solid #4A1F73;border-radius:12px;padding:0 10px;font:inherit;background:#fff;color:#22163A}
.fc.note{--c:#9A90AC}
.lbl{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7A7090;margin:14px 2px 7px}
/* flag form */
.hero{border-radius:18px;padding:15px;background:linear-gradient(150deg,#4A1F73,#2A0F45 72%);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(200,162,74,.5),transparent 70%);pointer-events:none}
.hero .k{display:flex;gap:10px;align-items:center}
.flagic{width:38px;height:38px;border-radius:12px;background:#C8A24A;display:grid;place-items:center;font-size:19px;box-shadow:0 6px 14px rgba(0,0,0,.25);flex:none}
.hero small{opacity:.75;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.subj{font-size:.95rem;font-weight:700;line-height:1.3;margin:9px 0 3px;overflow-wrap:anywhere}
.from{font-size:.74rem;opacity:.75}
.dates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.d{background:#fff;border:1.5px solid #E4DEEC;border-radius:12px;padding:7px 2px;text-align:center;cursor:pointer;font:inherit;color:inherit;position:relative}
.d b{display:block;font-size:.78rem}.d small{font-size:.66rem;color:#7A7090}
.d.on{border-color:#4A1F73;background:#F1EAF8}.d.on b{color:#4A1F73}
.d input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.pri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pr{border-radius:12px;padding:9px 4px;text-align:center;font-weight:800;font-size:.8rem;border:1.5px solid transparent;cursor:pointer;font-family:inherit}
.pr i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pr.high{background:#FDECEC;color:#B0283C}.pr.high i{background:#E5484D}.pr.high.on{border-color:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.15)}
.pr.medium{background:#FFF1E2;color:#B85C00}.pr.medium i{background:#F08C2E}.pr.medium.on{border-color:#F08C2E;box-shadow:0 0 0 3px rgba(240,140,46,.18)}
.pr.low{background:#FFF9D9;color:#8A6E00}.pr.low i{background:#E8B923}.pr.low.on{border-color:#E8B923;box-shadow:0 0 0 3px rgba(232,185,35,.2)}
.go{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;font-size:.9rem;color:#fff;background:#4A1F73;cursor:pointer}
.go:disabled{opacity:.6}
.hint{font-size:.7rem;color:#7A7090;text-align:center;margin-top:7px}
/* flagged card */
.fc{border-radius:18px;padding:14px 15px;background:#fff;border:1.5px solid var(--c);position:relative}
.fc.high{--c:#E5484D}.fc.medium{--c:#F08C2E}.fc.low{--c:#E8B923}
.fc .rib{position:absolute;top:-1.5px;right:14px;background:var(--c);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.05em;padding:5px 8px 9px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.fc small{color:#7A7090;font-size:.74rem}
.fc b{display:block;font-size:.92rem;margin:5px 0 4px;padding-right:46px;overflow-wrap:anywhere}
.fc .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.fc .acts button{border:0;border-radius:9px;padding:6px 11px;font:inherit;font-size:.74rem;font-weight:700;background:#F1EAF8;color:#4A1F73;cursor:pointer}
/* one tap */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.q{background:#fff;border:1px solid #E4DEEC;border-radius:14px;padding:10px 2px 8px;text-align:center;font:inherit;font-size:.7rem;font-weight:700;color:#4A3E60;cursor:pointer}
.q .ic{width:38px;height:38px;border-radius:12px;margin:0 auto 5px;display:grid;place-items:center;font-size:18px}
.q.busy{opacity:.55}
.q.done{border-color:#7BC89A;background:#F0FAF4;color:#2E8B57}.q.done .ic{background:#D9F1E3!important}
.res{margin-top:8px;border-radius:10px;padding:8px 10px;font-size:.76rem;font-weight:600;line-height:1.4}
.res.ok{background:#2E8B57;color:#fff}.res.err{background:#FDECEC;color:#B0283C}
.res a{color:inherit}
/* first run / connect */
.t{font-size:1.05rem;font-weight:800;margin:6px 2px 4px}.s{font-size:.8rem;color:#7A7090;line-height:1.5;margin:0 2px 12px}
.site{width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid #E4DEEC;border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer;color:inherit}
.site span{width:20px;height:20px;border-radius:50%;border:2px solid #CFC8DA}
.site.on{border-color:#4A1F73;background:#F1EAF8;color:#4A1F73}.site.on span{border:6px solid #4A1F73}
.inp2{width:100%;height:44px;border:1.5px solid #E4DEEC;border-radius:12px;padding:0 12px;font:inherit;background:#fff;margin:4px 0 10px}
.code{font-size:1.4rem;letter-spacing:.3em;text-align:center}
.foot{font-size:.7rem;color:#7A7090;text-align:center;padding:12px}
.foot a{color:#7B4BB0}

.ls-h{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7A7090;margin:12px 2px 5px;display:flex;justify-content:space-between}
.ls-h.r{color:#B0283C}
.li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E4DEEC;border-left:4px solid var(--c);border-radius:8px;padding:7px 8px;margin-bottom:5px;cursor:pointer}
.li.high{--c:#E5484D}.li.medium{--c:#F08C2E}.li.low{--c:#E8B923}
.li:hover{background:#FAF7FD}
.li .tx{flex:1;min-width:0}.li b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{font-size:10.5px;color:#7A7090}
.li .ok{border:0;background:#F1EAF8;color:#4A1F73;border-radius:6px;font:inherit;font-size:11px;font-weight:700;padding:4px 7px;cursor:pointer;flex:none}
.empty2{text-align:center;color:#7A7090;font-size:12px;padding:24px 8px}
/* compact, Outlook-sized (Oct 2026): Segoe UI 13px, smaller controls */
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:13px}
.hd{padding:9px 12px;gap:8px}.hd img{width:24px;height:24px}.hd b{font-size:.95rem;font-weight:600}
.pad{padding:10px}
.ptabs{border-radius:10px;padding:3px;margin-bottom:10px}.ptabs button{padding:6px 4px;font-size:12px;border-radius:8px;font-weight:700}
.lbl{font-size:10px;margin:11px 2px 5px}
.hero{border-radius:12px;padding:10px 12px}.hero:after{width:90px;height:90px;right:-24px;top:-24px}
.flagic{width:26px;height:26px;border-radius:8px;font-size:13px}.hero .k{gap:8px}.hero small{font-size:9.5px}
.subj{font-size:13px;margin:6px 0 1px;font-weight:600}.from{font-size:11px}
.dates,.dates2,.pri{gap:5px}.dates2{margin-top:5px}
.d{border-radius:8px;padding:5px 2px;border-width:1px}.d b{font-size:12px;font-weight:600}.d small{font-size:10px}
.pr{border-radius:8px;padding:6px 4px;font-size:12px;border-width:1px;font-weight:700}.pr i{width:7px;height:7px;margin-right:4px}
.pickrow input{height:32px;border-radius:8px;border-width:1px}
.go{margin-top:10px;border-radius:8px;padding:8px;font-size:13px;font-weight:700}
.hint{font-size:10.5px;margin-top:5px}
.fc{border-radius:12px;padding:10px 12px;border-width:1px}.fc b{font-size:13px;font-weight:600;margin:4px 0 2px}.fc small{font-size:11px}
.fc .rib{font-size:9px;padding:4px 7px 7px}.fc .acts{margin-top:8px;gap:5px}.fc .acts button{padding:4px 9px;font-size:11.5px;border-radius:6px}
.qa{gap:6px}.q{border-radius:10px;padding:7px 2px 6px;font-size:11px;font-weight:600}.q .ic{width:28px;height:28px;border-radius:8px;font-size:14px;margin-bottom:3px}
.res{font-size:11.5px;padding:6px 9px;border-radius:8px}
.t{font-size:14px}.s{font-size:12px}.site{padding:8px 11px;border-radius:9px;border-width:1px;font-size:13px}.site span{width:16px;height:16px}.site.on span{border-width:5px}
.inp2{height:34px;border-radius:8px;border-width:1px}.code{font-size:1.1rem}
.foot{font-size:10.5px;padding:8px 10px}
</style>
</head>
<body>
<div class="hd"><img src="/icons/abc-logo-white.png" alt="ABC"><b>Operations Hub</b></div>
<div class="pad" id="app"><div class="hint">Loading…</div></div>
<div class="foot" id="foot"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEMO = new URLSearchParams(location.search).has("demo");
let CTX = null, ITEM = null, site = "", FLAG = null, pick = { due: "", priority: "high", note: false }, editing = false, TAB = "fu", showPick = false;

/* ---------- token + flagship: Outlook roaming settings (follow the person), else this browser ---------- */
const store = {
  get(k){ try { const r = Office.context.roamingSettings; const v = r && r.get(k); if (v) return v; } catch {} try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v){ try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {}
    try { const r = Office.context.roamingSettings; if (r){ v ? r.set(k, v) : r.remove(k); r.saveAsync(); } } catch {} }
};
const TOKEN = "abchub", SITE = "abchub.site";
async function api(path, body){
  const t = store.get(TOKEN);
  const r = await fetch("/api/" + path, { method: body === undefined ? "GET" : "POST", credentials: "omit",
    headers: { "content-type": "application/json", ...(t ? { authorization: "Bearer " + t } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch {}
  if (r.status === 401 && path !== "addin/pair"){ store.set(TOKEN, ""); connect(); throw new Error("Please connect again."); }
  if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || `Error ${r.status}`);
  return j.data;
}

/* ---------- dates (Beirut) ---------- */
const bday = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Beirut" }).format(d);
const addD = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fmt = (d, o) => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", Object.assign({ timeZone: "UTC", weekday: "short", day: "numeric", month: "short" }, o || {}));
const nextMonday = d => { const w = new Date(d + "T12:00:00Z").getUTCDay(); return addD(d, ((8 - w) % 7) || 7); };

/* ---------- the open email ---------- */
function readItem(){
  if (DEMO) return Promise.resolve({ id: "demo-1", link: "", subject: "PO12600246 - supply of Network switch, power supply and wireless bridge", fromName: "Noura Nader", fromEmail: "noura@abc.com.lb",
    from: "Noura Nader <noura@abc.com.lb>", date: new Date().toISOString(), body: "Dear Sultan,\nPlease find attached the PO for the network switch.\nRegards",
    atts: [{ id: "1", name: "ABC-VS-260929RK-260809A.pdf", size: 122000, pdf: true }, { id: "2", name: "CHIP PO12600246.pdf", size: 20000, pdf: true }] });
  return new Promise(res => {
    const it = Office.context.mailbox.item;
    const from = it.from || it.sender || {};
    let link = ""; try { if (it.itemId) link = "https://outlook.office365.com/owa/?ItemID=" + encodeURIComponent(it.itemId) + "&exvsurl=1&viewmodel=ReadMessageItem"; } catch {}
    const base = { id: it.itemId || it.internetMessageId || "", link, subject: it.subject || "", fromName: from.displayName || "", fromEmail: from.emailAddress || "",
      from: `${from.displayName || ""} <${from.emailAddress || ""}>`, date: (it.dateTimeCreated || new Date()).toISOString(),
      atts: (it.attachments || []).filter(a => !a.isInline).map(a => ({ id: a.id, name: a.name, size: a.size, pdf: /pdf/i.test(a.contentType || "") || /\.pdf$/i.test(a.name || "") })) };
    it.body.getAsync(Office.CoercionType.Text, r => res({ ...base, body: r.status === "succeeded" ? String(r.value || "").replace(/\r/g, "").replace(/\n{3,}/g, "\n\n").trim() : "" }));
  });
}
function attachmentBase64(id){
  if (DEMO) return Promise.resolve("JVBERi0xLjQKJcOkw7zDtsOfCjEgMCBvYmoKPDwvVHlwZS9DYXRhbG9nPj4KZW5kb2JqCnRyYWlsZXIKPDwvUm9vdCAxIDAgUj4+CiUlRU9G");
  return new Promise((res, rej) => Office.context.mailbox.item.getAttachmentContentAsync(id, r => {
    if (r.status !== "succeeded") return rej(new Error("Outlook could not read the attachment."));
    if (r.value.format !== Office.MailboxEnums.AttachmentContentFormat.Base64) return rej(new Error("This attachment type cannot be sent."));
    res(r.value.content);
  }));
}

/* ---------- connect (email + 6-digit code from the hub) ---------- */
function connect(msg){
  $("#app").innerHTML = `<div class="t">Connect Outlook to the hub</div>
    <div class="s">In the hub: your picture → Profile settings → <b>Outlook</b> → <b>Connect Outlook</b>, then type the 6-digit code here.</div>
    <label class="hint" style="text-align:left;display:block">Your work email</label><input class="inp2" id="cE" type="email" autocomplete="username" value="${esc(DEMO ? "" : (Office.context.mailbox && Office.context.mailbox.userProfile ? Office.context.mailbox.userProfile.emailAddress : ""))}">
    <label class="hint" style="text-align:left;display:block">Code from the hub</label><input class="inp2 code" id="cC" inputmode="numeric" maxlength="6" placeholder="––––––">
    <button class="go" id="cGo">Connect</button><div id="cMsg">${msg ? `<div class="res err">${esc(msg)}</div>` : ""}</div>`;
  $("#cGo").onclick = async () => {
    try { const r = await api("addin/pair", { email: $("#cE").value, code: $("#cC").value }); store.set(TOKEN, r.token); start(); }
    catch (e){ $("#cMsg").innerHTML = `<div class="res err">${esc(e.message)}</div>`; }
  };
  $("#foot").innerHTML = "";
}

/* ---------- first time: choose the flagship ---------- */
function chooseSite(){
  const S = Object.entries(CTX.sites);
  let sel = store.get(SITE) || CTX.user.site || (S[0] || [])[0] || "";
  const draw = () => {
    $("#app").innerHTML = `<div class="t">Welcome, ${esc(CTX.user.name.split(" ")[0])}</div>
      <div class="s">Which flagship do you work for? Works forms, handover, calendar and feedback from Outlook go there. You can change it later.</div>
      ${S.map(([c, n]) => `<button class="site ${c === sel ? "on" : ""}" data-s="${c}">${esc(n)}<span></span></button>`).join("")}
      <button class="go" id="sGo">Continue</button>`;
    $("#app").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sel = b.dataset.s; draw(); });
    $("#sGo").onclick = () => { store.set(SITE, sel); site = sel; main(); };
  };
  $("#foot").innerHTML = "";
  draw();
}

async function start(){
  if (!store.get(TOKEN)) return connect();
  try { CTX = await api("addin/context"); } catch (e){ if (!store.get(TOKEN)) return; return connect(e.message); }
  const S = Object.keys(CTX.sites);
  site = store.get(SITE);
  if (!site || !S.includes(site)){
    if (S.length === 1){ site = S[0]; store.set(SITE, site); }
    else return chooseSite();
  }
  main();
}
async function main(){
  ITEM = await readItem();
  FLAG = null; editing = false;
  pick = { due: addD(bday(), 1), priority: "high", note: false }; showPick = false; TAB = "fu";
  try { const r = await api("fu/item?msgId=" + encodeURIComponent(ITEM.id)); FLAG = r.item; } catch {}
  $("#foot").innerHTML = `${esc(CTX.user.name)} · ${esc(CTX.sites[site] || "")} · <a href="#" id="chg">Change flagship</a> · <a href="#" id="dis">Disconnect</a> · <a href="/" target="_blank">Open the hub</a>`;
  $("#chg").onclick = e => { e.preventDefault(); chooseSite(); };
  $("#dis").onclick = async e => { e.preventDefault(); await api("addin/disconnect", {}).catch(() => {}); store.set(TOKEN, ""); connect(); };
  draw(); loadAll();
}

/* ---------- the panel ---------- */
const PL = { high: "High", medium: "Medium", low: "Low" };
let ALL = null;
async function loadAll(){ try { ALL = await api("fu/all"); } catch { ALL = ALL || { list: [], notes: [], today: bday(), tomorrow: addD(bday(), 1) }; } if (TAB === "list") draw(); else { const b = document.querySelector('[data-tab="list"]'); if (b) b.textContent = `🗂 My flags (${ALL.list.length + ALL.notes.length})`; } }
/* open the flagged email: inside Outlook (desktop or web) by its id; otherwise the web link */
function openMail(id, link){
  try { if (id && Office.context && Office.context.mailbox && Office.context.mailbox.displayMessageForm){ Office.context.mailbox.displayMessageForm(id); return; } } catch {}
  if (link) window.open(link, "_blank"); else say("This email cannot be opened from here.", true);
}
function listHtml(){
  if (!ALL) return `<div class="empty2">Loading…</div>`;
  const t = ALL.today, tm = ALL.tomorrow, wk = addD(t, 7);
  const G = [["Overdue", x => x.due < t, "r"], ["Today", x => x.due === t], ["Tomorrow", x => x.due === tm], ["This week", x => x.due > tm && x.due <= wk], ["Later", x => x.due > wk]];
  const row = x => `<div class="li ${x.priority}" data-open="${esc(x.msgId)}" data-link="${esc(x.link)}" title="Open the email">
      <div class="tx"><b>${esc(x.subject)}</b><small>${x.due ? esc(x.due === t ? "Today" : x.due === tm ? "Tomorrow" : fmt(x.due)) + " · " : ""}${PL[x.priority]}${x.sender ? " · " + esc(x.sender) : ""}</small></div>
      <button class="ok" data-okid="${x.id}" title="Done">✓</button></div>`;
  const parts = G.map(([n, f, c]) => { const L = ALL.list.filter(f); return L.length ? `<div class="ls-h ${c || ""}"><span>${n}</span><span>${L.length}</span></div>${L.map(row).join("")}` : ""; }).join("");
  const notes = ALL.notes.length ? `<div class="ls-h"><span>📝 Notes</span><span>${ALL.notes.length}</span></div>${ALL.notes.map(row).join("")}` : "";
  return parts || notes ? parts + notes + `<div class="hint" style="margin-top:8px">Tap an item to open the email · ✓ when done</div>` : `<div class="empty2">Nothing flagged yet.<br>Open an email → 🚩 Follow up.</div>`;
}
const doneKey = () => "abchub.done." + (ITEM.id || ITEM.subject).slice(-80);
const doneGet = () => { try { return JSON.parse(sessionStorage.getItem(doneKey()) || "{}"); } catch { return {}; } };
const doneSet = k => { try { const o = doneGet(); o[k] = 1; sessionStorage.setItem(doneKey(), JSON.stringify(o)); } catch {} };
function flagForm(){
  const t = bday(), D = [["Today", t, "by tonight"], ["Tomorrow", addD(t, 1), fmt(addD(t, 1), { weekday: "short", day: "numeric", month: undefined })], ["Monday", nextMonday(t), fmt(nextMonday(t), { weekday: undefined, day: "numeric", month: "short" })]];
  const custom = !pick.note && !D.some(x => x[1] === pick.due);
  const whenTxt = pick.note ? "Note · no date" : pick.due === t ? "Today" : pick.due === addD(t, 1) ? "Tomorrow" : fmt(pick.due);
  return `<div class="hero"><div class="k"><div class="flagic">🚩</div><small>Follow up this email</small></div>
      <div class="subj">${esc(ITEM.subject || "(no subject)")}</div><div class="from">${esc(ITEM.fromName || ITEM.fromEmail)}${ITEM.date ? " · " + esc(new Date(ITEM.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" })) : ""}</div></div>
    <div class="lbl">Due</div>
    <div class="dates" style="grid-template-columns:repeat(3,minmax(0,1fr))">${D.map(([n, d, sm]) => `<button class="d ${!pick.note && pick.due === d ? "on" : ""}" data-due="${d}"><b>${n}</b><small>${esc(sm)}</small></button>`).join("")}</div>
    <div class="dates2"><button class="d ${custom ? "on" : ""}" id="pickBtn"><b>📅 ${custom ? esc(fmt(pick.due)) : "Pick a date"}</b><small>${custom ? "tap to change" : "any day"}</small></button>
      <button class="d ${pick.note ? "on" : ""}" id="noteBtn"><b>📝 Note</b><small>no due date</small></button></div>
    ${showPick ? `<div class="pickrow"><input type="date" id="dPick" min="${t}" value="${custom ? pick.due : ""}"><button class="d on" id="pickOk" style="padding:10px 12px"><b>OK</b></button></div>` : ""}
    <div class="lbl">Priority</div>
    <div class="pri">${["high", "medium", "low"].map(p => `<button class="pr ${p} ${pick.priority === p ? "on" : ""}" data-pri="${p}"><i></i>${PL[p]}</button>`).join("")}</div>
    <button class="go" id="flagGo">${pick.note ? "📝 Save note" : "🚩 Flag · " + esc(whenTxt)} · ${PL[pick.priority]}</button>
    <div class="hint">${pick.note ? "Kept in your notes on the hub home page — no reminder" : "Reminder the day before and on the day · shown on your hub home page"}</div>
    ${editing ? `<div class="hint"><a href="#" id="flagCancel">Cancel</a></div>` : ""}`;
}
function flagCard(){
  const t = bday();
  if (!FLAG.due) return `<div class="fc ${FLAG.priority}"><div class="rib">${PL[FLAG.priority].toUpperCase()}</div><small>📝 Note · no due date</small>
      <b>${esc(FLAG.subject)}</b><small>On your hub home page under Notes · no reminder</small>
      <div class="acts"><button data-fa="done">✓ Done</button><button data-fa="change">Add a date / change</button><button data-fa="remove">Remove</button></div></div>`;
  const when = FLAG.due === t ? "today" : FLAG.due === addD(t, 1) ? "tomorrow" : fmt(FLAG.due);
  return `<div class="fc ${FLAG.priority}"><div class="rib">${PL[FLAG.priority].toUpperCase()}</div><small>🚩 Flagged · due ${esc(when)}</small>
      <b>${esc(FLAG.subject)}</b><small>${FLAG.due > addD(t, 1) ? `Reminder ${esc(fmt(addD(FLAG.due, -1)))} · 09:00` : FLAG.due === t ? "Due today · it is on your hub home page" : "Reminder today, then tomorrow 09:00"}</small>
      <div class="acts"><button data-fa="done">✓ Done</button><button data-fa="change">Change</button><button data-fa="remove">Remove</button></div></div>`;
}
const TAPS = [["works", "📄", "Works", "#EDE4F7", "Sent to Works"], ["handover", "🔁", "Handover", "#E2F1EE", "In handover"], ["calendar", "📅", "Calendar", "#E7EEFB", "In calendar"], ["feedback", "💬", "Feedback", "#FFF1E2", "Logged"]];
function draw(){
  const dn = doneGet();
  const tabs = `<div class="ptabs"><button data-tab="fu" class="${TAB === "fu" ? "on" : ""}">🚩 Follow up</button><button data-tab="list" class="${TAB === "list" ? "on" : ""}">🗂 My flags${ALL ? ` (${ALL.list.length + ALL.notes.length})` : ""}</button><button data-tab="tap" class="${TAB === "tap" ? "on" : ""}">⚡ One tap</button></div>`;
  const body = TAB === "list" ? listHtml() : TAB === "fu" ? (FLAG && !editing ? flagCard() : flagForm())
    : `<div class="hero" style="padding:12px 15px"><small>One tap — nothing to type</small><div class="subj" style="font-size:.86rem;margin-top:6px">${esc(ITEM.subject || "(no subject)")}</div></div>
      <div class="lbl">Send this email to</div>
      <div class="qa">${TAPS.map(([k, ic, n, bg, ok]) => `<button class="q ${dn[k] ? "done" : ""}" data-tap="${k}"><div class="ic" style="background:${bg}">${dn[k] ? "✓" : ic}</div>${dn[k] ? ok : n}</button>`).join("")}</div>
      <div class="hint" style="text-align:left;margin-top:12px;line-height:1.6"><b>Works</b> – PDF attachments → Tenant Works Forms<br><b>Handover</b> – "sender: subject" in today's handover<br><b>Calendar</b> – on the follow-up date (or today)<br><b>Feedback</b> – logged as tenant feedback, to check in the hub</div>`;
  $("#app").innerHTML = `${tabs}${body}<div id="out"></div>`;
  $("#app").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; if (TAB === "list") loadAll(); draw(); });
  $("#app").querySelectorAll("[data-open]").forEach(el => el.onclick = e => { if (e.target.closest("[data-okid]")) return; openMail(el.dataset.open, el.dataset.link); });
  $("#app").querySelectorAll("[data-okid]").forEach(b => b.onclick = async () => { b.disabled = true; try { await api("fu/done", { id: +b.dataset.okid }); if (FLAG && FLAG.id === +b.dataset.okid) FLAG = null; await loadAll(); } catch (e){ say(e.message, true); } });
  $("#app").querySelectorAll("[data-due]").forEach(b => b.onclick = () => { pick.due = b.dataset.due; pick.note = false; showPick = false; draw(); });
  const pb = $("#pickBtn"); if (pb) pb.onclick = () => { showPick = true; draw(); const i = $("#dPick"); if (i){ i.focus(); try { i.showPicker(); } catch {} } };
  const setPick = () => { const i = $("#dPick"); if (i && i.value){ if (i.value < bday()) return say("Choose today or a later date", true); pick.due = i.value; pick.note = false; showPick = false; draw(); } };
  const dp = $("#dPick"); if (dp) dp.onchange = setPick;
  const po = $("#pickOk"); if (po) po.onclick = setPick;
  const nb = $("#noteBtn"); if (nb) nb.onclick = () => { pick.note = true; showPick = false; draw(); };
  $("#app").querySelectorAll("[data-pri]").forEach(b => b.onclick = () => { pick.priority = b.dataset.pri; draw(); });
  const fg = $("#flagGo"); if (fg) fg.onclick = async () => {
    fg.disabled = true;
    try { FLAG = (await api("fu/save", { id: FLAG ? FLAG.id : 0, msgId: ITEM.id, subject: ITEM.subject, sender: ITEM.fromName || ITEM.fromEmail, link: ITEM.link,
      due: pick.note ? "" : pick.due, note: pick.note, priority: pick.priority, site })).item; editing = false; draw(); loadAll(); }
    catch (e){ fg.disabled = false; say(e.message, true); }
  };
  const fc = $("#flagCancel"); if (fc) fc.onclick = e => { e.preventDefault(); editing = false; draw(); };
  $("#app").querySelectorAll("[data-fa]").forEach(b => b.onclick = async () => {
    const a = b.dataset.fa;
    if (a === "change"){ editing = true; pick = { due: FLAG.due || addD(bday(), 1), priority: FLAG.priority, note: false }; showPick = false; return draw(); }
    try { await api(a === "done" ? "fu/done" : "fu/remove", { id: FLAG.id }); FLAG = null; draw(); say(a === "done" ? "✓ Follow-up done" : "Flag removed"); loadAll(); }
    catch (e){ say(e.message, true); }
  });
  $("#app").querySelectorAll("[data-tap]").forEach(b => b.onclick = () => tap(b));
}
function say(t, bad){ const o = $("#out"); if (o) o.innerHTML = `<div class="res ${bad ? "err" : "ok"}">${t.startsWith("<") ? t : esc(t)}</div>`; }

/* ---------- one tap: everything is filled from the email ---------- */
const clean = s => String(s || "").replace(/^((re|fw|fwd|tr)\s*:\s*)+/i, "").trim();
async function tap(btn){
  const k = btn.dataset.tap;
  if (btn.classList.contains("busy")) return;
  btn.classList.add("busy");
  const can = CTX.can[site] || {};
  try {
    if (k === "works"){
      const pdfs = ITEM.atts.filter(a => a.pdf);
      if (!pdfs.length) throw new Error("This email has no PDF attachment to send to Works Forms.");
      for (const a of pdfs) await api("ops/works/add", { site, name: a.name, data: "data:application/pdf;base64," + await attachmentBase64(a.id) });
      say(`<span>✓ ${pdfs.length} attachment${pdfs.length === 1 ? "" : "s"} sent to Tenant Works Forms · <a href="/tools/works?site=${site}" target="_blank">Open</a></span>`);
    }
    if (k === "handover"){
      if (!can.handover) throw new Error("You cannot add to this flagship's handover.");
      const who = (ITEM.fromName || "").split("<")[0].trim();
      const r = await api("ops/handover/append", { site, section: "today", text: `${who ? who + ": " : ""}${clean(ITEM.subject)}`.slice(0, 500), cctv: false });
      say(`<span>✓ Added to the ${esc(r.day)} handover · <a href="/tools/handover?site=${site}" target="_blank">Open</a></span>`);
    }
    if (k === "calendar"){
      const day = FLAG && FLAG.due ? FLAG.due : bday();
      const r = await api("ops/cal/save", { site, kind: "ops", title: clean(ITEM.subject).slice(0, 160) || "Email follow-up", start: day, end: "",
        notes: `From: ${ITEM.from}\n${String(ITEM.body || "").slice(0, 600)}`, category: "", extra: { status: "Planned" } });
      say(`<span>✓ In the Operations Calendar on ${esc(fmt(day))} · <a href="/tools/calendar?site=${site}&id=${r.item.id}" target="_blank">Open</a></span>`);
    }
    if (k === "feedback"){
      let tenant = "";
      try {
        const T = (await api(`ops/feedback/tenants?site=${site}`)).tenants || [];
        /* whole words in the subject, the body and the sender's company domain — never a person's name */
        const dom = (String(ITEM.fromEmail).split("@")[1] || "").split(".")[0].replace(/[-_]/g, " ");
        const hay = ` ${clean(ITEM.subject)} ${String(ITEM.body || "").slice(0, 1500)} ${/^(abc|gmail|hotmail|outlook|yahoo|icloud|live)$/i.test(dom) ? "" : dom} `.toLowerCase();
        const rx = t => t.toLowerCase().replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
        const word = t => new RegExp("(^|[^\\p{L}\\d])" + rx(t) + "($|[^\\p{L}\\d])", "u").test(hay);
        tenant = T.filter(t => t && t.length > 2 && word(t)).sort((a, b) => b.length - a.length)[0] || "";
      } catch {}
      tenant = tenant || "To check (from Outlook)";
      await api("ops/feedback/save", { site, entry: { tenant, day: bday(), time: new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", minute: "2-digit" }),
        category: "Operations Violation", description: "Other", action: "None", actionDesc: `${clean(ITEM.subject)}\n${String(ITEM.body || "").slice(0, 400)}`.slice(0, 500) } });
      say(`<span>✓ Logged as tenant feedback for <b>${esc(tenant)}</b> · <a href="/tools/feedback?site=${site}" target="_blank">Open to edit</a></span>`);
    }
    doneSet(k);
    btn.classList.remove("busy"); btn.classList.add("done");
    const T = TAPS.find(x => x[0] === k); btn.innerHTML = `<div class="ic" style="background:${T[3]}">✓</div>${T[4]}`;
  } catch (e){ btn.classList.remove("busy"); say(e.message, true); }
}

if (DEMO || typeof Office === "undefined") { window.Office = window.Office || {}; start(); }
else Office.onReady(() => {
  if (!Office.context || !Office.context.mailbox){ $("#app").innerHTML = `<div class="hint">Open this panel from an email in Outlook (“ABC Hub” button).</div>`; return; }
  start();
  /* pinned panel: follow the email the person is reading */
  if (Office.context.mailbox.addHandlerAsync) Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, () => { if (CTX && site && Office.context.mailbox.item) main(); });
});
</script>
