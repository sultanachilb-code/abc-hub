<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memo · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
/* Memo (Upcoming - Testing, Nov 2026) — docs/FEATURE-memo.md */
.cmp{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap}
.cmp:hover{border-color:var(--brand-2)}.cmp .m{flex:1;min-width:200px}.cmp .m b{display:block}.cmp small{color:var(--muted);font-size:.78rem}
.ref{font-size:.7rem;font-weight:800;letter-spacing:.04em;color:var(--brand-2)}
.pill2{font-size:.72rem;font-weight:800;border-radius:99px;padding:4px 9px;white-space:nowrap}
.p-ok{background:#E3F4EA;color:#1E7A4F}.p-rep{background:#E6EEFB;color:#1F5A96}.p-wait{background:#FFF1D6;color:#8A6200}.p-mail{background:#EEE9F4;color:#5B4E70}.p-cl{background:#ECECEC;color:#555}
.sec{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.fm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px}
.fm label{font-size:.76rem;font-weight:700;color:var(--muted);margin-top:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ck{display:flex;gap:6px;flex-wrap:wrap}
.ck span{border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:.8rem;cursor:pointer;background:var(--surface);user-select:none}
.ck span.on{background:var(--brand);border-color:var(--brand);color:#fff}.ck span small{opacity:.7;margin-left:4px}
.ck.lv span.on{background:#1F5A96;border-color:#1F5A96}
textarea.inp{min-height:150px;padding:10px;resize:vertical;line-height:1.45}
.grp{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.grp>b{font-size:.82rem}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.site{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.site.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(74,31,115,.18)}
.site b{font-size:.88rem}.pct{font-size:1.7rem;font-weight:800;color:#1E8A4C;line-height:1.2}
.stk{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 6px;background:var(--paper)}.stk i{display:block}
.leg{display:flex;gap:9px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}.leg em{font-style:normal;font-weight:800}
.c1{background:#1E8A4C}.c2{background:#1F5A96}.c3{background:#D9D2E3}
.ft{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.ft span{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:700;cursor:pointer;background:var(--surface)}
.ft span.on{background:#2A0F45;color:#fff;border-color:#2A0F45}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:.82rem;min-width:680px}
.t th{text-align:left;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t td .inp{height:32px;min-width:200px}
.mut{color:var(--muted);font-size:.76rem}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.rp{white-space:pre-line;background:var(--paper);border-radius:9px;padding:6px 9px;margin-top:4px;max-width:420px}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;white-space:pre-line;line-height:1.5}
dialog#ed{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 24px))}
dialog#ed .b{padding:16px;display:grid;gap:6px}dialog#ed label{font-size:.76rem;font-weight:700;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="top"><h1>📜 Memo <small>official memos to tenants</small></h1></div>
<div class="wrap"><div id="view"><p class="muted">Loading…</p></div></div>
<dialog id="ed"></dialog>
<input type="file" id="fileIn" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx" hidden>
<script src="common.js"></script>
<script>
let L = null, C = null, SITE = "", FIL = "all", FORM = null;
const fd = d => d ? new Date(d.slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "";
const V = h => { $("#view").innerHTML = h; };
const todayISO = () => new Date(Date.now() + 2 * 36e5).toISOString().slice(0, 10);
const ST = { ack: `<span class="pill2 p-ok">✓ Acknowledged</span>`, reply: `<span class="pill2 p-rep">💬 Replied</span>`, "": `<span class="pill2 p-wait">Waiting</span>` };

async function list(){
  C = null; L = await api("ops/memo/list");
  V(`<div class="bar2" style="margin-bottom:12px"><span class="muted">${L.list.length} memo${L.list.length === 1 ? "" : "s"}</span>${L.ops ? `<button class="btn" id="new">＋ New memo</button>` : ""}</div>
    ${L.list.map(m => `<div class="cmp" data-c="${m.id}"><div class="m"><span class="ref">${esc(m.ref)}${m.cat ? " · " + esc(m.cat) : ""}</span><b>${esc(m.title)}</b><small>${m.sites.map(s => esc(L.sites[s] || s)).join(" · ")} · sent ${esc(fd(m.sent))} by ${esc(m.by)}${m.replyBy ? " · answer by " + esc(fd(m.replyBy)) : ""}</small></div>
      ${m.closed ? `<span class="pill2 p-cl">Closed</span>` : ""}<span class="pill2 ${m.mode === "reply" ? "p-rep" : "p-ok"}">${m.mode === "reply" ? "Reply" : "Acknowledge"} · ${m.stats.pct}%</span><span class="mut">${m.stats.done}/${m.stats.invited}</span></div>`).join("")
      || `<div class="card empty" style="padding:22px">No memo yet.${L.ops ? " Press “＋ New memo” to write the first one." : ""}</div>`}`);
  $("#view").querySelectorAll("[data-c]").forEach(x => x.onclick = () => open(+x.dataset.c));
  const n = $("#new"); if (n) n.onclick = () => newForm();
}

/* ---------- new memo ---------- */
async function newForm(){
  const sites = Object.keys(L.sites);
  FORM = FORM || { title: "", body: "", cat: "Operations", mode: "ack", replyBy: "", auto: true, every: 2, max: 3, sites: sites.length === 1 ? sites : [], cats: [], depts: [], floors: [], crm: "", dbank: "",
    positions: [], levels: ["Shop", "Brand", "Company", "Group"], file: null, aud: null, off: new Set(), mails: {} };
  const F = FORM, f = F.sites.length ? await api("ops/memo/filters?sites=" + F.sites.join(",")) : { cats: [], depts: [], floors: [], positions: [], levels: ["Shop", "Brand", "Company", "Group"], crm: 0, dbank: 0, tenants: 0 };
  const chips = (id, key, L2, label = x => esc(x.name), cls = "") => `<div class="ck ${cls}" id="${id}">${L2.map(x => `<span data-v="${esc(x.name)}" class="${F[key].includes(x.name) ? "on" : ""}">${label(x)}${x.n != null ? `<small>${x.n}</small>` : ""}</span>`).join("") || `<span class="mut" style="border:0">${F.sites.length ? "None" : "Choose a flagship first"}</span>`}</div>`;
  const depts = f.depts.filter(x => !F.cats.length || F.cats.includes(x.cat));
  const tri = (key, n) => `<div class="ck" data-tri="${key}">${[["", "All"], ["yes", "With"], ["no", "Without"]].map(([v, l]) => `<span data-v="${v}" class="${F[key] === v ? "on" : ""}">${l}</span>`).join("")}</div>${n != null ? `<span class="mut">${n} tenant${n === 1 ? "" : "s"} with</span>` : ""}`;
  V(`<button class="btn ghost small" id="back">‹ Memos</button>
    <div class="fm" style="margin-top:10px">
      <div class="g2"><div style="grid-column:span 2"><label>Subject</label><input class="inp" id="fT" value="${esc(F.title)}" placeholder="e.g. Fire alarm test — Tuesday 10 Nov, 8:00 AM"></div>
        <div><label>Category</label><select class="sel" id="fC">${L.cats.map(c => `<option ${F.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div></div>
      <label>Memo text</label><textarea class="inp" id="fB" placeholder="Dear Tenant,&#10;Please be informed that…">${esc(F.body)}</textarea>
      <label>Attachment (optional · PDF, image, Word or Excel · up to 8 MB)</label><div><button class="btn ghost small" id="fF">${F.file ? "📎 " + esc(F.file.name) + " · change" : "Attach a file"}</button>${F.file ? ` <button class="btn ghost small" id="fFx">Remove</button>` : ""}</div>
      <div class="g2"><div><label>Tenants must</label><select class="sel" id="fMo"><option value="ack" ${F.mode === "ack" ? "selected" : ""}>Acknowledge (one button)</option><option value="reply" ${F.mode === "reply" ? "selected" : ""}>Reply (text + file)</option></select></div>
        <div><label>Answer by (optional)</label><input class="inp" type="date" id="fR" value="${F.replyBy}" min="${todayISO()}"></div></div>
      <div class="grp"><b>Reminders to tenants who don't answer</b>
        <div class="g2" style="align-items:end"><div><label><input type="checkbox" id="fA" ${F.auto ? "checked" : ""}> Automatic</label></div>
          <div><label>Every (days)</label><input class="inp" type="number" min="1" max="30" id="fEv" value="${F.every}"></div><div><label>Up to (times)</label><input class="inp" type="number" min="0" max="10" id="fMx" value="${F.max}"></div></div>
        <span class="mut">You can also send a reminder yourself at any time from the memo's board.</span></div>

      <div class="sec" style="margin-top:18px">Who receives it</div>
      <label>Flagships</label><div class="ck" id="kS">${sites.map(s => `<span data-v="${s}" class="${F.sites.includes(s) ? "on" : ""}">${esc(L.sites[s])}</span>`).join("")}</div>
      <label>Category <span class="mut">(none selected = all)</span></label>${chips("kC", "cats", f.cats)}
      <label>Sub-category <span class="mut">(GLA department · none selected = all)</span></label>${chips("kD", "depts", depts)}
      <label>Mall level</label>${chips("kF", "floors", f.floors)}
      <div class="g2"><div><label>CRM handheld</label>${tri("crm", F.sites.length ? f.crm : null)}</div><div><label>Direct Banking</label>${tri("dbank", F.sites.length ? f.dbank : null)}</div></div>
      <label>Tenants Directory contacts by position <span class="mut">(none selected = all contacts)</span></label>${chips("kP", "positions", f.positions)}
      <label>+ Tenant Portal Database <span class="mut">(ABC Connect users of the shop, its brand, company and group)</span></label>${chips("kL", "levels", f.levels.map(x => ({ name: x })), x => esc(x.name) + " level", "lv")}
      <div class="acts" style="margin-top:12px"><button class="btn" id="fV">Show the tenants</button><button class="btn ghost" id="fTest">✉ Send me a test</button></div>
    </div><div id="aud"></div>`);
  const keep = () => Object.assign(F, { title: $("#fT").value, body: $("#fB").value, cat: $("#fC").value, mode: $("#fMo").value, replyBy: $("#fR").value, auto: $("#fA").checked, every: +$("#fEv").value || 2, max: +$("#fMx").value });
  ["#fT", "#fB", "#fC", "#fMo", "#fR", "#fA", "#fEv", "#fMx"].forEach(s => { const el = $(s); el.addEventListener("input", keep); el.addEventListener("change", keep); });
  $("#back").onclick = () => { keep(); list(); };
  const reset = () => { F.aud = null; $("#aud").innerHTML = ""; };
  const tog = (id, key, reload) => { const el = $("#" + id); if (el) el.onclick = e => { const s = e.target.closest("[data-v]"); if (!s) return; const v = s.dataset.v, a = F[key];
    a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); s.classList.toggle("on"); reset(); if (reload) { keep(); newForm(); } }; };
  tog("kS", "sites", true); tog("kC", "cats", true); tog("kD", "depts"); tog("kF", "floors"); tog("kP", "positions"); tog("kL", "levels");
  $("#view").querySelectorAll("[data-tri]").forEach(g => g.onclick = e => { const s = e.target.closest("[data-v]"); if (!s) return; F[g.dataset.tri] = s.dataset.v; g.querySelectorAll("span").forEach(x => x.classList.toggle("on", x === s)); reset(); });
  $("#fF").onclick = () => { const p = $("#fileIn"); p.value = ""; p.onchange = () => { const x = p.files[0]; if (!x) return; if (x.size > 8e6) return toast("The file is larger than 8 MB", true);
    const r = new FileReader(); r.onload = () => { keep(); F.file = { name: x.name, data: r.result }; newForm(); }; r.readAsDataURL(x); }; p.click(); };
  const fx = $("#fFx"); if (fx) fx.onclick = () => { keep(); F.file = null; newForm(); };
  $("#fTest").onclick = async () => { keep(); if (!F.sites.length) return toast("Choose a flagship", true);
    try { const r = await api("ops/memo/test", { sites: F.sites, title: F.title, body: F.body, cat: F.cat, mode: F.mode, replyBy: F.replyBy, file: F.file ? { name: F.file.name } : null }); toast("Test sent to " + r.sent); } catch (e){ toast(e.message, true); } };
  $("#fV").onclick = async () => { keep(); if (!F.sites.length) return toast("Choose at least one flagship", true);
    try { F.aud = (await api("ops/memo/audience", body())).list; F.off = new Set(); audience(); $("#aud").scrollIntoView({ behavior: "smooth" }); } catch (e){ toast(e.message, true); } };
  if (F.aud) audience();
}
const body = () => { const F = FORM; return { sites: F.sites, cats: F.cats, depts: F.depts, floors: F.floors, crm: F.crm, dbank: F.dbank, positions: F.positions, levels: F.levels }; };
function audience(){
  const F = FORM, A = F.aud, key = t => `${t.site}|${t.brand}`;
  const on = A.filter(t => !F.off.has(key(t))), noMail = on.filter(t => !(F.mails[key(t)] ?? t.emails)).length;
  const nMails = new Set(on.flatMap(t => String(F.mails[key(t)] ?? t.emails).split(/[\s,;]+/).filter(Boolean))).size;
  $("#aud").innerHTML = `<div class="sec">${on.length} of ${A.length} tenants selected · ${nMails} emails · ${noMail ? `<span style="color:#B0283C">${noMail} without email</span>` : "all have an email ✓"}</div>
    <div class="tw"><table class="t"><thead><tr><th><input type="checkbox" id="all" ${on.length === A.length ? "checked" : ""}></th><th>Tenant</th><th>Category · level</th><th>CRM · DB</th><th>Emails <span class="mut" style="text-transform:none;letter-spacing:0">(Directory + portal)</span></th></tr></thead><tbody>
    ${A.map((t, i) => `<tr><td><input type="checkbox" data-i="${i}" ${F.off.has(key(t)) ? "" : "checked"}></td><td><b>${esc(t.brand)}</b><br><span class="mut">${esc(t.units)}${F.sites.length > 1 ? " · " + esc(L.sites[t.site]) : ""}</span></td>
      <td>${esc(t.cat)}<br><span class="mut">${esc(t.dept)}${t.floors ? " · " + esc(t.floors) : ""}</span></td><td class="mut">${t.crm ? "CRM ✓" : "—"}<br>${t.dbank ? "Direct Banking ✓" : ""}</td>
      <td><input class="inp" data-m="${i}" value="${esc(F.mails[key(t)] ?? t.emails)}" placeholder="no email — type one"><br><span class="mut">${t.dir} Directory · ${t.portal} portal</span></td></tr>`).join("")}</tbody></table></div>
    <div class="bar2" style="margin-top:12px"><span class="mut">One email per shop, with its own link. ${F.auto && F.max ? `Reminder every ${F.every} day${F.every === 1 ? "" : "s"}, up to ${F.max} times.` : "No automatic reminder."}</span>
      <button class="btn" id="go">Send the memo to ${on.length} tenants</button></div>`;
  $("#aud").querySelectorAll("[data-i]").forEach(c => c.onchange = () => { const k = key(A[+c.dataset.i]); c.checked ? F.off.delete(k) : F.off.add(k); audience(); });
  $("#all").onchange = e => { F.off = e.target.checked ? new Set() : new Set(A.map(key)); audience(); };
  $("#aud").querySelectorAll("[data-m]").forEach(c => c.onchange = () => { F.mails[key(A[+c.dataset.m])] = c.value; audience(); });
  $("#go").onclick = async () => {
    if (!F.title.trim()) { toast("Give the memo a subject", true); $("#fT").focus(); return; }
    if (!F.body.trim()) { toast("Write the memo", true); $("#fB").focus(); return; }
    if (!(await confirmBox("Send the memo", `<b>${esc(F.title)}</b> to ${on.length} tenants (${nMails} emails), asking them to ${F.mode === "reply" ? "reply" : "acknowledge"}?`, "Send"))) return;
    $("#go").disabled = true;
    try { const r = await api("ops/memo/create", { ...body(), title: F.title, body: F.body, cat: F.cat, mode: F.mode, replyBy: F.replyBy, auto: F.auto, every: F.every, max: F.max, file: F.file, only: on.map(key), extraEmails: F.mails });
      toast(`${r.ref} sent to ${r.mailed} tenants`); FORM = null; open(r.id); } catch (e){ $("#go").disabled = false; toast(e.message, true); } };
}

/* ---------- one memo ---------- */
async function open(id){ V(`<p class="muted">Loading…</p>`); C = await api(`ops/memo/one?id=${id}`); if (SITE && !C.sites.some(s => s.site === SITE)) SITE = ""; draw(); }
function draw(){
  const m = C.memo, T = C.targets.filter(t => !SITE || t.site === SITE), live = !m.closed;
  const F = { all: T, ack: T.filter(t => t.state === "ack"), reply: T.filter(t => t.state === "reply"), wait: T.filter(t => !t.state), mail: T.filter(t => !t.state && !t.emails), unread: T.filter(t => !t.state && !t.opened) };
  const rows = F[FIL], waitN = F.wait.filter(t => t.emails).length;
  V(`<button class="btn ghost small" id="back">‹ Memos</button>
    <div class="bar2" style="margin-top:10px"><div><span class="ref">${esc(m.ref)}${m.cat ? " · " + esc(m.cat) : ""}</span><h2 style="margin:0">${esc(m.title)} ${m.closed ? `<span class="pill2 p-cl" style="vertical-align:middle">Closed</span>` : ""}</h2>
      <span class="mut">By ${esc(m.by)} · sent ${esc(fd(m.sent))} · tenants ${m.mode === "reply" ? "reply" : "acknowledge"}${m.replyBy ? " by <b>" + esc(fd(m.replyBy)) + "</b>" : ""} ·
        ${m.auto && m.max ? `reminder every ${m.every} day${m.every === 1 ? "" : "s"}, up to ${m.max} times` : "no automatic reminder"}${m.file ? ` · <a href="/api/ops/memo/file?id=${m.id}" target="_blank">📎 ${esc(m.file.name)}</a>` : ""}</span></div>
      <div class="acts">${C.ops && live ? `<button class="btn small" id="rem" ${waitN ? "" : "disabled"}>🔔 Remind waiting (${waitN})</button>` : ""}<button class="btn ghost small" id="csv">⇣ Export</button>
        ${C.ops ? `<button class="btn ghost small" id="set">⚙ Reminders</button><button class="btn ghost small" id="cls">${m.closed ? "Re-open" : "Close"}</button>` : ""}</div></div>
    <details style="margin-top:8px"><summary class="mut" style="cursor:pointer">Show the memo text</summary><div class="memo">${esc(m.body)}</div></details>
    <div class="sites">${C.sites.length > 1 ? card({ site: "", name: "All flagships", ...C.total }) : ""}${C.sites.map(card).join("")}</div>
    <div class="ft">${[["all", "All"], ["ack", "Acknowledged"], ["reply", "Replied"], ["wait", "Waiting"], ["unread", "Not opened"], ["mail", "No email"]].filter(([k]) => m.mode === "reply" ? k !== "ack" || F.ack.length : k !== "reply").map(([k, n]) => `<span data-f="${k}" class="${FIL === k ? "on" : ""}">${n} · ${F[k].length}</span>`).join("")}</div>
    <div class="tw"><table class="t"><thead><tr><th>Tenant</th><th>Answer</th><th>${m.mode === "reply" ? "Reply" : "Note"}</th><th>Emails sent</th><th></th></tr></thead><tbody>
    ${rows.map(t => `<tr><td><b>${esc(t.brand)}</b><br><span class="mut">${esc(t.units)}${t.dept ? " · " + esc(t.dept) : ""}${C.sites.length > 1 && !SITE ? " · " + esc(t.site) : ""}</span>${t.emails ? "" : `<br><span class="pill2 p-mail">no email</span>`}</td>
      <td>${ST[t.state]}${t.at ? `<br><span class="mut">${esc(fd(t.at))} · ${esc(t.by)}</span>` : t.opened ? `<br><span class="mut">opened the link</span>` : ""}</td>
      <td>${t.reply ? `<div class="rp">${esc(t.reply)}</div>` : ""}${t.replyFile ? `<a href="/api/ops/memo/rfile?target=${t.id}" target="_blank">📎 ${esc(t.replyFile)}</a>` : ""}${!t.reply && !t.replyFile ? "—" : ""}</td>
      <td class="mut">${t.mails ? `${t.mails} (${t.reminders} reminder${t.reminders === 1 ? "" : "s"})<br>last ${esc(fd(t.lastMail))}` : "—"}</td>
      <td style="white-space:nowrap">${C.ops ? `${live && !t.state && t.emails ? `<button class="btn ghost small" data-r="${t.id}" title="Remind now">🔔</button> ` : ""}<button class="btn ghost small" data-e="${t.id}" title="Edit">✎</button> <button class="btn ghost small" data-l="${esc(t.link)}" title="Copy the tenant's link">🔗</button>` : ""}</td></tr>`).join("")
      || `<tr><td colspan="5" class="mut" style="padding:16px">Nothing here.</td></tr>`}</tbody></table></div>`);
  $("#back").onclick = () => list();
  $("#view").querySelectorAll("[data-s]").forEach(x => x.onclick = () => { SITE = x.dataset.s; draw(); });
  $("#view").querySelectorAll("[data-f]").forEach(x => x.onclick = () => { FIL = x.dataset.f; draw(); });
  const rem = $("#rem"); if (rem) rem.onclick = async () => { rem.disabled = true; try { const r = await api("ops/memo/remind", { id: m.id, site: SITE }); toast(`Reminder sent to ${r.sent} tenants`); open(m.id); } catch (e){ rem.disabled = false; toast(e.message, true); } };
  $("#view").querySelectorAll("[data-r]").forEach(b => b.onclick = async () => { b.disabled = true; try { await api("ops/memo/remind", { id: m.id, target: +b.dataset.r }); toast("Reminder sent"); open(m.id); } catch (e){ b.disabled = false; toast(e.message, true); } });
  $("#view").querySelectorAll("[data-l]").forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.l).then(() => toast("Tenant link copied"), () => toast(b.dataset.l)));
  $("#view").querySelectorAll("[data-e]").forEach(b => b.onclick = () => edit(C.targets.find(t => t.id === +b.dataset.e)));
  $("#csv").onclick = () => {
    const out = [["Memo", "Flagship", "Unit", "Tenant", "Sub-category", "Answer", "Answered on", "By", "Reply", "Reply file", "Emails", "Emails sent", "Reminders"],
      ...C.targets.filter(t => !SITE || t.site === SITE).map(t => [m.ref, t.site, t.units, t.brand, t.dept, t.state === "ack" ? "Acknowledged" : t.state === "reply" ? "Replied" : "Waiting", (t.at || "").slice(0, 10), t.by, t.reply, t.replyFile, t.emails, t.mails, t.reminders])];
    const csv = out.map(r => r.map(x => `"${String(x ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = `${m.ref} ${m.title}.csv`; a.click(); };
  const st = $("#set"); if (st) st.onclick = () => { const d = $("#ed"); d.innerHTML = `<div class="b"><b>Reminders · ${esc(m.ref)}</b>
      <label><input type="checkbox" id="sA" ${m.auto ? "checked" : ""}> Automatic reminders</label>
      <div class="g2"><div><label>Every (days)</label><input class="inp" type="number" min="1" max="30" id="sE" value="${m.every}"></div><div><label>Up to (times)</label><input class="inp" type="number" min="0" max="10" id="sM" value="${m.max}"></div></div>
      <label>Answer by</label><input type="date" class="inp" id="sR" value="${m.replyBy}">
      <div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="ok">Save</button></div></div>`; d.showModal();
    $("#x").onclick = () => d.close(); $("#ok").onclick = async () => { try { await api("ops/memo/settings", { id: m.id, auto: $("#sA").checked, every: +$("#sE").value, max: +$("#sM").value, replyBy: $("#sR").value }); d.close(); toast("Saved"); open(m.id); } catch (e){ toast(e.message, true); } }; };
  const cl = $("#cls"); if (cl) cl.onclick = async () => { if (!m.closed && !(await confirmBox("Close the memo", "No more answers or reminders after this.", "Close"))) return; await api("ops/memo/close", { id: m.id }); toast(m.closed ? "Re-opened" : "Closed"); open(m.id); };
}
function card(s){
  return `<div class="site ${SITE === s.site ? "on" : ""}" data-s="${s.site}"><b>${esc(s.name)}</b><div class="pct">${s.pct}%</div><div class="mut">answered · ${s.opened} opened</div>
    <div class="stk"><i class="c1" style="width:${s.invited ? s.ack / s.invited * 100 : 0}%"></i><i class="c2" style="width:${s.invited ? s.reply / s.invited * 100 : 0}%"></i><i class="c3" style="width:${s.invited ? s.wait / s.invited * 100 : 0}%"></i></div>
    <div class="leg">${s.ack ? `<span><em style="color:#1E8A4C">${s.ack}</em> acknowledged</span>` : ""}${s.reply ? `<span><em style="color:#1F5A96">${s.reply}</em> replied</span>` : ""}<span><em>${s.wait}</em> waiting</span><span>of ${s.invited}</span></div></div>`;
}
function edit(t){
  const d = $("#ed"), m = C.memo;
  d.innerHTML = `<div class="b"><b>${esc(t.brand)}</b><span class="mut">${esc(t.units)}</span>
    <label>Emails</label><input class="inp" id="eM" value="${esc(t.emails)}" placeholder="manager@brand.com, crm@brand.com">
    <label>Answer (e.g. given in person or by phone)</label><select class="sel" id="eA"><option value="">Waiting</option><option value="ack" ${t.state === "ack" ? "selected" : ""}>Acknowledged</option>${m.mode === "reply" ? `<option value="reply" ${t.state === "reply" ? "selected" : ""}>Replied</option>` : ""}</select>
    <label>Note / reply</label><textarea class="inp" id="eC" style="min-height:70px" placeholder="optional">${esc(t.reply || "")}</textarea>
    <div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="ok">Save</button></div></div>`;
  d.showModal(); $("#x").onclick = () => d.close();
  $("#ok").onclick = async () => { const b = { id: m.id, target: t.id, emails: $("#eM").value };
    if ($("#eA").value !== t.state || $("#eC").value !== (t.reply || "")) Object.assign(b, { state: $("#eA").value, reply: $("#eC").value });
    try { await api("ops/memo/target", b); d.close(); toast("Saved"); open(m.id); } catch (e){ toast(e.message, true); } };
}
window.hubRefresh = () => C ? open(C.memo.id) : list();
list().catch(e => V(`<p class="muted">${esc(e.message)}</p>`));
</script>
</body>
</html>
