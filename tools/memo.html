<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memo · ABC Property Hub</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
/* Memo (Upcoming - Testing, Nov 2026) — docs/FEATURE-memo.md · laid out like an ABC Connect group (flagship groups → group page: composer + feed) */
:root{--cb:#0B6FD0;--cl:#D8DDE6}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px}
.grpc{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--cl);border-radius:8px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.grpc:hover{border-color:var(--cb)}
.lg{width:58px;height:58px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;overflow:hidden}
.lg img{width:70%;filter:brightness(0);opacity:.82}
.grpc b{display:block;font-size:1rem}.grpc small{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em}
.grpc .n{font-size:.8rem;color:var(--cb);margin-top:4px}
.gbox{background:var(--surface);border:1px solid var(--cl);border-radius:6px}
.ghead{padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ghead .lg{width:96px;height:96px}
.tiny{font-size:.74rem;color:var(--muted);text-transform:uppercase}
.ghead h2{font-size:1.45rem;margin:4px 0 0;font-weight:700}
.segb{display:inline-flex;border:1px solid var(--cl);border-radius:4px;overflow:hidden;margin-top:12px;flex-wrap:wrap}
.segb button{padding:7px 14px;color:var(--cb);border-right:1px solid var(--cl);font-weight:600;font-size:.86rem;background:transparent}.segb button:last-child{border:0}
.comp{margin-top:14px}
.ctab{background:var(--paper);border-bottom:1px solid var(--cl)}.ctab span{display:inline-block;padding:11px 18px;color:var(--cb);background:var(--surface);border-right:1px solid var(--cl);font-weight:600}
.cbody{padding:14px 16px;display:grid;gap:8px}
textarea.inp{min-height:130px;padding:10px;resize:vertical;line-height:1.45}
.rec{border:1px solid var(--cl);border-radius:6px;padding:10px 12px}
.rec>b{font-size:.86rem}
.dots{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0 2px}
.dots label{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:.88rem;font-weight:600}
.dots input{width:16px;height:16px;accent-color:var(--cb)}
.opt{margin-top:10px}.opt>b{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ck{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ck span{border:1px solid var(--cl);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer;background:var(--surface);user-select:none}
.ck span.on{background:var(--cb);border-color:var(--cb);color:#fff}.ck span small{opacity:.75;margin-left:4px}
.cnt{margin-top:10px;font-size:.86rem;color:var(--muted)}.cnt b{color:var(--text)}.cnt a{color:var(--cb);cursor:pointer;font-weight:700}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crow .sel{width:auto}
.share{background:var(--cb)!important;border-color:var(--cb)!important}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}.fbar .inp{max-width:320px;flex:1}
.post{padding:16px 4px;border-bottom:1px solid var(--cl)}
.ph{display:flex;gap:10px;align-items:center}.av{width:36px;height:36px}.ph b{color:var(--cb)}.ph small{display:block;color:var(--muted);font-size:.78rem}
.post .tt{font-weight:800;margin:12px 0 4px}
.post .bd{white-space:pre-line;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post .bd.open{display:block}
.xp{color:var(--cb);font-size:.84rem;cursor:pointer;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips span{font-size:.72rem;background:#EEF4FC;color:#0B4F94;border-radius:99px;padding:2px 9px}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--cl);border-radius:4px;padding:8px 11px;margin:4px 0;color:var(--cb);font-weight:600;text-decoration:none;font-size:.86rem}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px}
.ack{font-size:1rem;cursor:pointer}.ack b{color:var(--cb)}
.st{color:var(--muted);font-size:.82rem}.st a{color:var(--cb);cursor:pointer}
.ref{font-size:.7rem;font-weight:800;letter-spacing:.04em;color:var(--brand-2)}
.pill2{font-size:.72rem;font-weight:800;border-radius:99px;padding:4px 9px;white-space:nowrap}
.p-ok{background:#E3F4EA;color:#1E7A4F}.p-rep{background:#E6EEFB;color:#1F5A96}.p-wait{background:#FFF1D6;color:#8A6200}.p-mail{background:#EEE9F4;color:#5B4E70}.p-cl{background:#ECECEC;color:#555}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.site{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.site.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(74,31,115,.18)}
.site b{font-size:.88rem}.pct{font-size:1.7rem;font-weight:800;color:#1E8A4C;line-height:1.2}
.stk{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 6px;background:var(--paper)}.stk i{display:block}
.leg{display:flex;gap:9px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}.leg em{font-style:normal;font-weight:800}
.c1{background:#1E8A4C}.c2{background:#1F5A96}.c3{background:#D9D2E3}
.ft{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.ft span{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:700;cursor:pointer;background:var(--surface)}
.ft span.on{background:#2A0F45;color:#fff;border-color:#2A0F45}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:.82rem;min-width:680px}
.t th{text-align:left;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t td .inp{height:32px;min-width:200px}
.mut{color:var(--muted);font-size:.76rem}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.rp{white-space:pre-line;background:var(--paper);border-radius:9px;padding:6px 9px;margin-top:4px;max-width:420px}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;white-space:pre-line;line-height:1.5}
dialog#ed{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:90dvh}
dialog#ed .b{padding:16px;display:grid;gap:6px}dialog#ed label{font-size:.76rem;font-weight:700;color:var(--muted);margin-top:6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tl{max-height:55dvh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tl label{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.84rem;align-items:start}
.tl .inp{grid-column:2;height:30px;font-size:.78rem}
</style>
</head>
<body>
<div class="top"><h1>📜 Memo <small id="sub">ABC Property Hub</small></h1></div>
<div class="wrap"><div id="view"><p class="muted">Loading…</p></div></div>
<dialog id="ed"></dialog>
<input type="file" id="fileIn" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx" hidden>
<script src="common.js"></script>
<script>
const UP = new URLSearchParams(location.search);
let GR = null, G = UP.get("site") || "", L = null, C = null, SITE = "", FIL = "all", FORM = null, FLT = null, SORT = "latest", Q = "", SN = {}, AUDT = 0;
const fd = d => d ? new Date(d.slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "";
const fdl = d => d ? new Date(d).toLocaleString("en-GB", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Beirut" }).replace(",", " at") : "";
const V = h => { $("#view").innerHTML = h; };
const todayISO = () => new Date(Date.now() + 2 * 36e5).toISOString().slice(0, 10);
const ST = { ack: `<span class="pill2 p-ok">✓ Acknowledged</span>`, reply: `<span class="pill2 p-rep">💬 Replied</span>`, "": `<span class="pill2 p-wait">Waiting</span>` };
const logo = () => `<span class="lg"><img src="/icons/abc-logo-white.png" alt=""></span>`;
const go = (site, id) => history.replaceState(null, "", site ? `?site=${site}${id ? "&memo=" + id : ""}` : location.pathname);

/* ---------- 1 · the flagship groups ---------- */
async function groups(){
  C = null; G = ""; go(""); $("#sub").textContent = "ABC Property Hub";
  GR = await api("ops/memo/groups"); GR.groups.forEach(g => SN[g.site] = g.name);
  V(`<div class="groups">${GR.groups.map(g => `<button class="grpc" data-g="${g.site}">${logo()}<div><small>📡 Broadcast only</small><b>${esc(g.name)}</b>
      <div class="n">${g.tenants} tenants · ${g.memos} memo${g.memos === 1 ? "" : "s"}${g.last ? " · last " + esc(fd(g.last)) : ""}</div></div></button>`).join("")}</div>`);
  $("#view").querySelectorAll("[data-g]").forEach(b => b.onclick = () => group(b.dataset.g));
}

/* ---------- 2 · one group: composer + feed ---------- */
async function group(site){
  C = null; G = site; go(site); V(`<p class="muted">Loading…</p>`);
  if (!GR) { GR = await api("ops/memo/groups"); GR.groups.forEach(g => SN[g.site] = g.name); }
  $("#sub").textContent = SN[site] || "";
  [L, FLT] = await Promise.all([api(`ops/memo/list?site=${site}`), api(`ops/memo/filters?sites=${site}`)]);
  if (!FORM || FORM.site !== site) FORM = { site, title: "", body: "", cat: "Operations", mode: "ack", auto: true, every: 2, max: 3, all: true, use: { cats: false, depts: false, floors: false, contract: false },
    cats: [], depts: [], floors: [], contract: "", file: null, aud: null, off: new Set(), mails: {} };
  drawGroup();
}
function drawGroup(){
  const F = FORM, g = GR.groups.find(x => x.site === G) || { tenants: 0, memos: 0 };
  const chips = (key, list, label = x => esc(x.name)) => `<div class="ck" data-k="${key}">${list.map(x => `<span data-v="${esc(x.name)}" class="${F[key].includes(x.name) ? "on" : ""}">${label(x)}<small>${x.n}</small></span>`).join("") || `<span class="mut" style="border:0">None in the GLA</span>`}</div>`;
  const depts = FLT.depts.filter(x => !F.use.cats || !F.cats.length || F.cats.includes(x.cat));
  const opt = (k, title, body) => F.use[k] ? `<div class="opt"><b>${title}</b>${body}</div>` : "";
  let feed = L.list.slice();
  if (SORT === "waiting") feed.sort((a, b) => (b.stats.wait - a.stats.wait) || (b.id - a.id));
  if (Q) { const s = Q.toLowerCase(); feed = feed.filter(m => `${m.ref} ${m.title} ${m.body}`.toLowerCase().includes(s)); }
  const tags = m => { const f = m.filt || {}, t = [];
    if (f.cats && f.cats.length) t.push("Category: " + f.cats.join(", ")); if (f.depts && f.depts.length) t.push("Sub category: " + f.depts.join(", "));
    if (f.floors && f.floors.length) t.push("Levels: " + f.floors.join(", ")); if (f.contract) t.push({ crm: "CRM", dbank: "Direct Banking", both: "CRM + Direct Banking" }[f.contract]);
    return t.length ? t : ["All tenants"]; };
  V(`<div class="gbox ghead">${logo()}<div><div class="tiny">Unlisted · 📡 Broadcast only</div><h2>${esc(SN[G] || G)}</h2>
      <div class="segb"><button id="bk">‹ All groups</button><button disabled style="color:var(--muted)">${g.tenants} tenants</button><button disabled style="color:var(--muted)">${L.list.length} memo${L.list.length === 1 ? "" : "s"}</button></div></div></div>
    ${L.ops ? `<div class="gbox comp"><div class="ctab"><span>Memo</span></div><div class="cbody">
      <div class="crow"><input class="inp" id="fT" style="flex:1;min-width:220px" value="${esc(F.title)}" placeholder="Subject — e.g. Mall evacuation awareness session">
        <select class="sel" id="fC">${L.cats.map(c => `<option ${F.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
      <textarea class="inp" id="fB" placeholder="Dear Valued Partners,&#10;…">${esc(F.body)}</textarea>
      <div class="crow"><button class="btn ghost small" id="fF">📎 ${F.file ? esc(F.file.name) + " · change" : "Attach file"}</button>${F.file ? `<button class="btn ghost small" id="fFx">Remove</button>` : ""}<span class="mut">PDF, image, Word or Excel · up to 8 MB</span></div>
      <div class="rec"><b>Recipients</b>
        <div class="dots"><label><input type="checkbox" data-all ${F.all ? "checked" : ""}> All tenants</label>
          ${[["cats", "Category"], ["depts", "Sub Category"], ["floors", "Mall Levels"], ["contract", "Contract Terms"]].map(([k, n]) => `<label><input type="checkbox" data-use="${k}" ${F.use[k] ? "checked" : ""}> ${n}</label>`).join("")}</div>
        ${opt("cats", "Category", chips("cats", FLT.cats))}
        ${opt("depts", "Sub Category", chips("depts", depts))}
        ${opt("floors", "Mall Levels", chips("floors", FLT.floors))}
        ${opt("contract", "Contract Terms", `<div class="ck" data-ct>${[["crm", "CRM", FLT.crm], ["dbank", "Direct Banking", FLT.dbank], ["both", "Both (CRM and Direct Banking)", FLT.both]].map(([v, n, c]) => `<span data-v="${v}" class="${F.contract === v ? "on" : ""}">${n}<small>${c}</small></span>`).join("")}</div>`)}
        <div class="cnt" id="cnt">…</div></div>
      <div class="crow"><select class="sel" id="fMo"><option value="ack" ${F.mode === "ack" ? "selected" : ""}>Tenants must: Acknowledge</option><option value="reply" ${F.mode === "reply" ? "selected" : ""}>Tenants must: Reply (text + file)</option></select>
        <select class="sel" id="fRm">${[[1, 2, 3], [1, 1, 3], [1, 3, 3], [1, 2, 5], [0, 2, 3]].map(([a, e, m]) => `<option value="${a}|${e}|${m}" ${(F.auto ? 1 : 0) === a && (!a || (F.every === e && F.max === m)) ? "selected" : ""}>${a ? `Reminder every ${e} day${e === 1 ? "" : "s"} · ${m} times` : "No automatic reminder"}</option>`).join("")}</select>
        <span style="flex:1"></span><button class="btn ghost small" id="fTest">Send me a test</button><button class="btn share" id="share">Share</button></div>
    </div></div>` : ""}
    <div class="fbar"><span class="mut">Sort by:</span><select class="sel" id="srt" style="width:auto"><option value="latest">Latest memos</option><option value="waiting" ${SORT === "waiting" ? "selected" : ""}>Most waiting</option></select><span style="flex:1"></span><input class="inp" id="fq" placeholder="🔍 Search this feed…" value="${esc(Q)}"></div>
    <div>${feed.map(m => `<div class="post"><div class="ph">${logo().replace('class="lg"', 'class="lg av"')}<div><b>Operations Team</b> <span class="ref">· ${esc(m.ref)}${m.cat ? " · " + esc(m.cat) : ""}</span><small>${esc(fdl(m.at))} · by ${esc(m.by)}${m.closed ? " · closed" : ""}</small></div></div>
        <div class="tt">${esc(m.title)}</div><div class="bd" data-bd>${esc(m.body)}</div>${m.body.split("\n").length > 4 || m.body.length > 320 ? `<span class="xp" data-xp>Expand post</span>` : ""}
        <div class="chips">${tags(m).map(t => `<span>${esc(t)}</span>`).join("")}</div>
        ${m.file ? `<a class="att" href="/api/ops/memo/file?id=${m.id}" target="_blank">📄 ${esc(m.file.name)}</a>` : ""}
        <div class="pf"><span class="ack" data-open="${m.id}">${m.mode === "reply" ? "💬 Reply" : "👍 Acknowledge"} · <b>${m.stats.done} / ${m.stats.invited}</b></span>
          <span class="st">${m.stats.reply ? `<a data-open="${m.id}" data-f="reply">${m.stats.reply} repl${m.stats.reply === 1 ? "y" : "ies"}</a> · ` : ""}${m.stats.opened} views · <a data-open="${m.id}" data-f="wait">${m.stats.wait} waiting</a>${L.ops && !m.closed && m.stats.wait ? ` · <a data-rem="${m.id}">🔔 Remind</a>` : ""}</span></div></div>`).join("")
      || `<div class="card empty" style="padding:22px">No memo in this group yet.</div>`}</div>`);
  wireGroup();
}
function wireGroup(){
  const F = FORM, v = $("#view");
  $("#bk").onclick = () => groups();
  v.querySelectorAll("[data-xp]").forEach(x => x.onclick = () => { const b = x.previousElementSibling; b.classList.toggle("open"); x.textContent = b.classList.contains("open") ? "Collapse" : "Expand post"; });
  v.querySelectorAll("[data-open]").forEach(x => x.onclick = e => { e.stopPropagation(); FIL = x.dataset.f || "all"; open(+x.dataset.open); });
  v.querySelectorAll("[data-rem]").forEach(x => x.onclick = async e => { e.stopPropagation(); try { const r = await api("ops/memo/remind", { id: +x.dataset.rem }); toast(`Reminder sent to ${r.sent} tenants`); group(G); } catch (er){ toast(er.message, true); } });
  $("#srt").onchange = e => { SORT = e.target.value; drawGroup(); };
  const fq = $("#fq"); fq.oninput = () => { Q = fq.value; const p = fq.selectionStart; drawGroup(); const n = $("#fq"); n.focus(); n.setSelectionRange(p, p); };
  if (!L.ops) return;
  const keep = () => { const [a, e, m] = $("#fRm").value.split("|").map(Number); Object.assign(F, { title: $("#fT").value, body: $("#fB").value, cat: $("#fC").value, mode: $("#fMo").value, auto: !!a, every: e, max: m }); };
  ["#fT", "#fB", "#fC", "#fMo", "#fRm"].forEach(s => { const el = $(s); el.addEventListener("input", keep); el.addEventListener("change", keep); });
  const changed = () => { F.aud = null; F.off = new Set(); keep(); drawGroup(); };
  v.querySelector("[data-all]").onchange = e => { F.all = e.target.checked; if (F.all) F.use = { cats: false, depts: false, floors: false, contract: false }; else if (!Object.values(F.use).some(Boolean)) F.use.cats = true; changed(); };
  v.querySelectorAll("[data-use]").forEach(c => c.onchange = () => { F.use[c.dataset.use] = c.checked; F.all = !Object.values(F.use).some(Boolean); changed(); });
  v.querySelectorAll(".ck[data-k]").forEach(g => g.onclick = e => { const s = e.target.closest("[data-v]"); if (!s) return; const a = F[g.dataset.k], x = s.dataset.v; a.includes(x) ? a.splice(a.indexOf(x), 1) : a.push(x); changed(); });
  const ct = v.querySelector("[data-ct]"); if (ct) ct.onclick = e => { const s = e.target.closest("[data-v]"); if (!s) return; F.contract = F.contract === s.dataset.v ? "" : s.dataset.v; changed(); };
  $("#fF").onclick = () => { const p = $("#fileIn"); p.value = ""; p.onchange = () => { const x = p.files[0]; if (!x) return; if (x.size > 8e6) return toast("The file is larger than 8 MB", true);
    const r = new FileReader(); r.onload = () => { keep(); F.file = { name: x.name, data: r.result }; drawGroup(); }; r.readAsDataURL(x); }; p.click(); };
  const fx = $("#fFx"); if (fx) fx.onclick = () => { keep(); F.file = null; drawGroup(); };
  $("#fTest").onclick = async () => { keep(); try { const r = await api("ops/memo/test", { sites: [G], title: F.title, body: F.body, cat: F.cat, mode: F.mode, file: F.file ? { name: F.file.name } : null }); toast("Test sent to " + r.sent); } catch (e){ toast(e.message, true); } };
  $("#share").onclick = () => share();
  count();
}
const filt = () => { const F = FORM; return { sites: [G], cats: F.use.cats ? F.cats : [], depts: F.use.depts ? F.depts : [], floors: F.use.floors ? F.floors : [], contract: F.use.contract ? F.contract : "" }; };
const key = t => `${t.site}|${t.brand}`;
async function count(){
  const F = FORM, my = ++AUDT;
  if (!F.aud) { try { const r = await api("ops/memo/audience", filt()); if (my !== AUDT) return; F.aud = r.list; } catch (e){ const c = $("#cnt"); if (c) c.textContent = e.message; return; } }
  const on = F.aud.filter(t => !F.off.has(key(t))), em = new Set(on.flatMap(t => String(F.mails[key(t)] ?? t.emails).split(/[\s,;]+/).filter(Boolean))), no = on.filter(t => !(F.mails[key(t)] ?? t.emails)).length;
  const c = $("#cnt"); if (c) c.innerHTML = `→ <b>${on.length} tenant${on.length === 1 ? "" : "s"}</b> · ${em.size} emails${no ? ` · <span style="color:#B0283C">${no} without email</span>` : ""} · <a id="seeT">see / untick tenants</a>`;
  const s = $("#seeT"); if (s) s.onclick = () => seeTenants();
}
function seeTenants(){
  const F = FORM, A = F.aud, d = $("#ed");
  const paint = () => { d.innerHTML = `<div class="b"><b>${A.length - F.off.size} of ${A.length} tenants</b><span class="mut">Directory contacts + Tenant Portal Database (shop, brand, company and group). Edit an email or untick a tenant.</span>
      <div class="tl">${A.map((t, i) => `<label><input type="checkbox" data-i="${i}" ${F.off.has(key(t)) ? "" : "checked"}><span><b>${esc(t.brand)}</b> <span class="mut">${esc(t.units)} · ${esc(t.cat)}${t.floors ? " · " + esc(t.floors) : ""}${t.crm ? " · CRM" : ""}${t.dbank ? " · DB" : ""}</span></span>
        <input class="inp" data-m="${i}" value="${esc(F.mails[key(t)] ?? t.emails)}" placeholder="no email — type one"></label>`).join("")}</div>
      <div class="acts" style="justify-content:space-between;margin-top:10px"><span><button class="btn ghost small" id="tA">All</button> <button class="btn ghost small" id="tN">None</button></span><button class="btn" id="tOk">Done</button></div></div>`;
    d.querySelectorAll("[data-i]").forEach(c => c.onchange = () => { const k = key(A[+c.dataset.i]); c.checked ? F.off.delete(k) : F.off.add(k); d.querySelector("b").textContent = `${A.length - F.off.size} of ${A.length} tenants`; });
    d.querySelectorAll("[data-m]").forEach(c => c.onchange = () => { F.mails[key(A[+c.dataset.m])] = c.value; });
    $("#tA").onclick = () => { F.off = new Set(); paint(); }; $("#tN").onclick = () => { F.off = new Set(A.map(key)); paint(); };
    $("#tOk").onclick = () => { d.close(); count(); }; };
  paint(); d.showModal(); d.addEventListener("close", () => count(), { once: true });
}
async function share(){
  const F = FORM; if (!F.aud) await count();
  const on = F.aud.filter(t => !F.off.has(key(t)));
  if (!F.title.trim()) { toast("Write the subject", true); return $("#fT").focus(); }
  if (!F.body.trim()) { toast("Write the memo", true); return $("#fB").focus(); }
  if (F.use.contract && !F.contract) return toast("Choose CRM, Direct Banking or Both", true);
  if (!on.length) return toast("No tenant matches these recipients", true);
  if (!(await confirmBox("Share the memo", `<b>${esc(F.title)}</b> to ${on.length} tenants of ${esc(SN[G])}, asking them to ${F.mode === "reply" ? "reply" : "acknowledge"}?`, "Share"))) return;
  const b = $("#share"); b.disabled = true;
  try { const r = await api("ops/memo/create", { ...filt(), title: F.title, body: F.body, cat: F.cat, mode: F.mode, auto: F.auto, every: F.every, max: F.max, file: F.file, only: on.map(key), extraEmails: F.mails });
    toast(`${r.ref} shared with ${r.mailed} tenants`); FORM = null; GR = null; group(G); } catch (e){ b.disabled = false; toast(e.message, true); }
}

/* ---------- 3 · one memo: who answered ---------- */
async function open(id){ V(`<p class="muted">Loading…</p>`); C = await api(`ops/memo/one?id=${id}`); if (!G) G = C.memo.sites[0]; go(G, id); SITE = ""; draw(); }
function draw(){
  const m = C.memo, T = C.targets.filter(t => !SITE || t.site === SITE), live = !m.closed;
  const F = { all: T, ack: T.filter(t => t.state === "ack"), reply: T.filter(t => t.state === "reply"), wait: T.filter(t => !t.state), mail: T.filter(t => !t.state && !t.emails), unread: T.filter(t => !t.state && !t.opened) };
  const rows = F[FIL], waitN = F.wait.filter(t => t.emails).length;
  V(`<button class="btn ghost small" id="back">‹ ${esc(SN[G] || "Group")}</button>
    <div class="bar2" style="margin-top:10px"><div><span class="ref">${esc(m.ref)}${m.cat ? " · " + esc(m.cat) : ""}</span><h2 style="margin:0">${esc(m.title)} ${m.closed ? `<span class="pill2 p-cl" style="vertical-align:middle">Closed</span>` : ""}</h2>
      <span class="mut">By ${esc(m.by)} · sent ${esc(fd(m.sent))} · tenants ${m.mode === "reply" ? "reply" : "acknowledge"}${m.replyBy ? " by <b>" + esc(fd(m.replyBy)) + "</b>" : ""} ·
        ${m.auto && m.max ? `reminder every ${m.every} day${m.every === 1 ? "" : "s"}, up to ${m.max} times` : "no automatic reminder"}${m.file ? ` · <a href="/api/ops/memo/file?id=${m.id}" target="_blank">📎 ${esc(m.file.name)}</a>` : ""}</span></div>
      <div class="acts">${C.ops && live ? `<button class="btn small" id="rem" ${waitN ? "" : "disabled"}>🔔 Remind waiting (${waitN})</button>` : ""}<button class="btn ghost small" id="csv">⇣ Export</button>
        ${C.ops ? `<button class="btn ghost small" id="set">⚙ Reminders</button><button class="btn ghost small" id="cls">${m.closed ? "Re-open" : "Close"}</button>` : ""}</div></div>
    <details style="margin-top:8px"><summary class="mut" style="cursor:pointer">Show the memo text</summary><div class="memo">${esc(m.body)}</div></details>
    <div class="sites">${C.sites.length > 1 ? card({ site: "", name: "All flagships", ...C.total }) : ""}${C.sites.map(card).join("")}</div>
    <div class="ft">${[["all", "All"], ["ack", "Acknowledged"], ["reply", "Replied"], ["wait", "Waiting"], ["unread", "Not opened"], ["mail", "No email"]].filter(([k]) => m.mode === "reply" ? k !== "ack" || F.ack.length : k !== "reply").map(([k, n]) => `<span data-f="${k}" class="${FIL === k ? "on" : ""}">${n} · ${F[k].length}</span>`).join("")}</div>
    <div class="tw"><table class="t"><thead><tr><th>Tenant</th><th>Answer</th><th>${m.mode === "reply" ? "Reply" : "Note"}</th><th>Emails sent</th><th></th></tr></thead><tbody>
    ${rows.map(t => `<tr><td><b>${esc(t.brand)}</b><br><span class="mut">${esc(t.units)}${t.dept ? " · " + esc(t.dept) : ""}${C.sites.length > 1 && !SITE ? " · " + esc(t.site) : ""}</span>${t.emails ? "" : `<br><span class="pill2 p-mail">no email</span>`}</td>
      <td>${ST[t.state]}${t.at ? `<br><span class="mut">${esc(fd(t.at))} · ${esc(t.by)}</span>` : t.opened ? `<br><span class="mut">opened the link</span>` : ""}</td>
      <td>${t.reply ? `<div class="rp">${esc(t.reply)}</div>` : ""}${t.replyFile ? `<a href="/api/ops/memo/rfile?target=${t.id}" target="_blank">📎 ${esc(t.replyFile)}</a>` : ""}${!t.reply && !t.replyFile ? "—" : ""}</td>
      <td class="mut">${t.mails ? `${t.mails} (${t.reminders} reminder${t.reminders === 1 ? "" : "s"})<br>last ${esc(fd(t.lastMail))}` : "—"}</td>
      <td style="white-space:nowrap">${C.ops ? `${live && !t.state && t.emails ? `<button class="btn ghost small" data-r="${t.id}" title="Remind now">🔔</button> ` : ""}<button class="btn ghost small" data-e="${t.id}" title="Edit">✎</button> <button class="btn ghost small" data-l="${esc(t.link)}" title="Copy the tenant's link">🔗</button>` : ""}</td></tr>`).join("")
      || `<tr><td colspan="5" class="mut" style="padding:16px">Nothing here.</td></tr>`}</tbody></table></div>`);
  $("#back").onclick = () => group(G);
  $("#view").querySelectorAll("[data-s]").forEach(x => x.onclick = () => { SITE = x.dataset.s; draw(); });
  $("#view").querySelectorAll("[data-f]").forEach(x => x.onclick = () => { FIL = x.dataset.f; draw(); });
  const rem = $("#rem"); if (rem) rem.onclick = async () => { rem.disabled = true; try { const r = await api("ops/memo/remind", { id: m.id, site: SITE }); toast(`Reminder sent to ${r.sent} tenants`); open(m.id); } catch (e){ rem.disabled = false; toast(e.message, true); } };
  $("#view").querySelectorAll("[data-r]").forEach(b => b.onclick = async () => { b.disabled = true; try { await api("ops/memo/remind", { id: m.id, target: +b.dataset.r }); toast("Reminder sent"); open(m.id); } catch (e){ b.disabled = false; toast(e.message, true); } });
  $("#view").querySelectorAll("[data-l]").forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.l).then(() => toast("Tenant link copied"), () => toast(b.dataset.l)));
  $("#view").querySelectorAll("[data-e]").forEach(b => b.onclick = () => edit(C.targets.find(t => t.id === +b.dataset.e)));
  $("#csv").onclick = () => {
    const out = [["Memo", "Flagship", "Unit", "Tenant", "Sub-category", "Answer", "Answered on", "By", "Reply", "Reply file", "Emails", "Emails sent", "Reminders"],
      ...C.targets.filter(t => !SITE || t.site === SITE).map(t => [m.ref, t.site, t.units, t.brand, t.dept, t.state === "ack" ? "Acknowledged" : t.state === "reply" ? "Replied" : "Waiting", (t.at || "").slice(0, 10), t.by, t.reply, t.replyFile, t.emails, t.mails, t.reminders])];
    const csv = out.map(r => r.map(x => `"${String(x ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = `${m.ref} ${m.title}.csv`; a.click(); };
  const st = $("#set"); if (st) st.onclick = () => { const d = $("#ed"); d.innerHTML = `<div class="b"><b>Reminders · ${esc(m.ref)}</b>
      <label><input type="checkbox" id="sA" ${m.auto ? "checked" : ""}> Automatic reminders</label>
      <div class="g2"><div><label>Every (days)</label><input class="inp" type="number" min="1" max="30" id="sE" value="${m.every}"></div><div><label>Up to (times)</label><input class="inp" type="number" min="0" max="10" id="sM" value="${m.max}"></div></div>
      <label>Answer by</label><input type="date" class="inp" id="sR" value="${m.replyBy}">
      <div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="ok">Save</button></div></div>`; d.showModal();
    $("#x").onclick = () => d.close(); $("#ok").onclick = async () => { try { await api("ops/memo/settings", { id: m.id, auto: $("#sA").checked, every: +$("#sE").value, max: +$("#sM").value, replyBy: $("#sR").value }); d.close(); toast("Saved"); open(m.id); } catch (e){ toast(e.message, true); } }; };
  const cl = $("#cls"); if (cl) cl.onclick = async () => { if (!m.closed && !(await confirmBox("Close the memo", "No more answers or reminders after this.", "Close"))) return; await api("ops/memo/close", { id: m.id }); toast(m.closed ? "Re-opened" : "Closed"); open(m.id); };
}
function card(s){
  return `<div class="site ${SITE === s.site ? "on" : ""}" data-s="${s.site}"><b>${esc(s.name)}</b><div class="pct">${s.pct}%</div><div class="mut">answered · ${s.opened} opened</div>
    <div class="stk"><i class="c1" style="width:${s.invited ? s.ack / s.invited * 100 : 0}%"></i><i class="c2" style="width:${s.invited ? s.reply / s.invited * 100 : 0}%"></i><i class="c3" style="width:${s.invited ? s.wait / s.invited * 100 : 0}%"></i></div>
    <div class="leg">${s.ack ? `<span><em style="color:#1E8A4C">${s.ack}</em> acknowledged</span>` : ""}${s.reply ? `<span><em style="color:#1F5A96">${s.reply}</em> replied</span>` : ""}<span><em>${s.wait}</em> waiting</span><span>of ${s.invited}</span></div></div>`;
}
function edit(t){
  const d = $("#ed"), m = C.memo;
  d.innerHTML = `<div class="b"><b>${esc(t.brand)}</b><span class="mut">${esc(t.units)}</span>
    <label>Emails</label><input class="inp" id="eM" value="${esc(t.emails)}" placeholder="manager@brand.com, crm@brand.com">
    <label>Answer (e.g. given in person or by phone)</label><select class="sel" id="eA"><option value="">Waiting</option><option value="ack" ${t.state === "ack" ? "selected" : ""}>Acknowledged</option>${m.mode === "reply" ? `<option value="reply" ${t.state === "reply" ? "selected" : ""}>Replied</option>` : ""}</select>
    <label>Note / reply</label><textarea class="inp" id="eC" style="min-height:70px" placeholder="optional">${esc(t.reply || "")}</textarea>
    <div class="acts" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" id="x">Cancel</button><button class="btn" id="ok">Save</button></div></div>`;
  d.showModal(); $("#x").onclick = () => d.close();
  $("#ok").onclick = async () => { const b = { id: m.id, target: t.id, emails: $("#eM").value };
    if ($("#eA").value !== t.state || $("#eC").value !== (t.reply || "")) Object.assign(b, { state: $("#eA").value, reply: $("#eC").value });
    try { await api("ops/memo/target", b); d.close(); toast("Saved"); open(m.id); } catch (e){ toast(e.message, true); } };
}window.hubRefresh = () => C ? open(C.memo.id) : G ? group(G) : groups();
(UP.get("memo") ? open(+UP.get("memo")) : G ? group(G) : groups()).catch(e => V(`<p class="muted">${esc(e.message)}</p>`));
</script>
</body>
