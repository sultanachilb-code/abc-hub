<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Access Pass · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Quick Access Pass: one-entry QR for a contractor or visitor, live 30 minutes — see docs/FEATURE-quick-pass.md -->
<style>
.grid2{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.box{padding:16px 18px}.box h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
.fg{display:grid;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)}
.fg input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-weight:500}
.hint{font-size:.76rem;color:var(--muted);line-height:1.45;margin-top:10px}
.qp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.qp:first-of-type{border-top:0}
.qp .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:.72rem;color:#fff;background:var(--brand)}
.qp .ic.live{background:var(--ok)}.qp .ic.requested{background:var(--warn)}.qp .ic.used{background:var(--brand-2)}.qp .ic.expired,.qp .ic.cancelled,.qp .ic.rejected{background:#8C8398}
.qp b{font-size:.95rem}.qp small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px;line-height:1.4}
.qp .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cd{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ok)}
.wa{background:#1E9E55!important;color:#fff!important;border:0!important}
.sec{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.made{padding:18px;text-align:center}
.made .qr{width:200px;height:200px;margin:8px auto;background:#fff;border-radius:14px;padding:8px}
.made .qr svg{width:100%;height:100%}
.made .code{font-size:1.4rem;font-weight:900;letter-spacing:.12em;color:var(--brand)}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.qp{grid-template-columns:auto 1fr}.qp .acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="top"><h1>🎫 Quick Access Pass <small id="sub"></small></h1><span id="sitePick"></span></div>
<div class="wrap"><div id="app"><div class="empty">Loading…</div></div></div>
<dialog id="dlg"></dialog>
<script src="common.js"></script>
<script>
const UP = new URLSearchParams(location.search);
let ctx = null, site = UP.get("site") || "", Q = null, made = null;
const hm = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", minute: "2-digit" }) : "";
const dayL = iso => iso ? new Date(iso).toLocaleDateString("en-GB", { timeZone: "Asia/Beirut", day: "numeric", month: "short" }) : "";
const linkOf = p => `${location.origin}/qp/${p.token}`;
const STATE = { live: ["Live", "ok"], requested: ["Waiting for approval", "warn"], used: ["Used at the gate", "brand"], expired: ["Expired", ""], rejected: ["Rejected", "alert"], cancelled: ["Cancelled", ""] };
/* Lebanese numbers: 03 123 456 → 9613123456 */
function waNumber(m){ let n = String(m || "").replace(/[^\d+]/g, ""); if (n.startsWith("+")) return n.slice(1); if (n.startsWith("00")) return n.slice(2); if (n.startsWith("961")) return n; if (n.startsWith("0")) n = n.slice(1); return n ? "961" + n : ""; }
function waLink(p){
  const first = String(p.name).split(/\s+/)[0];
  const t = `Hello ${first}, this is your ABC ${Q.siteName} access pass: ${linkOf(p)}\nShow the QR code at the loading area. It is for one entry and is valid for ${Q.minutes} minutes once approved.\n\nمرحباً ${first}، هذا تصريح الدخول إلى ABC ${Q.siteName}: ${linkOf(p)}\nيرجى إبراز رمز QR عند منطقة التحميل. صالح لدخول واحد ولمدة ${Q.minutes} دقيقة بعد الموافقة.`;
  const n = waNumber(p.mobile);
  return `https://wa.me/${n}?text=${encodeURIComponent(t)}`;
}
async function boot(){
  try {
    ctx = await api("ops/context" + (site ? `?site=${site}` : ""));
    if (!site || site === "ALL") site = ctx.site;
    $("#sitePick").innerHTML = siteSelect(ctx, v => { site = v; made = null; history.replaceState(null, "", `?site=${site}`); load(); });
    load();
  } catch (e){ $("#app").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function load(quiet){
  try { Q = await api(`ops/qp/list?site=${site}`); $("#sub").textContent = Q.siteName; draw(quiet); }
  catch (e){ if (!quiet) $("#app").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function left(p){ const s = Math.max(0, Math.round((Date.parse(p.expiresAt) - Date.now()) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function row(p){
  const [lbl, tone] = STATE[p.state] || [p.state, ""];
  const mine = Q.approver || p.requestedBy === ctx.me.name;
  const acts = [];
  if (p.state === "requested" && Q.approver) acts.push(`<button class="btn small" data-ap="${p.id}">Approve</button><button class="btn small ghost danger" data-rj="${p.id}">Reject</button>`);
  if (["live", "requested"].includes(p.state)){
    if (p.mobile) acts.push(`<a class="btn small wa" href="${esc(waLink(p))}" target="_blank" rel="noopener">WhatsApp</a>`);
    acts.push(`<button class="btn small ghost" data-cp="${p.id}">Copy link</button>`);
    if (mine) acts.push(`<button class="btn small ghost danger" data-cx="${p.id}">Cancel</button>`);
  }
  const when = p.state === "live" ? `Live · <span class="cd" data-cd="${esc(p.expiresAt)}">${left(p)}</span> left · until ${hm(p.expiresAt)}`
    : p.state === "used" ? `Entered ${hm(p.usedAt)} · ${esc(p.usedBy)}` : p.state === "requested" ? `Asked ${hm(p.requestedAt)} by ${esc(p.requestedBy)}`
    : p.state === "expired" && p.expiresAt ? `Expired ${hm(p.expiresAt)}` : esc(p.note || "");
  return `<div class="qp"><div class="ic ${p.state}">QP</div><div><b>${esc(p.name)}</b> <span class="pill ${tone}">${lbl}</span>
    <small>${esc([p.company, p.tenant && "for " + p.tenant, p.reason].filter(Boolean).join(" · "))}</small>
    <small>${esc(p.code)} · ${dayL(p.requestedAt)} · ${when}${p.decidedBy && p.state !== "requested" ? ` · ${p.state === "rejected" ? "rejected" : "approved"} by ${esc(p.decidedBy)}` : ""}</small></div>
    <div class="acts">${acts.join("")}</div></div>`;
}
function draw(quiet){
  const keep = quiet && document.activeElement && document.activeElement.closest && document.activeElement.closest("#fForm");
  const waiting = Q.list.filter(p => p.state === "requested"), live = Q.list.filter(p => p.state === "live"), other = Q.list.filter(p => !["requested", "live"].includes(p.state));
  const listHtml = `${waiting.length ? `<div class="sec">${Q.approver ? "To approve" : "Waiting for approval"} · ${waiting.length}</div><div class="card">${waiting.map(row).join("")}</div>` : ""}
    <div class="sec">Live now · ${live.length}</div><div class="card">${live.length ? live.map(row).join("") : `<div class="empty" style="padding:18px">No live pass.</div>`}</div>
    ${other.length ? `<div class="sec">Last 3 days</div><div class="card">${other.map(row).join("")}</div>` : ""}`;
  if (keep){ $("#lists").innerHTML = listHtml; return; }
  $("#app").innerHTML = `<div class="grid2"><div>
    <div class="card box" id="fForm"><h3>${Q.approver ? "New pass" : "Ask for a pass"}</h3>
      <div class="fg">
        <label>Name of the contractor / visitor *<input id="fName" autocomplete="off" placeholder="e.g. Ahmad Khalil"></label>
        <label>Company<input id="fCo" autocomplete="off" placeholder="e.g. Fast Fix SARL"></label>
        <label>Mobile (WhatsApp)<input id="fMob" inputmode="tel" autocomplete="off" placeholder="e.g. 03 123 456"></label>
        <label>Tenant / unit<input id="fTen" autocomplete="off" placeholder="e.g. Zara"></label>
        <label>Reason<input id="fWhy" autocomplete="off" placeholder="e.g. AC repair, delivery"></label>
      </div>
      <button class="btn" id="fGo" style="width:100%;margin-top:12px;height:44px">${Q.approver ? "Create live pass" : "Send for approval"}</button>
      <p class="hint">${Q.approver ? `Your pass is live at once for ${Q.minutes} minutes, for one entry at the loading gate.` : `The operations team gets your request. The ${Q.minutes} minutes start when they approve it — you can send the WhatsApp link now; the page turns live by itself.`}</p>
    </div>
    ${made ? `<div class="card made" style="margin-top:14px"><b>${esc(made.name)}</b><div class="qr" id="mQr"></div><div class="code">${esc(made.code)}</div>
      <p class="hint" style="margin:6px 0 12px">${made.state === "live" ? `Live until ${hm(made.expiresAt)}` : "Waiting for approval"}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${made.mobile ? `<a class="btn wa" href="${esc(waLink(made))}" target="_blank" rel="noopener">Send on WhatsApp</a>` : ""}<button class="btn ghost" data-cp="${made.id}">Copy link</button></div></div>` : ""}
    </div><div id="lists">${listHtml}</div></div>`;
  $("#fGo").onclick = create;
  if (made) qrInto($("#mQr"), linkOf(made));
}
function qrInto(el, text){ const go = () => { try { const q = qrcode(0, "M"); q.addData(text); q.make(); el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 1 }); } catch {} };
  if (window.qrcode) go(); else { const s = document.createElement("script"); s.src = "/tools/qrcode.js"; s.onload = go; document.head.append(s); } }
async function create(){
  const b = $("#fGo"); b.disabled = true;
  try {
    const r = await api("ops/qp/new", { site, name: $("#fName").value, company: $("#fCo").value, mobile: $("#fMob").value, tenant: $("#fTen").value, reason: $("#fWhy").value });
    made = r.pass; toast(made.state === "live" ? "Pass is live" : "Request sent to the operations team"); await load();
  } catch (e){ toast(e.message, true); b.disabled = false; }
}
function askNote(p){ return new Promise(res => { const d = $("#dlg");
  d.innerHTML = `<div class="dlg-h"><b>Reject the pass for ${esc(p.name)}?</b><small>${esc(p.requestedBy)} is told, with your reason.</small></div>
    <div class="dlg-b"><input class="inp" id="rjN" placeholder="Reason (optional)" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit"></div>
    <div class="dlg-f"><button class="btn ghost" data-v="0">Back</button><button class="btn" data-v="1">Reject</button></div>`;
  d.onclick = e => { const b = e.target.closest("[data-v]"); if (!b && e.target !== d) return; const v = $("#rjN").value.trim(); d.close(); res(b && b.dataset.v === "1" ? v : null); };
  d.showModal(); setTimeout(() => $("#rjN").focus(), 50); }); }
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-ap],[data-rj],[data-cx],[data-cp]"); if (!t) return;
  const id = Number(t.dataset.ap || t.dataset.rj || t.dataset.cx || t.dataset.cp), p = Q.list.find(x => x.id === id) || made;
  try {
    if (t.dataset.cp){ await navigator.clipboard.writeText(linkOf(p)); return toast("Link copied"); }
    if (t.dataset.ap){ await api("ops/qp/decide", { site, id, approve: true }); toast(`Approved — live for ${Q.minutes} minutes`); }
    if (t.dataset.rj){ const note = await askNote(p); if (note === null) return; await api("ops/qp/decide", { site, id, approve: false, note }); toast("Rejected"); }
    if (t.dataset.cx){ if (!(await confirmBox("Cancel this pass?", "The QR code stops working at once.", "Cancel pass"))) return; await api("ops/qp/cancel", { site, id }); toast("Cancelled"); }
    if (made && made.id === id) made = null;
    load();
  } catch (er){ toast(er.message, true); }
});
setInterval(() => document.querySelectorAll("[data-cd]").forEach(el => { const s = Math.round((Date.parse(el.dataset.cd) - Date.now()) / 1000); if (s <= 0) return load(true); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }), 1000);
setInterval(() => { if (document.visibilityState === "visible" && Q) load(true); }, 20000);
boot();
</script>
</body>
</html>
