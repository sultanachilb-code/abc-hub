<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLA &amp; Occupancy · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.kpi{padding:14px 16px}
.kpi strong{display:block;font-size:1.55rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.kpi.big strong{color:var(--brand-2)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.panel{padding:16px 18px}
.panel h2{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.lv{display:grid;grid-template-columns:58px 1fr 92px;gap:10px;align-items:center;font-size:.85rem;margin-bottom:9px}
.lv b{font-variant-numeric:tabular-nums}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.c-occ{background:#7B4BB0}.c-fit{background:#C8A24A}.c-vac{background:#E5484D}.c-ds{background:#4A6FA5}.c-pop{background:#2E8B7A}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}
.dp{display:grid;grid-template-columns:1fr 70px;gap:4px 10px;font-size:.84rem;align-items:center}
.dp .t{height:7px;border-radius:99px;background:var(--line);overflow:hidden;grid-column:1/-1;margin-bottom:6px}
.dp .t i{display:block;height:100%;background:var(--brand-2);border-radius:99px}
.dp b{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters .inp{flex:1;min-width:180px}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);cursor:pointer;white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.scroll{max-height:560px;overflow:auto}
.st-Active{background:rgba(46,139,87,.14);color:var(--ok)} .st-VACANT{background:rgba(192,57,43,.13);color:var(--alert)} .st-FIT{background:rgba(200,162,74,.2);color:#8A6A1C}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--brand-2);color:var(--brand-2)}
@media (max-width:900px){ .grid2{grid-template-columns:1fr} }
@media print{ .filters,.noprint{display:none!important} .scroll{max-height:none;overflow:visible} }
</style>
</head>
<body>
<div class="top">
  <h1>GLA &amp; Occupancy <small id="sub"></small></h1>
  <span id="siteBox"></span>
  <select class="sel" id="monthSel" aria-label="Report month"></select>
  <button class="btn ghost small noprint" id="uplBtn">Upload month</button>
  <button class="btn ghost small noprint" id="csvBtn">Export CSV</button>
</div>
<div class="wrap" id="app"></div>
<dialog id="upl"></dialog>

<script src="xlsx.full.min.js"></script>
<script src="common.js"></script>
<script>
let CTX = null, LIST = null, R = null, sortKey = "level", sortDir = 1;
const app = $("#app");
const fmt = n => Math.round(n).toLocaleString("en-US");
const pct = x => (Math.round(x * 1000) / 10).toFixed(1) + "%";
const statusOf = u => /vacant/i.test(u.status) || /^vacant$/i.test(u.brand) ? "VACANT" : /fit/i.test(u.status) ? "FIT OUT" : "Active";

/* ---------- read the monthly GLA workbook (one sheet per level + TOTALS) ---------- */
function parseGla(wb){
  const out = { month: "", units: [], levels: [], official: {} };
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    if (/^totals?$/i.test(name.trim())){
      for (const r of rows) for (const v of r){ if (typeof v === "number" && v > 40000 && v < 60000 && !out.month){ const d = XLSX.SSF.parse_date_code(v); if (d) out.month = `${d.y}-${String(d.m).padStart(2, "0")}`; } }
      const hi = rows.findIndex(r => r.some(v => /occupancy rate/i.test(String(v || ""))));
      if (hi >= 0 && rows[hi + 1]) rows[hi].forEach((h, i) => { const v = rows[hi + 1][i]; if (h && typeof v === "number") out.official[String(h).trim()] = v; });
      continue;
    }
    let map = null;
    for (const r of rows){
      const low = r.map(v => String(v ?? "").trim().toLowerCase());
      if (low.includes("areacode")){ map = { level: low.indexOf("level"), type: low.indexOf("type"), code: low.indexOf("areacode"), brand: low.indexOf("brand"),
          status: low.indexOf("operating status"), dept: low.indexOf("dept"), area: low.findIndex(x => x.startsWith("area sqm") || x === "area") }; continue; }
      if (!map) continue;
      const code = r[map.code], brand = r[map.brand];
      if (!code || !brand || /^total/i.test(String(r[0] || ""))) continue;
      const level = String(r[map.level] ?? name).trim() || name.trim();
      const u = { level, type: String(r[map.type] ?? "").trim(), code: String(code).trim(), brand: String(brand).trim(),
        status: map.status >= 0 ? String(r[map.status] ?? "").trim() : (/vacant/i.test(brand) ? "VACANT" : "Active"),
        dept: map.dept >= 0 ? String(r[map.dept] ?? "").trim() : "", area: Number(r[map.area]) || 0, sheet: name.trim() };
      out.units.push(u);
      if (!out.levels.includes(level)) out.levels.push(level);
    }
  }
  return out;
}
/* ---------- figures ---------- */
function summarise(units, official){
  const sum = f => units.filter(f).reduce((a, u) => a + u.area, 0);
  const ds = sum(u => /^ds$/i.test(u.type)), iplay = sum(u => /iplay/i.test(u.type));
  const popup = sum(u => /pop/i.test(u.type));
  const leasing = sum(u => /leasing/i.test(u.type));
  const vacant = sum(u => statusOf(u) === "VACANT" && !/pop/i.test(u.type));
  const fit = sum(u => statusOf(u) === "FIT OUT");
  const total = units.reduce((a, u) => a + u.area, 0);
  const occ = official && typeof official["Occupancy Rate"] === "number" ? official["Occupancy Rate"] : (leasing ? 1 - vacant / leasing : 0);
  return { ds, iplay, popup, leasing, vacant, fit, total, occ, official: official && typeof official["Occupancy Rate"] === "number",
    vacantUnits: units.filter(u => statusOf(u) === "VACANT" && !/pop/i.test(u.type)).length, brands: units.filter(u => statusOf(u) !== "VACANT" && !/^ds$/i.test(u.type)).length };
}

async function boot(site){
  CTX = await api("ops/context" + (site ? "?site=" + site : ""));
  $("#sub").textContent = CTX.siteName;
  $("#siteBox").innerHTML = siteSelect(CTX, s => boot(s));
  $("#uplBtn").classList.toggle("hidden", !CTX.can.gla);
  LIST = await api(`ops/gla/list?site=${CTX.site}`);
  $("#monthSel").innerHTML = LIST.reports.map(r => `<option value="${r.month}">${esc(D.fmt(r.month + "-15", { day: undefined, month: "long", year: "numeric" }))}</option>`).join("");
  $("#monthSel").classList.toggle("hidden", !LIST.reports.length);
  $("#csvBtn").classList.toggle("hidden", !LIST.reports.length);
  await load();
}
async function load(month){
  const d = await api(`ops/gla/get?site=${CTX.site}${month ? "&month=" + month : ""}`);
  R = d.report;
  if (!R){
    app.innerHTML = `<div class="card empty">No GLA uploaded yet for ${esc(CTX.siteName)}.${CTX.can.gla ? `<br><br><button class="btn gold" onclick="openUpload()">Upload the monthly GLA</button><br><small>Use the same Excel as “Verdun Mall GLA — August 2026”: one sheet per level plus TOTALS.</small>` : "<br>Ask the flagship Manager to upload it."}</div>`;
    return;
  }
  $("#monthSel").value = R.month;
  render();
}
function render(){
  const U = R.units, S = summarise(U, R.official);
  const levels = R.levels.length ? R.levels : [...new Set(U.map(u => u.level))];
  const byLevel = levels.map(l => { const us = U.filter(u => u.level === l); const a = f => us.filter(f).reduce((t, u) => t + u.area, 0);
    return { l, total: a(() => true), ds: a(u => /^ds$/i.test(u.type) || /iplay/i.test(u.type)), pop: a(u => /pop/i.test(u.type)),
      vac: a(u => statusOf(u) === "VACANT"), fit: a(u => statusOf(u) === "FIT OUT"), units: us.length }; }).filter(x => x.total > 0);
  byLevel.forEach(x => x.occ = x.total - x.ds - x.pop - x.vac - x.fit);
  const maxL = Math.max(...byLevel.map(x => x.total));
  const depts = {}; U.filter(u => statusOf(u) !== "VACANT" && !/^ds$/i.test(u.type) && !/warehouse/i.test(u.dept)).forEach(u => { const k = (u.dept || "Other").toUpperCase(); depts[k] = (depts[k] || 0) + u.area; });
  const topD = Object.entries(depts).sort((a, b) => b[1] - a[1]).slice(0, 10), maxD = topD.length ? topD[0][1] : 1;
  app.innerHTML = `
  <div class="kpis">
    <div class="card kpi big"><strong>${pct(S.occ)}</strong><span>occupancy${S.official ? " (as reported)" : ""}</span></div>
    <div class="card kpi"><strong>${fmt(S.total)}</strong><span>sqm total GLA incl. DS</span></div>
    <div class="card kpi"><strong>${fmt(S.leasing)}</strong><span>sqm leasing GLA</span></div>
    <div class="card kpi"><strong style="color:var(--alert)">${fmt(S.vacant)}</strong><span>sqm vacant · ${S.vacantUnits} units</span></div>
    <div class="card kpi"><strong style="color:#8A6A1C">${fmt(S.fit)}</strong><span>sqm in fit-out</span></div>
    <div class="card kpi"><strong>${S.brands}</strong><span>trading units · ${fmt(S.popup)} sqm pop-ups</span></div>
  </div>
  <div class="grid2">
    <div class="card panel"><h2>By level</h2>
      ${byLevel.map(x => `<div class="lv"><b>${esc(x.l)}</b><div class="bar" style="width:${Math.max(8, x.total / maxL * 100)}%" title="${esc(x.l)}: ${fmt(x.total)} sqm">
        ${[["occ", x.occ], ["ds", x.ds], ["pop", x.pop], ["fit", x.fit], ["vac", x.vac]].filter(([, v]) => v > 0).map(([c, v]) => `<i class="c-${c}" style="width:${v / x.total * 100}%" title="${fmt(v)} sqm"></i>`).join("")}</div>
        <span class="muted" style="text-align:right">${fmt(x.total)} sqm</span></div>`).join("")}
      <div class="legend"><span><i class="c-occ"></i>Leased</span><span><i class="c-ds"></i>DS / iPlay</span><span><i class="c-pop"></i>Pop-ups</span><span><i class="c-fit"></i>Fit-out</span><span><i class="c-vac"></i>Vacant</span></div>
    </div>
    <div class="card panel"><h2>Largest categories (sqm)</h2><div class="dp">${topD.map(([k, v]) => `<span>${esc(k)}</span><b>${fmt(v)}</b><span class="t"><i style="width:${v / maxD * 100}%"></i></span>`).join("")}</div></div>
  </div>
  <div class="card panel" style="margin-top:14px"><h2>Units <span class="pill" id="uCount"></span></h2>
    <div class="filters"><input class="inp" id="fQ" placeholder="Search brand or unit code">
      <select class="sel" id="fL"><option value="">All levels</option>${levels.map(l => `<option>${esc(l)}</option>`).join("")}</select>
      <select class="sel" id="fS"><option value="">All statuses</option><option>Active</option><option>VACANT</option><option>FIT OUT</option></select>
      <select class="sel" id="fT"><option value="">All types</option>${[...new Set(U.map(u => u.type).filter(Boolean))].map(t => `<option>${esc(t)}</option>`).join("")}</select></div>
    <div class="scroll"><table class="tbl"><thead><tr>${[["level","Level"],["code","Unit"],["brand","Brand"],["status","Status"],["dept","Category"],["type","Type"],["area","Area sqm"]].map(([k, l]) => `<th data-k="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead><tbody id="uBody"></tbody></table></div>
    <p class="muted" style="font-size:.78rem;margin-top:10px">${esc(R.fileName || "")} · uploaded ${esc(new Date(R.uploadedAt).toLocaleDateString("en-GB"))} by ${esc(R.uploadedBy || "")}</p>
  </div>`;
  const draw = () => {
    const qv = $("#fQ").value.trim().toLowerCase(), lv = $("#fL").value, sv = $("#fS").value, tv = $("#fT").value;
    const rows = U.filter(u => (!qv || (u.brand + " " + u.code).toLowerCase().includes(qv)) && (!lv || u.level === lv) && (!sv || statusOf(u) === sv) && (!tv || u.type === tv))
      .sort((a, b) => { if (sortKey === "level"){ const d = levels.indexOf(a.level) - levels.indexOf(b.level); if (d) return d * sortDir; return a.code.localeCompare(b.code, undefined, { numeric: true }); }
        const x = sortKey === "status" ? statusOf(a) : a[sortKey], y = sortKey === "status" ? statusOf(b) : b[sortKey];
        return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * sortDir; });
    $("#uCount").textContent = `${rows.length} · ${fmt(rows.reduce((a, u) => a + u.area, 0))} sqm`;
    $("#uBody").innerHTML = rows.map(u => { const st = statusOf(u);
      return `<tr><td>${esc(u.level)}</td><td>${esc(u.code)}</td><td><b>${esc(u.brand)}</b></td><td><span class="pill st-${st.split(" ")[0]}">${esc(st)}</span></td><td>${esc(u.dept)}</td><td class="muted">${esc(u.type)}</td><td class="n">${fmt(u.area)}</td></tr>`; }).join("");
  };
  ["#fQ", "#fL", "#fS", "#fT"].forEach(id => $(id).addEventListener("input", draw));
  app.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); });
  draw();
}

/* ---------- upload a month ---------- */
function openUpload(){
  const d = $("#upl");
  d.innerHTML = `<div class="dlg-h"><b>Upload the monthly GLA · ${esc(CTX.siteName)}</b><small>The same Excel layout: one sheet per level plus TOTALS</small></div>
    <div class="dlg-b"><label class="drop" id="drop"><input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>Choose or drop the Excel file</label><div id="prev" style="margin-top:12px"></div></div>
    <div class="dlg-f"><button class="btn ghost" id="uClose">Cancel</button><button class="btn gold hidden" id="uSave">Save</button></div>`;
  let parsed = null, fileName = "";
  const handle = async f => {
    fileName = f.name;
    try {
      parsed = parseGla(XLSX.read(await f.arrayBuffer(), { type: "array" }));
      if (!parsed.units.length) throw new Error("No units were found — check that each level sheet has an AreaCode column.");
      const S = summarise(parsed.units, parsed.official);
      $("#prev").innerHTML = `<label class="lbl">Report month</label><input class="inp" type="month" id="uMonth" value="${parsed.month || new Date().toISOString().slice(0, 7)}">
        <p style="margin-top:12px;line-height:1.6"><b>${parsed.units.length}</b> units on <b>${parsed.levels.length}</b> levels · <b>${fmt(S.total)}</b> sqm · occupancy <b>${pct(S.occ)}</b></p>
        <p class="muted" style="font-size:.84rem">${esc(parsed.levels.join(" · "))}</p>`;
      $("#uSave").classList.remove("hidden");
    } catch (e){ $("#prev").innerHTML = `<p style="color:var(--alert)">${esc(e.message)}</p>`; }
  };
  d.onchange = e => { if (e.target.id === "file" && e.target.files[0]) handle(e.target.files[0]); };
  const drop = d.querySelector("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("on"); };
  drop.ondragleave = () => drop.classList.remove("on");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("on"); if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); };
  d.onclick = async e => {
    if (e.target.id === "uClose" || e.target === d) return d.close();
    if (e.target.id === "uSave" && parsed){
      e.target.disabled = true;
      try {
        const month = $("#uMonth").value;
        const exists = LIST.reports.some(r => r.month === month);
        if (exists && !(await confirmBox("Replace this month?", `A GLA for ${esc(month)} is already saved for ${esc(CTX.siteName)}. It will be replaced.`, "Replace"))){ e.target.disabled = false; return; }
        await api("ops/gla/save", { site: CTX.site, month, units: parsed.units, levels: parsed.levels, official: parsed.official, fileName });
        d.close(); toast("GLA saved"); await boot(CTX.site);
      } catch (er){ toast(er.message, true); e.target.disabled = false; }
    }
  };
  d.showModal();
}
$("#uplBtn").onclick = openUpload;
$("#monthSel").onchange = e => load(e.target.value);
$("#csvBtn").onclick = () => {
  if (!R) return;
  const rows = [["Level", "Type", "Unit", "Brand", "Status", "Category", "Area SQM"], ...R.units.map(u => [u.level, u.type, u.code, u.brand, statusOf(u), u.dept, u.area])];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n")], { type: "text/csv" }));
  a.download = `GLA-${CTX.site}-${R.month}.csv`; a.click();
};
boot().catch(e => { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
</script>
</body>
</html>
