<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenant 360 · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Tenant 360 (v3, Oct 2026): one screen — overview (open vs total, ABC Connect penalties & violations posted in the period) + a tenant search;
     picking a tenant opens his KPI board (compliance, sales & score card, ABC Connect, employees), each row opens its details.
     Sales are never saved: the Sales Performance file is read in this page only. See docs/FEATURE-tenant-360.md -->
<style>
.pick{position:relative;flex:1;max-width:560px;min-width:220px}
.pick input{width:100%;height:42px;border:2px solid var(--brand-2);border-radius:12px;padding:0 14px 0 38px;font-size:.95rem;background:var(--surface);color:var(--text);outline:none}
.pick:before{content:"🔍";position:absolute;left:12px;top:10px;font-size:.92rem}
.sug{position:absolute;left:0;right:0;top:46px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(42,15,69,.18);max-height:360px;overflow:auto;display:none}
.sug button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}.sug button:hover,.sug button.on{background:var(--paper)}
.sug b{font-size:.88rem}.sug small{display:block;color:var(--muted);font-size:.72rem}
.k4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.kp b{display:block;font-size:1.7rem;line-height:1.15}.kp span{font-size:.76rem;color:var(--muted)}
.kp em{display:block;font-style:normal;font-size:.74rem;font-weight:800;margin-top:2px}
.mtr{height:8px;border-radius:4px;background:var(--paper);overflow:hidden;margin-top:8px}.mtr i{display:block;height:100%;background:var(--ok)}
.up{color:var(--ok)}.dn{color:var(--alert)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
.box h3{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .m{flex:1;min-width:0}.row b{font-size:.9rem}.row small{display:block;color:var(--muted);font-size:.74rem;line-height:1.35}
.row.go{cursor:pointer}.row.go:hover b{color:var(--brand-2)}
.chip{font-size:.68rem;font-weight:800;border-radius:99px;padding:3px 8px;white-space:nowrap}
.per{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}.per select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-weight:700;font-size:.78rem;padding:0 6px}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 18px}
.az .row{padding:7px 0}
/* tenant board — same pills as the leadership KPI board */
.ph{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#2A0F45,#4A1F73);color:#fff;border-radius:18px;padding:16px 20px;margin-top:4px}
.ph .lgo{width:54px;height:54px;border-radius:14px;background:#fff;color:#4A1F73;display:grid;place-items:center;font-weight:900;font-size:1.1rem;flex:none}
.ph h2{font-size:1.3rem}.ph p{opacity:.88;font-size:.82rem;margin-top:2px}
.ph .x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.ph .x button,.ph .x a{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:.8rem;text-decoration:none}
table.k{width:100%;border-collapse:collapse;font-size:.86rem}
table.k th{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);text-align:center}table.k th:first-child{text-align:left}
table.k td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}table.k td:first-child{text-align:left;font-weight:700;font-size:.84rem}
table.k tr.go{cursor:pointer}table.k tr.go:hover td{background:var(--paper)}
.c{display:inline-block;min-width:58px;padding:5px 10px;border-radius:9px;font-weight:800;font-size:.84rem;background:var(--paper)}
.c.g{background:#E6F4EC;color:#2E8B57}.c.a{background:#FFF1DA;color:#9A5B00}.c.r{background:#FDECEA;color:#C0392B}
:root[data-theme="dark"] .c.g{background:#16382A;color:#5FD08A}:root[data-theme="dark"] .c.a{background:#3B2C12;color:#F0B44C}:root[data-theme="dark"] .c.r{background:#3D1A1A;color:#FF7A6B}
.d{font-size:.7rem;font-weight:800;margin-left:4px}.d.up{color:#2E8B57}.d.dn{color:#C0392B}
td small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px}
.more{color:var(--brand-2);font-weight:800;font-size:.76rem;white-space:nowrap}
tr.sec td{background:var(--paper);font-size:.66rem!important;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px!important;font-weight:800}
.salesup{border:2px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:.82rem;font-weight:600}
dialog.dl{border:0;border-radius:18px;padding:0;width:min(680px,94vw);max-height:86vh;background:var(--surface);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.dl::backdrop{background:rgba(20,8,35,.45)}
.dl .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px 8px}.dl .h b{font-size:1rem}.dl .h small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.dl .b{padding:4px 18px 18px;overflow:auto;max-height:70vh}
.mo{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 10px}.mo button{border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.76rem;font-weight:800}.mo button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.spark{display:flex;align-items:flex-end;gap:5px;height:70px;margin:6px 0}.spark div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.spark i{display:block;width:100%;border-radius:5px 5px 0 0;min-height:3px}.spark small{font-size:.66rem;color:var(--muted)}
@media (max-width:760px){.k4{grid-template-columns:1fr 1fr}.ph .x{margin-left:0}table.k th:nth-child(3),table.k td:nth-child(3){display:none}}
@media print{.top,.noprint{display:none!important}body{background:#fff}.ph{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="top"><h1>🏬 Tenant 360 <small id="sub"></small></h1><span id="sitePick"></span>
  <div class="pick"><input id="q" placeholder="Search a tenant, unit or group — or pick from the list" autocomplete="off"><div class="sug" id="sug"></div></div>
  <button class="btn ghost small hidden" id="upB">⇡ Sales file</button></div>
<div class="wrap"><div id="app"><div class="empty">Loading…</div></div></div>
<dialog class="dl" id="dl"></dialog>
<input type="file" id="sfile" accept=".xlsx,.xlsm" hidden>
<script src="exec-sales.js"></script>
<script src="common.js"></script>
<script>
const UP = new URLSearchParams(location.search), MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MNL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MIN_SQM = 20;   // as in Tenant Sales & Score Card: kiosks / ATMs under 20 m² are left out of the comparisons
let CTX = null, site = (UP.get("site") || "").toUpperCase(), O = null, PER = "ytd", U = null, SD = null, SM = 0, SBU = "";
const f0 = v => Math.round(v || 0).toLocaleString("en-US"), pc = v => isFinite(v) ? (v > 0 ? "+" : "") + v.toFixed(1) + " %" : "—";
const money = v => (v < 0 ? "−$" : "$") + f0(Math.abs(v));
const nk = s => String(s || "").toLowerCase().replace(/&/g, "and").replace(/\b(s\.?a\.?r?\.?l|sarl|sal|co|ltd|llc|the)\b/g, "").replace(/[^a-z0-9]+/g, "");
const dd = d => d ? new Date(String(d).length <= 10 ? d + "T12:00:00" : d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const tone = (v, g, a) => v == null ? "" : v >= g ? "g" : v >= a ? "a" : "r";
const pill = (v, t, delta, sub) => `<span class="c ${t || ""}">${v}</span>${delta ? `<span class="d ${delta > 0 ? "up" : "dn"}">${delta > 0 ? "▲" : "▼"}${esc(String(Math.abs(delta)).replace(/^(\d+\.\d)\d+$/, "$1"))}</span>` : ""}${sub ? `<small>${sub}</small>` : ""}`;

async function boot(s){
  CTX = await api("ops/context" + (s || site ? "?site=" + (s || site) : "")); site = CTX.site;
  $("#sub").textContent = CTX.siteName; $("#sitePick").innerHTML = siteSelect(CTX, x => { location.search = "?site=" + x; });
  await loadO();
  const id = Number(UP.get("unit")) || 0; if (id) openUnit(id); else drawO();
}
async function loadO(){ O = await api(`ops/t360/overview?site=${site}&period=${PER}`); $("#upB").classList.toggle("hidden", !O.canSales); }

/* ---------- search / pick a tenant ---------- */
let SI = -1;
function sug(){
  const q = $("#q").value.trim().toLowerCase(), box = $("#sug"); if (!O) return;
  const L = O.units.filter(u => !q || (u.brand + " " + u.code + " " + u.group + " " + u.dept).toLowerCase().includes(q)).slice(0, 40);
  box.innerHTML = L.map((u, i) => `<button data-u="${u.id}" class="${i === SI ? "on" : ""}"><b>${esc(u.brand)}</b><small>${esc([u.code, u.dept, u.group, u.status].filter(Boolean).join(" · "))}</small></button>`).join("") || `<div class="row" style="padding:10px 14px"><small>No tenant found</small></div>`;
  box.style.display = "block";
}
$("#q").onfocus = () => { SI = -1; sug(); }; $("#q").oninput = () => { SI = -1; sug(); };
$("#q").onkeydown = e => { const n = $("#sug").querySelectorAll("[data-u]").length;
  if (e.key === "ArrowDown"){ SI = Math.min(n - 1, SI + 1); sug(); e.preventDefault(); } else if (e.key === "ArrowUp"){ SI = Math.max(0, SI - 1); sug(); e.preventDefault(); }
  else if (e.key === "Enter"){ const b = $("#sug").querySelectorAll("[data-u]")[Math.max(0, SI)]; if (b) b.click(); } else if (e.key === "Escape") $("#sug").style.display = "none"; };
$("#sug").onmousedown = e => { const b = e.target.closest("[data-u]"); if (b){ e.preventDefault(); $("#sug").style.display = "none"; $("#q").blur(); openUnit(Number(b.dataset.u)); } };
$("#q").onblur = () => setTimeout(() => $("#sug").style.display = "none", 150);

/* ---------- overview ---------- */
function perOptions(){
  const y = O.today.slice(0, 4), m = Number(O.today.slice(5, 7)), o = [`<option value="ytd" ${PER === "ytd" ? "selected" : ""}>Year to date ${y}</option>`];
  for (let i = m; i >= 1; i--){ const k = `${y}-${String(i).padStart(2, "0")}`; o.push(`<option value="${k}" ${PER === k ? "selected" : ""}>${MNL[i - 1]} ${y}</option>`); }
  return o.join("");
}
function drawO(){
  U = null; history.replaceState(null, "", `?site=${site}`); const K = O.kpi, cd = K.compliance != null && K.compliancePrev != null ? K.compliance - K.compliancePrev : 0;
  const perLabel = PER === "ytd" ? "this year" : MNL[Number(PER.slice(5)) - 1];
  $("#app").innerHTML = `<div class="k4">
      <div class="kp"><b>${K.open} <span style="font-size:1rem">/ ${K.total}</span></b><span>Open tenants of all units</span><div class="mtr"><i style="width:${K.total ? K.open / K.total * 100 : 0}%"></i></div></div>
      <div class="kp"><b>${K.fit}</b><span>In fit-out (not open yet)</span></div>
      <div class="kp"><b class="${K.attention ? "dn" : "up"}">${K.attention}</b><span>Need attention · ${K.bp} penalt${K.bp === 1 ? "y" : "ies"} and ${K.vr} violation${K.vr === 1 ? "" : "s"} posted ${esc(perLabel)}</span></div>
      <div class="kp"><b style="color:${K.compliance == null ? "var(--muted)" : K.compliance >= 90 ? "var(--ok)" : K.compliance >= 75 ? "var(--warn)" : "var(--alert)"}">${K.compliance ?? "—"}</b><span>Average compliance (${MNL[Number(O.month.slice(5)) - 1]})</span>${cd ? `<em class="${cd > 0 ? "up" : "dn"}">${cd > 0 ? "▲" : "▼"} ${Math.abs(cd)} vs last month</em>` : ""}</div></div>
    <div class="box"><h3><span>Needs attention · penalties & violations posted in ABC Connect</span><span class="per">Period <select id="per">${perOptions()}</select></span></h3>
      ${O.attention.map(a => `<div class="row go" data-u="${a.id}"><div class="m"><b>${esc(a.brand)}</b><small>${esc([a.code, a.dept, a.group].filter(Boolean).join(" · "))}</small>
        <small>${a.items.map(x => `${esc(x.name)} · ${esc(x.subject || "")} (${esc(dd(x.day))}, ${esc(x.status)})`).join(" — ")}</small></div>
        <span class="chip c-al" style="background:color-mix(in srgb,var(--alert) 14%,transparent);color:var(--alert)">${[a.bp ? `${a.bp} penalt${a.bp === 1 ? "y" : "ies"}` : "", a.vr ? `${a.vr} violation${a.vr === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ")}</span></div>`).join("")
        || `<div class="row"><div class="m"><small>No penalty or violation posted ${esc(perLabel)} 👍</small></div></div>`}</div>
    <div class="box"><h3><span>All tenants · A–Z</span><span>${O.units.length} · tap to open</span></h3><div class="az">
      ${O.units.map(u => `<div class="row go" data-u="${u.id}"><div class="m"><b>${esc(u.brand)}</b><small>${esc([u.code, u.dept].filter(Boolean).join(" · "))}</small></div><span class="more">›</span></div>`).join("")}</div></div>`;
  $("#per").onchange = async e => { PER = e.target.value; try { await loadO(); drawO(); } catch (er){ toast(er.message, true); } };
  $("#app").querySelectorAll("[data-u]").forEach(r => r.onclick = () => openUnit(Number(r.dataset.u)));
}

/* ---------- sales (Leasing Sales Performance YTD — in this page only, never saved) ---------- */
$("#upB").onclick = () => $("#sfile").click();
$("#sfile").onchange = async e => { const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try { toast("Reading the sales file…"); await xlsxReady();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const D = SalesLocal.parse(wb.SheetNames.map(n => ({ name: n, grid: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }) })));
    const units = D.units.filter(u => /mall$|department store$/i.test(u)), mine = (CTX.siteName || "").toLowerCase();
    SBU = units.find(u => u.toLowerCase() === mine) || units.find(u => mine && u.toLowerCase().includes(mine.split(" ")[0])) || units[0] || D.units[0];
    SD = { D, file: file.name }; SM = D.upTo || 12; $("#upB").textContent = "✓ " + file.name.slice(0, 26); toast("Sales loaded — not saved");
    if (U) drawU();
  } catch (er){ toast(er.message, true); } };
function salesFor(brand){
  if (!SD) return null; const D = SD.D, R = D.rows.filter(r => r.bu === SBU), ytd = a => a.slice(0, SM).reduce((s, v) => s + v, 0), ten = {};
  for (const r of R){ const k = r.ten.toLowerCase(); const x = ten[k] = ten[k] || { name: r.ten, cat: r.cat || "Other", grp: r.grp, cur: Array(12).fill(0), prev: Array(12).fill(0), space: 0 };
    r.cur.forEach((v, i) => x.cur[i] += v); r.prev.forEach((v, i) => x.prev[i] += v); x.space += r.space; }
  const T = Object.values(ten).map(x => ({ ...x, c: ytd(x.cur), p: ytd(x.prev) })).filter(x => x.space >= MIN_SQM && (x.c || x.p)).map(x => ({ ...x, sqm: x.c / x.space, sqmP: x.p / x.space, dp: x.p > 0 ? (x.c / x.p - 1) * 100 : NaN }));
  const b = nk(brand), t = T.find(x => nk(x.name) === b) || T.find(x => { const n = nk(x.name); return b.length >= 4 && (n.startsWith(b) || b.startsWith(n)); });
  if (!t) return { missing: true };
  const C = T.filter(x => x.cat === t.cat), cc = C.reduce((s, x) => s + x.c, 0), cp = C.reduce((s, x) => s + x.p, 0), csp = C.reduce((s, x) => s + x.space, 0);
  const rk = C.slice().sort((a, b2) => b2.sqm - a.sqm).findIndex(x => x === t) + 1;
  return { ...t, catGrowth: cp > 0 ? (cc / cp - 1) * 100 : NaN, catSqm: csp ? cc / csp : 0, rank: rk, of: C.length, year: D.year, prevYear: D.prevYear };
}

/* ---------- the tenant board ---------- */
async function openUnit(id){
  $("#app").innerHTML = `<div class="empty">Loading…</div>`; scrollTo(0, 0);
  try { U = await api(`ops/t360/unit?site=${site}&id=${id}`); } catch (e){ $("#app").innerHTML = `<div class="box">${esc(e.message)}</div>`; return; }
  history.replaceState(null, "", `?site=${site}&unit=${id}`); $("#q").value = ""; drawU();
}
function drawU(){
  const u = U.unit, tr = U.trend || [], now = tr.length ? tr[tr.length - 1].score : null, last = tr.length > 1 ? tr[tr.length - 2].score : null;
  const viol = U.feedback.filter(f => f.category !== "Customer Feedback"), fb = U.feedback.filter(f => f.category === "Customer Feedback");
  const pos = fb.filter(f => f.description === "Positive").length, monthViol = (U.complianceEntries || []).filter(e => e.category !== "Customer Feedback").length;
  const P = U.portal12 || { vr: { open: 0, total: 0 }, bp: { open: 0, total: 0 }, nr: { open: 0, total: 0 } };
  const S = U.canSales ? salesFor(u.brand) : null, emails = [...new Set(U.contacts.map(x => x.email).filter(Boolean))], cEnd = U.contract ? (U.contract.departure || U.contract.end) : "";
  const pRow = (k, label) => `<tr class="go" data-d="${k}"><td>${label}</td><td>${pill(P[k].open + " open", P[k].open ? (k === "bp" ? "r" : "a") : "g", 0, `of ${P[k].total} ${k === "nr" ? "sent" : "posted"}`)}</td><td><small>last 12 months</small></td><td class="more">›</td></tr>`;
  let sales = "";
  if (U.canSales){
    if (!SD) sales = `<tr><td colspan="4"><div class="salesup">Sales are not saved in the hub — <button class="btn small" id="up2">⇡ Upload the Leasing Sales Performance file</button> to see them for this tenant.</div></td></tr>`;
    else if (S.missing) sales = `<tr><td colspan="4"><small>${esc(u.brand)} is not in ${esc(SD.file)} (${esc(SBU)}), or is under ${MIN_SQM} m².</small></td></tr>`;
    else sales = `<tr class="go" data-d="sales"><td>Sales YTD growth</td><td>${pill(pc(S.dp), S.dp >= 0 ? "g" : "r")}</td><td><small>Category ${esc(S.cat)} <b class="${S.catGrowth >= 0 ? "up" : "dn"}">${pc(S.catGrowth)}</b></small></td><td class="more">By month ›</td></tr>
      <tr><td>YTD ${S.year} sales</td><td>${pill(money(S.c))}</td><td><small>YTD ${S.prevYear} ${money(S.p)}</small></td><td></td></tr>
      <tr><td>Change</td><td>${pill(money(S.c - S.p), S.c >= S.p ? "g" : "r")}</td><td><small>${pc(S.dp)}</small></td><td></td></tr>
      <tr><td>Space</td><td>${pill(f0(S.space) + " m²")}</td><td></td><td></td></tr>
      <tr><td>Sales / m²</td><td>${pill("$" + f0(S.sqm), S.sqm >= S.catSqm ? "g" : "a", Math.round(S.sqm - S.sqmP))}</td><td><small>Category $${f0(S.catSqm)} · LY $${f0(S.sqmP)}</small></td><td></td></tr>
      <tr><td>Rank in category</td><td>${pill(S.rank + " / " + S.of, S.rank <= Math.ceil(S.of / 3) ? "g" : S.rank <= Math.ceil(S.of * 2 / 3) ? "a" : "r")}</td><td><small>by sales / m² in ${esc(S.cat)}</small></td><td></td></tr>`;
  }
  $("#app").innerHTML = `<div class="ph"><div class="lgo">${esc(initials(u.brand || u.code))}</div><div style="min-width:0"><h2>${esc(u.brand || u.code)}</h2>
      <p>${esc([u.code, u.dept, u.area ? Math.round(u.area) + " m²" : "", U.group ? "Group " + U.group : "", U.sku ? "SKU " + U.sku : "", cEnd ? "contract ends " + dd(cEnd) : "", u.status].filter(Boolean).join(" · "))}</p></div>
      <div class="x noprint">${emails.length ? `<a href="mailto:${esc(emails.join(","))}">✉ Email</a>` : ""}<button id="prt">🖨 Print</button><button id="cls">✕ Close</button></div></div>
    <div class="box"><h3><span>Tenant KPIs</span>${U.canSales && SD && !S.missing ? `<span class="per">YTD to <select id="ytm">${MNL.slice(0, SD.D.upTo || 12).map((m, i) => `<option value="${i + 1}" ${i + 1 === SM ? "selected" : ""}>${m}</option>`).join("")}</select></span>` : `<span>tap a row for the details</span>`}</h3>
      <table class="k"><thead><tr><th>KPI</th><th>Value</th><th>Compared with</th><th></th></tr></thead><tbody>
        <tr class="sec"><td colspan="4">Compliance · hub</td></tr>
        <tr class="go" data-d="comp"><td>Compliance score (${MNL[new Date().getMonth()]})</td><td>${pill(now ?? "—", tone(now, 90, 75), now != null && last != null ? now - last : 0, last != null ? `${MNL[(new Date().getMonth() + 11) % 12]} ${last}` : "")}</td><td><small>Flagship average ${O && O.kpi.compliance != null ? O.kpi.compliance : "—"}</small></td><td class="more">Details ›</td></tr>
        <tr class="go" data-d="viol"><td>Tenant compliance violations</td><td>${pill(monthViol, monthViol ? (monthViol >= 3 ? "r" : "a") : "g", 0, "this month")}</td><td><small>12 months: ${viol.length}</small></td><td class="more">›</td></tr>
        <tr class="go" data-d="fb"><td>Tenant feedback</td><td>${pill(fb.length, fb.length - pos > pos ? "a" : fb.length ? "g" : "", 0, `${pos} positive · ${fb.length - pos} negative`)}</td><td><small>last 12 months</small></td><td class="more">›</td></tr>
        ${U.canSales ? `<tr class="sec"><td colspan="4">Sales & score card · ${SD ? esc(SD.file) + " · not saved" : "Sales Performance file"}</td></tr>${sales}` : ""}
        <tr class="sec"><td colspan="4">ABC Connect · portal</td></tr>
        ${pRow("vr", "Violations")}${pRow("bp", "Penalties")}${pRow("nr", "ABC Requests")}
        <tr class="sec"><td colspan="4">People · Tenants Directory</td></tr>
        <tr class="go" data-d="emp"><td>Employees</td><td>${pill(U.contacts.length, U.contacts.length ? "" : "a", 0, esc([...new Set(U.contacts.map(x => x.position).filter(Boolean))].slice(0, 3).join(" · ")))}</td><td></td><td class="more">See them ›</td></tr>
      </tbody></table></div>`;
  $("#cls").onclick = () => drawO(); $("#prt").onclick = () => print();
  const up = $("#up2"); if (up) up.onclick = () => $("#sfile").click();
  const ym = $("#ytm"); if (ym) ym.onchange = e => { SM = Number(e.target.value); drawU(); };
  $("#app").querySelectorAll("[data-d]").forEach(r => r.onclick = () => detail(r.dataset.d, S));
}

/* ---------- details ---------- */
function dlg(title, sub, body){
  const d = $("#dl"); d.innerHTML = `<div class="h"><div><b>${title}</b><small>${sub || ""}</small></div><button class="btn ghost small" id="dx">✕</button></div><div class="b">${body}</div>`;
  $("#dx").onclick = () => d.close(); d.onclick = e => { if (e.target === d) d.close(); }; if (!d.open) d.showModal(); return d;
}
function detail(k, S){
  const u = U.unit, B = esc(u.brand || u.code);
  if (k === "comp"){ const tr = U.trend || [];
    return dlg(`${B} · Compliance`, "Score per month (100 = nothing recorded) and this month's entries",
      `<div class="spark">${tr.map(t => `<div><small><b>${t.score ?? "—"}</b></small><i style="height:${Math.max(4, t.score || 0)}%;background:${t.score >= 90 ? "var(--ok)" : t.score >= 75 ? "#C8A24A" : t.score >= 60 ? "#E07A3A" : "var(--alert)"}"></i><small>${MN[Number(t.month.slice(5)) - 1]}</small></div>`).join("")}</div>
      ${(U.compliance && U.compliance.repeats.length) ? `<p class="dn" style="font-size:.8rem;font-weight:700;margin:6px 0">Repeats: ${esc(U.compliance.repeats.map(r => `${r.what} ×${r.n} → ${r.suggest}`).join(" · "))}</p>` : ""}
      ${(U.complianceEntries || []).map(e => `<div class="row"><div class="m"><b>${esc(e.description || e.category)}</b><small>${esc(e.category)} · ${esc(dd(e.day))}${e.action ? " · " + esc(e.action) : ""}${e.by ? " · " + esc(e.by) : ""}</small></div></div>`).join("") || `<p class="muted" style="font-size:.82rem">Nothing recorded this month.</p>`}`); }
  if (k === "viol" || k === "fb"){ const L = U.feedback.filter(f => k === "viol" ? f.category !== "Customer Feedback" : f.category === "Customer Feedback");
    return dlg(`${B} · ${k === "viol" ? "Compliance violations" : "Tenant feedback"}`, "Last 12 months · from the hub",
      L.map(f => `<div class="row"><div class="m"><b>${esc(f.description || f.category)}</b><small>${esc(dd(f.day))}${f.time ? " " + esc(f.time) : ""}${f.action ? " · " + esc(f.action) : ""}${f.by ? " · " + esc(f.by) : ""}</small>${f.actionDesc ? `<small>${esc(f.actionDesc)}</small>` : ""}</div></div>`).join("") || `<p class="muted">Nothing recorded.</p>`); }
  if (k === "vr" || k === "bp" || k === "nr"){ const X = U.portal12[k];
    return dlg(`${B} · ${{ vr: "Violations", bp: "Penalties", nr: "ABC Requests" }[k]}`, `ABC Connect · last 12 months · ${X.open} open of ${X.total}`,
      X.items.map(x => `<div class="row"><div class="m"><b>${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener" style="color:inherit">${esc(x.name)}</a>` : esc(x.name)} · ${esc(x.subject || "")}</b><small>${esc(dd(x.day))} · ${esc(x.status)}</small></div>
        <span class="chip" style="${x.open ? "background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)" : "background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)"}">${x.open ? "Open" : "Closed"}</span></div>`).join("") || `<p class="muted">Nothing in the last 12 months.</p>`); }
  if (k === "emp") return dlg(`${B} · Employees`, "From the Tenants Directory",
    U.contacts.map(x => `<div class="row"><div class="m"><b>${esc(x.name || "—")}</b><small>${esc([x.position, x.mobile, x.email].filter(Boolean).join(" · "))}</small></div>
      ${x.mobile ? `<a class="btn ghost small" href="tel:${esc(String(x.mobile).replace(/[^+\d]/g, ""))}">📞</a>` : ""}${x.email ? `<a class="btn ghost small" href="mailto:${esc(x.email)}">✉</a>` : ""}</div>`).join("") || `<p class="muted">No contact in the Tenants Directory yet.</p>`);
  if (k === "sales"){
    const draw = () => { const T = salesFor(u.brand); if (!T || T.missing) return;
      const rows = MN.slice(0, SM).map((m, i) => { const c = T.cur[i], p = T.prev[i], g = p ? (c / p - 1) * 100 : NaN;
        return `<tr><td>${MNL[i]}</td><td>${money(c)}</td><td>${money(p)}</td><td>${pill(pc(g), isFinite(g) ? (g >= 0 ? "g" : "r") : "")}<span class="d ${g >= 0 ? "up" : "dn"}">${isFinite(g) ? (g >= 0 ? "▲" : "▼") : ""}</span></td></tr>`; }).join("");
      dlg(`${B} · Sales by month`, `${T.year} vs ${T.prevYear} · ${esc(SD.file)} · not saved`,
        `<div class="mo">${MN.slice(0, SD.D.upTo || 12).map((m, i) => `<button data-m="${i + 1}" class="${i + 1 === SM ? "on" : ""}">YTD ${m}</button>`).join("")}</div>
        <table class="k"><thead><tr><th>Month</th><th>${T.year}</th><th>${T.prevYear}</th><th>Change</th></tr></thead><tbody>${rows}
        <tr><td><b>YTD</b></td><td><b>${money(T.c)}</b></td><td><b>${money(T.p)}</b></td><td>${pill(pc(T.dp), T.dp >= 0 ? "g" : "r")}</td></tr></tbody></table>
        <p class="muted" style="font-size:.76rem;margin-top:8px">Category ${esc(T.cat)}: ${pc(T.catGrowth)} YTD.</p>`);
      $("#dl").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { SM = Number(b.dataset.m); draw(); drawU(); }); };
    return draw();
  }
}
window.hubRefresh = async () => { await loadO(); if (U) openUnit(U.unit.id); else drawO(); };
boot().catch(e => $("#app").innerHTML = `<div class="box">${esc(e.message)}</div>`);
</script>
</body>
</html>
