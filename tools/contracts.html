<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracts Near Ending · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Contracts near ending (email report) — see docs/FEATURE-email-inbox.md -->
<style>
.src{padding:12px 16px;margin-bottom:12px;font-size:.84rem;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.src b{color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:12px 14px;cursor:pointer;border:1px solid var(--line)}
.kpi.on{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.kpi strong{display:block;font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:.76rem;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .inp{flex:1;min-width:180px}
.list{display:grid;gap:10px}
.k{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-left:4px solid var(--line)}
.k.red{border-left-color:var(--alert)} .k.amb{border-left-color:var(--warn)} .k.grn{border-left-color:var(--ok)} .k.past{border-left-color:#555}
.k .dl{text-align:center;border-radius:12px;padding:8px 0;background:var(--paper);font-weight:800;font-size:1.3rem;line-height:1.05;font-variant-numeric:tabular-nums}
.k .dl small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-top:3px;color:var(--muted)}
.k.red .dl{background:rgba(192,57,43,.13);color:var(--alert)} .k.amb .dl{background:rgba(192,122,18,.13);color:var(--warn)} .k.past .dl{background:#555;color:#fff} .k.past .dl small{color:#ddd}
.k h3{font-size:.98rem;font-weight:800;display:flex;gap:8px;flex-wrap:wrap;align-items:center;line-height:1.3}
.k .meta{font-size:.79rem;color:var(--muted);margin-top:4px;line-height:1.5}
.k .note{margin-top:7px;font-size:.82rem;padding:7px 10px;border-radius:10px;background:var(--paper);line-height:1.45}
.k .note small{color:var(--muted)}
.pill.term{background:rgba(192,57,43,.13);color:var(--alert)} .pill.new{background:rgba(46,139,87,.14);color:var(--ok)} .pill.ren{background:rgba(123,75,176,.14);color:var(--brand-2)}
.sec{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.gone .k{opacity:.6}
@media (max-width:700px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .k{grid-template-columns:62px 1fr;gap:10px;padding:12px} .k .acts{grid-column:1/-1;justify-self:end} }
@media print{ .top,.bar,.src button,.acts{display:none!important} .wrap{padding:0} .k{break-inside:avoid} }
</style>
</head>
<body>
<div class="top"><h1>📄 Contracts Near Ending <small id="sub"></small></h1><span id="sitePick"></span></div>
<div class="wrap"><div id="app"><div class="empty">Loading…</div></div></div>
<script src="common.js"></script>
<script>
const UP = new URLSearchParams(location.search);
let ctx = null, site = UP.get("site") || "", C = null, filt = "", q = "", type = "";
const fmt = d => d ? D.fmt(d, { year: "numeric" }) : "—";
const typeCls = t => /termin/i.test(t) ? "term" : /renew/i.test(t) ? "ren" : /new/i.test(t) ? "new" : "";
const band = c => c.left == null ? "" : c.left < 0 ? "past" : c.left <= 7 ? "red" : c.left <= 30 ? "amb" : "grn";
async function boot(){
  try { ctx = await api("ops/context" + (site ? `?site=${site}` : "")); site = ctx.site; $("#sub").textContent = ctx.siteName;
    $("#sitePick").innerHTML = siteSelect(ctx, v => { site = v; history.replaceState(null, "", `?site=${v}`); load(); }); load(); }
  catch (e){ $("#app").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function load(){ try { C = await api(`ops/contracts/list?site=${site}`); draw(); } catch (e){ $("#app").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
function draw(){
  const A = C.list.filter(c => c.active), G = C.list.filter(c => !c.active);
  const s = q.toLowerCase();
  const match = c => (!s || `${c.tenant} ${c.no} ${c.account}`.toLowerCase().includes(s)) && (!type || typeCls(c.type) === type);
  const pick = c => !filt || (filt === "7" ? c.left != null && c.left >= 0 && c.left <= 7 : filt === "30" ? c.left != null && c.left > 7 && c.left <= 30 : filt === "later" ? c.left > 30 : filt === "past" ? c.left < 0 : true);
  const L = A.filter(c => match(c) && pick(c));
  const n = f => A.filter(f).length;
  const last = C.last;
  $("#app").innerHTML = `<div class="card src">📧 ${last ? `Last report <b>${esc(new Date(last.at).toLocaleString("en-GB", { timeZone: "Asia/Beirut", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</b> · ${last.rows} contract${last.rows === 1 ? "" : "s"} (all flagships) · ${last.added} new · ${last.gone} dropped · forwarded by ${esc(last.from)}`
      : `No report received yet. Forward the daily “contracts near ending” email (with the Excel) to the hub's contracts address.`}<span style="flex:1"></span><button class="btn ghost small" onclick="print()">Print</button></div>
    <div class="kpis">
      <div class="card kpi ${filt === "7" ? "on" : ""}" data-f="7"><strong style="color:var(--alert)">${n(c => c.left != null && c.left >= 0 && c.left <= 7)}</strong><span>Within 7 days</span></div>
      <div class="card kpi ${filt === "30" ? "on" : ""}" data-f="30"><strong style="color:var(--warn)">${n(c => c.left > 7 && c.left <= 30)}</strong><span>8 – 30 days</span></div>
      <div class="card kpi ${filt === "later" ? "on" : ""}" data-f="later"><strong style="color:var(--ok)">${n(c => c.left > 30)}</strong><span>Later</span></div>
      <div class="card kpi ${filt === "past" ? "on" : ""}" data-f="past"><strong>${n(c => c.left < 0)}</strong><span>Date passed, still in the report</span></div></div>
    <div class="bar"><input class="inp" id="q" placeholder="Search tenant or contract number" value="${esc(q)}">
      <select class="sel" id="ty"><option value="">All types</option><option value="term" ${type === "term" ? "selected" : ""}>Termination</option><option value="ren" ${type === "ren" ? "selected" : ""}>Renewal</option><option value="new" ${type === "new" ? "selected" : ""}>New</option></select></div>
    <div class="list">${L.length ? L.map(card).join("") : `<div class="card empty">${A.length ? "Nothing matches." : `No contract near ending at ${esc(ctx.siteName)} in the last report.`}</div>`}</div>
    ${G.length ? `<div class="sec">No longer in the report · last 60 days</div><div class="list gone">${G.filter(match).map(card).join("")}</div>` : ""}
    <p class="muted" style="font-size:.78rem;margin-top:12px;line-height:1.5">The key date is the effective departure date when there is one, otherwise the contract end date. The flagship is alerted when a contract appears, then 30, 14, 7 and 1 day before and on the day. Key dates also show in the Operations Calendar.</p>`;
  $("#q").oninput = e => { q = e.target.value; const p = e.target.selectionStart; draw(); const x = $("#q"); x.focus(); x.setSelectionRange(p, p); };
  $("#ty").onchange = e => { type = e.target.value; draw(); };
  $("#app").querySelectorAll("[data-f]").forEach(k => k.onclick = () => { filt = filt === k.dataset.f ? "" : k.dataset.f; draw(); });
  $("#app").querySelectorAll("[data-note]").forEach(b => b.onclick = () => noteBox(C.list.find(c => c.no === b.dataset.note)));
}
function card(c){
  const b = band(c);
  return `<div class="card k ${c.active ? b : ""}">
    <div class="dl">${c.left == null ? "—" : c.left < 0 ? Math.abs(c.left) : c.left}<small>${c.left == null ? "" : c.left < 0 ? "days ago" : c.left === 0 ? "today" : c.left === 1 ? "day" : "days"}</small></div>
    <div><h3>${esc(c.tenant)} ${c.type ? `<span class="pill ${typeCls(c.type)}">${esc(c.type)}</span>` : ""}${c.unit ? `<span class="pill">${esc(c.unit.level)} · ${esc(c.unit.code)}</span>` : ""}${!c.active ? `<span class="pill">Left the report ${esc(D.fmt((c.leftAt || "").slice(0, 10)))}</span>` : ""}</h3>
      <div class="meta">Contract <b>${esc(c.no)}</b>${c.status ? " · " + esc(c.status) : ""} · ${esc(fmt(c.start))} → <b>${esc(fmt(c.end))}</b>${c.departure ? ` · departure <b>${esc(fmt(c.departure))}</b>` : ""}</div>
      ${c.note ? `<div class="note">${esc(c.note)}<br><small>${esc(c.noteBy)} · ${esc(D.fmt((c.noteAt || "").slice(0, 10)))}</small></div>` : ""}</div>
    <div class="acts">${C.can.note ? `<button class="btn ghost small" data-note="${esc(c.no)}">${c.note ? "Edit note" : "Add note"}</button>` : ""}</div></div>`;
}
function noteBox(c){
  let d = $("#dN"); if (!d){ d = document.createElement("dialog"); d.id = "dN"; document.body.append(d); }
  d.innerHTML = `<div class="dlg-h"><b>${esc(c.tenant)} · ${esc(c.no)}</b><small class="muted">Follow-up note</small></div>
    <div class="dlg-b"><textarea id="nT" rows="4" maxlength="500" placeholder="e.g. Leasing confirmed renewal · handover form sent · keys to collect">${esc(c.note)}</textarea></div>
    <div class="dlg-f"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="nOk">Save</button></div>`;
  d.querySelector("[data-x]").onclick = () => d.close();
  d.querySelector("#nOk").onclick = async () => { try { await api("ops/contracts/note", { site, no: c.no, note: $("#nT").value }); d.close(); toast("Saved"); load(); } catch (e){ toast(e.message, true); } };
  d.showModal();
}
boot();
</script>
</body>
</html>
