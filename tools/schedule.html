<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations Schedule · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.weekbar .range{font-weight:800;font-size:1rem;min-width:200px;text-align:center}
.nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav:hover{border-color:var(--brand-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.grid thead th{background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;padding:10px 6px;position:sticky;top:0}
.grid thead th.today{background:var(--brand-2)}
.grid thead th small{display:block;font-weight:500;opacity:.8;font-size:.72rem}
.grid .name{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:190px;z-index:2;border-right:1px solid var(--line)}
.grid thead .name{background:var(--ink);z-index:3}
.grid .name b{display:block;font-size:.88rem}
.grid .name small{color:var(--muted);font-size:.72rem}
.grid tr.me .name{box-shadow:inset 4px 0 0 var(--gold)}
.grid tr.grp td{background:var(--paper);text-align:left;padding:7px 12px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid tr.grp td.name{background:var(--paper)}
.grid tr.notes td{background:var(--blueSoft)}
.grid tr.notes input{width:100%;border:0;background:transparent;padding:7px 6px;font-size:.74rem;text-align:center;color:var(--text);outline:none}
.grid tr.notes .name{background:var(--blueSoft);font-size:.74rem;font-weight:700;color:var(--muted)}
.cell{width:100%;min-height:48px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;border-radius:0}
.cell small{font-size:.66rem;font-weight:600;opacity:.8}
.cell:hover{background:rgba(123,75,176,.08)}
.cell.ro{cursor:default}.cell.ro:hover{background:none}
.cell.dirty{box-shadow:inset 0 0 0 2px var(--gold)}
.s-am{background:rgba(64,156,255,.12)} .s-mid{background:rgba(46,184,114,.12)} .s-pm{background:rgba(123,75,176,.14)}
.c-OFF{background:#E5484D;color:#fff} .c-VAC,.c-SICK,.c-DEATH,.c-UL{background:#FFC000;color:#3B2A00}
.c-HOLI{background:#8E6BD8;color:#fff} .c-TRAIN{background:#2F80ED;color:#fff} .c-OTH{background:#1F9E8F;color:#fff}
.hrs{font-weight:800;font-variant-numeric:tabular-nums;padding:0 10px;min-width:64px}
.hrs.under{color:var(--warn)} .hrs.over{color:var(--alert)} .hrs.ok{color:var(--ok)}
.grid tfoot td{background:var(--paper);font-size:.74rem;color:var(--muted);padding:8px 4px;border-bottom:0}
.grid tfoot .name{background:var(--paper);font-weight:800}
.grid tfoot b{color:var(--text)}
.cov-bad{color:var(--alert)!important}
.savebar{position:sticky;bottom:12px;margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
.picker .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.picker .presets button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.picker .presets button:hover{border-color:var(--brand-2)}
.picker .codes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px}
.picker .codes button{padding:9px 10px;border-radius:10px;font-weight:700;font-size:.82rem;text-align:left}
.picker .custom{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.picker .custom .sel{flex:1}
@media print{ .tbl-wrap{border:0;overflow:visible} table.grid{min-width:0;font-size:10px} .grid thead th{background:#2A0F45!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .c-OFF,.c-VAC,.c-SICK,.c-DEATH,.c-UL,.c-HOLI,.c-TRAIN,.c-OTH,.s-am,.s-mid,.s-pm{-webkit-print-color-adjust:exact;print-color-adjust:exact} .ptitle{display:block!important} }
@media (max-width:640px){ .grid .name{min-width:118px;padding:8px} .grid .name small{display:none} .legend{font-size:.72rem;gap:4px 10px} .weekbar .range{min-width:0;font-size:.92rem} }
.ptitle{display:none;font-weight:800;font-size:16px;margin-bottom:8px}
/* Weekly schedule email + WhatsApp */
.sendbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin:0 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sendbar .st{flex:1;min-width:200px;font-size:.84rem;line-height:1.45}
.sendbar .st b{display:block;font-size:.9rem}
.sendbar .st small{color:var(--muted)}
.sendbar.sent{border-color:rgba(46,139,87,.4);background:rgba(46,139,87,.06)} .sendbar.changed{border-color:rgba(192,122,18,.5);background:rgba(192,122,18,.07)}
.btn.wa{background:#25D366;color:#073B1E} .btn.wa:hover{background:#1EBE5A}
.btn.wa svg{width:16px;height:16px}
dialog.mail{width:min(1040px,calc(100% - 20px));max-height:92dvh}
.mail .mh{padding:16px 20px 10px;border-bottom:1px solid var(--line);font-size:.84rem;line-height:1.7}
.mail .mh .sj{font-size:1.02rem;font-weight:800;line-height:1.35;margin-bottom:6px}
.mail .mh span.k{display:inline-block;width:38px;color:var(--muted);font-weight:700}
.mail .mh .cc{max-height:72px;overflow:auto;color:var(--muted);margin-bottom:4px;padding-right:6px}
.mail iframe{width:100%;height:56dvh;border:0;background:#fff}
@media print{ .sendbar{display:none!important} }
/* Arrange names */
dialog.arr{width:min(560px,calc(100% - 20px))}
.arr .sec{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.arr .row{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--surface)}
.arr .row.drag{opacity:.4} .arr .row.over{border-color:var(--brand-2);box-shadow:inset 0 2px 0 var(--brand-2)}
.arr .h{cursor:grab;color:var(--muted);font-size:1.1rem;text-align:center;user-select:none}
.arr .row b{display:block;font-size:.9rem} .arr .row small{color:var(--muted);font-size:.74rem}
.arr .mv{display:flex;gap:4px} .arr .mv button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);font-weight:800}
.arr .mv button:disabled{opacity:.3}
.arr select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.8rem;padding:0 6px;max-width:150px}
</style>
</head>
<body>
<div class="top">
  <h1>Operations Schedule <small id="sub"></small></h1>
  <span id="siteBox"></span>
  <button class="btn ghost small" id="printBtn">Print</button>
</div>
<div class="wrap">
  <div class="weekbar">
    <button class="nav" id="prev" aria-label="Previous week">‹</button>
    <div class="range" id="range"></div>
    <button class="nav" id="next" aria-label="Next week">›</button>
    <button class="btn ghost small" id="todayBtn">This week</button>
    <span style="flex:1"></span>
    <span id="editTools" class="hidden" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost small" id="arrBtn" title="Change the order of the names and their section">⇅ Arrange names</button>
      <button class="btn ghost small" id="copyBtn">Copy last week</button>
      <button class="btn ghost small danger" id="clearBtn">Clear week</button>
    </span>
  </div>
  <div class="sendbar hidden" id="sendbar"></div>
  <div class="legend" id="legend"></div>
  <div class="ptitle" id="ptitle"></div>
  <div id="board"></div>
  <div class="savebar hidden" id="savebar">
    <button class="btn ghost" id="discardBtn">Discard</button>
    <button class="btn gold" id="saveBtn">Save changes</button>
  </div>
</div>
<dialog id="pick" class="picker"></dialog>

<script src="common.js"></script>
<script>
let CTX = null, WEEK = null, DATA = null, DIRTY = new Map(), DIRTY_NOTES = new Map();
const PRESETS = ["08:00-16:00", "10:00-18:00", "11:00-19:00", "12:00-20:00", "14:00-22:00", "16:00-24:00", "07:00-15:00", "15:00-23:00", "23:00-07:00"];
const TARGET = 48;
const days = () => [...Array(7)].map((_, i) => D.add(WEEK, i));
const key = (email, day) => `${email}|${day}`;
const hm = t => { const [h, m] = t.split(":").map(Number); return h + m / 60; };
function hoursOf(v){ if (!v || !v.includes("-")) return 0; const [a, b] = v.split("-").map(hm); let h = b - a; if (h <= 0) h += 24; return h; }
const short = t => { const [h, m] = t.split(":"); return m === "00" ? h : `${h}:${m}`; };
function shiftClass(v){ const s = hm(v.split("-")[0]); return s < 10 ? "s-am" : s < 14 ? "s-mid" : "s-pm"; }
const valOf = (email, day) => DIRTY.has(key(email, day)) ? DIRTY.get(key(email, day)) : (DATA.map[key(email, day)] || "");

async function boot(site){
  CTX = await api("ops/context" + (site ? "?site=" + site : ""));
  $("#siteBox").innerHTML = siteSelect(CTX, s => { if (DIRTY.size && !confirm("Discard unsaved changes?")) return; DIRTY.clear(); boot(s); });
  $("#legend").innerHTML = [["s-am","Morning start"],["s-mid","Midday start"],["s-pm","Evening start"]].map(([c, l]) => `<span><i class="${c}"></i>${l}</span>`).join("") +
    Object.entries(CTX.codes).map(([c, o]) => `<span><i class="c-${c}"></i>${c} · ${esc(o.label)}</span>`).join("");
  WEEK = WEEK || D.monday(CTX.today);
  await load();
}
async function load(){
  const d = days();
  $("#range").textContent = `${D.fmt(d[0])} – ${D.fmt(d[6], { year: "numeric" })}`;
  $("#sub").textContent = CTX.siteName;
  $("#ptitle").textContent = `ABC ${CTX.siteName} — Mall Operations Schedule — ${D.fmt(d[0])} to ${D.fmt(d[6], { year: "numeric" })}`;
  DATA = await api(`ops/schedule?site=${CTX.site}&from=${d[0]}&to=${d[6]}`);
  DATA.map = Object.fromEntries(DATA.cells.map(c => [key(c.email, c.day), c.val]));
  DATA.noteMap = Object.fromEntries(DATA.notes.map(n => [n.day, n.note]));
  $("#editTools").classList.toggle("hidden", !DATA.can.schedule);
  if (!DATA.can.schedule && DATA.can.scheduleOwn && !$("#ownHint")) $("#board").insertAdjacentHTML("beforebegin", `<p id="ownHint" class="muted noprint" style="font-size:.82rem;margin:0 0 8px">Tap a day on <b>your own line</b> to fill your shift, then <b>Save changes</b>.</p>`);
  render();
  loadSend();
}
function render(){
  const d = days(), can = DATA.can.schedule;
  if (!DATA.staff.length){
    $("#board").innerHTML = `<div class="card empty">No operations staff at ${esc(CTX.siteName)} yet.<br>
      Add people in <b>Hub administration → People &amp; roles</b> with a position — Senior Mall Supervisor, Mall Supervisor or Mall Officer — and they appear here automatically.</div>`;
    return;
  }
  let groups = [], lastPos = null;
  DATA.staff.forEach(s => { if (s.position !== lastPos){ groups.push({ label: s.positionLabel, people: [] }); lastPos = s.position; } groups[groups.length - 1].people.push(s); });
  const head = `<thead><tr><th class="name">Location &amp; name</th>${d.map(x => `<th class="${x === CTX.today ? "today" : ""}">${D.dow(x)}<small>${D.fmt(x)}</small></th>`).join("")}<th>T.hrs</th></tr></thead>`;
  const notes = `<tr class="notes"><td class="name">Notes</td>${d.map(x => {
      const v = DIRTY_NOTES.has(x) ? DIRTY_NOTES.get(x) : (DATA.noteMap[x] || "");
      return `<td>${can ? `<input data-note="${x}" value="${esc(v)}" placeholder="—" maxlength="120">` : `<small style="display:block;padding:7px 4px;font-size:.74rem">${esc(v)}</small>`}</td>`; }).join("")}<td></td></tr>`;
  const body = groups.map(g => `<tr class="grp"><td class="name">${esc(g.label)}</td><td colspan="8"></td></tr>` + g.people.map(p => {
      let total = 0;
      const cells = d.map(x => {
        const v = valOf(p.email, x); total += hoursOf(v);
        const can = mayEdit(p.email);   // the Manager / Senior Mall Supervisor edit every row, each team member their own
        const dirty = DIRTY.has(key(p.email, x)) ? "dirty" : "";
        let inner = "", cls = "";
        if (v.includes("-")){ const [a, b] = v.split("-"); inner = `${short(a)}–${short(b)}<small>${hoursOf(v)}h</small>`; cls = shiftClass(v); }
        else if (v){ inner = `${esc(v)}<small>${esc((CTX.codes[v] || {}).label || "")}</small>`; cls = "c-" + v; }
        else inner = can ? `<small class="muted">+</small>` : "";
        return `<td class="${cls}"><button class="cell ${can ? "" : "ro"} ${dirty}" data-e="${esc(p.email)}" data-d="${x}" ${can ? "" : "tabindex=-1"}>${inner}</button></td>`;
      }).join("");
      const tcls = total === TARGET ? "ok" : total > TARGET ? "over" : total ? "under" : "";
      return `<tr class="${p.email === CTX.me.email ? "me" : ""}"><td class="name"><b>${esc(p.name)}</b><small>${esc(p.title || p.positionLabel)}</small></td>${cells}<td class="hrs ${tcls}">${total || "—"}</td></tr>`;
    }).join("")).join("");
  /* coverage: how many on shift in the morning and the evening of each day */
  const foot = `<tfoot><tr><td class="name">On duty</td>${d.map(x => {
      let am = 0, pm = 0;
      DATA.staff.forEach(p => { const v = valOf(p.email, x); if (!v.includes("-")) return; const [a, b] = v.split("-").map(hm); if (a < 12) am++; if (b >= 20 || b <= a) pm++; });
      return `<td><b class="${am ? "" : "cov-bad"}">${am}</b> AM · <b class="${pm ? "" : "cov-bad"}">${pm}</b> PM</td>`; }).join("")}<td></td></tr></tfoot>`;
  $("#board").innerHTML = `<div class="tbl-wrap"><table class="grid">${head}<tbody>${notes}${body}</tbody>${foot}</table></div>`;
  $("#savebar").classList.toggle("hidden", !(DIRTY.size || DIRTY_NOTES.size));
  $("#saveBtn").textContent = `Save changes (${DIRTY.size + DIRTY_NOTES.size})`;
}

/* ----- cell picker ----- */
let target = null;
const times = [...Array(37)].map((_, i) => { const m = 360 + i * 30; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${m % 60 ? "30" : "00"}`; }); // 06:00 → 24:00
function openPicker(email, day){
  target = { email, day };
  const p = DATA.staff.find(s => s.email === email);
  const cur = valOf(email, day);
  const [cs, ce] = cur.includes("-") ? cur.split("-") : ["08:00", "16:00"];
  const d = $("#pick");
  d.innerHTML = `<div class="dlg-h"><b>${esc(p.name)}</b><small>${D.long(day)}</small></div>
    <div class="dlg-b">
      <span class="lbl">Shift</span>
      <div class="presets">${PRESETS.map(v => `<button data-v="${v}" class="${shiftClass(v)}">${v.split("-").map(short).join("–")}</button>`).join("")}</div>
      <span class="lbl">Custom hours</span>
      <div class="custom"><select class="sel" id="cS">${times.slice(0, -1).map(t => `<option ${t === cs ? "selected" : ""}>${t}</option>`).join("")}</select>
        <span class="muted">to</span><select class="sel" id="cE">${times.slice(1).concat(["00:30","01:00","02:00","07:00"]).map(t => `<option ${t === ce ? "selected" : ""}>${t}</option>`).join("")}</select>
        <button class="btn small" id="cOk">Set</button></div>
      <span class="lbl" style="margin-top:12px">Status</span>
      <div class="codes">${Object.entries(CTX.codes).map(([c, o]) => `<button data-v="${c}" class="c-${c}">${c} · ${esc(o.label)}</button>`).join("")}</div>
      <label style="display:flex;align-items:center;gap:8px;font-size:.86rem"><input type="checkbox" id="wholeWeek"> Apply to the rest of this week (until Sunday)</label>
    </div>
    <div class="dlg-f"><button class="btn ghost danger" data-v="">Clear</button><button class="btn ghost" id="pClose">Cancel</button></div>`;
  d.onclick = e => {
    if (e.target === d || e.target.id === "pClose") return d.close();
    if (e.target.id === "cOk") return setVal(`${$("#cS").value}-${$("#cE").value}`);
    const b = e.target.closest("[data-v]"); if (b) setVal(b.dataset.v);
  };
  d.showModal();
}
function setVal(v){
  const { email, day } = target;
  const list = $("#wholeWeek") && $("#wholeWeek").checked ? days().filter(x => x >= day) : [day];
  list.forEach(x => { const k = key(email, x); (DATA.map[k] || "") === v ? DIRTY.delete(k) : DIRTY.set(k, v); });
  $("#pick").close(); render();
}

/* ----- actions ----- */
const mayEdit = email => !!(DATA && (DATA.can.schedule || (DATA.can.scheduleOwn && email === CTX.me.email)));
$("#board").addEventListener("click", e => { const c = e.target.closest(".cell"); if (c && mayEdit(c.dataset.e)) openPicker(c.dataset.e, c.dataset.d); });
$("#board").addEventListener("input", e => { const n = e.target.dataset.note; if (n === undefined) return;
  (DATA.noteMap[n] || "") === e.target.value ? DIRTY_NOTES.delete(n) : DIRTY_NOTES.set(n, e.target.value);
  $("#savebar").classList.toggle("hidden", !(DIRTY.size || DIRTY_NOTES.size)); $("#saveBtn").textContent = `Save changes (${DIRTY.size + DIRTY_NOTES.size})`; });
const move = n => async () => { if ((DIRTY.size || DIRTY_NOTES.size) && !confirm("You have unsaved changes. Leave this week without saving?")) return; DIRTY.clear(); DIRTY_NOTES.clear(); WEEK = D.add(WEEK, n); await load(); };
$("#prev").onclick = move(-7); $("#next").onclick = move(7);
$("#todayBtn").onclick = async () => { WEEK = D.monday(CTX.today); DIRTY.clear(); DIRTY_NOTES.clear(); await load(); };
$("#printBtn").onclick = () => print();
$("#discardBtn").onclick = () => { DIRTY.clear(); DIRTY_NOTES.clear(); render(); };
$("#arrBtn").onclick = openArrange;
$("#copyBtn").onclick = async () => {
  const d = days(), from = D.add(d[0], -7), to = D.add(d[6], -7);
  const prev = await api(`ops/schedule?site=${CTX.site}&from=${from}&to=${to}`);
  if (!prev.cells.length) return toast("Last week is empty — nothing to copy", true);
  if (!(await confirmBox("Copy last week?", `Every shift from ${D.fmt(from)}–${D.fmt(to)} is copied onto this week. You can still adjust before saving.`, "Copy"))) return;
  prev.cells.forEach(c => { const day = D.add(c.day, 7); const k = key(c.email, day); if (DATA.staff.some(s => s.email === c.email) && (DATA.map[k] || "") !== c.val) DIRTY.set(k, c.val); });
  render(); toast("Copied — review, then Save changes");
};
$("#clearBtn").onclick = async () => {
  if (!(await confirmBox("Clear this week?", "All shifts shown this week are removed when you save.", "Clear"))) return;
  days().forEach(x => DATA.staff.forEach(p => { const k = key(p.email, x); if (DATA.map[k]) DIRTY.set(k, ""); }));
  render();
};
$("#saveBtn").onclick = async () => {
  const b = $("#saveBtn"); b.disabled = true;
  try {
    const cells = [...DIRTY].map(([k, val]) => { const [email, day] = k.split("|"); return { email, day, val }; });
    const notes = [...DIRTY_NOTES].map(([day, note]) => ({ day, note }));
    await api("ops/schedule", { site: CTX.site, cells, notes, announce: `Week of ${D.fmt(WEEK)}` });
    DIRTY.clear(); DIRTY_NOTES.clear(); toast("Schedule saved"); await load();
  } catch (e){ toast(e.message, true); }
  b.disabled = false;
};
addEventListener("beforeunload", e => { if (DIRTY.size || DIRTY_NOTES.size){ e.preventDefault(); e.returnValue = ""; } });
boot().catch(e => { $("#board").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });

/* =====================================================================
   WEEKLY SCHEDULE EMAIL (Sunday) + WHATSAPP — see docs/FEATURE-schedule-email.md
   ===================================================================== */
let SEND = null;
const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
async function loadSend(){
  const bar = $("#sendbar");
  try { SEND = await api(`ops/schedmail/status?site=${CTX.site}&week=${WEEK}`); } catch { bar.classList.add("hidden"); return; }
  const d = days(), range = `${D.fmt(d[0])} – ${D.fmt(d[6], { year: "numeric" })}`;
  const at = SEND.sent ? new Date(SEND.sent.at).toLocaleString("en-GB", { timeZone: "Asia/Beirut", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const cls = SEND.sent ? (SEND.changed ? "changed" : "sent") : "";
  bar.className = "sendbar " + cls;
  bar.innerHTML = `<div class="st">${SEND.sent ? (SEND.changed ? `<b>⚠️ Changed since it was emailed</b><small>Sent ${esc(at)} by ${esc(SEND.sent.by)} — send the update so everyone has the latest version.</small>`
      : `<b>✓ Emailed</b><small>${esc(at)} by ${esc(SEND.sent.by)}${SEND.sent.count > 1 ? ` · ${SEND.sent.count} versions` : ""}</small>`)
      : `<b>Weekly schedule email · ${esc(range)}</b><small>${SEND.filled ? "Sent on Sunday to the Mall Manager and the flagship's teams." : "Fill the week first — it is emailed on Sunday."}</small>`}</div>
    ${SEND.can.send ? `<button class="btn ${SEND.sent && !SEND.changed ? "ghost" : ""}" id="mailBtn" ${SEND.filled ? "" : "disabled"}>${SEND.sent ? (SEND.changed ? "Send update" : "Send again") : "Submit &amp; send"}</button>` : ""}
    <button class="btn ghost" id="rcpBtn" title="Who receives the weekly email">✉️ Recipients</button>
    <button class="btn wa" id="waBtn" ${SEND.filled ? "" : "disabled"} title="Share the schedule picture to a WhatsApp group">${WA_ICON} WhatsApp</button>`;
  const m = $("#mailBtn"); if (m) m.onclick = openMail;
  $("#waBtn").onclick = shareWhatsApp;
  $("#rcpBtn").onclick = openRecipients;
}
async function openMail(){
  if (DIRTY.size || DIRTY_NOTES.size) return toast("Save your changes first", true);
  let P; try { P = await api(`ops/schedmail/preview?site=${CTX.site}&week=${WEEK}`); } catch (e){ return toast(e.message, true); }
  let dl = $("#mailDlg"); if (!dl){ dl = document.createElement("dialog"); dl.id = "mailDlg"; dl.className = "mail"; document.body.append(dl); }
  const L = list => list.map(x => esc(x.name ? `${x.name} <${x.email}>` : x.email)).join("; ");
  dl.innerHTML = `<div class="mh"><div class="sj">${esc(P.subject)}</div>
      <div><span class="k">To</span>${P.to.length ? L(P.to) : `<b style="color:var(--alert)">No Mall Manager set in People &amp; roles</b>`}</div>
      <div class="cc"><span class="k">Cc</span>${L(P.cc) || "—"}</div>
      <div><span class="k">From</span>ABC Operations Hub · replies come to you</div></div>
    <iframe id="mailFrame" title="Email preview"></iframe>
    <div class="dlg-f"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="mailGo" ${P.to.length ? "" : "disabled"}>${P.sent ? "Send update" : "Send email"}</button></div>`;
  dl.querySelector("#mailFrame").srcdoc = `<!doctype html><meta charset="utf-8"><body style="margin:14px">${P.html}</body>`;
  dl.querySelector("[data-x]").onclick = () => dl.close();
  dl.querySelector("#mailGo").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Sending…";
    try { await api("ops/schedmail/send", { site: CTX.site, week: WEEK }); dl.close(); toast("Schedule emailed ✓"); loadSend(); }
    catch (er){ toast(er.message, true); e.target.disabled = false; e.target.textContent = "Send email"; }
  };
  dl.showModal();
}

/* recipients of this flagship's weekly email (To / Cc) — kept per flagship, changed by the operations team */
async function openRecipients(){
  let R; try { R = await api(`ops/schedmail/recipients?site=${CTX.site}&week=${WEEK}`); } catch (e){ return toast(e.message, true); }
  let dl = $("#rcpDlg"); if (!dl){ dl = document.createElement("dialog"); dl.id = "rcpDlg"; dl.style.width = "min(640px,calc(100% - 20px))"; document.body.append(dl); }
  const lines = v => esc((v || "").split("; ").filter(Boolean).join(";\n"));
  const ro = R.can.edit ? "" : "readonly";
  dl.innerHTML = `<div class="dlg-h"><b>Weekly schedule email · recipients</b><small class="muted">${esc(CTX.siteName)} — used every Sunday</small></div>
    <div class="dlg-b">
      <label class="lbl">To</label><textarea id="rcpTo" rows="3" ${ro} placeholder="Empty = the Mall Manager${R.managers ? ": " + esc(R.managers) : " (none set in People & roles)"}">${lines(R.to)}</textarea>
      <p class="muted" style="font-size:.76rem;margin:4px 0 12px">Leave empty to send to the Mall Manager from People &amp; roles${R.managers ? ` (${esc(R.managers)})` : ""}.</p>
      <label class="lbl">Cc</label><textarea id="rcpCc" rows="8" ${ro}>${lines(R.cc)}</textarea>
      <p class="muted" style="font-size:.76rem;margin-top:4px">One per line, or separated by “;”. Copy them straight from Outlook — “Name &lt;email&gt;” is fine.</p>
      <div id="rcpErr" style="color:var(--alert);font-size:.84rem;margin-top:8px"></div></div>
    <div class="dlg-f"><button class="btn ghost" data-x>${R.can.edit ? "Cancel" : "Close"}</button>${R.can.edit ? `<button class="btn" id="rcpSave">Save</button>` : ""}</div>`;
  dl.querySelector("[data-x]").onclick = () => dl.close();
  const sv = dl.querySelector("#rcpSave"); if (sv) sv.onclick = async () => {
    try { await api("ops/schedmail/recipients", { site: CTX.site, week: WEEK, to: $("#rcpTo").value, cc: $("#rcpCc").value }); dl.close(); toast("Recipients saved"); }
    catch (e){ $("#rcpErr").textContent = e.message; }
  };
  dl.showModal();
}
/* the schedule as a picture (for WhatsApp) — drawn on a canvas, same colours as the email */
function schedulePng(){
  const d = days(), W = 230, CW = 128, TW = 70, RH = 50, HH = 52, S = 2;
  let groups = [], last = null;
  DATA.staff.forEach(p => { if (p.position !== last){ groups.push({ label: p.positionLabel, people: [] }); last = p.position; } groups[groups.length - 1].people.push(p); });
  const rows = groups.reduce((n, g) => n + 1 + g.people.length, 0);
  const width = W + CW * 7 + TW, top = 92, height = top + HH + 34 + rows * RH - groups.length * 18 + 40 + 46;
  const c = document.createElement("canvas"); c.width = width * S; c.height = height * S;
  const x = c.getContext("2d"); x.scale(S, S);
  const F = (w, z) => `${w} ${z}px Calibri, "Segoe UI", Arial, sans-serif`;
  x.fillStyle = "#fff"; x.fillRect(0, 0, width, height);
  x.fillStyle = "#2A0F45"; x.fillRect(0, 0, width, 76);
  x.fillStyle = "#C8A24A"; x.fillRect(0, 76, width, 4);
  x.fillStyle = "#fff"; x.font = F("bold", 22); x.textBaseline = "middle";
  x.fillText(`${(SEND && SEND.flag) || "ABC " + CTX.siteName} · Operations Weekly Schedule`, 18, 28);
  x.font = F("", 15); x.fillStyle = "#E9DDF7"; x.fillText(`${D.long(d[0])} → ${D.long(d[6])}`, 18, 54);
  let y = top;
  const cellRect = (cx, cy, w, h, bg) => { x.fillStyle = bg; x.fillRect(cx, cy, w, h); x.strokeStyle = "#D9D2E3"; x.lineWidth = 1; x.strokeRect(cx + .5, cy + .5, w, h); };
  const text = (t, cx, cy, font, color, align = "center") => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(t, cx, cy); x.textAlign = "left"; };
  cellRect(0, y, W, HH, "#2A0F45"); text("Location & name", 12, y + HH / 2, F("bold", 14), "#fff", "left");
  d.forEach((dd, i) => { cellRect(W + i * CW, y, CW, HH, "#2A0F45"); text(D.dow(dd), W + i * CW + CW / 2, y + 18, F("bold", 14), "#fff"); text(D.fmt(dd), W + i * CW + CW / 2, y + 36, F("", 12), "#E9DDF7"); });
  cellRect(W + 7 * CW, y, TW, HH, "#2A0F45"); text("T.hrs", W + 7 * CW + TW / 2, y + HH / 2, F("bold", 14), "#fff");
  y += HH;
  cellRect(0, y, W, 34, "#D9E2F3"); text("Notes", 12, y + 17, F("bold", 13), "#6D6479", "left");
  d.forEach((dd, i) => { cellRect(W + i * CW, y, CW, 34, "#D9E2F3"); let n = DATA.noteMap[dd] || "—"; x.font = F("", 11); while (x.measureText(n).width > CW - 8 && n.length > 3) n = n.slice(0, -2) + "…"; text(n, W + i * CW + CW / 2, y + 17, F("", 11), "#221A2E"); });
  cellRect(W + 7 * CW, y, TW, 34, "#D9E2F3"); y += 34;
  const CODE = { OFF: ["#E5484D", "#fff"], VAC: ["#FFC000", "#3B2A00"], SICK: ["#FFC000", "#3B2A00"], DEATH: ["#FFC000", "#3B2A00"], UL: ["#FFC000", "#3B2A00"], HOLI: ["#8E6BD8", "#fff"], TRAIN: ["#2F80ED", "#fff"], OTH: ["#1F9E8F", "#fff"] };
  for (const g of groups){
    cellRect(0, y, width, RH - 18, "#F3F0F7"); text(g.label.toUpperCase(), 12, y + (RH - 18) / 2, F("bold", 12), "#6D6479", "left"); y += RH - 18;
    for (const p of g.people){
      cellRect(0, y, W, RH, "#fff"); text(p.name, 12, y + 19, F("bold", 15), "#221A2E", "left"); text(p.title || p.positionLabel, 12, y + 36, F("", 12), "#6D6479", "left");
      let tot = 0;
      d.forEach((dd, i) => {
        const v = DATA.map[key(p.email, dd)] || "", cx = W + i * CW;
        if (v.includes("-")){ const [a, b] = v.split("-"); tot += hoursOf(v); const s0 = hm(a);
          cellRect(cx, y, CW, RH, s0 < 10 ? "#E3EEFF" : s0 < 14 ? "#E1F5EA" : "#ECE3F6"); text(`${a}–${b}`, cx + CW / 2, y + 20, F("bold", 14), "#221A2E"); text(`${hoursOf(v)}h`, cx + CW / 2, y + 37, F("", 11), "#6D6479"); }
        else if (v){ const [bg, fg] = CODE[v] || ["#eee", "#333"]; cellRect(cx, y, CW, RH, bg); text(v, cx + CW / 2, y + 20, F("bold", 14), fg); text(((CTX.codes[v] || {}).label || "").replace(/\s*\(.*\)/, ""), cx + CW / 2, y + 37, F("", 11), fg); }
        else { cellRect(cx, y, CW, RH, "#fff"); text("—", cx + CW / 2, y + RH / 2, F("", 14), "#B9B0C6"); }
      });
      cellRect(W + 7 * CW, y, TW, RH, "#fff"); text(tot ? String(tot) : "—", W + 7 * CW + TW / 2, y + RH / 2, F("bold", 15), "#221A2E");
      y += RH;
    }
  }
  cellRect(0, y, W, 40, "#F3F0F7"); text("On duty", 12, y + 20, F("bold", 13), "#221A2E", "left");
  d.forEach((dd, i) => { let am = 0, pm = 0; DATA.staff.forEach(p => { const v = DATA.map[key(p.email, dd)] || ""; if (!v.includes("-")) return; const [a, b] = v.split("-").map(hm); if (a < 12) am++; if (b >= 20 || b <= a) pm++; });
    cellRect(W + i * CW, y, CW, 40, "#F3F0F7"); text(`${am} AM · ${pm} PM`, W + i * CW + CW / 2, y + 20, F("bold", 12), "#221A2E"); });
  cellRect(W + 7 * CW, y, TW, 40, "#F3F0F7"); y += 40;
  text(`ABC Operations Hub · shared by ${CTX.me.name} · ${new Date().toLocaleString("en-GB", { timeZone: "Asia/Beirut", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`, 12, y + 22, F("", 12), "#6D6479", "left");
  return new Promise(res => c.toBlob(res, "image/png"));
}
async function shareWhatsApp(){
  if (DIRTY.size || DIRTY_NOTES.size) return toast("Save your changes first", true);
  const d = days();
  const name = `Schedule ${CTX.siteName} ${d[0]} to ${d[6]}.png`;
  const caption = `${CTX.siteName} — Operations Weekly Schedule ${D.fmt(d[0])} – ${D.fmt(d[6], { year: "numeric" })}`;
  const blob = await schedulePng();
  const file = new File([blob], name, { type: "image/png" });
  /* phones (and Windows/Mac with WhatsApp installed): the share sheet → WhatsApp → pick the group */
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], text: caption }); return; } catch (e){ if (e.name === "AbortError") return; }
  }
  /* otherwise: picture copied → WhatsApp opens → choose the group → Ctrl+V */
  let copied = false;
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); copied = true; } catch {}
  if (!copied && window.HubDL) HubDL.save(blob, name); else if (!copied){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
  let dl = $("#waDlg"); if (!dl){ dl = document.createElement("dialog"); dl.id = "waDlg"; document.body.append(dl); }
  dl.innerHTML = `<div class="dlg-h"><b>Share on WhatsApp</b></div>
    <div class="dlg-b"><p class="muted" style="line-height:1.55">${copied ? "The schedule picture is <b>copied</b>. Open WhatsApp, choose the group and press <b>Ctrl+V</b> (or right-click → Paste), then Send."
      : "The schedule picture is <b>saved</b> in your Downloads. Open WhatsApp, choose the group and attach it."}</p></div>
    <div class="dlg-f"><button class="btn ghost" data-x>Close</button><a class="btn wa" href="whatsapp://send?text=${encodeURIComponent(caption)}" target="_top" data-x>${WA_ICON} Open WhatsApp</a>
      <a class="btn ghost" href="https://web.whatsapp.com/" target="_blank" rel="noopener" data-x>WhatsApp Web</a></div>`;
  dl.onclick = e => { if (e.target.closest("[data-x]") || e.target === dl) setTimeout(() => dl.close(), 50); };
  dl.showModal();
}

/* =====================================================================
   ARRANGE NAMES — order of the rows and the section each person shows under (schedule only;
   the position in People & roles does not change). Saved per flagship for everyone.
   ===================================================================== */
let ARR = null;
function openArrange(){
  if (DIRTY.size || DIRTY_NOTES.size) return toast("Save your changes first", true);
  ARR = DATA.staff.map(p => ({ email: p.email, name: p.name, title: p.title || p.positionLabel, group: p.position }));
  let dl = $("#arrDlg"); if (!dl){ dl = document.createElement("dialog"); dl.id = "arrDlg"; dl.className = "arr"; document.body.append(dl); }
  drawArr(); dl.showModal();
}
function drawArr(){
  const dl = $("#arrDlg"), G = DATA.groups || {};
  const order = Object.keys(G);
  ARR.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));   // keep sections together, order inside each kept
  let h = "";
  for (const g of order){
    const L = ARR.map((p, i) => [p, i]).filter(([p]) => p.group === g);
    h += `<div class="sec">${esc(G[g])}</div><div class="list" data-g="${g}">` + (L.length ? L.map(([p, i], k) => `<div class="row" draggable="true" data-i="${i}">
      <span class="h" title="Drag">⋮⋮</span><div><b>${esc(p.name)}</b><small>${esc(p.title)}</small></div>
      <select data-gi="${i}" aria-label="Section">${order.map(x => `<option value="${x}" ${x === p.group ? "selected" : ""}>${esc(G[x])}</option>`).join("")}</select>
      <span class="mv"><button data-up="${i}" ${k === 0 ? "disabled" : ""} aria-label="Up">↑</button><button data-dn="${i}" ${k === L.length - 1 ? "disabled" : ""} aria-label="Down">↓</button></span></div>`).join("")
      : `<div class="muted" style="font-size:.8rem;padding:4px 2px 8px">Nobody — drop a name here or choose this section.</div>`) + `</div>`;
  }
  dl.innerHTML = `<div class="dlg-h"><b>Arrange names</b><small class="muted">Drag, or use ↑ ↓. The section only changes where the name shows on the schedule and in the email.</small></div>
    <div class="dlg-b" style="max-height:62dvh;overflow:auto">${h}</div>
    <div class="dlg-f"><button class="btn ghost" id="arrReset" style="margin-right:auto">Default order</button><button class="btn ghost" data-x>Cancel</button><button class="btn" id="arrSave">Save</button></div>`;
  const swap = (i, j) => { const t = ARR[i]; ARR[i] = ARR[j]; ARR[j] = t; drawArr(); };
  const sibling = (i, dir) => { for (let j = i + dir; j >= 0 && j < ARR.length; j += dir) if (ARR[j].group === ARR[i].group) return j; return -1; };
  dl.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up, j = sibling(i, -1); if (j >= 0) swap(i, j); });
  dl.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => { const i = +b.dataset.dn, j = sibling(i, 1); if (j >= 0) swap(i, j); });
  dl.querySelectorAll("[data-gi]").forEach(s => s.onchange = () => { const p = ARR.splice(+s.dataset.gi, 1)[0]; p.group = s.value; ARR.push(p); drawArr(); });
  let from = -1;
  dl.querySelectorAll(".row").forEach(r => {
    r.ondragstart = () => { from = +r.dataset.i; r.classList.add("drag"); };
    r.ondragend = () => r.classList.remove("drag");
    r.ondragover = e => { e.preventDefault(); r.classList.add("over"); };
    r.ondragleave = () => r.classList.remove("over");
    r.ondrop = e => { e.preventDefault(); const to = +r.dataset.i; if (from < 0 || from === to) return; const p = ARR.splice(from, 1)[0]; p.group = ARR[to > from ? to - 1 : to].group; ARR.splice(to > from ? to - 1 : to, 0, p); drawArr(); };
  });
  dl.querySelectorAll(".list").forEach(l => { l.ondragover = e => e.preventDefault(); l.ondrop = e => { if (e.target.closest(".row") || from < 0) return; const p = ARR.splice(from, 1)[0]; p.group = l.dataset.g; ARR.push(p); drawArr(); }; });
  dl.querySelector("[data-x]").onclick = () => dl.close();
  dl.querySelector("#arrReset").onclick = async () => { await saveArr([]); };
  dl.querySelector("#arrSave").onclick = () => saveArr(ARR.map(p => ({ email: p.email, group: p.group })));
}
async function saveArr(order){
  try { const r = await api("ops/schedule/order", { site: CTX.site, order }); DATA.staff = r.staff; $("#arrDlg").close(); render(); toast("Order saved"); loadSend(); }
  catch (e){ toast(e.message, true); }
}
