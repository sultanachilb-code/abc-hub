<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Dashboard · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="dash.css">
<!-- Performance Dashboard (Nov 2026, v3 · white) — the clean white admin look (Modernize style) with ABC purple, light / dark.
     Left menu with names (no tabs): Performance (Overview · Flagship status · Restroom Inspections · Soft services) · Reports (Monthly Pack ·
     Leadership Pack · Snaglist Report · Report builder) · Data (Data updated). Pages other than Overview and Restroom open inside the frame,
     styled by dash.css so everything looks like one product. docs/FEATURE-performance-dashboard.md -->
<style>
.pd{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100dvh}
.side{background:var(--d-card);border-right:1px solid var(--d-line);padding:18px 14px;position:sticky;top:0;height:100dvh;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;margin:2px 8px 18px;color:var(--d-txt)}.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6B3FA0,#2A0F45);display:grid;place-items:center;flex:none}.logo img{height:18px}
.side h6{margin:14px 10px 6px;font-size:.66rem;letter-spacing:.1em;color:var(--d-mut);text-transform:uppercase}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--d-txt);font-weight:600;font-size:.87rem;margin-bottom:2px;cursor:pointer;text-decoration:none}
.side a:hover{background:var(--d-pl);color:var(--d-acc)}.side a.on{background:var(--d-acc);color:#fff;box-shadow:0 6px 16px rgba(107,63,160,.3)}.side a span{width:20px;text-align:center;flex:none}
.me{margin-top:auto;background:var(--d-pl);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}.me b{display:block;font-size:.84rem}.me small{color:var(--d-mut);font-size:.74rem}
.av{width:38px;height:38px;border-radius:50%;background:var(--d-acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.mn{padding:0 24px 30px;min-width:0}
.tb{display:flex;align-items:center;gap:10px;min-height:68px;position:sticky;top:0;background:var(--d-bg);z-index:5;flex-wrap:wrap;padding:8px 0}
.tb h1{font-size:1.15rem;margin:0;font-weight:800}.tb .sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--d-card);border:1px solid var(--d-line);cursor:pointer;font-size:1rem}
.al{background:var(--d-badl);color:var(--d-bad);border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin:6px 0 22px}
.tile{border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;border:0;font:inherit;transition:transform .15s}.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:1.9rem;margin-bottom:6px}.tile small{display:block;font-weight:700;font-size:.8rem}.tile b{display:block;font-size:1.35rem;margin-top:2px}.tile em{display:block;font-style:normal;font-size:.7rem;opacity:.8;margin-top:2px}
.t1{background:var(--t1b);color:var(--t1c)}.t2{background:var(--t2b);color:var(--t2c)}.t3{background:var(--t3b);color:var(--t3c)}.t4{background:var(--t4b);color:var(--t4c)}.t5{background:var(--t5b);color:var(--t5c)}.t6{background:var(--t6b);color:var(--t6c)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.dc h3{margin:0;font-size:1.02rem}.dc .sub{color:var(--d-mut);font-size:.82rem;margin:2px 0 14px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:1.5rem;font-weight:800}.mut{color:var(--d-mut)}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.76rem;border-radius:99px;padding:2px 9px}.up{background:var(--d-okl);color:var(--d-ok)}.dn{background:var(--d-badl);color:var(--d-bad)}.nt{background:var(--d-pl);color:var(--d-acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.rev{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:center}
.kv{display:flex;gap:12px;align-items:flex-start;margin:6px 0 14px}.kv .ic{width:42px;height:42px;border-radius:10px;background:var(--d-pl);display:grid;place-items:center;font-size:1.1rem;flex:none}
.obtn{display:block;width:100%;text-align:center;border:1px solid var(--d-acc);color:var(--d-acc);border-radius:10px;padding:9px;font-weight:700;margin-top:12px;background:none;cursor:pointer;font:inherit;font-weight:700}
.obtn:hover{background:var(--d-acc);color:#fff}
.hero{background:linear-gradient(135deg,#6B3FA0,#4A1F73)!important;color:#fff}.hero .sub{color:#E3D4F5!important}
.bar{height:8px;border-radius:99px;background:var(--d-line);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.list{display:flex;flex-direction:column;gap:10px;max-height:330px;overflow:auto}.li{display:flex;align-items:center;gap:12px}.li .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:.95rem}
.li b{display:block;font-size:.86rem}.li small{color:var(--d-mut);font-size:.76rem}
.pill2{border-radius:8px;padding:3px 10px;font-weight:700;font-size:.74rem;white-space:nowrap}.pg{background:var(--d-okl);color:var(--d-ok)}.pa{background:var(--d-warnl);color:var(--d-warn)}.pr{background:var(--d-badl);color:var(--d-bad)}
.tw{overflow-x:auto}.tw table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:620px}.tw th{text-align:left;color:var(--d-mut);font-weight:700;font-size:.74rem;padding:10px 8px;border-bottom:1px solid var(--d-line)}.tw td{padding:12px 8px;border-bottom:1px solid var(--d-line)}
.tw tr[data-open]{cursor:pointer}.tw tr[data-open]:hover td{background:var(--d-pl)}
.foot{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--d-mut);margin-top:22px}.foot b{color:var(--d-txt)}.foot .stale b{color:var(--d-bad)}.foot .due b{color:var(--d-warn)}
.frm{padding:0!important;overflow:hidden}.frm .fh{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--d-line);flex-wrap:wrap}
.frm .fh b{font-size:1rem}.frm .fh a{color:var(--d-acc);font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none}
.frm iframe{display:block;width:100%;height:calc(100dvh - 150px);border:0;background:var(--d-bg)}
.empty2{padding:30px;text-align:center;color:var(--d-mut)}
/* restroom */
.ring{--v:0;--c:var(--d-acc);width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--d-pl) 0);display:grid;place-items:center;flex:none}
.ring span{width:80px;height:80px;border-radius:50%;background:var(--d-card);display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.rk{display:flex;gap:14px;align-items:center;margin-top:6px}.lbl2{font-size:.72rem;color:var(--d-mut);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.hg{overflow-x:auto}.hg table{border-collapse:separate;border-spacing:4px;width:100%;min-width:720px;font-size:.74rem}
.hg th{color:var(--d-mut);font-weight:700;font-size:.68rem;text-align:center}.hg th.rm,.hg td.rm{text-align:left;white-space:nowrap;font-weight:700;color:var(--d-txt);font-size:.78rem}
.hg td.c{height:34px;border-radius:9px;text-align:center;background:var(--d-bg)}.hg .s{display:flex;gap:3px;justify-content:center;align-items:center;height:100%}.hg .s i{width:13px;height:13px;border-radius:4px;display:block}
.k-ok{background:var(--d-ok)}.k-ms{background:var(--d-bad)}.k-pr{background:var(--d-warn)}.k-up{background:var(--d-line)}.k-is{outline:2px solid var(--d-warn);outline-offset:1px}.hg td.now{box-shadow:inset 0 0 0 2px var(--d-acc)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--d-mut)}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cmp .r{display:grid;grid-template-columns:minmax(90px,150px) 1fr 48px;gap:10px;align-items:center;font-size:.82rem;margin:8px 0;cursor:pointer}
.lst .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--d-line);font-size:.84rem}.lst .it:last-child{border:0}.lst small{color:var(--d-mut)}.lst{max-height:330px;overflow:auto}
.chip2{border:1px solid var(--d-line);background:var(--d-card);border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;font-size:.82rem;color:var(--d-txt);cursor:pointer}
@media(max-width:1200px){.tiles{grid-template-columns:repeat(3,1fr)}.c3{grid-column:span 6}.c4,.c6,.c8{grid-column:span 12}.rev{grid-template-columns:1fr}}
@media(max-width:820px){.pd{grid-template-columns:1fr}.side{position:sticky;top:0;height:auto;z-index:8;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-right:0;border-bottom:1px solid var(--d-line)}
  .side h6,.logo,.me{display:none}.side a{white-space:nowrap;margin:0}.mn{padding:0 12px 20px}.tb{position:static}.tiles{grid-template-columns:repeat(2,1fr)}.c3{grid-column:span 12}.frm iframe{height:calc(100dvh - 200px)}}
</style>
</head>
<body class="dash">
<div class="pd">
  <nav class="side" id="side"></nav>
  <main class="mn">
    <div class="tb"><h1 id="ttl">Performance Dashboard</h1><span class="sp"></span><button class="al hidden" id="alertChip"></button>
      <select class="chip2" id="siteF" aria-label="Flagship"></select><span class="chip2" id="today"></span><button class="ib" id="thm" title="Light / dark">🌙</button></div>
    <div id="view"><div class="dc"><div class="empty2">Loading…</div></div></div>
  </main>
</div>
<script src="common.js"></script>
<script>
const UP = new URLSearchParams(location.search);
let S = null, PAGE = UP.get("page") || "overview", SITE = UP.get("site") || "", SNAG = null, RR = null, RRDAY = "";
const PAGES = [
  { k: "overview", n: "Overview", i: "📊", g: "Performance" },
  { k: "status", n: "Flagship status", i: "🏬", g: "Performance", url: () => "/tools/leadership?tab=ov&embed=1" },
  { k: "restroom", n: "Restroom Inspections", i: "🚻", g: "Performance" },
  { k: "soft", n: "Soft services", i: "🧽", g: "Performance", url: () => "/tools/leadership?tab=sc&embed=1" },
  { k: "pack", n: "Monthly Pack", i: "📦", g: "Reports", url: () => `/tools/pack${SITE ? "?site=" + SITE : ""}` },
  { k: "lpack", n: "Leadership Pack", i: "👔", g: "Reports", url: () => "/tools/leadership?tab=pk&embed=1" },
  { k: "snag", n: "Snaglist Report", i: "📋", g: "Reports", url: () => "/tools/snagreport" },
  { k: "reports", n: "Report builder", i: "🧱", g: "Reports", url: () => "/tools/reports" },
  { k: "accuracy", n: "Data updated", i: "🔄", g: "Data", url: () => `/tools/accuracy${SITE ? "?site=" + SITE : ""}` }
];
const allowed = p => p.k === "overview" || (S && (S.items[p.k] || (S.items2 || {})[p.k]));
const fmtN = n => n == null ? "—" : n >= 100000 ? Math.round(n / 1000) + "k" : n >= 10000 ? (n / 1000).toFixed(1) + "k" : Number(n).toLocaleString("en-US");
const pctS = v => v == null ? "—" : Math.round(v) + "%";
const ago = d => { if (!d) return "never"; const n = Math.round((Date.now() - Date.parse(d)) / 864e5); return n <= 0 ? "today" : n === 1 ? "1 day" : n + " days"; };
const LIGHT = { green: ["pg", "On track"], amber: ["pa", "Watch"], red: ["pr", "Action needed"] };
const tone = v => v == null ? "var(--d-acc)" : v >= 95 ? "var(--d-ok)" : v >= 85 ? "var(--d-warn)" : "var(--d-bad)";
const sumOf = (L, k) => { const v = L.map(f => f[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const avgOf = (L, k) => { const v = L.map(f => f[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const chg = (a, b, goodUp = true, unit = "%") => { if (a == null || b == null || !b) return ""; const d = Math.round((a - b) * 100 / b); if (!d) return `<span class="badge nt">= same as last month</span>`;
  return `<span class="badge ${(d > 0) === goodUp ? "up" : "dn"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d)}${unit} vs last month</span>`; };

/* light / dark — the same setting as the hub */
function themeNow(){ const a = document.documentElement.getAttribute("data-theme"); return a || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function themeBtn(){ $("#thm").textContent = themeNow() === "dark" ? "☀️" : "🌙"; }
$("#thm").onclick = () => { const t = themeNow() === "dark" ? "light" : "dark"; try { localStorage.setItem("hub.theme", JSON.stringify(t)); } catch {} document.documentElement.setAttribute("data-theme", t); themeBtn();
  document.querySelectorAll("iframe").forEach(f => { try { f.contentDocument.documentElement.setAttribute("data-theme", t); } catch {} }); };
themeBtn();

async function boot(){
  try { S = await api("ops/perf/summary"); } catch (e){ $("#view").innerHTML = `<div class="dc"><div class="empty2">${esc(e.message)}</div></div>`; return; }
  $("#today").textContent = D.fmt(S.today, { weekday: "short", year: "numeric" });
  const F = S.flagships;
  $("#siteF").innerHTML = (F.length > 1 ? `<option value="">All my flagships</option>` : "") + F.map(f => `<option value="${f.site}">${esc(f.name)}</option>`).join("");
  if (F.length === 1) SITE = F[0].site;
  $("#siteF").value = SITE; $("#siteF").onchange = () => { SITE = $("#siteF").value; RR = null; show(PAGE); };
  const act = F.filter(f => f.light === "red"), ch = $("#alertChip");
  if (act.length){ ch.classList.remove("hidden"); ch.textContent = act.length > 2 ? `⚠ ${act.length} flagships need action` : `⚠ ${act.map(f => f.name.replace(/^ABC\s+/i, "")).join(", ")} need${act.length === 1 ? "s" : ""} action`;
    ch.onclick = () => { SITE = act[0].site; $("#siteF").value = SITE; show("overview"); }; }
  if (S.items.snag) api("ops/snag/report").then(r => { SNAG = r; if (PAGE === "overview") overview(); }).catch(() => { SNAG = { sites: [], failed: true }; if (PAGE === "overview") overview(); });
  else SNAG = { sites: [], failed: true };
  if (S.items.restroom) loadRR(true);
  if (!allowed(PAGES.find(p => p.k === PAGE) || {})) PAGE = "overview";
  show(PAGE);
}
async function loadRR(quiet){
  const site = SITE || (S.flagships[0] || {}).site;
  try { RR = await api(`ops/perf/restroom?site=${site}${RRDAY ? "&day=" + RRDAY : ""}`); } catch (e){ RR = { error: e.message }; }
  if (PAGE === "restroom") restroom(); else if (PAGE === "overview" && quiet) overview();
}
function side(){
  const name = S && S.me ? S.me.name || "" : "", L = PAGES.filter(allowed); let g = "";
  $("#side").innerHTML = `<div class="logo"><i><img src="/icons/abc-logo-white.png" alt="ABC"></i>Property Hub</div>` +
    L.map(p => { const h = p.g !== g ? `<h6>${esc(p.g)}</h6>` : ""; g = p.g; return h + `<a data-p="${p.k}" class="${PAGE === p.k ? "on" : ""}"><span>${p.i}</span>${esc(p.n)}</a>`; }).join("") +
    `<div class="me"><div class="av">${esc(initials(name))}</div><div><b>${esc(name)}</b><small>${esc((S.me.position || S.me.role || "").toString())}</small></div></div>`;
  $("#side").querySelectorAll("[data-p]").forEach(a => a.onclick = () => show(a.dataset.p));
}
function show(k){
  PAGE = k; history.replaceState(null, "", k === "overview" ? location.pathname : `?page=${k}${SITE ? "&site=" + SITE : ""}`); side(); scrollTo(0, 0);
  const p = PAGES.find(x => x.k === k) || PAGES[0]; $("#ttl").textContent = k === "overview" ? "Performance Dashboard" : p.n;
  if (k === "overview") return overview();
  if (k === "restroom") { if (!RR || (RR.site && SITE && RR.site !== SITE)) { $("#view").innerHTML = `<div class="dc"><div class="empty2">Loading the inspections…</div></div>`; return loadRR(); } return restroom(); }
  $("#view").innerHTML = `<div class="dc frm"><div class="fh"><a data-back>‹ Overview</a><b>${p.i} ${esc(p.n)}</b><span class="sp"></span><a href="${p.url()}" target="_blank" rel="noopener">Open full screen ↗</a></div><iframe src="${p.url()}" title="${esc(p.n)}"></iframe></div>`;
  $("#view [data-back]").onclick = () => show("overview");
}

/* ---------- charts (inline SVG) ---------- */
function barsSvg(a, b){   /* footfall per day of the month: this month (purple) vs last month (light) */
  const days = Math.max(28, ...a.map(x => x[0]), ...b.map(x => x[0])), mx = Math.max(1, ...a.map(x => x[1]), ...b.map(x => x[1]));
  const W = 560, H = 220, L = 38, B = 196, w = (W - L - 6) / days, A = new Map(a), P = new Map(b);
  const y = v => B - (v / mx) * (B - 14), ticks = [0, .5, 1].map(f => Math.round(mx * f));
  let s = ticks.map(t => `<line x1="${L}" y1="${y(t)}" x2="${W}" y2="${y(t)}" stroke="var(--d-line)"/><text x="0" y="${y(t) + 4}" font-size="10" fill="var(--d-mut)">${fmtN(t)}</text>`).join("");
  for (let d = 1; d <= days; d++) { const x = L + (d - 1) * w, bw = Math.max(2, w / 2 - 2);
    if (P.has(d)) s += `<rect x="${x + 1}" y="${y(P.get(d))}" width="${bw}" height="${B - y(P.get(d))}" rx="${Math.min(4, bw / 2)}" fill="var(--d-acc2)"><title>Last month · day ${d}: ${P.get(d).toLocaleString()}</title></rect>`;
    if (A.has(d)) s += `<rect x="${x + bw + 2}" y="${y(A.get(d))}" width="${bw}" height="${B - y(A.get(d))}" rx="${Math.min(4, bw / 2)}" fill="var(--d-acc)"><title>This month · day ${d}: ${A.get(d).toLocaleString()}</title></rect>`;
    if (d % 5 === 1) s += `<text x="${x + 1}" y="${H - 6}" font-size="9" fill="var(--d-mut)">${d}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Footfall per day">${s}</svg>`;
}
function donutSvg(parts){   /* [[value, colour]] */
  const tot = parts.reduce((a, p) => a + p[0], 0) || 1, C = 2 * Math.PI * 44; let off = 0;
  return `<svg viewBox="0 0 120 120" width="118" aria-hidden="true"><circle cx="60" cy="60" r="44" fill="none" stroke="var(--d-pl)" stroke-width="16"/>${parts.map(([v, c]) => { const l = v / tot * C, s = `<circle cx="60" cy="60" r="44" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${l} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += l; return s; }).join("")}</svg>`;
}
function waveSvg(vals){   /* restroom % per day — smooth line + soft fill */
  const v = vals.map(x => x == null ? null : x), pts = v.map((x, i) => [i, x]).filter(p => p[1] != null);
  if (pts.length < 2) return `<div class="mut" style="padding:20px 0;font-size:.8rem">Not enough days yet</div>`;
  const W = 300, H = 70, lo = Math.min(...pts.map(p => p[1])) - 5, hi = Math.max(...pts.map(p => p[1])) + 5, X = i => i * W / (v.length - 1), Y = x => H - 8 - (x - lo) / Math.max(1, hi - lo) * (H - 16);
  let d = `M${X(pts[0][0])} ${Y(pts[0][1])}`; for (let i = 1; i < pts.length; i++) { const [a, b] = [pts[i - 1], pts[i]], mx = (X(a[0]) + X(b[0])) / 2; d += ` C${mx} ${Y(a[1])} ${mx} ${Y(b[1])} ${X(b[0])} ${Y(b[1])}`; }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:calc(100% + 44px);margin:10px -22px 0;height:80px"><path d="${d} L${X(pts[pts.length - 1][0])} ${H} L${X(pts[0][0])} ${H}Z" fill="var(--d-pl)"/><path d="${d}" fill="none" stroke="var(--d-acc)" stroke-width="2.5"/></svg>`;
}

/* ---------- overview ---------- */
function overview(){
  const F = S.flagships.filter(f => !SITE || f.site === SITE);
  if (!F.length){ $("#view").innerHTML = `<div class="dc"><div class="empty2">No flagship on your account.</div></div>`; return; }
  const one = SITE ? F[0].name : "All my flagships";
  const sn = SNAG && !SNAG.failed ? (SITE ? SNAG.sites.filter(s => s.site === SITE) : SNAG.sites) : null, snT = sn ? sn.reduce((a, s) => ({ open: a.open + (s.openTotal || 0), added: a.added + (s.added || 0), solved: a.solved + (s.solved || 0) }), { open: 0, added: 0, solved: 0 }) : null;
  const inc = sumOf(F, "incidentsMonth"), pir = sumOf(F, "pirsOverdue"), rr = avgOf(F, "restroomMonth"), mfo = sumOf(F, "mfOpen"), ck = avgOf(F, "checklists"), ff = sumOf(F, "ffMonth");
  const mfF = sumOf(F, "mfFixed"), mfL = sumOf(F, "mfFixedLast"), mfD = avgOf(F, "mfDays");
  /* footfall: per day of the month, summed over the flagships shown */
  const merge = k => { const m = new Map(); F.forEach(f => (f[k] || []).forEach(([d, v]) => m.set(d, (m.get(d) || 0) + v))); return [...m.entries()].sort((a, b) => a[0] - b[0]); };
  const fA = merge("ffSeries"), fB = merge("ffSeriesLast"), ffL = sumOf(F, "ffLastMonth");
  const perDay = (L, n) => n ? Math.round(L.reduce((a, x) => a + x[1], 0) / n) : null, dA = perDay(fA, fA.length), dB = perDay(fB, fB.length);
  /* restroom trend: average of the flagships, last 14 days */
  const days = (F[0].trend || []).map(t => t.day);
  const tr = days.map(d => { const v = F.map(f => (f.trend.find(t => t.day === d) || {}).restroom).filter(x => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; });
  const trNow = tr.filter(x => x != null), wk = trNow.slice(-7), pw = trNow.slice(-14, -7), avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const wDiff = avg(wk) != null && avg(pw) != null ? Math.round(avg(wk) - avg(pw)) : null;
  const comp = avgOf(F, "compliance"), rep = sumOf(F, "repeatOffenders"), vio = sumOf(F, "violations");
  const occ = avgOf(F, "occupancy"), vac = sumOf(F, "vacantUnits"), fit = sumOf(F, "fitout"), actv = sumOf(F, "active");
  const att = F.flatMap(f => f.attention.map(a => ({ ...a, name: f.name.replace(/^ABC\s+/i, "") }))).sort((a, b) => (a.tone === "alert" ? 0 : 1) - (b.tone === "alert" ? 0 : 1));
  const ac = {}; F.forEach(f => (f.accuracy ? f.accuracy.items : []).forEach(i => { const o = ac[i.name]; if (!o || (i.at || "") < (o.at || "")) ac[i.name] = i; }));
  const snO = sn ? (k => sn.reduce((a, s) => a + (s[k] || 0), 0)) : null;
  $("#view").innerHTML = `
    <div class="tiles">
      <button class="tile t1" data-hub="incidents"><div class="ic">🚨</div><small>Incidents · this month</small><b>${fmtN(inc)}</b><em>${pir ? pir + " report" + (pir === 1 ? "" : "s") + " late" : "&nbsp;"}</em></button>
      <button class="tile t2" data-go="${S.items.snag ? "snag" : ""}" data-hub="${S.items.snag ? "" : "snaglist"}"><div class="ic">📋</div><small>Open snags</small><b>${snT ? fmtN(snT.open) : SNAG ? "—" : "…"}</b><em>${snT ? "+" + snT.added + " added · " + snT.solved + " solved" : SNAG ? "Snaglist not reachable" : "&nbsp;"}</em></button>
      <button class="tile t3" data-go="${S.items.restroom ? "restroom" : ""}"><div class="ic">🚻</div><small>Restroom score</small><b>${pctS(rr)}</b><em>this month</em></button>
      <button class="tile t4" data-hub="malfunctions"><div class="ic">🛠</div><small>Malfunctions open</small><b>${fmtN(mfo)}</b><em>${mfF != null ? mfF + " fixed this month" : "&nbsp;"}</em></button>
      <button class="tile t5" data-hub="forms"><div class="ic">✅</div><small>AM / PM checklists</small><b>${pctS(ck)}</b><em>submitted this month</em></button>
      <button class="tile t6" data-hub="footfall"><div class="ic">👣</div><small>Footfall · month</small><b>${fmtN(ff)}</b><em>cars · parking entries</em></button>
    </div>
    <div class="g12">
      <div class="dc c8"><div class="hd"><div><h3>Footfall</h3><div class="sub">Parking entries per day · this month vs last month · ${esc(one)}</div></div>
        <span class="mut" style="font-size:.78rem"><span class="dot" style="background:var(--d-acc)"></span>This month <span class="dot" style="background:var(--d-acc2);margin-left:8px"></span>Last month</span></div>
        ${fA.length || fB.length ? `<div class="rev">${barsSvg(fA, fB)}<div><div class="kv"><div class="ic">👣</div><div><div class="big">${ff != null ? ff.toLocaleString("en-US") : "—"}</div><div class="mut">Entries this month</div></div></div>
          <div style="margin:12px 0"><span class="dot" style="background:var(--d-acc)"></span><span class="mut">This month</span><div style="font-weight:800;font-size:1.05rem;margin-left:15px">${dA != null ? dA.toLocaleString("en-US") + " / day" : "—"}</div></div>
          <div><span class="dot" style="background:var(--d-acc2)"></span><span class="mut">Last month</span><div style="font-weight:800;font-size:1.05rem;margin-left:15px">${dB != null ? dB.toLocaleString("en-US") + " / day" : "—"}</div></div>
          ${chg(dA, dB)}<button class="obtn" data-hub="footfall">View full report</button></div></div>`
        : `<div class="empty2">No footfall figures for ${esc(one)} yet this month.${S.items2 && S.items2.footfall ? ` <a href="#" data-hub="footfall" style="color:var(--d-acc);font-weight:700">Open Footfall</a>` : ""}</div>`}</div>
      <div class="c4" style="display:grid;gap:22px;align-content:start">
        <div class="dc" style="cursor:pointer" data-go="${S.items.snag ? "snag" : ""}"><div class="hd"><div><h3>Snaglist</h3><div class="big" style="margin-top:6px">${snT ? fmtN(snT.open) : SNAG ? "—" : "…"} <span style="font-size:.85rem" class="mut">open</span></div>
          ${snT ? `<span class="badge ${snT.solved >= snT.added ? "up" : "dn"}">${snT.solved >= snT.added ? "▼" : "▲"} ${Math.abs(snT.added - snT.solved)} ${snT.solved >= snT.added ? "fewer" : "more"} this month</span>` : ""}</div>
          ${snT ? donutSvg([[snT.open, "var(--d-acc)"], [snT.added, "var(--d-blue)"], [snT.solved, "var(--d-ok)"]]) : ""}</div>
          <div class="mut" style="font-size:.76rem"><span class="dot" style="background:var(--d-acc)"></span>Open <span class="dot" style="background:var(--d-blue);margin-left:8px"></span>Added <span class="dot" style="background:var(--d-ok);margin-left:8px"></span>Solved · this month</div></div>
        <div class="dc" style="padding-bottom:0;overflow:hidden;cursor:pointer" data-go="${S.items.restroom ? "restroom" : ""}"><div class="hd"><div><h3>Restroom inspections</h3><div class="big" style="margin-top:6px">${pctS(rr)}</div>
          ${wDiff != null ? `<span class="badge ${wDiff >= 0 ? "up" : "dn"}">${wDiff >= 0 ? "▲" : "▼"} ${Math.abs(wDiff)}% vs last week</span>` : `<span class="badge nt">this month</span>`}</div><span class="ib" style="background:var(--d-acc);color:#fff;border:0">🚻</span></div>${waveSvg(tr)}</div>
      </div>
      <div class="dc c3" style="cursor:pointer" data-hub="incidents"><div class="sub" style="margin:0">Incidents · this month</div><div class="big">${fmtN(inc)}</div>
        ${pir ? `<span class="badge dn">${pir} post-incident report${pir === 1 ? "" : "s"} late</span>` : `<span class="badge up">No report late</span>`}
        <div class="mut" style="font-size:.78rem;margin-top:10px">${(() => { const t = F.flatMap(f => f.trend).filter(x => x.incidents != null); const w = t.slice(-7 * F.length).reduce((a, x) => a + x.incidents, 0); return t.length ? w + " in the last 7 days" : "Daily counts from the Incident system"; })()}</div></div>
      <div class="dc c3" style="cursor:pointer" data-hub="malfunctions"><div class="sub" style="margin:0">Malfunctions fixed · this month</div><div class="big">${fmtN(mfF)}</div>${chg(mfF, mfL)}
        <div class="mut" style="font-size:.78rem;margin-top:10px">${mfD != null ? `Average ${mfD} days to fix` : `${fmtN(mfo)} still open`}</div></div>
      ${comp != null || rep ? `<div class="dc c6 hero"><h3>Tenant compliance</h3><div class="sub">This month · ${esc(one)}</div>
        <div style="display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap"><div><div class="big" style="font-size:2rem">${pctS(comp)}</div><div style="color:#E3D4F5;font-size:.8rem">Average compliance score</div></div>
          <div style="flex:1;min-width:180px"><div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px"><span>Repeat offenders</span><b>${rep || 0}</b></div><div class="bar" style="background:rgba(255,255,255,.2)"><i style="width:${Math.min(100, (rep || 0) * 8)}%;background:#E9CF8A"></i></div>
          <div style="display:flex;justify-content:space-between;font-size:.8rem;margin:8px 0 4px"><span>Violations recorded</span><b>${vio || 0}</b></div><div class="bar" style="background:rgba(255,255,255,.2)"><i style="width:${Math.min(100, (vio || 0) * 3)}%;background:#fff"></i></div></div></div></div>`
      : `<div class="dc c6 hero"><h3>Occupancy</h3><div class="sub">Leasing GLA · ${esc(one)}</div><div style="display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap"><div><div class="big" style="font-size:2rem">${occ != null ? (Math.round(occ * 1000) / 10) + "%" : "—"}</div><div style="color:#E3D4F5;font-size:.8rem">occupied</div></div>
          <div style="flex:1;min-width:180px"><div class="bar" style="background:rgba(255,255,255,.2)"><i style="width:${occ != null ? Math.round(occ * 100) : 0}%;background:#E9CF8A"></i></div><div style="font-size:.8rem;margin-top:8px">${vac || 0} vacant units · ${fit || 0} in fit-out · ${actv || 0} active tenants</div></div></div></div>`}
      <div class="dc c4"><h3>Needs attention</h3><div class="sub">${att.length} item${att.length === 1 ? "" : "s"} · ${esc(one)}</div><div class="list">${att.slice(0, 20).map(a => `<div class="li"><div class="ic" style="background:${a.tone === "alert" ? "var(--d-badl)" : "var(--d-warnl)"}">${a.tone === "alert" ? "⛔" : "⚠️"}</div><div><b>${esc(a.name)}</b><small>${esc(a.text)}</small></div></div>`).join("") || `<div class="li"><div class="ic" style="background:var(--d-okl)">✓</div><div><b>All clear</b><small>Nothing needs attention</small></div></div>`}</div></div>
      <div class="dc c8"><div class="hd"><div><h3>Flagship status</h3><div class="sub">This month · tap a flagship to open it</div></div>${S.items.status ? `<button class="chip2" data-go="status">Open Flagship status ›</button>` : ""}</div>
        <div class="tw"><table><thead><tr><th>Flagship</th><th>Occupancy</th><th>Checklists</th><th>Restrooms</th><th>Incidents</th><th>Snags open</th><th>Status</th></tr></thead><tbody>
        ${S.flagships.map(f => { const L = LIGHT[f.light] || LIGHT.green, sx = SNAG ? SNAG.sites.find(s => s.site === f.site) : null;
          return `<tr data-open="${f.site}"${SITE && f.site !== SITE ? ` style="opacity:.55"` : ""}><td><b>${esc(f.name)}</b></td><td>${f.occupancy != null ? Math.round(f.occupancy * 1000) / 10 + "%" : "—"}</td><td>${pctS(f.checklists)}</td><td>${pctS(f.restroomMonth)}</td><td>${f.incidentsMonth ?? "—"}</td><td>${sx ? sx.openTotal : SNAG ? "—" : "…"}</td><td><span class="pill2 ${L[0]}">${L[1]}</span></td></tr>`; }).join("")}</tbody></table></div></div>
    </div>
    ${Object.keys(ac).length ? `<div class="foot"><span>🔄 Data last updated${SITE ? "" : " (oldest flagship)"}:</span>${Object.values(ac).map(i => `<span class="${i.state}">${esc(i.name)} <b>${esc(ago(i.at))}</b></span>`).join("")}</div>` : ""}`;
  $("#view").querySelectorAll("[data-go]").forEach(b => { if (b.dataset.go) b.onclick = e => { e.preventDefault(); show(b.dataset.go); }; });
  $("#view").querySelectorAll("[data-hub]").forEach(b => { if (b.dataset.hub && !b.dataset.go) b.onclick = e => { e.preventDefault(); e.stopPropagation(); hubOpen(b.dataset.hub, SITE ? "?site=" + SITE : ""); }; });
  $("#view").querySelectorAll("[data-open]").forEach(r => r.onclick = () => { SITE = r.dataset.open; $("#siteF").value = SITE; RR = null; overview(); scrollTo(0, 0); });
}

/* ---------- restroom inspections ---------- */
function restroom(){
  if (!RR || RR.error){ $("#view").innerHTML = `<div class="dc"><div class="empty2">${esc(RR ? RR.error : "Loading…")}</div></div>`; return; }
  const R0 = RR, t = R0.totals, G = R0.grid, live = R0.day === R0.today;
  const due = t ? t.done + t.missed : 0, pct = due ? Math.round(t.done * 100 / due) : null;
  const nowW = G ? G.windows.findIndex(w => w.state === "open") : -1;
  const cell = (r, w, wi) => { const c = (G.grid || {})[`${r.id}|${w.id}`] || {};
    const sq = role => { const x = c[role]; return x ? `<i class="k-ok${x.issues ? " k-is" : ""}" title="${role === "ops" ? "OPS" : "Soft services"} · ${esc(x.time || "")} · ${esc(x.by || "")}${x.issues ? " · issue reported" : ""}"></i>`
      : `<i class="${w.state === "closed" ? "k-ms" : w.state === "open" ? "k-pr" : "k-up"}" title="${role === "ops" ? "OPS" : "Soft services"} · ${w.state === "closed" ? "missed" : w.state === "open" ? "in progress" : "upcoming"}"></i>`; };
    return `<td class="c ${wi === nowW ? "now" : ""}"><div class="s">${sq("ops")}${sq("usm")}</div></td>`; };
  const trend = R0.trend || [];
  const diff = R0.monthPct != null && R0.lastPct != null ? Math.round((R0.monthPct - R0.lastPct) * 10) / 10 : null;
  const mx = 100, bars = `<svg viewBox="0 0 600 150" width="100%" aria-label="Done per day">${trend.map((x, i) => { const w = 600 / trend.length, h = x.pct == null ? 3 : Math.max(3, x.pct / mx * 128);
      return `<rect x="${i * w + 2}" y="${136 - h}" width="${Math.max(3, w - 5)}" height="${h}" rx="4" fill="${x.pct == null ? "var(--d-line)" : i === trend.length - 1 ? "var(--d-acc)" : x.pct < 88 ? "var(--d-bad)" : "var(--d-acc2)"}"><title>${esc(D.fmt(x.day))}: ${x.pct == null ? "no data" : x.pct + "%"}</title></rect>${i % 3 ? "" : `<text x="${i * w + 2}" y="149" font-size="9" fill="var(--d-mut)">${D.parse(x.day).getUTCDate()}</text>`}`; }).join("")}</svg>`;
  $("#view").innerHTML = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 16px"><span class="mut">${esc(R0.siteName)} · ${esc(D.fmt(R0.day, { weekday: "long", year: "numeric" }))}${live ? " · updates live" : ""}</span><span class="sp" style="flex:1"></span>
      <input type="date" class="chip2" id="rrDay" value="${R0.day}" max="${R0.today}">${live ? "" : `<button class="chip2" id="rrToday">Today</button>`}<button class="chip2" id="rrSys">Open the inspection system ↗</button></div>
    <div class="g12">
      <div class="dc c3"><div class="lbl2">Done ${live ? "so far today" : "that day"}</div><div class="rk"><div class="ring" style="--v:${pct || 0};--c:${tone(pct)}"><span>${pct == null ? "—" : pct + "%"}</span></div>
        <div class="mut" style="font-size:.8rem">${t ? `<b style="color:var(--d-txt);font-size:1.05rem">${t.done}</b> of ${due} due${live ? " by now" : ""}<br>${t.expectedDay} for the whole day` : esc(R0.gridError || "No data")}</div></div></div>
      <div class="dc c3"><div class="lbl2">Missed</div><div class="big" style="color:var(--d-bad);font-size:2rem">${t ? t.missed : "—"}</div><div class="mut" style="font-size:.8rem">OPS ${R0.missedOps} · Soft services ${R0.missedSS}</div>
        <div class="bar" style="margin:10px 0 6px"><i style="width:${due ? Math.round((t.missed / due) * 100) : 0}%;background:var(--d-bad)"></i></div><div class="mut" style="font-size:.78rem">${R0.mostMissed[0] ? `worst this week: ${esc(R0.mostMissed[0].room)} (${R0.mostMissed[0].n})` : "no restroom missed this week ✓"}</div></div>
      <div class="dc c3"><div class="lbl2">Issues reported</div><div class="big" style="color:var(--d-warn);font-size:2rem">${R0.issues.length}</div><div class="mut" style="font-size:.8rem">${R0.kinds.length ? R0.kinds.map(([k, n]) => `${n} ${esc(k)}`).join(" · ") : "nothing reported ✓"}</div></div>
      <div class="dc c3"><div class="lbl2">This month</div><div class="big" style="font-size:2rem">${R0.monthPct == null ? "—" : R0.monthPct + "%"}</div>${diff != null ? `<span class="badge ${diff >= 0 ? "up" : "dn"}">${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff)}% vs last month</span>` : ""}
        <div class="mut" style="font-size:.78rem;margin-top:6px">${R0.delay != null ? `checks done on average ${R0.delay} min after the window opens` : "done of the checks expected"}</div></div>
      <div class="dc c8"><div class="hd" style="flex-wrap:wrap;margin-bottom:10px"><h3>${live ? "Today" : esc(D.fmt(R0.day))} · by time window</h3>
        <div class="leg"><span><i class="k-ok"></i>Done</span><span><i class="k-pr"></i>In progress</span><span><i class="k-ms"></i>Missed</span><span><i class="k-up"></i>Upcoming</span><span><i style="outline:2px solid var(--d-warn)"></i>Issue</span><span>each cell: OPS | Soft services</span></div></div>
        ${G ? `<div class="hg"><table><tr><th class="rm">Restroom</th>${G.windows.map((w, i) => `<th>${esc(w.label)}${w.display ? `<br><span style="font-weight:600">${esc(w.display)}</span>` : ""}${i === nowW ? `<br><span style="color:var(--d-acc)">now</span>` : ""}</th>`).join("")}</tr>
          ${G.rooms.map(r => `<tr><td class="rm">${esc(r.name)}</td>${G.windows.map((w, wi) => cell(r, w, wi)).join("")}</tr>`).join("")}</table></div>` : `<div class="empty2">${esc(R0.gridError || "The inspection system did not answer — try again.")}</div>`}</div>
      <div class="c4" style="display:grid;gap:22px;align-content:start">
        ${R0.flagships.length > 1 ? `<div class="dc cmp"><h3 style="margin-bottom:6px">All flagships · ${live ? "today" : esc(D.fmt(R0.day))}</h3>${R0.flagships.map(f => `<div class="r" data-rs="${f.site}"><span${f.site === R0.site ? ` style="font-weight:800;color:var(--d-acc)"` : ""}>${esc(f.name)}</span><span class="bar"><i style="width:${f.pct || 0}%;background:${tone(f.pct)}"></i></span><b>${f.pct == null ? "—" : f.pct + "%"}</b></div>`).join("")}</div>` : ""}
        <div class="dc lst"><h3 style="margin-bottom:6px">Most missed · last 7 days</h3>${R0.mostMissed.map(m => `<div class="it"><span>${esc(m.room)}</span><b style="color:${m.n >= 5 ? "var(--d-bad)" : "var(--d-txt)"}">${m.n}</b></div>`).join("") || `<div class="it"><span>No restroom missed ✓</span></div>`}</div>
      </div>
      <div class="dc c8"><h3>Done · last 30 days</h3><div class="sub">Share of the expected checks done each day</div>${bars}</div>
      <div class="dc c4 lst"><h3 style="margin-bottom:6px">Issues ${live ? "today" : "that day"} · ${R0.issues.length}</h3>${R0.issues.map(i => `<div class="it"><span><b>${esc(i.room)}</b>${i.what.length ? " · " + esc(i.what.join(", ")) : ""}${i.note ? `<br><small>${esc(i.note)}</small>` : ""}</span><small style="white-space:nowrap;text-align:right">${esc(i.time)}<br>${esc(i.by)} · ${esc(i.role)}</small></div>`).join("") || `<div class="it"><span>Nothing reported ✓</span></div>`}</div>
    </div>`;
  $("#rrDay").onchange = e => { RRDAY = e.target.value === R0.today ? "" : e.target.value; RR = null; show("restroom"); };
  const tb = $("#rrToday"); if (tb) tb.onclick = () => { RRDAY = ""; RR = null; show("restroom"); };
  $("#rrSys").onclick = () => hubOpen("restroom");
  $("#view").querySelectorAll("[data-rs]").forEach(r => r.onclick = () => { SITE = r.dataset.rs; $("#siteF").value = SITE; RR = null; show("restroom"); });
}
window.hubRefresh = () => { RR = null; boot(); };
setInterval(() => { if (PAGE === "restroom" && RR && !RRDAY && !document.hidden) loadRR(); }, 120000);   // live: refresh every 2 minutes
boot();
</script>
</body>
</html>
