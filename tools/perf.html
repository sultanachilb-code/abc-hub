<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Dashboard · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Performance Dashboard (Nov 2026) — one icon for Performance (flagship status, soft services, leadership pack), Monthly Operations Pack,
     Executive Report, Snaglist Report and Data updated. Light frost glass, a named menu on the left (no tabs), each page opens beside the menu.
     docs/FEATURE-performance-dashboard.md -->
<style>
:root{--acc:#6B3FA0;--edge:#C9B2E6;--t:#22163A;--t2:#6B6478;--glass:rgba(255,255,255,.55)}
html,body{min-height:100%}
body.pf{margin:0;color:var(--t);background:radial-gradient(900px 600px at 15% 10%,#FFFFFF 0,transparent 60%),radial-gradient(900px 600px at 85% 30%,#DCD3EA 0,transparent 55%),linear-gradient(135deg,#F3F1F7,#E4E0EC 55%,#D3CCE0);background-attachment:fixed}
.g{background:var(--glass);border:1.5px solid var(--edge);border-radius:22px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 8px 28px rgba(74,31,115,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.app{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px}
.rail{padding:12px 6px;display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:16px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;color:var(--t2);font-size:.68rem;font-weight:700;text-align:center;line-height:1.15;cursor:pointer;text-decoration:none}
.rail a i{font-style:normal;font-size:1.15rem;width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.rail a:hover{background:rgba(107,63,160,.08)}.rail a.on{color:var(--acc)}.rail a.on i{background:var(--acc);color:#fff}
.rail hr{border:0;border-top:1.5px solid var(--edge);margin:4px 8px}
.topb{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.68rem;flex:none}
.chip{background:rgba(255,255,255,.7);border:1.5px solid var(--edge);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--t)}
.chip.al{color:#B3261E;cursor:pointer}
select.chip{font:inherit;font-size:.8rem;font-weight:600}
.sp{flex:1}
.main{padding:20px}
.main h1{margin:0;font-size:1.5rem;font-weight:700}.sub{color:var(--t2);font-size:.86rem;margin:2px 0 16px}
.row{display:grid;grid-template-columns:1fr 1.35fr 1.1fr;gap:14px}
.card{background:rgba(255,255,255,.6);border:1.5px solid var(--edge);border-radius:18px;padding:16px;min-width:0}
.lbl{font-size:.7rem;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.big{font-size:2.1rem;font-weight:800;margin:4px 0}.mini{font-size:.78rem;color:var(--t2)}
.pbar{height:7px;border-radius:9px;background:#EDE6F6;overflow:hidden;margin:10px 0 6px}.pbar i{display:block;height:100%;background:var(--acc)}
.bars{display:flex;gap:6px;align-items:flex-end;height:118px;margin-top:8px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:.58rem;color:var(--t2);min-width:0}
.bars b{display:block;width:100%;max-width:22px;border-radius:7px;background:#6E6680;min-height:3px}.bars b.on{background:var(--acc)}.bars b.nd{background:#E4DCEF}
.att{margin-top:6px;max-height:150px;overflow:auto}.att .it{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #E6DCF3;font-size:.82rem}
.att .it:last-child{border:0}.att .d{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.flags{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px;margin-top:14px}
.fc{background:rgba(255,255,255,.6);border:1.5px solid var(--edge);border-radius:18px;padding:12px;text-align:center}
.fc .tg{display:flex;justify-content:space-between;font-size:.68rem;color:var(--t2)}
.ring{--v:0;width:86px;height:86px;margin:8px auto;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--v)*1%),#EDE6F6 0);display:grid;place-items:center}
.ring span{width:68px;height:68px;border-radius:50%;background:#F4F0FA;display:grid;place-items:center;font-weight:800;font-size:1rem}
.fc b{display:block;font-size:.84rem}.fc small{color:var(--t2);font-size:.72rem;display:block}
.fc button{margin-top:8px;width:100%;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:6px;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px;margin-top:14px}
.tile{background:rgba(255,255,255,.55);border:1.5px solid var(--edge);border-radius:18px;padding:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;font:inherit;color:inherit}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(74,31,115,.12)}
.tile .e{font-size:1.4rem}.tile b{display:block;margin-top:6px;font-size:.95rem}.tile small{color:var(--t2);font-size:.76rem;display:block;margin-top:2px}
.foot{margin-top:14px;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--t2);padding:10px 14px}
.foot b{color:var(--t)}.foot .stale b{color:#B3261E}.foot .due b{color:#B7791F}
.frame{padding:0;overflow:hidden}
.frame .fh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1.5px solid var(--edge);flex-wrap:wrap}
.frame .fh b{font-size:1rem}.frame .fh a{color:var(--acc);font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none}
.frame iframe{display:block;width:100%;height:calc(100dvh - 170px);border:0;background:#fff}
.empty2{padding:30px;text-align:center;color:var(--t2)}
@media (max-width:980px){ .row{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr;padding:10px}
  .rail{flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:5;border-radius:18px}
  .rail a{min-width:76px}.rail hr{display:none}
  .main{padding:14px}.frame iframe{height:calc(100dvh - 210px)}
}
</style>
</head>
<body class="pf">
<div class="app">
  <nav class="g rail" id="rail"></nav>
  <div style="min-width:0">
    <div class="g topb"><span class="av">ABC</span><b id="hi">Welcome</b><span class="sp"></span><span class="chip al hidden" id="alertChip"></span><select class="chip" id="siteF" aria-label="Flagship"></select></div>
    <div id="view"><div class="g main"><div class="empty2">Loading…</div></div></div>
  </div>
</div>
<script src="common.js"></script>
<script>
const UP = new URLSearchParams(location.search);
let S = null, PAGE = UP.get("page") || "overview", SITE = "", SNAG = null;
/* the menu: every page this user may open — each opens beside the menu */
const PAGES = [
  { k: "overview", n: "Overview", i: "◉" },
  { k: "status", n: "Flagship status", i: "🏢", url: () => "/tools/leadership?tab=ov&embed=1" },
  { k: "soft", n: "Soft services", i: "🧹", url: () => "/tools/leadership?tab=sc&embed=1" },
  { k: "pack", n: "Monthly Pack", i: "📄", url: () => `/tools/pack${SITE ? "?site=" + SITE : ""}` },
  { k: "lpack", n: "Leadership Pack", i: "🗂", url: () => "/tools/leadership?tab=pk&embed=1" },
  { k: "exec", n: "Executive Report", i: "📈", url: () => `/tools/exec${SITE ? "?site=" + SITE : ""}` },
  { k: "snag", n: "Snaglist Report", i: "🧾", url: () => "/tools/snagreport" },
  { k: "accuracy", n: "Data updated", i: "🕒", url: () => `/tools/accuracy${SITE ? "?site=" + SITE : ""}`, sep: true }
];
const allowed = p => p.k === "overview" || (S && S.items[p.k]);
const occ = v => v == null ? "—" : Math.round(v * 1000) / 10 + "%";
const ago = d => { if (!d) return "never"; const n = Math.round((Date.now() - Date.parse(d)) / 864e5); return n <= 0 ? "today" : n === 1 ? "1 day" : n + " days"; };
const LIGHT = { green: ["#2FB36B", "On track"], amber: ["#E0A030", "Attention"], red: ["#E14B4B", "Action"] };

async function boot(){
  try { S = await api("ops/perf/summary"); } catch (e){ $("#view").innerHTML = `<div class="g main"><div class="empty2">${esc(e.message)}</div></div>`; return; }
  $("#hi").textContent = `Welcome, ${(S.me.name || "").split(" ")[0] || ""}`;
  const F = S.flagships;
  $("#siteF").innerHTML = (F.length > 1 ? `<option value="">All my flagships</option>` : "") + F.map(f => `<option value="${f.site}">${esc(f.name)}</option>`).join("");
  $("#siteF").value = SITE; $("#siteF").onchange = () => { SITE = $("#siteF").value; show(PAGE); };
  const act = F.filter(f => f.light === "red");
  const ch = $("#alertChip"); if (act.length){ ch.classList.remove("hidden"); ch.textContent = act.length > 2 ? `✦ ${act.length} flagships need action` : `✦ ${act.map(f => f.name).join(", ")} need${act.length === 1 ? "s" : ""} action`; ch.onclick = () => { SITE = act[0].site; $("#siteF").value = SITE; show("overview"); }; }
  if (S.items.snag) api(`ops/snag/report`).then(r => { SNAG = r; if (PAGE === "overview") overview(); }).catch(() => {});
  if (!allowed(PAGES.find(p => p.k === PAGE) || {})) PAGE = "overview";
  show(PAGE);
}
function rail(){
  $("#rail").innerHTML = PAGES.filter(allowed).map(p => `${p.sep ? "<hr>" : ""}<a data-p="${p.k}" class="${PAGE === p.k ? "on" : ""}"><i>${p.i}</i>${esc(p.n)}</a>`).join("");
  $("#rail").querySelectorAll("[data-p]").forEach(a => a.onclick = () => show(a.dataset.p));
}
function show(k){
  PAGE = k; history.replaceState(null, "", k === "overview" ? location.pathname : `?page=${k}`); rail();
  if (k === "overview") return overview();
  const p = PAGES.find(x => x.k === k);
  $("#view").innerHTML = `<div class="g frame"><div class="fh"><a data-back>‹ Overview</a><b>${p.i} ${esc(p.n)}</b><span class="sp"></span><a href="${p.url()}" target="_blank" rel="noopener">Open full screen ↗</a></div><iframe src="${p.url()}" title="${esc(p.n)}"></iframe></div>`;
  $("#view [data-back]").onclick = () => show("overview");
}
function overview(){
  const F = S.flagships.filter(f => !SITE || f.site === SITE);
  if (!F.length){ $("#view").innerHTML = `<div class="g main"><div class="empty2">No flagship on your account.</div></div>`; return; }
  const oc = F.map(f => f.occupancy).filter(v => v != null), avgOcc = oc.length ? oc.reduce((a, b) => a + b, 0) / oc.length : null;
  /* restroom checks done, last 14 days, average of the flagships shown */
  const days = (F[0].trend || []).map(t => t.day);
  const tr = days.map(d => { const v = F.map(f => (f.trend.find(t => t.day === d) || {}).restroom).filter(x => x != null); return { d, v: v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null }; });
  const att = F.flatMap(f => f.attention.map(a => ({ ...a, name: f.name }))).sort((a, b) => (a.tone === "alert" ? 0 : 1) - (b.tone === "alert" ? 0 : 1));
  const n = c => F.filter(f => f.light === c).length;
  const sn = SNAG ? (SITE ? SNAG.sites.filter(s => s.site === SITE) : SNAG.sites) : null, snT = sn ? sn.reduce((a, s) => ({ open: a.open + (s.openTotal || 0), added: a.added + (s.added || 0), solved: a.solved + (s.solved || 0) }), { open: 0, added: 0, solved: 0 }) : null;
  const ac = {}; F.forEach(f => (f.accuracy ? f.accuracy.items : []).forEach(i => { const o = ac[i.name]; if (!o || (i.at || "") < (o.at || "")) ac[i.name] = i; }));
  const accItem = k => Object.values(ac).find(i => (i.name || "").toLowerCase().includes(k));
  const ex = accItem("executive");
  const T = {
    status: `${n("green")} on track · ${n("amber")} attention · ${n("red")} action`,
    soft: "Cleaning, Security and Parking scores",
    pack: "One page per flagship · this month vs last",
    lpack: "A4 management pack · Download PDF",
    exec: ex ? `updated ${ago(ex.at)}${ex.at ? " ago" : ""}`.replace("today ago", "today") : "Occupancy, leasing, CAPEX, QC",
    snag: snT ? `${snT.open} open · +${snT.added} added · ${snT.solved} solved this month` : "Findings open, added and solved",
    accuracy: "When the key data was last updated"
  };
  $("#view").innerHTML = `<div class="g main"><h1>Performance Dashboard</h1><div class="sub">${SITE ? esc(F[0].name) : "Every flagship at a glance"} — tap a ring or an icon to open its page</div>
    <div class="row">
      <div class="card"><div class="lbl">${SITE ? "Occupancy" : "Average occupancy"}</div><div class="big">${occ(avgOcc)}</div>
        <div class="pbar"><i style="width:${avgOcc != null ? Math.round(avgOcc * 100) : 0}%"></i></div>
        <div class="mini">${F.reduce((a, f) => a + (f.vacantUnits || 0), 0)} vacant units · ${F.reduce((a, f) => a + (f.fitout || 0), 0)} in fit-out · ${F.reduce((a, f) => a + (f.active || 0), 0)} active tenants</div></div>
      <div class="card"><div class="lbl">Restroom checks done · last 14 days</div><div class="bars">${tr.map((t, i) => `<div><b class="${t.v == null ? "nd" : i === tr.length - 1 ? "on" : ""}" style="height:${t.v == null ? 4 : Math.max(4, t.v)}%" title="${esc(D.fmt(t.d))}: ${t.v == null ? "no data" : t.v + "%"}"></b>${i % 2 ? "" : D.parse(t.d).getUTCDate()}</div>`).join("")}</div></div>
      <div class="card"><div class="lbl">Needs attention · ${att.length}</div><div class="att">${att.slice(0, 12).map(a => `<div class="it"><span class="d" style="background:${a.tone === "alert" ? "#E14B4B" : "#E0A030"}"></span><span><b>${esc(a.name)}</b> · ${esc(a.text)}</span></div>`).join("") || `<div class="it"><span class="d" style="background:#2FB36B"></span>All clear ✓</div>`}</div></div>
    </div>
    <div class="flags">${F.map(f => { const L = LIGHT[f.light] || LIGHT.green, v = f.occupancy != null ? Math.round(f.occupancy * 100) : 0;
      return `<div class="fc"><div class="tg"><span style="color:${L[0]}">●</span><span>${L[1]}</span></div><div class="ring" style="--v:${v}"><span>${occ(f.occupancy)}</span></div><b>${esc(f.name)}</b><small>occupancy${f.compliance != null ? ` · compliance ${f.compliance}%` : ""}</small>
        <button data-open="${f.site}">Open ›</button></div>`; }).join("")}</div>
    <div class="tiles">${PAGES.filter(p => p.k !== "overview" && allowed(p)).map(p => `<button class="tile" data-p2="${p.k}"><span class="e">${p.i}</span><b>${esc(p.n)}</b><small>${esc(T[p.k] || "")}</small></button>`).join("")}</div>
    ${Object.keys(ac).length ? `<div class="g foot"><span>🕒 Data last updated${SITE ? "" : " (oldest flagship)"}:</span>${Object.values(ac).map(i => `<span class="${i.state}">${esc(i.name)} <b>${esc(ago(i.at))}</b></span>`).join("")}</div>` : ""}
  </div>`;
  $("#view").querySelectorAll("[data-p2]").forEach(b => b.onclick = () => show(b.dataset.p2));
  $("#view").querySelectorAll("[data-open]").forEach(b => b.onclick = () => { SITE = b.dataset.open; $("#siteF").value = SITE; show(S.items.status ? "status" : S.items.pack ? "pack" : "overview"); });
}
window.hubRefresh = () => boot();
boot();
</script>
</body>
</html>
