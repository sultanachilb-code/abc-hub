<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Dashboard · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Tenant portal follow-up: Breaches & Penalties · Violations · ABC Requests (Salesforce reports by email) — see docs/FEATURE-portal-followup.md -->
<style>
:root{--bp:#A33B3B;--vr:#C07A12;--nr:#2F6F7E;--mk:#B4428C;--cp:#3A6EA5;--us:#5B8C3A}
.src{padding:12px 16px;margin-bottom:14px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.src .it{display:flex;align-items:center;gap:6px}
.src .it i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.src .it b{color:var(--text)}
.src .sp{flex:1}
.hero{display:grid;grid-template-columns:1.3fr repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kc{padding:16px 18px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.kc:hover{border-color:var(--brand-2);transform:translateY(-1px);box-shadow:0 10px 24px rgba(42,15,69,.08)}
.kc.on{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.kc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--brand))}
.kc h4{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kc .big{font-size:2.1rem;font-weight:800;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kc .big small{font-size:.85rem;font-weight:700;color:var(--muted);margin-left:6px}
.kc .sub{font-size:.78rem;color:var(--muted);line-height:1.5}
.kc.lead{background:linear-gradient(135deg,#2A0F45,#5B2A8A);color:#fff;border-color:transparent}
.kc.lead::before{display:none}
.kc.lead h4,.kc.lead .sub,.kc.lead .big small{color:rgba(255,255,255,.75)}
.kc.lead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kc.lead .chips span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700}
.stk{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.stk i{display:block;height:100%}
.lg{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.lg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.sec{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .inp{flex:1;min-width:180px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-weight:700;font-size:.8rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{display:grid;gap:8px}
.f{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-left:4px solid var(--k)}
.f .age{text-align:center;border-radius:12px;padding:7px 0;background:var(--paper);font-weight:800;font-size:1.25rem;line-height:1.05;font-variant-numeric:tabular-nums}
.f .age small{display:block;font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.f .age.a2{background:rgba(192,122,18,.13);color:var(--warn)} .f .age.a3{background:rgba(192,57,43,.13);color:var(--alert)}
.f h3{font-size:.95rem;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;line-height:1.3}
.f .kp{font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;background:var(--k)}
.f .no{font-size:.78rem;color:var(--muted);font-weight:700}
.f .meta{font-size:.78rem;color:var(--muted);margin-top:3px}
.f .ds{font-size:.82rem;margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.f .ds.open{-webkit-line-clamp:unset}
.f .go{display:inline-flex;align-items:center;gap:6px}
.panel{padding:14px 16px;margin-bottom:14px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:.8rem;margin:6px 0;cursor:pointer}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hb .b{height:14px;border-radius:5px;background:var(--paper);overflow:hidden;display:flex}
.hb .b i{display:block;height:100%}
.hb .n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.hb:hover .t{color:var(--brand-2)}
.note{font-size:.78rem;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--paper);line-height:1.5;margin-top:8px}
.left .f{opacity:.65}
details summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);margin:8px 0}
.tag{font-size:.72rem;font-weight:800;color:var(--alert)}
@media (max-width:1100px){ .hero{grid-template-columns:repeat(2,minmax(0,1fr))} .hero .kc.lead{grid-column:1/-1} .cols{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){ .hero{grid-template-columns:1fr 1fr;gap:8px} .kc{padding:12px} .kc .big{font-size:1.6rem} .kc.lead{grid-column:1/-1}
  .f{grid-template-columns:52px 1fr;gap:10px;padding:10px} .f .acts{grid-column:1/-1;justify-self:end} }
@media print{ .top,.bar,.src button,.acts{display:none!important} .wrap{padding:0} .f,.panel{break-inside:avoid} }

/* v2: tabs · flagship table · trend · marketing · permits · users */
.tabs{display:flex;gap:2px;margin:0 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:6px;padding:10px 13px;font-weight:800;font-size:.84rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.tabs button em{font-style:normal;font-size:.68rem;background:var(--paper);border-radius:99px;padding:1px 7px;color:var(--muted)}
.tabs button,.tabs button.on{background:transparent!important;box-shadow:none!important;border-radius:0}.tabs button.on{color:var(--brand-2);border-color:var(--brand-2)}
.panel .sub{font-size:.76rem;color:var(--muted);line-height:1.5}.f .meta a{color:var(--brand-2);font-weight:700} .tabs button.on em{background:rgba(123,75,176,.14);color:var(--brand-2)}
.ft{width:100%;border-collapse:collapse;font-size:.84rem}
.ft th{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.ft th:first-child,.ft td:first-child{text-align:left}
.ft td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.ft td:first-child{font-weight:700}
.tw{overflow-x:auto}.tw .ft{min-width:540px}
.c{display:inline-block;min-width:48px;padding:3px 8px;border-radius:8px;font-weight:800;background:var(--paper)}
.c.g{background:rgba(46,139,87,.14);color:var(--ok)}.c.a{background:rgba(192,122,18,.15);color:var(--warn)}.c.r{background:rgba(192,57,43,.13);color:var(--alert)}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px}
.mo{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mo .stack{width:68%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:2px}
.mo .stack i{display:block}
.mo small{font-size:.68rem;color:var(--muted);font-weight:700}.mo b{font-size:.7rem}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kv .card{padding:12px 14px;position:relative;overflow:hidden;cursor:pointer}
.kv .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.kv .card.on{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.kv b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kv small{font-size:.74rem;color:var(--muted)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chiprow button{font-size:.74rem;font-weight:800;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chiprow button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.win{font-size:.78rem;font-weight:700;margin-top:4px}
.cm{font-size:.8rem;margin-top:5px;line-height:1.45;padding:6px 9px;border-radius:9px;background:var(--paper)}
.cm b{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:5px}
.ut{width:100%;border-collapse:collapse;font-size:.8rem}
.ut th{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ut td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ut td small{display:block;color:var(--muted);font-size:.72rem}
.lg2{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:8px}
.lg2 span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:-1px}
.warnnote{background:rgba(192,57,43,.08);color:var(--alert)}
@media (max-width:1100px){ .kv{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .kv b{font-size:1.3rem} .trend{height:120px} .ut .hide-s{display:none} }
</style>
</head>
<body>
<div class="top"><h1>🧾 Portal Dashboard <small id="sub"></small></h1><span id="sitePick"></span></div>
<div class="wrap"><div id="app"><div class="empty">Loading…</div></div></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv,.html" multiple hidden>
<script src="common.js"></script>
<script>
/* Portal Dashboard v2 (Oct 2026) — docs/FEATURE-portal-v2.md
   Overview · Violations · Breaches & Penalties · ABC Requests · Marketing · Contractor Permits · Portal Users (managers and leadership) */
const UP = new URLSearchParams(location.search);
const K = { bp: { c: "var(--bp)", short: "Breach" }, vr: { c: "var(--vr)", short: "Violation" }, nr: { c: "var(--nr)", short: "Request" }, mk: { c: "var(--mk)", short: "Marketing" }, cp: { c: "var(--cp)", short: "Permit" } };
const ST_COL = { "Sent to Tenant": "#C0392B", "In Review": "#C07A12", "Acknowledged": "#2E8B57", "Rejected": "#8C8398", "Confirmed & Resolved": "#2E8B57", "Confirmed": "#2E8B57", "Closed": "#5E7F6B",
  "Created": "#B9AFC8", "Approved": "#2E8B57", "Submitted To Review": "#C07A12", "Submitted": "#C07A12" };
const stCol = s => ST_COL[s] || "#7B4BB0";
const TABS = [["overview", "Overview"], ["vr", "Violations"], ["bp", "Breaches & Penalties"], ["nr", "ABC Requests"], ["mk", "Marketing"], ["cp", "Contractor Permits"], ["users", "Portal Users"]];
let ctx = null, site = UP.get("site") || "", P = null, U = null, tab = UP.get("tab") || "overview", kind = "", q = UP.get("q") || "", old = false, tenant = "", status = "follow", LIM = 40;
let mkF = "review", mkType = "", cpF = "live", usF = "", usLim = 150;
if (q && /^(MKT|CP)-/i.test(q)) tab = /^MKT/i.test(q) ? "mk" : "cp";
async function boot(){
  try {
    ctx = await api("ops/context" + (site && site !== "ALL" ? `?site=${site}` : ""));
    if (!site) site = ctx.site;
    const S = Object.entries(ctx.sites || {});
    $("#sitePick").innerHTML = S.length > 1 ? `<select class="sel" id="siteSel" aria-label="Flagship"><option value="ALL" ${site === "ALL" ? "selected" : ""}>All flagships</option>${S.map(([c, n]) => `<option value="${c}" ${c === site ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : `<span class="pill brand">${esc(ctx.siteName)}</span>`;
    const sel = $("#siteSel"); if (sel) sel.onchange = () => { site = sel.value; url(); load(); };
    load();
  } catch (e){ $("#app").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function url(){ history.replaceState(null, "", `?site=${site}${tab !== "overview" ? "&tab=" + tab : ""}`); }
async function load(){
  try {
    P = await api(`ops/portal/data?site=${site}`);
    if (P.can.users && !U) api("ops/portal/users").then(r => { U = r; draw(); }).catch(() => { U = { users: [], err: true }; });
    if (tab === "users" && !P.can.users) tab = "overview";
    draw();
  } catch (e){ $("#app").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
const ago = iso => { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const ageCls = a => a == null ? "" : a > 30 ? "a3" : a > 14 ? "a2" : "";
const nowL = () => new Date().toLocaleString("sv-SE", { timeZone: "Asia/Beirut" }).replace(" ", "T").slice(0, 16);
const dt = v => v ? `${D.fmt(v.slice(0, 10))}${v.length > 10 ? " " + v.slice(11, 16) : ""}` : "";
const pctTone = v => v == null ? "" : v >= 90 ? "g" : v >= 75 ? "a" : "r";
const isOpenVr = x => /^(sent to tenant|created)/i.test(x.status);
const isDoneVr = x => /^(closed|confirmed)/i.test(x.status);
const isOpenBp = x => /^(sent to tenant|created|in review)/i.test(x.status);
const isOpenNr = x => /^(sent to tenant|created)/i.test(x.status);
const mkReview = x => /^(submitted|created)/i.test(x.status);
const cpLive = (x, n) => /^approved/i.test(x.status) && x.from && x.to && x.from <= n && x.to >= n;
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function stack(L, keyOf, order){
  const c = {}; L.forEach(x => { const k = keyOf(x); c[k] = (c[k] || 0) + 1; });
  const keys = [...(order || []).filter(k => c[k]), ...Object.keys(c).filter(k => !(order || []).includes(k))];
  const n = L.length || 1;
  return `<div class="stk">${keys.map(k => `<i style="width:${c[k] / n * 100}%;background:${stCol(k)}" title="${esc(k)}: ${c[k]}"></i>`).join("")}</div>
    <div class="lg">${keys.map(k => `<span style="--c:${stCol(k)}">${esc(k)} <b>${c[k]}</b></span>`).join("")}</div>`;
}
function bars(rows, color){   // [[label, n, title?]]
  const m = Math.max(1, ...rows.map(r => r[1]));
  return rows.map(([t, n, tip, key]) => `<div class="hb" ${key ? `data-f="${esc(key)}"` : `style="cursor:default"`} title="${esc(tip || "")}"><span class="t">${esc(t)}</span><span class="b"><i style="width:${n / m * 100}%;background:${color}"></i></span><span class="n">${n}</span></div>`).join("");
}
function draw(){
  $("#sub").textContent = P.all ? "All flagships" : P.siteNames[P.sites[0]] || "";
  const I = P.items, of = k => I.filter(x => x.kind === k);
  const cnt = { overview: "", vr: of("vr").filter(x => x.followUp).length, bp: of("bp").filter(isOpenBp).length, nr: of("nr").filter(isOpenNr).length,
    mk: of("mk").filter(mkReview).length, cp: of("cp").filter(x => cpLive(x, nowL())).length, users: U && U.users ? U.users.length : "" };
  const tk = { vr: "var(--vr)", bp: "var(--bp)", nr: "var(--nr)", mk: "var(--mk)", cp: "var(--cp)", users: "var(--us)" };
  const lastTxt = k => { const l = P.last[k]; const lab = k === "users" ? "Portal Users" : P.kinds[k].label; return `<span class="it" style="--k:${tk[k]}"><i></i>${esc(lab)}: ${l ? `<b>${esc(ago(l.at))}</b> · ${l.rows}` : "<b>not yet</b>"}</span>`; };
  const tabsH = `<div class="tabs" role="tablist">${TABS.filter(([k]) => k !== "users" || P.can.users).map(([k, n]) => `<button role="tab" data-tab="${k}" class="${tab === k ? "on" : ""}" style="--k:${tk[k] || "var(--brand)"}">${k !== "overview" ? "<i></i>" : ""}${esc(n)}${cnt[k] !== "" && cnt[k] != null ? ` <em>${cnt[k]}${k === "cp" ? " live" : ""}</em>` : ""}</button>`).join("")}</div>`;
  const src = `<div class="card src">${["vr", "bp", "nr", "mk", "cp", ...(P.can.users ? ["users"] : [])].map(lastTxt).join("")}<span class="sp"></span>
      ${P.can.import ? `<button class="btn small ghost" id="impBtn" title="Salesforce report exports (.xls / .xlsx / .csv): Violations, Breaches & Penalties, ABC Requests, Marketing Requests, Contractor Permits, Active Users">⤓ Import reports</button>` : ""}</div>`;
  const body = tab === "mk" ? drawMk(of("mk")) : tab === "cp" ? drawCp(of("cp")) : tab === "users" ? drawUsers() : tab === "overview" ? drawOverview(I) : drawKind(tab, I);
  $("#app").innerHTML = src + tabsH + body;
  wire();
}
/* ---------------- Overview ---------------- */
function drawOverview(I){
  const of = k => I.filter(x => x.kind === k), vr = of("vr"), bp = of("bp"), nr = of("nr"), mk = of("mk"), cp = of("cp"), n = nowL();
  const FU = I.filter(x => x.followUp), oldest = FU.reduce((m, x) => Math.max(m, x.age || 0), 0);
  const res = vr.length ? Math.round(vr.filter(isDoneVr).length / vr.length * 100) : null;
  const mkR = mk.filter(mkReview), mkOld = mkR.filter(x => (x.age || 0) > 7), mkWeek = mk.filter(x => /^approved/i.test(x.status) && x.from > n && x.from <= D.add(P.today, 7) + "T23:59");
  const cpL = cp.filter(x => cpLive(x, n)), cpToday = cp.filter(x => x.from && x.from.slice(0, 10) === P.today), cpWait = cp.filter(x => /^submitted/i.test(x.status));
  const us = U && U.users && U.users.length ? U.users : null, us30 = us ? us.filter(u => u.login && days(u.login.slice(0, 10), U.today) <= 30).length : 0;
  const lastTile = P.can.users
    ? `<div class="card kc" style="--k:var(--us)" data-tab="users"><h4>Portal users active</h4><div class="big">${us ? Math.round(us30 / us.length * 100) : "—"}<small>%</small></div><div class="sub">${us ? `${us30} of ${us.length} logged in during the last 30 days` : U ? "Import the Active Users report" : "Loading…"}</div></div>`
    : `<div class="card kc" style="--k:var(--bp)" data-tab="bp"><h4>Breaches open</h4><div class="big">${bp.filter(isOpenBp).length}</div><div class="sub">${bp.length} in the report</div></div>`;
  /* by flagship */
  const S = P.sites.map(s => { const f = x => x.site === s;
    const v = vr.filter(f), r = v.length ? Math.round(v.filter(isDoneVr).length / v.length * 100) : null;
    return `<tr><td>${esc(P.siteNames[s] || s)}</td><td>${v.filter(isOpenVr).length}</td><td>${r == null ? "—" : `<span class="c ${pctTone(r)}">${r}%</span>`}</td><td>${bp.filter(f).filter(isOpenBp).length}</td><td>${nr.filter(f).filter(isOpenNr).length}</td><td>${mk.filter(f).filter(mkReview).length}</td></tr>`; }).join("");
  /* new items per month: last 6 months */
  const mon = []; { const t = new Date(P.today + "T12:00:00Z"); for (let i = 5; i >= 0; i--){ const x = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - i, 15)); mon.push(x.toISOString().slice(0, 7)); } }
  const ord = ["vr", "bp", "nr", "mk", "cp"], M = mon.map(m => { const c = {}; ord.forEach(k => c[k] = 0); I.forEach(x => { if (x.created && x.created.slice(0, 7) === m && c[x.kind] != null) c[x.kind]++; }); return c; });
  const tot = M.map(c => ord.reduce((a, k) => a + c[k], 0)), mx = Math.max(1, ...tot);
  const trend = `<div class="trend">${mon.map((m, i) => `<div class="mo"><b>${tot[i]}</b><div class="stack" style="height:${tot[i] / mx * 100}%">${ord.map(k => M[i][k] ? `<i style="flex:${M[i][k]};background:${K[k].c}" title="${esc(P.kinds[k].label)}: ${M[i][k]}"></i>` : "").join("")}</div><small>${new Date(m + "-15T12:00:00Z").toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" })}${m === P.today.slice(0, 7) ? "*" : ""}</small></div>`).join("")}</div>
    <div class="lg2">${ord.map(k => `<span style="--c:${K[k].c}">${esc(P.kinds[k].label)}</span>`).join("")}<span style="--c:transparent">* month to date</span></div>`;
  return `
    <div class="hero">
      <div class="card kc lead"><h4>Waiting on tenants</h4><div class="big">${FU.length}<small>sent to tenant</small></div>
        <div class="sub">${FU.length ? `Oldest ${oldest} days · ${FU.filter(x => (x.age || 0) > 30).length} over 30 days` : "Nothing waiting"}</div>

      <div class="bar"><input class="inp" id="q" placeholder="Search name, email, title or company…" value="${esc(q)}">${usF ? `<span class="pill brand">${esc((BK.find(x => x[0] === usF) || [])[1] || "")} <button data-usf="" style="font-weight:800;margin-left:4px">×</button></span>` : ""}</div>
      <div class="card" style="padding:4px 6px"><div class="tw"><table class="ut"><thead><tr><th>Name</th><th>Last login</th><th class="hide-s">Title</th><th class="hide-s">Company</th><th class="hide-s">User since</th></tr></thead>
        <tbody>${F.slice(0, usLim).map(u => `<tr><td><b>${esc(u.name || "—")}</b><small>${esc(u.user)}</small></td><td>${u.login ? esc(dt(u.login)) + `<small>${days(u.login.slice(0, 10), t)} days ago</small>` : `<span class="tag">Never</span>`}</td><td class="hide-s">${esc(u.title)}</td><td class="hide-s">${esc(u.company || (u.site ? U.siteNames[u.site] || "" : ""))}</td><td class="hide-s">${esc(dt((u.created || "").slice(0, 10)))}</td></tr>`).join("")}</tbody></table></div></div>
      ${F.length > usLim ? `<div style="text-align:center;margin:12px 0"><button class="btn ghost small" id="usMore">Show more · ${F.length - usLim} left</button></div>` : ""}
    </div><div>
      <div class="card panel"><div class="sec">Last login</div>${bars(BK.map(([k, l]) => [l, c[k] || 0, "", k]), "var(--us)")}<div class="sub" style="margin-top:8px">Tap a line to list those users. Users who never logged in or not for 90 days are the first to review for licences.</div></div>
      <div class="card panel"><div class="sec">Top titles · ${L.length - Object.values(TT).reduce((a, n) => a + n, 0)} without a title</div>${bars(Object.entries(TT).sort((a, b) => b[1] - a[1]).slice(0, 8), "var(--brand-2)")}</div>
      <div class="note warnnote">⚠ The Active Users report has no <b>Account</b> or <b>Branch</b> column, so users can't be counted per tenant or flagship yet. Ask IT to add both columns.</div>
    </div></div>`;
}
function wire(){
  $("#app").onclick = e => {
    const tb = e.target.closest("[data-tab]");
    if (tb){ tab = tb.dataset.tab; LIM = 40; kind = ""; tenant = ""; status = "follow"; q = ""; url(); return draw(); }
    if (e.target.id === "more"){ LIM += 40; return draw(); }
    if (e.target.id === "usMore"){ usLim += 150; return draw(); }
    const mf = e.target.closest("[data-mkf]"); if (mf){ mkF = mf.dataset.mkf; LIM = 40; return draw(); }
    const mt = e.target.closest("[data-mkt],[data-mkt2]"); if (mt){ const v = mt.dataset.mkt != null ? mt.dataset.mkt : mt.dataset.mkt2; mkType = mkType === v && mt.dataset.mkt2 != null ? "" : v; LIM = 40; return draw(); }
    const cf = e.target.closest("[data-cpf]"); if (cf){ cpF = cf.dataset.cpf; LIM = 40; return draw(); }
    const uf = e.target.closest("[data-usf]"); if (uf){ usF = uf.dataset.usf; usLim = 150; return draw(); }
    const hf = e.target.closest(".hb[data-f]"); if (hf){ usF = hf.dataset.f; usLim = 150; return draw(); }
    if (e.target.closest("#stSeg button,#kSeg button,.hb[data-t]") || e.target.id === "clrT") LIM = 40;
    const sb = e.target.closest("#stSeg button"); if (sb){ status = sb.dataset.s; return draw(); }
    const kb = e.target.closest("#kSeg button"); if (kb){ kind = kb.dataset.k; return draw(); }
    const t = e.target.closest(".hb[data-t]"); if (t){ tenant = t.dataset.t; status = "all"; return draw(); }
    if (e.target.id === "clrT"){ tenant = ""; return draw(); }
    const d = e.target.closest(".ds"); if (d) return d.classList.toggle("open");
    if (e.target.id === "impBtn") return $("#file").click();
  };
  const o = $("#old"); if (o) o.onchange = () => { old = o.checked; LIM = 40; draw(); };
  const qi = $("#q"); if (qi) qi.oninput = () => { q = qi.value; LIM = 40; const pos = qi.selectionStart; draw(); const n = $("#q"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } };
}
$("#file").onchange = async e => {
  const fs = [...e.target.files]; e.target.value = ""; if (!fs.length) return;
  try {
    toast(`Reading ${fs.length} report${fs.length > 1 ? "s" : ""}…`);
    const files = await Promise.all(fs.map(f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: f.name, data: r.result }); r.onerror = () => rej(new Error("Could not read " + f.name)); r.readAsDataURL(f); })));
    const r = await api("ops/portal/import", { site: site === "ALL" ? "" : site, files });
    toast(r.files.map(f => f.error ? `${f.file}: ${f.error}` : `${f.kinds.join(", ")}: ${f.rows} · ${f.added} new${f.gone ? " · " + f.gone + " left" : ""}`).join(" | "));
    U = null; load();
  } catch (er){ toast(er.message, true); }
};
boot();
</script>
