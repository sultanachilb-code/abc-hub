<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footfall · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
/* Footfall (Nov 2026) — Liban Park daily car counts, monthly report, analysis — docs/FEATURE-footfall.md */
.w2{max-width:1150px;margin:0 auto;display:grid;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:.8rem;font-weight:700;cursor:pointer;background:var(--surface);user-select:none}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.ctabs button{border:0;background:none;padding:10px 13px;font:inherit;font-weight:800;font-size:.86rem;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.ctabs button.on{color:var(--brand);border-bottom-color:#C8A24A}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.box h3{margin:0;padding:12px 14px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{padding:12px 14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.k{background:var(--surface);border:1px solid var(--line);border-top:3px solid #C8A24A;border-radius:14px;padding:12px 14px}
.k b{display:block;font-size:1.55rem;line-height:1.2}.k span{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em}.k em{display:block;font-style:normal;font-size:.76rem;font-weight:700;margin-top:2px}
.up{color:var(--ok,#1E8A4C)}.dn{color:var(--alert,#B03A2E)}
.pill{font-size:.68rem;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-in{background:rgba(30,138,76,.13);color:#1E7A4F}.p-wait{background:rgba(184,116,15,.15);color:#8A5A00}.p-miss{background:rgba(194,40,60,.13);color:#B0283C}.p-off{background:rgba(120,120,120,.15);color:var(--muted)}
.badge{display:inline-block;background:rgba(200,162,74,.16);border:1px solid rgba(200,162,74,.55);color:#8A6418;font-weight:800;font-size:.74rem;padding:4px 10px;border-radius:10px;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}table.t th{text-align:left;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.tw{overflow-x:auto}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(138,92,192,.06)}
.ban{border-radius:14px;padding:12px 14px;font-weight:700;font-size:.86rem;line-height:1.5;background:rgba(200,162,74,.16);border:1px solid rgba(200,162,74,.5)}
.ban.bad{background:rgba(194,40,60,.08);border-color:rgba(194,40,60,.35)}
.sc{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:grid;gap:8px}
.sc .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.sc b.nm{font-size:1rem}
.tl{display:flex;gap:5px;flex-wrap:wrap}.tl span{font-size:.7rem;border:1px solid var(--line);border-radius:8px;padding:3px 7px;color:var(--muted)}.tl span.d{background:var(--brand);color:#fff;border-color:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:3px;height:180px;border-bottom:1px solid var(--line);margin:10px 14px 0;position:relative}
.b{flex:1;height:100%;display:flex;align-items:flex-end;gap:1px;position:relative;min-width:0}.b i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.b i.miss{background:repeating-linear-gradient(45deg,rgba(194,40,60,.18) 0 4px,transparent 4px 8px)!important;border:1px dashed rgba(194,40,60,.6);height:100%!important}
.b s{position:absolute;bottom:-18px;left:-4px;right:-4px;text-align:center;font-size:.6rem;color:var(--muted);text-decoration:none}
.b:hover i{filter:brightness(1.15)}
.lg{display:flex;gap:14px;font-size:.75rem;padding:26px 14px 12px;flex-wrap:wrap}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.82rem;padding:5px 14px}.bar b{text-align:right;font-variant-numeric:tabular-nums}
.mini{height:8px;background:rgba(138,92,192,.13);border-radius:9px;overflow:hidden}.mini i{display:block;height:100%;background:var(--brand);border-radius:9px}
.sw{width:44px;height:26px;border-radius:99px;background:#CFC7D9;position:relative;cursor:pointer;flex:none;border:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--brand)}.sw.on:after{left:21px}.sw[disabled]{cursor:default;opacity:.8}
dialog.dd{border:0;border-radius:20px;padding:0;width:min(620px,calc(100% - 20px));max-height:92dvh;background:var(--surface);color:var(--text)}
.dd .h{padding:16px 18px 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dd .h b{font-size:1.05rem}.dd .bd{padding:6px 18px 14px;display:grid;gap:10px;max-height:70dvh;overflow:auto}.dd .f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fl label,.dd label{font-size:.7rem;font-weight:800;color:var(--muted);display:block;margin-bottom:3px;letter-spacing:.04em}
.fl input,.fl select,.fl textarea,.dd input,.dd select,.dd textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--text);width:100%}
.gin{display:grid;gap:6px;grid-template-columns:repeat(var(--n,3),1fr)}.gbox{border:1px solid var(--line);border-radius:12px;padding:9px}.gbox b{font-size:.84rem;display:flex;justify-content:space-between;margin-bottom:6px}
.grow{display:grid;grid-template-columns:1fr 90px 140px 34px;gap:6px;align-items:center;margin-bottom:6px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:34px;cursor:pointer;color:var(--muted)}
.log{font-size:.78rem;color:var(--muted);line-height:1.6}
.empty{border:2px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-size:.84rem;line-height:1.6}
.dd .kpi{grid-template-columns:repeat(2,1fr)}.dd .k b{font-size:1.25rem}
@media (max-width:560px){.bar{grid-template-columns:80px 1fr 60px}.grow{grid-template-columns:1fr 80px 34px}.grow select.kind{grid-column:1/3}}
</style>
</head>
<body>
<div class="top"><h1>👣 Footfall <small id="sub"></small></h1></div>
<div class="wrap"><div class="w2" id="view"><p class="muted">Loading…</p></div></div>
<dialog class="dd" id="dlg"></dialog>
<script src="common.js"></script>
<script>
let C = null, SITE = "", TAB = "imp", MONTH = "", YEAR = "", CACHE = {}, ST = null;
const KL = { t: "Tickets", c: "Cards", e: "Employees", u: "Users", p: "Passes" }, KINDS = { tce: ["t", "c", "e"], users: ["u"], passes: ["p"] };
const KIND_NAMES = { tce: "Tickets · Cards · Employees", users: "Users", passes: "Passes" };
const COLORS = ["#4A1F73", "#C8A24A", "#2E8B8B"];
const N = v => v == null ? "—" : Number(v).toLocaleString("en-US");
const pct = (a, b) => b ? (a - b) / b * 100 : null;
const delta = (a, b, lbl) => { const p = pct(a, b); return p == null ? "" : `<em class="${p >= 0 ? "up" : "dn"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(1)}% ${lbl}</em>`; };
const monthDays = m => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate();
const mLabel = m => D.parse(m + "-15").toLocaleDateString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });
const mShort = m => D.parse(m + "-15").toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" });
const prevM = m => { const [y, x] = m.split("-").map(Number); return x === 1 ? `${y - 1}-12` : `${y}-${String(x - 1).padStart(2, "0")}`; };
const nextM = m => { const [y, x] = m.split("-").map(Number); return x === 12 ? `${y + 1}-01` : `${y}-${String(x + 1).padStart(2, "0")}`; };
const sitesOn = () => Object.keys(C.sites).filter(s => C.on[s]);
const shown = () => SITE === "ALL" ? sitesOn() : [SITE];
const canEdit = s => !!C.canEdit[s];
const pill = st => ({ in: `<span class="pill p-in"><i></i>RECEIVED</span>`, wait: `<span class="pill p-wait"><i></i>WAITING</span>`, miss: `<span class="pill p-miss"><i></i>MISSING</span>` }[st]);
const time = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Beirut" }) : "";

async function boot(){
  C = await api("ops/ff/context");
  const keys = Object.keys(C.sites);
  if (!keys.length) return shell(`<div class="ban">No flagship is set up for Footfall on your account.</div>`);
  MONTH = C.today.slice(0, 7); YEAR = C.today.slice(0, 4);
  const on = sitesOn();
  SITE = on.length > 1 ? "ALL" : (on[0] || keys[0]);
  draw();
}
function shell(inner){
  const on = sitesOn();
  const tabs = [["imp", "Daily import"], ["rep", "Monthly report"], ["ana", "Analysis"], ...(C.settings ? [["set", "Settings"], ["hist", "History import"]] : [])];
  const chips = TAB === "set" || TAB === "hist" ? "" : on.length > 1 || (TAB === "imp" && Object.keys(C.sites).length > 1)
    ? `<div class="chips">${on.length > 1 ? `<span class="chip ${SITE === "ALL" ? "on" : ""}" data-s="ALL">All flagships</span>` : ""}${on.map(s => `<span class="chip ${SITE === s ? "on" : ""}" data-s="${s}">${esc(C.sites[s])}</span>`).join("")}</div>` : "";
  $("#sub").textContent = SITE === "ALL" ? "· All flagships" : C.sites[SITE] ? "· " + C.sites[SITE] : "";
  $("#view").innerHTML = `<div class="ctabs">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${TAB === k ? "on" : ""}">${n}</button>`).join("")}</div>` + chips + (inner || "");
  $("#view").querySelectorAll("[data-s]").forEach(x => x.onclick = () => { SITE = x.dataset.s; draw(); });
  $("#view").querySelectorAll("[data-tab]").forEach(x => x.onclick = () => { TAB = x.dataset.tab; draw(); });
}
async function draw(){
  shell(`<p class="muted">Loading…</p>`);
  try {
    if (TAB === "imp") return drawImport(ST = await api("ops/ff/status"));
    if (TAB === "rep") return drawReport();
    if (TAB === "ana") return drawAnalysis();
    if (TAB === "set") return drawSettings(await api("ops/ff/settings"));
    if (TAB === "hist") return drawHistory();
  } catch (e){ shell(`<div class="ban bad">${esc(e.message)}</div>`); }
}

/* ---------- 1. Daily import ---------- */
function drawImport(o){
  const list = SITE === "ALL" ? Object.keys(o.sites).filter(s => o.sites[s].on) : [SITE];
  const all = Object.keys(o.sites);
  const yday = D.add(o.today, -1), hr = o.hour;
  const slots = [9, 10, 11, 12, 13, 14];
  const cards = all.map(s => { const x = o.sites[s], y = x.list[0];
    const sent = y.sentAt ? `${time(y.sentAt)} email` : "";
    return `<div class="sc"><div class="row"><b class="nm">${esc(C.sites[s])}</b><span class="sw ${x.on ? "on" : ""}" disabled title="Switch on / off in Settings"></span></div>
      ${!x.on ? `<span class="pill p-off"><i></i>SWITCHED OFF</span><span class="muted" style="font-size:.8rem">No emails, no reminders, not in the report.</span>`
      : `<div>${pill(y.status)}${y.status === "wait" && y.reminders ? ` <span class="pill p-wait">REMINDER ${y.reminders}</span>` : ""}</div>
        <div class="muted" style="font-size:.8rem">${D.long(yday)}${y.status === "in" ? ` · <b style="color:var(--text)">${N(y.entries)}</b> entries · ${y.source === "liban" ? "Liban Park" : esc(y.by)} at ${time(y.at)}` : ""}</div>
        ${y.status !== "in" ? `<div class="tl">${slots.map(h => `<span class="${h <= hr ? "d" : ""}">${String(h).padStart(2, "0")}:00${h === 9 ? " link" : h === 14 ? " last" : ""}</span>`).join("")}</div>` : ""}
        ${!x.contacts ? `<div class="ban bad" style="font-size:.78rem;padding:8px 10px">No Liban Park email set — no emails go out. ${C.settings ? "Settings → add it." : ""}</div>` : ""}
`}
    </div>`; }).join("");
  const rows = (s) => o.sites[s].list.map(d => `<tr class="click" data-day="${d.day}" data-site="${s}"><td>${esc(D.fmt(d.day, { weekday: "short", year: "numeric" }))}</td>
    <td>${pill(d.status)}</td><td class="n">${N(d.entries)}</td><td class="n">${N(d.exits)}</td><td>${d.status === "in" ? `${d.source === "liban" ? "Liban Park" : d.source === "import" ? "History import" : esc(d.by)} · ${time(d.at)}` : d.sentAt ? `Link sent ${time(d.sentAt)}${d.reminders ? ` · ${d.reminders} reminder${d.reminders > 1 ? "s" : ""}` : ""}` : "—"}</td></tr>`).join("");
  shell(`<div class="grid">${cards}</div>
    <div class="muted" style="font-size:.8rem">Liban Park gets the link at <b>09:00</b> for yesterday, then a reminder every hour until <b>14:00</b>. A day still missing at 15:00 is flagged to the operations team. Click a day to see the figures${C.settings ? ", correct them, or send the link again" : ""}.</div>
    ${list.map(s => `<div class="box"><h3>${esc(C.sites[s])} · last 14 days</h3><div class="tw"><table class="t"><tr><th>Day</th><th>Status</th><th class="n">Entries</th><th class="n">Exits</th><th>Details</th></tr>${rows(s)}</table></div></div>`).join("")}`);
  $("#view").querySelectorAll("[data-day]").forEach(x => x.onclick = () => openDay(x.dataset.site, x.dataset.day));
  $("#view").querySelectorAll("[data-dur]").forEach(x => x.onclick = e => { e.preventDefault(); openDur(x.dataset.dur, ST.sites[x.dataset.dur].durLast.month); });
}
function gateInputs(gates, cur, ro){
  const box = g => { const ks = KINDS[g.kind], v = (cur && cur.g && cur.g[g.id]) || {};
    return `<div class="gbox"><b>${esc(g.name)} <span class="muted" data-sum="${g.id}"></span></b><div class="gin" style="--n:${ks.length}">${ks.map(k => `<div><label>${KL[k]}</label>${ro ? `<div style="font-weight:800">${N(v[k] || 0)}</div>` : `<input inputmode="numeric" data-g="${g.id}" data-k="${k}" value="${v[k] || ""}">`}</div>`).join("")}</div></div>`; };
  const ins = gates.filter(g => g.dir === "in"), outs = gates.filter(g => g.dir === "out");
  return `<label>CAR ENTRIES</label>${ins.map(box).join("")}${outs.length ? `<label>CAR EXITS</label>${outs.map(box).join("")}` : ""}`;
}
/* Nov 2026: cars per hour · payments per machine (transactions) · parking duration — same as the Liban Park form */
function extraInputs(site, cur, ro){
  const m = (C.mach || {})[site] || { apm: [], hh: [] }, cell = (lbl, attr, v) => `<div><label>${esc(lbl)}</label>${ro ? `<div style="font-weight:800">${v ? N(v) : "—"}</div>` : `<input inputmode="numeric" ${attr} value="${v || ""}">`}</div>`;
  const h = (cur && cur.h) || [], du = (cur && cur.dur) || [], tx = (cur && cur.tx) || { apm: {}, hh: {} };
  if (ro && !h.length && !du.length && !(cur && cur.tx)) return `<div class="muted" style="font-size:.8rem">No hourly, payment or duration figures for this day.</div>`;
  return `<label>CARS ENTERING PER HOUR</label><div class="gin" style="--n:4">${C.hours.map((x, i) => cell(`${x}–${C.hours[i + 1] || "23:00"}`, `data-h="${i}"`, h[i])).join("")}</div>
    ${m.apm.length ? `<label>PAY MACHINES · TRANSACTIONS</label><div class="gin" style="--n:${Math.min(3, m.apm.length)}">${m.apm.map(n => cell(n, `data-tx="apm" data-n="${esc(n)}"`, (tx.apm || {})[n])).join("")}</div>` : ""}
    ${m.hh.length ? `<label>HANDHELDS · TRANSACTIONS</label><div class="gin" style="--n:${Math.min(3, m.hh.length)}">${m.hh.map(n => cell(n, `data-tx="hh" data-n="${esc(n)}"`, (tx.hh || {})[n])).join("")}</div>` : ""}
    <label>PARKING DURATION · CARS THAT LEFT</label><div class="gin" style="--n:4">${C.buckets.map((b, i) => cell(b, `data-du="${i}"`, du[i])).join("")}</div>`;
}
async function openDay(site, day){
  const d = $("#dlg"); d.innerHTML = `<div class="h"><b>Loading…</b></div>`; d.showModal();
  let r; try { r = await api(`ops/ff/day?site=${site}&day=${day}`); } catch (e){ d.close(); return toast(e.message, true); }
  const x = r.day, ed = canEdit(site);
  const view = () => {
    d.innerHTML = `<div class="h"><b>${esc(C.sites[site])}</b><span class="badge">${esc(D.long(day))}</span>${x ? pill("in") : pill(day === D.add(C.today, -1) && C.hour <= 14 ? "wait" : "miss")}</div>
      <div class="bd">${x ? `<div class="kpi"><div class="k"><b>${N(x.entries)}</b><span>ENTRIES</span></div><div class="k"><b>${N(x.noemp)}</b><span>WITHOUT EMPLOYEES</span></div>${x.detail ? `<div class="k"><b>${N(x.exits)}</b><span>EXITS</span></div><div class="k"><b>${N(x.free)}</b><span>FREE TICKETS</span></div>` : ""}</div>
        ${x.detail ? gateInputs(r.gates, x, true) + extraInputs(site, x, true) : `<div class="muted">Imported as a total only (no gate details).</div>`}
        ${C.revenue && x.detail ? `<div class="muted">Membership <b>${N(x.membership)} LBP</b> · Total balance <b>${N(x.balance)} LBP</b></div>` : ""}`
        : `<div class="ban">Not received.${r.sentAt ? ` Link sent at ${time(r.sentAt)}${r.reminders ? ` · ${r.reminders} reminder(s)` : ""}.` : ""}</div>`}
        ${r.log.length ? `<div class="log">${r.log.map(l => `${esc(new Date(l.at).toLocaleString("en-GB", { timeZone: "Asia/Beirut", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))} · ${esc(l.what)} · ${esc(l.by_name)}`).join("<br>")}</div>` : ""}
      </div>
      <div class="f">${ed && day < C.today ? `${!x ? `<button class="btn ghost" id="snd">✉ Send the link to Liban Park</button>` : ""}${r.link ? `<button class="btn ghost" id="cpy">Copy link</button>` : ""}<button class="btn ghost" id="edt">${x ? "Correct" : "Enter the figures"}</button>` : ""}<button class="btn" id="cl">Close</button></div>`;
    $("#cl").onclick = () => d.close();
    const s = $("#snd"); if (s) s.onclick = async () => { s.disabled = true; try { const o = await api("ops/ff/send", { site, kind: "day", period: day }); toast(`Sent to ${o.to.join(", ")}`); d.close(); draw(); } catch (e){ toast(e.message, true); s.disabled = false; } };
    const c = $("#cpy"); if (c) c.onclick = () => { navigator.clipboard.writeText(r.link).then(() => toast("Link copied")); };
    const e = $("#edt"); if (e) e.onclick = edit;
  };
  const edit = () => {
    const det = x && x.detail ? x : null;
    d.innerHTML = `<div class="h"><b>${x ? "Correct" : "Enter"} · ${esc(C.sites[site])}</b><span class="badge">${esc(D.long(day))}</span></div>
      <div class="bd fl">${gateInputs(r.gates, det, false)}${extraInputs(site, det, false)}
        <div class="gin" style="--n:${C.revenue ? 3 : 1}"><div><label>FREE TICKETS</label><input inputmode="numeric" id="free" value="${det ? det.free || "" : ""}"></div>
        ${C.revenue ? `<div><label>MEMBERSHIP (LBP)</label><input inputmode="numeric" id="membership" value="${det ? det.membership || "" : ""}"></div><div><label>TOTAL BALANCE (LBP)</label><input inputmode="numeric" id="balance" value="${det ? det.balance || "" : ""}"></div>` : ""}</div>
        <div class="ban" id="tot" style="font-size:.84rem"></div>
        ${x ? `<div><label>REASON FOR THE CORRECTION</label><input id="note" maxlength="200" placeholder="e.g. Liban Park sent a corrected figure"></div>` : ""}</div>
      <div class="f"><button class="btn ghost" id="bk">Back</button><button class="btn" id="sv">Save</button></div>`;
    const num = v => Math.max(0, Math.round(Number(String(v || "").replace(/[,\s]/g, ""))) || 0);
    const coll = () => { const g = {}; d.querySelectorAll("[data-g]").forEach(i => (g[i.dataset.g] = g[i.dataset.g] || {})[i.dataset.k] = num(i.value));
      const v = id => { const el = d.querySelector("#" + id); return el ? num(el.value) : 0; };
      const tx = { apm: {}, hh: {} }; d.querySelectorAll("[data-tx]").forEach(i => tx[i.dataset.tx][i.dataset.n] = num(i.value));
      return { g, free: v("free"), membership: v("membership"), balance: v("balance"), h: [...d.querySelectorAll("[data-h]")].map(i => num(i.value)), dur: [...d.querySelectorAll("[data-du]")].map(i => num(i.value)), tx }; };
    const sums = () => { const c = coll(); let tin = 0, tout = 0; for (const gt of r.gates){ const s = Object.values(c.g[gt.id] || {}).reduce((a, b) => a + b, 0); d.querySelector(`[data-sum="${gt.id}"]`).textContent = "= " + N(s); gt.dir === "in" ? tin += s : tout += s; }

/* ---------- data (one calendar year + last December, per flagship) ---------- */
async function yearDays(site, y){
  const k = site + y; if (CACHE[k]) return CACHE[k];
  const r = await api(`ops/ff/days?site=${site}&from=${y - 1}-12-01&to=${y}-12-31`);
  const by = {}; for (const x of r.days) by[x.day] = x;
  return CACHE[k] = { by, gates: r.gates, revenue: r.revenue };
}
const daysOf = (Y, m) => Object.values(Y.by).filter(x => x.day.startsWith(m)).sort((a, b) => a.day < b.day ? -1 : 1);
const sum = (l, k) => l.reduce((a, x) => a + (x[k] || 0), 0);
function coverage(list, m){
  const last = m === C.today.slice(0, 7) ? D.add(C.today, -1) : `${m}-${String(monthDays(m)).padStart(2, "0")}`;
  const N_ = m === C.today.slice(0, 7) ? Math.max(0, +last.slice(8)) : monthDays(m), have = new Set(list.map(x => x.day));
  const missing = []; for (let i = 1; i <= N_; i++){ const d = `${m}-${String(i).padStart(2, "0")}`; if (!have.has(d)) missing.push(d); }
  return { from: list.length ? list[0].day : "", to: list.length ? list[list.length - 1].day : "", n: list.length, total: monthDays(m), elapsed: N_, missing, current: m === C.today.slice(0, 7) };
}
const badgeOf = cv => !cv.n ? `<span class="badge">No figures yet</span>`
  : `<span class="badge">${esc(D.fmt(cv.from))} – ${esc(D.fmt(cv.to, { year: "numeric" }))} · ${cv.n} of ${cv.total} days</span>`;

/* ---------- 3. Analysis (Nov 2026): a landing page of icons, each report on its own page — built from the daily figures, Liban Park's monthly reports where they exist ---------- */
let ANA = "", ASITE = "", MON = {};
const PAGES = [["ee", "🚗", "Entries & exits", "Month by month, year over year"], ["adm", "🎫", "Parking admissions", "Tickets · VIP cards · Employees · Soffa"],

const MN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
async function monthsOf(site){ if (!MON[site]) MON[site] = await api(`ops/ff/monthly?site=${site}&from=2017-01&to=${C.today.slice(0, 7)}`); return MON[site]; }
const pctS = (a, b) => b ? (a / b * 100).toFixed(1) + "%" : "—";
const srcNote = (list, k) => { const r = list.filter(x => x.src[k] === "report").length, d = list.filter(x => x.src[k] === "daily"); return `<div class="muted" style="font-size:.76rem;padding:8px 14px">${r ? `${r} month${r > 1 ? "s" : ""} from Liban Park's monthly report` : ""}${r && d.length ? " · " : ""}${d.length ? `${d.length} month${d.length > 1 ? "s" : ""} from the daily figures${d.some(x => x.days < x.mdays) ? " (current month: " + d.filter(x => x.days < x.mdays).map(x => `${x.days} of ${x.mdays} days`).join(", ") + ")" : ""}` : ""}${!r && !d.length ? "No figures yet." : ""}</div>`; };
async function drawAnalysis(){
  const sites = sitesOn().length ? sitesOn() : Object.keys(C.sites); if (!sites.length) return shell(`<div class="ban">No flagship is switched on.</div>`);
  if (!sites.includes(ASITE)) ASITE = SITE !== "ALL" && sites.includes(SITE) ? SITE : sites[0];

  const bar = `<div class="box"><div class="pad" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${ANA ? `<button class="btn ghost small" id="aBk">‹ Analysis</button>` : ""}

function bindAna(){

function tbl(head, rows, foot){ return `<div class="tw"><table class="t"><tr>${head.map((h, i) => `<th${i ? ' class="n"' : ""}>${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td${i ? ' class="n"' : ""}>${c}</td>`).join("")}</tr>`).join("")}${foot ? `<tr>${foot.map((c, i) => `<td${i ? ' class="n"' : ""}><b>${c}</b></td>`).join("")}</tr>` : ""}</table></div>`; }
function page(k, R, yl, y){

      <div class="k"><b>${N(p)}</b><span>SAME MONTHS ${last || ""}</span></div><div class="k"><b>${N(Math.round(t / Math.max(1, upto + 1)))}</b><span>MONTHLY AVERAGE ${y}</span></div></div>

      <div class="lg">${ys.map((yy, j) => `<span style="--c:${cols[j]}">${yy}</span>`).join("")}</div></div>
      <div class="box"><h3>Entries &amp; exits · ${y}</h3>${tbl(["Month", "Entries", "Exits", "Difference", last ? "Entries " + last : ""].filter(Boolean),
        MN.map((n, i) => { const m = at(i, "ee"); return [n, m ? N(m.ee.in) : "—", m ? N(m.ee.out) : "—", m ? N(m.ee.out - m.ee.in) : "—", ...(last ? [N(val(last, i, "in"))] : [])]; }),
        ["Total", N(yl.reduce((a, m) => a + (m.src.ee ? m.ee.in : 0), 0)), N(yl.reduce((a, m) => a + (m.src.ee ? m.ee.out : 0), 0)), "", ...(last ? [N(MN.reduce((a, _, i) => a + (val(last, i, "in") || 0), 0))] : [])])}${srcNote(yl, "ee")}</div>`;
  }
  if (k === "adm"){

/* ---------- History import (Liban Park monthly workbook / parking duration workbook) ---------- */
const lc = v => String(v == null ? "" : v).replace(/\s+/g, " ").trim().toLowerCase();
const isoOf = v => { if (v instanceof Date && !isNaN(v)){ v = new Date(v.getTime() + 12 * 3600e3);   /* noon: clock changes (e.g. 29 Mar in Beirut) never shift the day */ return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`; }
  if (typeof v === "number" && v > 30000 && v < 80000){ const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return d.toISOString().slice(0, 10); } return ""; };
const SITE_WORDS = { verdun: "VRM", achrafieh: "ACM", dbayeh: "DBS" };
const subKey = s => { s = lc(s); return s.startsWith("ticket") ? "t" : s.startsWith("card") ? "c" : s.startsWith("emp") ? "e" : s.startsWith("user") ? "u" : s.startsWith("pas") ? "p" : ""; };
function parseDaily(wb){
  const days = [], others = {}, gatesSeen = new Map(), notes = [];
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    const r2i = rows.findIndex(r => r && r.some(c => /^(?!total).+\s(entry|exit)$/i.test(String(c || "").trim())));
    if (r2i < 1) { notes.push(`${name}: not a footfall sheet — skipped`); continue; }
    const r1 = rows[r2i - 1] || [], r2 = rows[r2i], r3 = rows[r2i + 1] || [];
    const exitCol = r1.findIndex(c => /cars per exit/i.test(String(c || "")));
    const cols = [];   // {col, gate, dir, key}
    let free = -1, mem = -1, bal = -1; const tots = [];
    r2.forEach((c, j) => { const t = String(c || "").trim(); if (!t) return;
      if (/^free$/i.test(t)) free = j; else if (/^membership/i.test(t)) mem = j; else if (/^total balance/i.test(t)) bal = j;
      else if (/^(the )?difference|^without|^total|^car entrances|^day$|^date$|^abc /i.test(t)) return;
      else { const m = /^(.+?)\s+(entry|exit)$/i.exec(t), gname = m ? m[1].trim() : t, dir = m ? (lc(m[2]) === "exit" ? "out" : "in") : (exitCol >= 0 && j >= exitCol ? "out" : "in");
        for (let k = j; k < Math.min(r3.length, j + 4); k++){ if (k > j && String(r2[k] || "").trim()) break; const key = subKey(r3[k]); if (key) cols.push({ col: k, gate: gname, dir, key }); } } });
    for (let j = 0; j < Math.max(r1.length, r2.length); j++){   // "ABC Achrafieh — Total Entries" (row 1 or row 2 label)
      const t = [r1[j], r2[j], r3[j]].map(lc).join(" "), m = /abc (verdun|achrafieh|dbayeh)/.exec(t);
      if (m && /total entries/.test(t) && !/exit/.test(t)) tots.push({ col: j, site: SITE_WORDS[m[1]] }); }
    for (const c of cols){ const k = c.gate.toLowerCase() + "|" + c.dir; if (!gatesSeen.has(k)) gatesSeen.set(k, { name: c.gate, dir: c.dir, keys: new Set() }); gatesSeen.get(k).keys.add(c.key); }
    for (let i = r2i + 2; i < rows.length; i++){
      const r = rows[i]; if (!r) continue; if (r.some(c => /^total$/i.test(String(c || "").trim()))) break;
      const day = r.map(isoOf).find(Boolean); if (!day) continue;
      const g = {}; for (const c of cols){ ((g[c.gate.toLowerCase() + "|" + c.dir]) = g[c.gate.toLowerCase() + "|" + c.dir] || {})[c.key] = Number(r[c.col]) || 0; }
      days.push({ day, g, free: free >= 0 ? Number(r[free]) || 0 : 0, membership: mem >= 0 ? Number(r[mem]) || 0 : 0, balance: bal >= 0 ? Number(r[bal]) || 0 : 0 });
      for (const t of tots){ const v = Number(r[t.col]) || 0; (others[t.site] = others[t.site] || []).push({ day, total: v }); }
    }
  }
  return { days, others, gates: [...gatesSeen.entries()].map(([k, v]) => ({ k, name: v.name, dir: v.dir, keys: [...v.keys] })), notes };
}
function parseDur(wb){
  const months = [], MN = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    const yr = (/(20\d\d)/.exec(name) || /(20\d\d)/.exec(String((rows[0] || [])[0] || "")) || [])[1]; if (!yr) continue;
    const h = rows.findIndex(r => r && lc(r[0]) === "duration"); if (h < 0) continue;
    for (let i = h + 1; i < rows.length; i++){ const r = rows[i] || [], mi = MN.indexOf(lc(r[0])); if (mi < 0) continue;
      const data = Array.from({ length: 13 }, (_, k) => Math.round(Number(r[k + 1]) || 0)); if (!data.some(Boolean)) continue;
      months.push({ month: `${yr}-${String(mi + 1).padStart(2, "0")}`, data }); }
  }
  return months;
}

  if (dur.length){
    $("#hp").innerHTML = `<div class="ban">Parking duration: <b>${dur.length} months</b> (${esc(dur[0].month)} → ${esc(dur[dur.length - 1].month)}) → ${esc(C.sites[site])}</div><button class="btn" id="hi">Import</button>`;
    $("#hi").onclick = async () => { try { const r = await api("ops/ff/import", { site, kind: "dur", months: dur, overwrite: $("#ho").checked }); toast(`${r.imported} months imported`); CACHE = {}; MON = {}; $("#hp").innerHTML = `<div class="ban">✓ ${r.imported} months imported.</div>`; } catch (e){ toast(e.message, true); } };
    return;
  }
  const p = parseDaily(wb);
  if (!p.days.length) return $("#hp").innerHTML = `<div class="ban bad">No footfall or parking duration found in this file.</div>`;
  const map = {}, miss = [];
  for (const g of p.gates){ const m = gates.find(x => lc(x.name) === lc(g.name) && x.dir === g.dir); if (m) map[g.k] = m.id; else miss.push(`${g.name} (${g.dir === "in" ? "entry" : "exit"})`); }
  const rows = p.days.map(d => { const g = {}; for (const [k, v] of Object.entries(d.g)) if (map[k]) g[map[k]] = v; return { day: d.day, g, free: d.free, membership: d.membership, balance: d.balance }; })
    .filter(r => Object.values(r.g).some(o => Object.values(o).some(Boolean)));
  const oth = Object.entries(p.others).filter(([s]) => s !== site && C.sites[s] && canEdit(s)).map(([s, l]) => [s, l.filter(x => x.total > 0)]);
  const skippedOther = Object.keys(p.others).filter(s => s !== site && !(C.sites[s] && canEdit(s)));
  const span = l => l.length ? `${esc(D.fmt(l[0].day, { year: "numeric" }))} → ${esc(D.fmt(l[l.length - 1].day, { year: "numeric" }))}` : "";
  $("#hp").innerHTML = `<div class="tw"><table class="t"><tr><th>Flagship</th><th>What</th><th class="n">Days</th><th>Dates</th><th></th></tr>
    <tr><td><b>${esc(C.sites[site])}</b></td><td>Gate details</td><td class="n">${rows.length}</td><td>${span(rows)}</td><td><input type="checkbox" id="h_main" checked style="width:auto"></td></tr>
    ${oth.map(([s, l]) => `<tr><td><b>${esc(C.sites[s])}</b></td><td>Day total only</td><td class="n">${l.length}</td><td>${span(l)}</td><td><input type="checkbox" data-oth="${s}" checked style="width:auto"></td></tr>`).join("")}</table></div>
    ${miss.length ? `<div class="ban bad" style="font-size:.82rem">Gates in the file not found in ${esc(C.sites[site])}'s settings (not imported): ${esc(miss.join(", "))}. Add or rename them in Settings → Gates, then choose the file again.</div>` : ""}
    ${skippedOther.length ? `<div class="muted" style="font-size:.8rem">Day totals for ${esc(skippedOther.join(", "))} are skipped (switched off in Footfall or not your flagship).</div>` : ""}
    ${p.notes.length ? `<div class="muted" style="font-size:.78rem">${esc(p.notes.join(" · "))}</div>` : ""}
    <div class="muted" style="font-size:.8rem">Days with all zeros are skipped (treated as missing).${C.revenue ? "" : " Revenue is OFF — amounts in the file are not kept."}</div>
    <button class="btn" id="hi">Import</button>`;
  $("#hi").onclick = async () => { const b = $("#hi"); b.disabled = true; let tot = 0, sk = 0;
    try {
      const send = async (s, list) => { for (let i = 0; i < list.length; i += 300){ const r = await api("ops/ff/import", { site: s, rows: list.slice(i, i + 300), overwrite: $("#ho").checked }); tot += r.imported; sk += r.skipped; } };
      if ($("#h_main").checked) await send(site, rows);
      for (const [s, l] of oth) if ($(`[data-oth="${s}"]`).checked) await send(s, l);
      CACHE = {}; MON = {}; $("#hp").innerHTML = `<div class="ban">✓ ${tot} days imported${sk ? ` · ${sk} skipped (already in the hub, empty, or today)` : ""}. Open the Monthly report to check.</div>`;
    } catch (e){ toast(e.message, true); b.disabled = false; }
  };
}

boot().catch(e => $("#view").innerHTML = `<div class="ban bad">${esc(e.message)}</div>`);
</script>
</body>
</html>
