<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Box · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
/* Key Box (Upcoming - Testing) — docs/FEATURE-keybox.md */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpis div{border-radius:14px;padding:10px 12px;color:#fff;font-size:.74rem;font-weight:600}
.kpis b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.k-in{background:#2E9E5B}.k-out{background:#D99A1E}.k-late{background:#E5484D}
.lvls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lvls button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text)}
.lvls button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* the cabinet */
.cab{border-radius:18px;background:linear-gradient(160deg,#5B6270,#3A3F49);padding:12px;box-shadow:inset 0 0 0 3px #2A2E36,0 12px 26px rgba(0,0,0,.25);max-width:980px}
.cab-h{text-align:center;color:#C8CDD6;font-size:.62rem;letter-spacing:.24em;font-weight:800;margin:2px 0 10px}
.hooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 8px;background:#2C3038;border-radius:10px;padding:14px 10px 10px}
.hk{display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.pin{width:9px;height:9px;border-radius:50%;background:#B9BEC8;box-shadow:0 1px 0 #000}
.tag{margin-top:2px;width:100%;max-width:92px;min-height:54px;border-radius:8px 8px 14px 14px;padding:11px 4px 6px;text-align:center;color:#fff;position:relative;transition:transform .15s}
.tag:before{content:"";position:absolute;top:4px;left:calc(50% - 3.5px);width:7px;height:7px;border-radius:50%;background:#2C3038}
.tag b{display:block;font-size:.78rem;letter-spacing:.02em}
.tag small{display:block;font-size:.62rem;opacity:.9;line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk:hover .tag{transform:rotate(-4deg)}
.in{background:#2E9E5B}.out{background:#E0A82E;color:#3A2900}.late{background:#E5484D;animation:kbPulse 1.6s ease-in-out infinite}
@keyframes kbPulse{50%{box-shadow:0 0 0 5px rgba(229,72,77,.35)}}
.lgd{display:flex;gap:14px;justify-content:center;font-size:.74rem;color:var(--muted);margin:10px 0 0}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* sheet */
dialog.kb{width:min(520px,calc(100% - 16px));max-height:92dvh;padding:0;border:0;border-radius:20px}
.kb .hd{padding:16px 18px 10px;border-bottom:1px solid var(--line)}.kb .hd b{font-size:1.05rem;display:block}.kb .hd small{color:var(--muted);font-size:.8rem}
.kb .bd{padding:12px 18px 16px;display:grid;gap:10px}
.kb .lb{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;line-height:1.2}
#form{display:grid;gap:10px}
.kbmsg{flex:1;font-size:.8rem;font-weight:700;color:#C2283C;align-self:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text)}
.chips button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand-2)}
.kb .inp{width:100%;height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sigw{position:relative;border:1.5px dashed var(--line);border-radius:12px;background:#fff;height:130px;touch-action:none}
.sigw canvas{width:100%;height:100%;display:block;border-radius:12px}
.sigw span{position:absolute;left:12px;bottom:8px;font-size:.7rem;color:#A39AB5;pointer-events:none}
.sigw button{position:absolute;right:8px;top:8px;border:0;background:#F1EAF8;color:#4A1F73;border-radius:7px;font:inherit;font-size:.7rem;font-weight:700;padding:3px 8px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:800;cursor:pointer}
.stepper b{min-width:70px;text-align:center}
.info{border-radius:12px;padding:10px 12px;font-size:.84rem;line-height:1.6;background:var(--paper)}
.info.late{background:rgba(229,72,77,.1);color:var(--text);animation:none}
.hist{font-size:.78rem;line-height:1.7;color:var(--muted)}.hist b{color:var(--text)}
.ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.empty{max-width:560px}
@media (max-width:560px){.hooks{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px 6px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>Key Box <small id="sub"></small></h1>
  <span id="siteBox"></span>
</div>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="lvls" id="lvls"></div>
  <div id="board"><p class="muted">Loading…</p></div>
</div>
<dialog id="sheet" class="kb"></dialog>

<script src="common.js"></script>
<script>
let CTX = null, KB = null, LVL = "All", F = null;
const when = iso => iso ? new Date(iso).toLocaleString("en-GB", { timeZone: "Asia/Beirut", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const short = iso => { const d = new Date(iso); const t = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Beirut" }).format(new Date());
  const day = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Beirut" }).format(d);
  return (day === t ? "" : d.toLocaleDateString("en-GB", { timeZone: "Asia/Beirut", day: "numeric", month: "short" }) + " ") + d.toLocaleTimeString("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", minute: "2-digit" }); };

async function boot(site){
  CTX = await api("ops/context" + (site ? "?site=" + site : ""));
  $("#siteBox").innerHTML = siteSelect(CTX, s => boot(s));
  await load();
}
async function load(){
  KB = await api(`ops/kb/board?site=${CTX.site}`);
  $("#sub").textContent = KB.siteName;
  render();
}
function render(){
  const H = KB.hooks, lv = ["All", ...new Set(H.map(h => h.level).filter(Boolean))];
  if (!lv.includes(LVL)) LVL = "All";
  $("#kpis").innerHTML = `<div class="k-in"><b>${KB.counts.in}</b>In the box</div><div class="k-out"><b>${KB.counts.out}</b>Out</div><div class="k-late"><b>${KB.counts.late}</b>Late</div>`;
  $("#lvls").innerHTML = lv.length > 2 ? lv.map(l => `<button data-l="${esc(l)}" class="${l === LVL ? "on" : ""}">${esc(l)}</button>`).join("") : "";
  $("#lvls").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { LVL = b.dataset.l; render(); });
  if (!H.length){ $("#board").innerHTML = `<div class="card empty" style="padding:22px">No vacant unit in <b>GLA &amp; Occupancy</b> for ${esc(KB.siteName)}. A unit marked Vacant (or Terminated) there gets a hook here automatically.</div>`; return; }
  const L = H.filter(h => LVL === "All" || h.level === LVL);
  $("#board").innerHTML = `<div class="cab"><div class="cab-h">ABC · ${esc(KB.siteName.toUpperCase())} · KEY CABINET</div><div class="hooks">${L.map((h, i) => {
      const sub = h.state === "in" ? `${h.keys} key${h.keys === 1 ? "" : "s"}` : h.state === "late" ? `late · ${esc(h.out.taker.split(" ")[0])}` : `${esc(h.out.taker.split(" ")[0])} · ${esc(short(h.out.dueAt))}`;
      return `<button class="hk" data-u="${esc(h.unit)}" title="${esc(h.unit)}${h.vacant ? "" : " (no longer vacant)"}"><i class="pin"></i><div class="tag ${h.state}"><b>${esc(h.unit)}</b><small>${sub}</small></div></button>`; }).join("")}</div></div>
    <div class="lgd"><span><i style="background:#2E9E5B"></i>In the box</span><span><i style="background:#E0A82E"></i>Out</span><span><i style="background:#E5484D"></i>Late</span></div>`;
  $("#board").querySelectorAll("[data-u]").forEach(b => b.onclick = () => openUnit(b.dataset.u));
}

/* ---------- the sheet ---------- */
const dlg = () => $("#sheet");
const say = (t, bad) => { const m = $("#kbMsg"); if (dlg().open && m){ m.style.color = bad ? "#C2283C" : "#2E8B57"; m.textContent = t; } else toast(t, bad); };
async function openUnit(u){
  const h = KB.hooks.find(x => x.unit === u); if (!h) return;
  F = null;
  const d = dlg();
  const head = `<div class="hd"><b>🔑 ${esc(h.unit)}${h.vacant ? " · vacant" : ""}</b><small>${esc(h.level)}${h.area ? ` · ${Math.round(h.area)} m²` : ""} · ${h.keys} key${h.keys === 1 ? "" : "s"}${h.note ? " · " + esc(h.note) : ""}</small></div>`;
  let body = "", foot = "";
  if (h.out){
    const o = h.out, mine = o.takerEmail && o.takerEmail === KB.me.email;
    body = `<div class="info ${h.state === "late" ? "late" : ""}">${h.state === "late" ? "<b style='color:#C2283C'>LATE</b> · " : ""}With <b>${esc(o.taker)}</b> (${esc(o.kindLabel)}${o.company ? " · " + esc(o.company) : ""})${o.phone ? ` · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ""}<br>
        ${esc(o.purpose)} · ${o.keys} key${o.keys === 1 ? "" : "s"} · out ${esc(when(o.outAt))}<br>Back by <b>${esc(when(o.dueAt))}</b> · handed over by ${esc(o.givenBy)}${o.notes ? `<br>${esc(o.notes)}` : ""}</div>
      ${KB.staff && (o.signed || o.photo) ? `<div class="chips">${o.signed ? `<button data-see="sig" data-id="${o.id}">✍️ Signature</button>` : ""}${o.photo ? `<button data-see="id" data-id="${o.id}">🪪 ID photo</button>` : ""}</div><div id="seeBox"></div>` : ""}`;
    foot = KB.staff || mine ? `<button class="btn ghost" data-x>Close</button><button class="btn" id="kbIn">✓ Key returned</button>` : `<button class="btn ghost" data-x>Close</button>`;
  } else {
    body = KB.staff ? `<div class="chips"><button class="on" data-mode="give">Hand over to someone</button><button data-mode="self">Take it myself</button></div><div id="form"></div>`
      : `<div id="form"></div>`;
    foot = `<button class="btn ghost" data-x>Cancel</button><button class="btn" id="kbOut">Hand over key</button>`;
  }
  d.innerHTML = `${head}<div class="bd">${body}<div class="lb" style="margin-top:6px">History</div><div class="hist" id="hist">Loading…</div>
    ${KB.staff && !h.out ? `<div class="stepper" style="margin-top:4px"><span class="muted" style="font-size:.78rem">Keys of this unit</span><button data-k="-1">−</button><b id="kN">${h.keys}</b><button data-k="1">＋</button></div>` : ""}</div><div class="ft"><span class="kbmsg" id="kbMsg"></span>${foot}</div>`;
  d.querySelectorAll("[data-x]").forEach(b => b.onclick = () => d.close());
  if (!h.out){ F = { unit: h.unit, max: h.keys, mode: KB.staff ? "give" : "self", takerKind: "tenant", purpose: "Viewing", due: "", keys: 1 }; drawForm(); }
  d.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { d.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("on", x === b)); F.mode = b.dataset.mode; drawForm(); });
  d.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
    const n = Math.max(1, Math.min(20, h.keys + +b.dataset.k)); if (n === h.keys) return;
    try { await api("ops/kb/keys", { site: CTX.site, unit: h.unit, keys: n, note: h.note }); h.keys = n; $("#kN").textContent = n; if (F){ F.max = n; drawForm(); } render(); } catch (e){ toast(e.message, true); } });
  d.querySelectorAll("[data-see]").forEach(b => b.onclick = async () => {
    try { const r = await api(`ops/kb/photo?site=${CTX.site}&id=${b.dataset.id}&kind=${b.dataset.see}`); $("#seeBox").innerHTML = r.data ? `<img src="${r.data}" alt="" style="max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px">` : ""; } catch (e){ toast(e.message, true); } });
  const ib = $("#kbIn"); if (ib) ib.onclick = async () => { ib.disabled = true;
    try { const r = await api("ops/kb/in", { site: CTX.site, id: h.out.id }); toast(r.late ? "Key back (it was late)" : "Key back in the box"); d.close(); load(); } catch (e){ ib.disabled = false; say(e.message, true); } };
  const ob = $("#kbOut"); if (ob) ob.onclick = () => handOver(ob);
  d.showModal();
  api(`ops/kb/history?site=${CTX.site}&unit=${encodeURIComponent(h.unit)}`).then(r => {
    $("#hist").innerHTML = r.list.length ? r.list.slice(0, 8).map(m => `<div><b>${esc(new Date(m.outAt).toLocaleDateString("en-GB", { timeZone: "Asia/Beirut", day: "numeric", month: "short" }))}</b> · ${esc(m.taker)}${m.company ? " (" + esc(m.company) + ")" : ""} · ${esc(m.purpose)} · ${m.backAt ? (m.backAt > m.dueAt ? "<span style='color:#C2283C'>returned late</span>" : "returned ✓") : m.late ? "<span style='color:#C2283C'>late</span>" : "out"}</div>`).join("") : "No movement yet.";
  }).catch(() => { $("#hist").textContent = ""; });
}
function dueChoices(){
  const now = new Date(), t = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Beirut" }).format(now);
  const at = (day, hm) => new Date(`${day}T${hm}:00+03:00`);   // Beirut (UTC+3)
  const tomorrow = new Date(Date.parse(t + "T12:00:00Z") + 864e5).toISOString().slice(0, 10);
  const L = [["1 hour", new Date(now.getTime() + 36e5)], ["2 hours", new Date(now.getTime() + 72e5)]];
  if (at(t, "18:00") > now) L.push(["Today 18:00", at(t, "18:00")]);
  L.push(["Tomorrow 12:00", at(tomorrow, "12:00")]);
  return L;
}
function drawForm(){
  const f = $("#form"); if (!f || !F) return;
  const C = dueChoices();
  if (!F.due) F.due = C[0][1].toISOString();
  const self = F.mode === "self", needSig = !self && ["tenant", "contractor", "other"].includes(F.takerKind);
  f.innerHTML = `${self ? `<div class="info">You take the key yourself (<b>${esc(KB.me.name)}</b>). Return it here when you are done.</div>`
    : `<div class="lb">Who takes it</div><div class="chips">${[["tenant", "Tenant"], ["contractor", "Contractor"], ["leasing", "Leasing"], ["staff", "Hub staff"], ["other", "Other"]].map(([k, n]) => `<button data-tk="${k}" class="${F.takerKind === k ? "on" : ""}">${n}</button>`).join("")}</div>
      <input class="inp" id="fN" placeholder="Full name" value="${esc(F.taker || "")}">
      <div class="two"><input class="inp" id="fC" placeholder="${F.takerKind === "tenant" ? "Brand / tenant" : "Company"}" value="${esc(F.company || "")}"><input class="inp" id="fP" inputmode="tel" placeholder="Mobile" value="${esc(F.phone || "")}"></div>`}
    <div class="lb">Why</div><div class="chips">${KB.purposes.map(p => `<button data-pu="${esc(p)}" class="${F.purpose === p ? "on" : ""}">${esc(p)}</button>`).join("")}</div>
    <div class="lb">Back by</div><div class="chips">${C.map(([n, d]) => `<button data-du="${d.toISOString()}" class="${Math.abs(Date.parse(F.due) - d) < 6e4 ? "on" : ""}">${n}</button>`).join("")}
      <input type="datetime-local" class="inp" id="fD" style="width:auto;height:34px" value=""></div>
    <div class="lb">Keys</div><div class="stepper"><button data-fk="-1">−</button><b>${F.keys} of ${F.max}</b><button data-fk="1">＋</button></div>
    ${self ? "" : `<div class="lb">Photo of ID ${needSig ? "(optional)" : "(optional)"}</div><div class="chips"><label class="btn ghost small" style="cursor:pointer">🪪 ${F.idPhoto ? "Photo added ✓" : "Add photo"}<input type="file" accept="image/*" capture="environment" id="fId" hidden></label></div>
      <div class="lb">Signature ${needSig ? "" : "(optional)"}</div><div class="sigw"><canvas id="sig"></canvas><span>Sign here</span><button id="sigClr">Clear</button></div>`}
    <input class="inp" id="fNo" placeholder="Notes (optional)" value="${esc(F.notes || "")}">`;
  const keep = () => { ["fN:taker", "fC:company", "fP:phone", "fNo:notes"].forEach(x => { const [id, k] = x.split(":"); const el = $("#" + id); if (el) F[k] = el.value; }); };
  f.querySelectorAll("[data-tk]").forEach(b => b.onclick = () => { keep(); F.takerKind = b.dataset.tk; drawForm(); });
  f.querySelectorAll("[data-pu]").forEach(b => b.onclick = () => { keep(); F.purpose = b.dataset.pu; drawForm(); });
  f.querySelectorAll("[data-du]").forEach(b => b.onclick = () => { keep(); F.due = b.dataset.du; drawForm(); });
  $("#fD").onchange = e => { if (e.target.value){ keep(); F.due = new Date(e.target.value + ":00+03:00").toISOString(); drawForm(); } };
  f.querySelectorAll("[data-fk]").forEach(b => b.onclick = () => { keep(); F.keys = Math.max(1, Math.min(F.max, F.keys + +b.dataset.fk)); drawForm(); });
  const idf = $("#fId"); if (idf) idf.onchange = async () => { const file = idf.files[0]; if (!file) return; keep(); F.idPhoto = await shrink(file, 1000, .8); drawForm(); };
  const cv = $("#sig"); if (cv) sigPad(cv);
}
/* signature pad: keeps the drawing in F.sig while the form is redrawn */
function sigPad(cv){
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const c = cv.getContext("2d"); c.scale(dpr, dpr); c.lineWidth = 2.2; c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = "#1B1230";
  if (F.sigImg){ const im = new Image(); im.onload = () => c.drawImage(im, 0, 0, r.width, r.height); im.src = F.sigImg; }
  let on = false, last = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { on = true; last = pt(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!on) return; const p = pt(e); c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke(); last = p; F.signed = true; };
  cv.onpointerup = cv.onpointercancel = () => { if (on && F.signed){ F.sigImg = cv.toDataURL("image/png"); } on = false; };
  $("#sigClr").onclick = e => { e.preventDefault(); c.clearRect(0, 0, cv.width, cv.height); F.signed = false; F.sigImg = ""; };
}
async function shrink(file, max, q){
  const url = URL.createObjectURL(file); const im = new Image(); await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = url; });
  const s = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
  cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url); return cv.toDataURL("image/jpeg", q);
}
async function handOver(btn){
  ["fN:taker", "fC:company", "fP:phone", "fNo:notes"].forEach(x => { const [id, k] = x.split(":"); const el = $("#" + id); if (el) F[k] = el.value; });
  const self = F.mode === "self";
  if (!self && !String(F.taker || "").trim()) return say("Write who takes the key", true);
  if (!self && ["tenant", "contractor", "other"].includes(F.takerKind) && !F.sigImg) return say("The person taking the key signs first", true);
  btn.disabled = true;
  try {
    await api("ops/kb/out", { site: CTX.site, unit: F.unit, kind: self ? "self" : "give", takerKind: self ? "leasing" : F.takerKind, taker: F.taker, company: F.company, phone: F.phone,
      purpose: F.purpose, dueAt: F.due, keys: F.keys, notes: F.notes, signature: F.sigImg || "", idPhoto: F.idPhoto || "" });
    toast(`Key ${F.unit} handed over`); dlg().close(); load();
  } catch (e){ btn.disabled = false; say(e.message, true); }
}
window.hubRefresh = () => { if (!dlg().open) load(); };
boot().catch(e => { $("#board").innerHTML = `<p class="muted">${esc(e.message)}</p>`; });
</script>
</body>
</html>
