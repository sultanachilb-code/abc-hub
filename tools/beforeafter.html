<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Before / After · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Before / After (docs/FEATURE-before-after.md) — everything stays on this device: nothing is sent to the hub.
     • Camera: the before photo stays on the screen as a faint "ghost" so the after photo is taken from the same angle.
       Photos go to the phone's gallery (share sheet on iPhone → Save Image; download on Android / computer).
     • Deck: pairs of photos → a PowerPoint file in ABC colours (PptxGenJS, hosted in tools/pptx). Drafts are kept on this device (IndexedDB). -->
<style>
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{padding:7px 14px;border-radius:9px;font-weight:800;font-size:.84rem;color:var(--muted)}.tabs button.on{background:var(--brand);color:#fff}
.pw{max-width:1100px;margin:0 auto;padding:14px 14px 80px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .inp,.row .sel{flex:1;min-width:140px}
.bpick{display:flex;align-items:center;gap:10px;padding:8px;border:1px dashed var(--line);border-radius:14px}
.bpick img{width:64px;height:64px;object-fit:cover;border-radius:10px}.bpick div{flex:1;min-width:0}.bpick b{display:block;font-size:.9rem}.bpick small{color:var(--muted);font-size:.76rem}
.bph{flex:none!important;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:900;color:var(--brand)}
.view video{transform-origin:50% 50%;transition:transform .08s}
.zbadge{position:absolute;right:12px;top:12px;padding:5px 10px;border-radius:99px;font-weight:900;font-size:.74rem;color:#2A1146;background:#E9CF8A}
.bar .zq{display:inline-flex;gap:4px}.bar .zq button{font-size:.7rem;font-weight:800;color:#fff;background:rgba(255,255,255,.16);border-radius:8px;padding:4px 7px}.bar .zq button.on{background:#E9CF8A;color:#2A1146}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{padding:9px 16px;font-weight:800;font-size:.86rem}
.seg button.on{background:var(--brand);color:#fff}.seg button[data-m="after"].on{background:#2E8B57}
.lbl{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 2px 4px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.84rem;font-weight:600}
/* viewer */
.view{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#0d0a12;touch-action:none}
@media (min-width:900px){.view{aspect-ratio:4/3;max-width:820px}}
.view video,.view .gh,.view .shotimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.view .gh{pointer-events:none;opacity:.28}.view .gh.edges{opacity:.85;mix-blend-mode:screen}
.view .grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:33.333% 33.333%}
.view .tag{position:absolute;left:12px;top:12px;padding:5px 11px;border-radius:99px;font-weight:900;font-size:.74rem;letter-spacing:.08em;color:#fff;background:#C0392B}
.view .tag.after{background:#2E8B57}
.view .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;gap:12px;align-content:center}
.view .msg p{color:#cfc6dc;font-size:.88rem;line-height:1.5;max-width:340px}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.72));display:grid;gap:10px;color:#fff}
.bar .sl{display:flex;align-items:center;gap:10px;font-size:.74rem;font-weight:700}.bar input[type=range]{flex:1;accent-color:#E9CF8A}
.bar .ctr{display:flex;align-items:center;justify-content:space-between}
.bar .ctr button.s{font-size:.74rem;font-weight:800;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;min-width:64px}.bar .ctr button.s.on{background:#E9CF8A;color:#2A1146}
.shutter{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)}.shutter:active{transform:scale(.94)}
/* befores */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip button{flex:none;width:86px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--paper);text-align:left}
.strip button.on{border-color:#2E8B57}.strip img{width:100%;height:64px;object-fit:cover;display:block}.strip small{display:block;font-size:.62rem;padding:3px 5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .pick{display:grid;place-items:center;height:86px;font-size:.72rem;font-weight:800;color:var(--brand);border:2px dashed var(--line)}
/* result sheet */
.res{display:grid;gap:10px}.res .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.res .imgs img{width:100%;border-radius:12px;display:block}
.res .imgs.one{grid-template-columns:1fr}
.note{font-size:.8rem;color:var(--muted);line-height:1.5}
/* deck */
.slides{display:grid;gap:10px}
.sl-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sl-th{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:150px}.sl-th img,.sl-th div{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--paper)}
.sl-f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sl-f .inp{height:34px;font-size:.84rem;width:100%}.sl-f .w{grid-column:1/-1}
.sl-b{display:grid;gap:4px}.sl-b button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);font-weight:800}
.prev{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;grid-template-rows:14% 1fr 9%;max-width:520px}
.prev .h{background:#2A1146;color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:800;font-size:.78rem}.prev .h img{height:62%}
.prev .h small{margin-left:auto;color:#E9CF8A;font-weight:600;font-size:.62rem}
.prev .b{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px}.prev .b div{position:relative;border-radius:5px;overflow:hidden;background:#eee}.prev .b img{width:100%;height:100%;object-fit:contain;background:#f3f1f6}
.prev .b em{position:absolute;left:5px;top:5px;font-style:normal;font-size:.5rem;font-weight:900;color:#fff;background:#C0392B;border-radius:99px;padding:2px 6px}.prev .b div+div em{background:#2E8B57}
.prev .f{font-size:.55rem;color:#6d6479;padding:0 10px;display:flex;align-items:center}
dialog .pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:50vh;overflow:auto}
dialog .pairs button{border:2px solid var(--line);border-radius:12px;overflow:hidden;text-align:left}.pairs button.on{border-color:var(--brand)}
dialog .pairs .th{display:grid;grid-template-columns:1fr 1fr}.pairs img{width:100%;height:60px;object-fit:cover}.pairs small{display:block;font-size:.66rem;padding:4px 6px;color:var(--muted)}
@media (max-width:640px){.sl-card{grid-template-columns:1fr}.sl-th{width:100%}.sl-b{grid-auto-flow:column;justify-content:start}}

/* v2 camera: before list + full-screen camera */
.addb{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border:2px dashed #C9B8DD;border-radius:16px;font-weight:800;color:var(--brand);cursor:pointer;background:var(--surface)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bc .im{height:128px;background-size:cover;background-position:center;position:relative}.bc .im small{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:2px 6px}
.bc .t{padding:8px 10px 10px;display:grid;gap:2px}.bc .t b{font-size:.86rem}.bc .t span{font-size:.72rem;color:var(--muted)}
.bc .bb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.bc .bb .btn{font-size:.74rem;padding-left:8px;padding-right:8px}.bc .bb .btn{flex:1;justify-content:center}.bc .bb .ghost[data-del]{flex:none}
.noscroll,.noscroll body{overflow:hidden;height:100%}
.fcam{position:fixed;inset:0;z-index:9999;background:#000;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.fv{position:absolute;overflow:hidden;background:#111}
.fv video,.fv .gh{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fv video{transform-origin:50% 50%}
.fv .gh{pointer-events:none;transition:opacity .12s}.fv .gh.edges{mix-blend-mode:screen}
.fv .grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);background-size:33.333% 33.333%}
.fv.aligned{box-shadow:inset 0 0 0 4px #34C759}.fv.flash::after{content:"";position:absolute;inset:0;background:#fff;opacity:.7}
.fv .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-weight:600;line-height:1.5}
.ftop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;gap:8px;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.fp{background:rgba(0,0,0,.5);border-radius:99px;padding:7px 12px;font-size:.8rem;font-weight:800;color:#fff;white-space:nowrap}.fp.pl{max-width:42%;overflow:hidden;text-overflow:ellipsis}
.fp.ok{background:#34C759;color:#03250f}.fp.mid{background:#FFD60A;color:#2a2200}.fp.low{background:rgba(255,69,58,.85)}
.fside{position:absolute;right:10px;top:34%;display:grid;gap:10px}.fs{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:.68rem;font-weight:800}.fs.on{background:#FFD60A;color:#2a2200}
.fhint{position:absolute;left:12px;right:68px;top:calc(env(safe-area-inset-top,0px) + 58px);font-size:.8rem;font-weight:800;text-shadow:0 1px 3px #000}.fhint.ok{color:#34C759}
.fzoom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);display:flex;justify-content:center;gap:8px}
.fzoom button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.74rem;font-weight:800}.fzoom button.on{color:#FFD60A;width:44px;height:44px}
.fgh{position:absolute;left:40px;right:40px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:flex;gap:8px;align-items:center;font-size:.72rem;font-weight:700}.fgh input{flex:1;accent-color:#FFD60A}
.fbot{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 112px);padding:0 28px env(safe-area-inset-bottom,0px);background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:space-between}
.fthumb{width:54px;height:54px;border-radius:10px;border:2px solid #fff;background-size:cover;background-position:center}
.fshut{width:78px;height:78px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;background:none}.fshut i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .1s}.fshut:active i{transform:scale(.9)}
.fios{width:58px;height:54px;border-radius:12px;background:rgba(255,255,255,.16);font-size:.62rem;font-weight:800;display:grid;place-items:center;text-align:center;line-height:1.2;cursor:pointer}
.fres{position:absolute;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 62px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:12px;align-content:start;justify-items:center}
.fres .ftop{position:fixed}
.cmp{position:relative;width:min(100%,560px);border-radius:16px;overflow:hidden;background:#111;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cmp .cb{position:absolute;inset:0;width:50%;overflow:hidden}.cmp .cb img{width:min(100vw - 28px,560px);max-width:none;height:100%}
.cmp i{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 6px #000}
.cmp em{position:absolute;top:10px;font-style:normal;font-size:.66rem;font-weight:900;border-radius:99px;padding:3px 9px}.cmp em.b{left:10px;background:#C0392B}.cmp em.a{right:10px;background:#2E8B57}
.fnote{font-size:.78rem;color:#cfc6dc;text-align:center;max-width:520px;line-height:1.45}
.fact{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
</style>
</head>
<body>
<div class="top"><h1>Before / After <small>on this device</small></h1><div class="tabs" id="tabs"><button data-t="cam" class="on">📷 Camera</button><button data-t="deck">🖼 Deck</button></div></div>
<div class="pw" id="app"><div class="empty">Loading…</div></div>
<dialog id="dlg"></dialog>
<script src="common.js"></script>
<script>
/* ---------------- local storage (IndexedDB): photos, pairs and decks never leave this device ---------------- */
const DBN = "abc-beforeafter";
const idb = () => new Promise((res, rej) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => { const d = r.result; for (const s of ["shots", "pairs", "decks"]) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: "id" }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const tx = async (store, mode, fn) => { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction(store, mode), s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); };
const put = (store, v) => tx(store, "readwrite", s => s.put(v));
const del = (store, id) => tx(store, "readwrite", s => s.delete(id));
const get = (store, id) => tx(store, "readonly", s => s.get(id));
const all = store => tx(store, "readonly", s => s.getAll());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let CTX = null, TAB = "cam";
const S = { zoom: 1, zMin: 1, zMax: 4, native: false, site: "", place: "", framed: (() => { try { return localStorage.getItem("ba.framed") !== "0"; } catch { return true; } })(), shotZoom: 1, stamp: true, hq: (() => { try { return localStorage.getItem("ba.hq") !== "0"; } catch { return true; } })(), wb: true, grid: true, edges: false, ghostOp: 28, facing: "environment", stream: null, before: null, shot: null };
const fmtD = iso => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const fmtDT = iso => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const slug = t => String(t || "").trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 40) || "area";
const stamp = d => { const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`; };   // the phone's own time
const blobToImg = b => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(b); });
/* iPhone photos are Display P3 (wide colour). Drawing them on a normal (sRGB) canvas clips the colours, so every canvas here is P3 when the browser allows it. */
const CS = (() => { try { const x = document.createElement("canvas").getContext("2d", { colorSpace: "display-p3" }); return x && x.getContextAttributes && x.getContextAttributes().colorSpace === "display-p3" ? { colorSpace: "display-p3" } : {}; } catch { return {}; } })();
const toBlob = (c, q = .9) => new Promise(r => c.toBlob(r, "image/jpeg", q));
const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function shrink(src, max, q = .82){   // canvas / image / blob → smaller jpeg blob
  const img = src instanceof Blob ? await blobToImg(src) : src, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext("2d", CS).drawImage(img, 0, 0, c.width, c.height); return toBlob(c, q);
}
const touch = matchMedia("(pointer:coarse)").matches;
/* to the phone's gallery: the share sheet on phones (iPhone: "Save Image"), a download on a computer */
async function saveFiles(files){
  if (touch && navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files, title: "ABC Before / After" }); return true; } catch (e){ if (e.name === "AbortError") return false; } }
  for (const f of files){ const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  return true;
}

async function boot(){
  CTX = await api("ops/context");
  S.site = CTX.site;
  $("#tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; TAB = b.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); if (TAB !== "cam") stopCam(); render(); };
  if (new URLSearchParams(location.search).get("t") === "deck") $("#tabs [data-t=deck]").click(); else render();
}
const render = () => TAB === "cam" ? camView() : deckView();

/* ================= CAMERA (Oct 2026 v2) — docs/FEATURE-before-after.md
   • "Before photos" list: every before photo waiting for its after has a "📷 Take after" button; finished pairs below.
   • Full-screen ghost camera like the iPhone camera: the frame has the before photo's exact shape, the before photo is a faint ghost,
     a live "Match %" (and which way to move) tells when the after sits on the same spot, hold the eye button to peek at the before.
   • The after photo: the highest resolution the phone gives the browser, JPEG quality 95 %, no filters — saved to Photos (share sheet → Save Image).
   • "iPhone Camera": the phone's own camera app (full quality, Apple's processing) — no ghost, but the after is fine-aligned onto the before automatically.
   • The side-by-side picture uses the after aligned onto the before (shift / zoom found automatically), so both look taken from the same tripod.
   Nothing is sent to the hub: photos are kept on this device (IndexedDB) for the list and the deck. ================= */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
async function fitBlob(src, max, q = .9){ return shrink(src, max, q); }
/* the before photo exactly as it is in Photos (no re-compression); very large or non-JPEG/PNG files are converted once at high quality */
async function keepOriginal(f){ return /^image\/(jpeg|png)$/.test(f.type) && f.size <= 15e6 ? f : shrink(f, 4800, .95); }
async function camView(){
  const shots = await all("shots"), pairs = (await all("pairs")).sort((a, b) => (b.afterAt || "").localeCompare(a.afterAt || ""));
  const paired = new Set(pairs.map(p => p.beforeId)), byId = new Map(shots.map(s2 => [s2.id, s2]));
  const waiting = shots.filter(s2 => s2.kind === "before" && !paired.has(s2.id)).sort((a, b) => b.at.localeCompare(a.at));
  const done = pairs.filter(p => byId.has(p.beforeId) && byId.has(p.afterId)).slice(0, 30);
  const card = (img, tag, title, sub, btn, cls = "", data = "") => `<div class="bc ${cls}" ${data}><div class="im" style="background-image:url(${img})"><small>${tag}</small></div><div class="t"><b>${esc(title)}</b><span>${esc(sub)}</span>${btn}</div></div>`;
  $("#app").innerHTML = `
    <div class="card" style="display:grid;gap:10px">
      <div class="row"><select class="sel" id="site">${Object.entries(CTX.sites).map(([c, n]) => `<option value="${c}" ${c === S.site ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
        <input class="inp" id="place" placeholder="Area, e.g. L2 corridor near Zara" value="${esc(S.place)}"></div>
      <label class="addb">＋ Add before photos from Photos<input type="file" accept="image/*" id="pickB" multiple hidden></label>
      <label class="chk"><input type="checkbox" id="hq" ${S.hq ? "checked" : ""}> ${isIOS ? "Best quality: the shutter opens the iPhone camera (line up with the ghost first)" : "Best quality: take a full-resolution photo"}</label>
      <label class="chk"><input type="checkbox" id="stamp" ${S.stamp ? "checked" : ""}> Print date, time and place on the side-by-side</label>
    </div>
    <div class="lbl" style="margin-top:4px">Waiting for the after photo · ${waiting.length}</div>
    <div class="bgrid">${waiting.map(s2 => card(s2.thumb, `BEFORE · ${fmtD(s2.at)}`, s2.place || "Area", CTX.sites[s2.site] || "",
        `<div class="bb"><button class="btn small" data-take="${s2.id}">📷 Take after</button><button class="btn small ghost" data-del="${s2.id}" title="Remove from this list">✕</button></div>`)).join("")
      || `<div class="card empty" style="grid-column:1/-1">Add the before photos of the job from Photos — then tap “Take after” when the work is finished.</div>`}</div>
    ${done.length ? `<div class="lbl" style="margin-top:8px">Done · ${done.length}</div><div class="bgrid">${done.map(p => card(byId.get(p.afterId).thumb, `PAIR · ${fmtD(p.afterAt)}`, p.place || "Area", CTX.sites[p.site] || "",
        `<div class="bb"><button class="btn small ghost" data-open="${p.id}">Side by side</button><button class="btn small ghost" data-deck="${p.id}">+ Deck</button></div>`, "done")).join("")}</div>` : ""}
    <p class="note" style="text-align:center">Photos are saved to your Photos and kept on this device only (latest 60). Nothing is sent to the hub.${isIOS ? " Open the hub from its home-screen icon for a full-screen camera." : ""}</p>`;
  $("#site").onchange = e => S.site = e.target.value;

    <div class="dlg-b" style="display:grid;gap:10px"><div class="pairs">${ok.map(p => `<button data-p="${p.id}" class="${used.has(p.afterId) ? "" : ""}" ${used.has(p.afterId) ? "disabled style=opacity:.4" : ""}><div class="th"><img src="${shots.get(p.beforeId).thumb}" alt=""><img src="${shots.get(p.afterId).thumb}" alt=""></div><small>${esc(p.place || "—")} · ${esc(fmtD(p.afterAt))}</small></button>`).join("") || `<p class="note">No pairs taken on this device yet.</p>`}</div>
      <div><div class="lbl">Or from the gallery</div><div class="row"><label class="btn ghost small">Before photo<input type="file" accept="image/*" id="gB" hidden></label><label class="btn ghost small">After photo<input type="file" accept="image/*" id="gA" hidden></label><span class="note" id="gN"></span></div></div></div>
    <div class="dlg-f"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="pOk">Add</button></div>`;
  const pick = { b: null, a: null };
  $("#gB").onchange = e => { pick.b = e.target.files[0]; $("#gN").textContent = `${pick.b ? "before ✓" : ""} ${pick.a ? "after ✓" : ""}`; };
  $("#gA").onchange = e => { pick.a = e.target.files[0]; $("#gN").textContent = `${pick.b ? "before ✓" : ""} ${pick.a ? "after ✓" : ""}`; };
  d.onclick = async e => {
    if (e.target === d || e.target.closest("[data-x]")) return d.close();
    const b = e.target.closest("[data-p]"); if (b && !b.disabled) b.classList.toggle("on");
    if (e.target.id === "pOk"){
      for (const el of d.querySelectorAll("[data-p].on")) DECK.slides.push(slideOf(ok.find(p => p.id === el.dataset.p)));
      if (pick.b && pick.a){ const mk = async (f, kind) => { const blob = await shrink(f, 1600, .84), id = uid(); await put("shots", { id, kind, site: DECK.site, place: "", at: new Date(f.lastModified || Date.now()).toISOString(), blob, thumb: await blobToData(await shrink(blob, 240, .7)) }); return id; };
        const bId = await mk(pick.b, "before"), aId = await mk(pick.a, "after");
        DECK.slides.push({ id: uid(), beforeId: bId, afterId: aId, title: "Area", place: CTX.sites[DECK.site] || "", beforeDate: new Date(pick.b.lastModified || Date.now()).toISOString().slice(0, 10), afterDate: new Date(pick.a.lastModified || Date.now()).toISOString().slice(0, 10), notes: "" }); }
      else if (pick.b || pick.a) return toast("Choose both the before and the after photo", true);
      DECK.at = new Date().toISOString(); await put("decks", DECK); d.close(); deckView();
    }
  };
  d.showModal();
}
/* ---------- the PowerPoint file (16:9, ABC purple) ---------- */
let pptxLib = null;
const loadPptx = () => pptxLib || (pptxLib = new Promise((res, rej) => { const s2 = document.createElement("script"); s2.src = "pptx/pptxgen.bundle.js"; s2.onload = () => res(window.PptxGenJS); s2.onerror = () => rej(new Error("Could not load the PowerPoint maker")); document.head.append(s2); }));
async function imgInfo(id){ const r = await get("shots", id); if (!r || !r.blob) return null; const img = await blobToImg(r.blob);
  const blob = Math.max(img.naturalWidth, img.naturalHeight) > 2000 || r.blob.size > 1.5e6 ? await shrink(img, 2000, .88) : r.blob, im2 = blob === r.blob ? img : await blobToImg(blob);
  return { data: (await blobToData(blob)).replace(/^data:/, ""), w: im2.naturalWidth, h: im2.naturalHeight }; }
const fitIn = (im, bx, by, bw, bh) => { const k = Math.min(bw / im.w, bh / im.h), w = im.w * k, h = im.h * k; return { x: bx + (bw - w) / 2, y: by + (bh - h) / 2, w, h }; };
async function makePptx(){
  const btn = $("#dl"); btn.disabled = true; btn.textContent = "Making the PowerPoint…";
  try {
    const PG = await loadPptx(), p = new PG(); p.layout = "LAYOUT_WIDE"; p.author = DECK.by; p.company = "ABC"; p.title = DECK.title;
    const logo = (await blobToData(await (await fetch("/icons/abc-logo-white.png")).blob())).replace(/^data:/, "");
    const P = "2A1146", G = "E9CF8A", site = CTX.sites[DECK.site] || "", dt = DECK.date ? fmtD(DECK.date + "T12:00:00") : "", F = "Calibri";
    let c = p.addSlide(); c.background = { color: P };
    c.addShape(p.ShapeType.rect, { x: 0, y: 6.9, w: 13.333, h: .6, fill: { color: "4A1F73" } });
    c.addImage({ data: logo, x: .7, y: .7, w: 1.4, h: 1.36 });
    c.addText(DECK.title, { x: .7, y: 2.5, w: 11.9, h: 1.3, fontFace: F, fontSize: 40, bold: true, color: "FFFFFF" });
    c.addText(`${site}${dt ? "  ·  " + dt : ""}`, { x: .7, y: 3.75, w: 11.9, h: .6, fontFace: F, fontSize: 20, color: G });
    c.addText(`${DECK.slides.length} area${DECK.slides.length === 1 ? "" : "s"} · Before / After${DECK.by ? "   ·   Prepared by " + DECK.by : ""}`, { x: .7, y: 4.45, w: 11.9, h: .5, fontFace: F, fontSize: 14, color: "D9CFE6" });
    c.addText("ABC Operations", { x: .7, y: 6.95, w: 6, h: .5, fontFace: F, fontSize: 12, color: G, bold: true });
    let n = 1;
    const head = (s, t, sub) => { s.background = { color: "FFFFFF" }; s.addShape(p.ShapeType.rect, { x: 0, y: 0, w: 13.333, h: .95, fill: { color: P } });
      s.addImage({ data: logo, x: .3, y: .14, w: .7, h: .68 }); s.addText(t, { x: 1.15, y: .12, w: 7.8, h: .72, fontFace: F, fontSize: 22, bold: true, color: "FFFFFF", valign: "middle" });
      s.addText(sub, { x: 8.9, y: .12, w: 4.15, h: .72, fontFace: F, fontSize: 13, color: G, align: "right", valign: "middle" }); };
    const label = (s, t, col, x, y) => s.addText(t, { x, y, w: 2.6, h: .38, fontFace: F, fontSize: 11, bold: true, color: "FFFFFF", fill: { color: col }, align: "center", valign: "middle", rectRadius: .19, shape: p.ShapeType.roundRect });
    const foot = (s, notes) => { s.addText(notes || "", { x: .35, y: 6.85, w: 10.6, h: .5, fontFace: F, fontSize: 12, color: "4A4458", valign: "middle" });
      s.addText(`ABC Operations · ${++n}`, { x: 10.9, y: 6.85, w: 2.1, h: .5, fontFace: F, fontSize: 10, color: "8A8494", align: "right", valign: "middle" }); };
    for (const s2 of DECK.slides){
      const b = await imgInfo(s2.beforeId), a = await imgInfo(s2.afterId); if (!b || !a) continue;
      const bd = s2.beforeDate ? fmtD(s2.beforeDate + "T12:00:00") : "", ad = s2.afterDate ? fmtD(s2.afterDate + "T12:00:00") : "";
      if (DECK.layout === "big"){
        for (const [im, t, col, d2] of [[b, "BEFORE", "C0392B", bd], [a, "AFTER", "2E8B57", ad]]){
          const s = p.addSlide(); head(s, s2.title, s2.place); const r = fitIn(im, .35, 1.15, 12.63, 5.55);
          s.addImage({ data: im.data, ...r }); label(s, `${t}${d2 ? " · " + d2 : ""}`, col, r.x + .15, r.y + .15); foot(s, s2.notes);
        }
      } else {
        const s = p.addSlide(); head(s, s2.title, s2.place);
        const rb = fitIn(b, .35, 1.15, 6.2, 5.55), ra = fitIn(a, 6.78, 1.15, 6.2, 5.55);
        s.addImage({ data: b.data, ...rb }); s.addImage({ data: a.data, ...ra });
        label(s, `BEFORE${bd ? " · " + bd : ""}`, "C0392B", rb.x + .15, rb.y + .15); label(s, `AFTER${ad ? " · " + ad : ""}`, "2E8B57", ra.x + .15, ra.y + .15);
        foot(s, s2.notes);
      }
    }
    if (DECK.closing){ const s = p.addSlide(); s.background = { color: P };
      s.addImage({ data: logo, x: 5.97, y: 1.3, w: 1.4, h: 1.36 });
      s.addText("Thank you", { x: .7, y: 3.0, w: 11.93, h: 1.1, fontFace: F, fontSize: 40, bold: true, color: "FFFFFF", align: "center" });
      s.addText(`${DECK.slides.length} area${DECK.slides.length === 1 ? "" : "s"} · ${site}${dt ? " · " + dt : ""}`, { x: .7, y: 4.1, w: 11.93, h: .6, fontFace: F, fontSize: 18, color: G, align: "center" });
      s.addText("ABC Operations", { x: .7, y: 6.6, w: 11.93, h: .5, fontFace: F, fontSize: 12, color: "D9CFE6", align: "center" }); }
    const name = `${DECK.title.replace(/[\\/:*?"<>|]+/g, "-")} - ${DECK.date || ""}.pptx`;
    await p.writeFile({ fileName: name, compression: true });
    toast("PowerPoint ready");
  } catch (e){ toast(e.message, true); }
  btn.disabled = false; btn.textContent = "⤓ Download PowerPoint";
}

boot().catch(e => { $("#app").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
</script>
