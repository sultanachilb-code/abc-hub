<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Executive Report · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<!-- Executive Report feature — see docs/FEATURE-exec-report.md -->
<style>
:root{
  --ink:#26262a; --muted:#6b6b70; --line:#dcdce0; --bg:#eeeef1; --card:#fff;
  --brand:#58585a; --accent:#0f5c7a; --accent-soft:#e6f1f5; --py:#b9b9bf;
  --pos:#1a7f4b; --neg:#c0392b; --warn:#b7791f;
  --pos-soft:#e5f4ec; --neg-soft:#fbe9e6; --warn-soft:#fcf3df;
}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Calibri,-apple-system,Roboto,Arial,sans-serif;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.tw{overflow-x:auto}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px}
.bar img{height:30px;background:#fff;border-radius:6px;padding:3px}
.bar .ttl{font-weight:600;letter-spacing:.2px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 320px;padding:2px}
.chip{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#fff;color:var(--brand);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:.9rem}
.btn.danger{color:var(--neg)}

/* ---------- report ---------- */
#report{max-width:980px;margin:18px auto;padding:0 12px 60px}
.mall{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:22px 24px;margin-bottom:22px}
.rh{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:14px}
.rh img{height:56px}
.rh .k{font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.rh h1{margin:0;font-size:1.6rem;line-height:1.15}
.rh-t{flex:1}
.rh-m{text-align:right;display:flex;flex-direction:column;gap:2px}
.rh-m b{font-size:1.15rem;color:var(--accent)}
.rh-m span{font-size:.8rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 18px}
.kpi{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 12px;background:#fafafb}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.kpi .v{font-size:1.65rem;font-weight:700;line-height:1.2}
.kpi .s{font-size:.8rem;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.sec{margin:0 0 20px}
h2{font-size:1.05rem;margin:0 0 8px;padding:5px 10px;background:var(--brand);color:#fff;border-radius:4px;letter-spacing:.3px}
h3{font-size:.95rem;margin:14px 0 6px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:3px}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{background:#efeff2;text-align:left;padding:5px 8px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{padding:4px 8px;border:1px solid var(--line);vertical-align:middle}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
table.t .c{text-align:center}
table.t tfoot td,table.t tr.tot td{font-weight:700;background:#f6f6f8}
table.t tr.sub td{background:#fafafb;font-style:italic}
.h-hi{background:var(--pos-soft)} .h-mid{background:var(--warn-soft)} .h-lo{background:var(--neg-soft)}
.note{margin:8px 0 0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
.note p{margin:0 0 6px} .note p:last-child{margin:0}
.hl ul{margin:0;padding-left:20px} .hl li{margin:2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar-c{display:flex;align-items:center;gap:6px}
.bar-c i{display:block;height:9px;background:var(--neg);border-radius:2px;min-width:1px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:#ececef;color:#444}
.b-completed{background:var(--pos-soft);color:var(--pos)}
.b-execution{background:#e3eefb;color:#1c5fa8}
.b-procurement{background:#ece6f7;color:#5b3fa0}
.b-boq{background:#ece6f7;color:#5b3fa0}
.b-awaiting{background:var(--warn-soft);color:var(--warn)}
.b-cancelled{background:var(--neg-soft);color:var(--neg)}
.b-merged{background:#ececef;color:#555}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.mini div{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.85rem;background:#fafafb}
.mini b{font-size:1rem}
.qc{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qc .box{border:1px solid var(--line);border-radius:8px;padding:8px 18px;text-align:center;min-width:150px}
.qc .box .v{font-size:1.8rem;font-weight:700}
.qc .box .l{font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.qc .arrow{font-size:1.6rem;color:var(--muted)}
.qc .delta{font-weight:700;font-size:1.1rem}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin:6px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg .gl{stroke:#e4e4e8;stroke-width:1} svg .ax{font-size:10px;fill:#77777c}
svg .b25{fill:var(--py)} svg .b26{fill:var(--accent)}
.foot{margin-top:6px;font-size:.75rem;color:var(--muted)}
.empty{max-width:980px;margin:0 auto 12px;padding:10px 14px;background:#fff8e6;border:1px dashed #d8b45a;border-radius:8px;font-size:.9rem}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:40;box-shadow:-6px 0 24px rgba(0,0,0,.25);display:none;flex-direction:column}
#drawer.open{display:flex}
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--brand);color:#fff}
.dh b{font-size:1.02rem}
.dtabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:#f6f6f8}
.dtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.dtab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.dbody{flex:1;overflow:auto;padding:14px}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
.fld textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.te{border:1px solid var(--line);border-radius:8px;margin:0 0 18px;overflow:hidden}
.te-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 10px;background:#f6f6f8}
.te-h b{flex:1 1 200px}
.te-h small{flex:1 1 100%;color:var(--muted)}
.te table{border-collapse:collapse;width:100%}
.te th{font-size:.75rem;text-align:left;padding:4px 6px;color:var(--muted);background:#fafafb;border-top:1px solid var(--line);white-space:nowrap}
.te td{padding:2px 3px;border-top:1px solid var(--line)}
.te td input,.te td select{width:100%;min-width:74px;padding:5px 6px;border:1px solid transparent;border-radius:4px;background:transparent}
.te td input:focus,.te td select:focus{border-color:var(--accent);background:#fff;outline:none}
.te td.x{width:28px;text-align:center}
.x-btn{border:0;background:transparent;color:var(--neg);cursor:pointer;font-size:1.1rem}
.te td input.req{border-color:var(--neg);background:#fff5f4}
.pastebox{padding:8px 10px;border-top:1px solid var(--line);background:#fffdf3}
.pastebox textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:6px;font-family:Consolas,monospace;font-size:.85rem}
.pastebox p{margin:0 0 6px;font-size:.82rem;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted);margin:0 0 12px}

@media (max-width:640px){
  html{font-size:13px}
  .mall{padding:14px 12px}
  .two{grid-template-columns:1fr}
  .rh{flex-wrap:wrap} .rh-m{text-align:left}
  .grid2{grid-template-columns:1fr}
  table.t{font-size:.85rem}
}


/* ---------- Update Occ modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,20,25,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:1.5vh 1.5vw}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:12px;width:min(1600px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--brand);color:#fff}
.mh b{font-size:1.05rem}
.mh input[type=search]{flex:1 1 260px;max-width:440px;padding:7px 11px;border-radius:8px;border:0;font-size:.95rem;color:var(--ink)}
.ucount{font-size:.85rem;opacity:.85}
.mact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.msum{padding:8px 14px;border-bottom:1px solid var(--line);background:#fafafb}
.msum table.st{font-size:.8rem;width:auto;min-width:60%}
.msum table.st th,.msum table.st td{padding:2px 9px}
.msum .foot{margin-top:3px}
.mb{flex:1;overflow:auto;padding:12px 14px;background:#f0f0f4}
.ugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(620px,1fr));gap:12px;align-items:start}
.fc{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fch{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:6px 10px;background:#e9e9ee;position:sticky;top:0}
.fch b{font-size:1.1rem;color:var(--brand)}
.fst{flex:1;font-size:.8rem;color:var(--muted)}
.ut{width:100%;border-collapse:collapse;font-size:.85rem}
.ut th{font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:4px 5px;color:var(--muted);background:#fafafb;border-bottom:1px solid var(--line);white-space:nowrap}
.ut td{padding:1px 2px;border-bottom:1px solid #eee}
.ut td input,.ut td select{width:100%;padding:4px 5px;border:1px solid transparent;border-radius:4px;background:transparent;font-size:.85rem}
.ut td:nth-child(1) input{min-width:60px}.ut td:nth-child(2) input{min-width:110px}.ut td:nth-child(7) input{min-width:100px}
.ut td input.r{text-align:right;min-width:52px}
.ut td:nth-child(3) select{min-width:104px}.ut td:nth-child(5) select{min-width:92px}.ut td:nth-child(6) select{min-width:104px}
.ut td input:focus,.ut td select:focus{border-color:var(--accent);background:#fff;outline:none}
.ut td input.req{border-color:var(--neg);background:#fff5f4}
.ut td.x{width:24px;text-align:center}
.ut tr.st-vacant td{background:var(--neg-soft)}
.ut tr.st-fitout td{background:var(--warn-soft)}
.ut tr.st-terminated td{background:#e8e8ee}
.ut tr.dts td{background:var(--warn-soft);font-size:.8rem;padding:2px 8px 5px;color:#7a5a12}
.ut tr.dts input{width:110px;border:1px solid #e0cfa2;background:#fff}
.ut tr.nogla td{font-style:italic;color:#666}
.ut select.warnsel{border-color:var(--warn);background:var(--warn-soft)}
#uPrint{display:none;width:1050px}
@page units{size:A4 landscape;margin:8mm}

/* ---------- print / PDF ---------- */
@media print{
  @page{size:A4;margin:11mm 10mm 13mm;@bottom-right{content:"Page " counter(page);font-size:8pt;color:#888}}
  html{font-size:9.6pt}
  html,body{background:#fff}
  .no-print,.bar,#drawer,.empty{display:none!important}
  #report{max-width:none;margin:0;padding:0}
  .mall{box-shadow:none;border-radius:0;padding:0;margin:0;break-after:page}
  .mall:last-of-type{break-after:auto}
  h2,h3{break-after:avoid}
  table.t{break-inside:auto} table.t tr{break-inside:avoid} table.t thead{display:table-header-group}
  table.t tbody.grp{break-inside:avoid}
  .kpi,.qc,.mini,.note,.keep,.chartwrap{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{overflow:visible}

  body.print-units .bar,body.print-units #report,body.print-units #emptyMsg{display:none!important}
  body.print-units #uPrint{display:block;page:units}
  .up-h{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--brand);padding-bottom:4px;margin-bottom:4px}
  .up-h img{height:34px}
  .up-t{display:flex;flex-direction:column;font-size:11px}.up-t b{font-size:14px}
  .up-leg{margin-left:auto;font-size:9px;display:flex;align-items:center;gap:4px}
  .lg{display:inline-block;width:12px;text-align:center;border-radius:2px;font-weight:700}
  .up-s{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:9px;margin-bottom:5px;color:#333}
  #uPrintCols{height:610px;column-count:5;column-gap:12px;column-fill:auto;overflow:hidden;font-size:8px;line-height:1.25}
  .pfh{background:var(--brand);color:#fff;font-weight:700;padding:1px 4px;break-after:avoid;margin-top:3px}
  .pf table{width:100%;border-collapse:collapse;table-layout:fixed}
  .pf td{padding:0 3px;border-bottom:.5px solid #ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
  .pf tr{break-inside:avoid}
  .pf .c1{width:19%}.pf .c2{width:56%}.pf .c3{width:17%;text-align:right;max-width:none}.pf .c4{width:8%;text-align:center;font-weight:700;max-width:none}
  .s-vacant{background:#fbe9e6!important}.s-fitout{background:#fcf3df!important}.s-terminated{background:#e4e4ea!important}
  .modal{display:none!important}
}
/* ---------- hub additions ---------- */
.bar .per{display:flex;align-items:center;gap:6px}
.bar input[type=month]{border:0;border-radius:8px;padding:5px 8px;font:inherit;color:var(--ink)}
.bar .st{font-size:.8rem;opacity:.85;white-space:nowrap}
.src{max-width:980px;margin:12px auto 0;padding:0 12px;font-size:.82rem;color:var(--muted)}
.src b{color:var(--ink)}
.auto{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.vn{width:100%;border-collapse:collapse;font-size:.88rem;margin:0 0 12px}
.vn td,.vn th{border-top:1px solid var(--line);padding:4px 6px;text-align:left}
.vn th{font-size:.75rem;color:var(--muted);background:#fafafb}
.vn input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:4px}
.lk{color:var(--accent);font-weight:600}
/* local sales (never saved) */
.lsb{max-width:980px;margin:10px auto 0;padding:9px 14px;border-radius:10px;font-size:.86rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);background:#fafafb}
.lsb.on{background:#eaf6ee;border:1px solid #9fd4b3}
.lsb b{font-weight:700}.lsb .sp{flex:1}
.lsb .lock{font-size:.75rem;font-weight:700;color:#1e7a4f;background:#fff;border:1px solid #9fd4b3;border-radius:999px;padding:2px 8px}
.bar .btn.sal{background:#1e7a4f;color:#fff;border-color:#1e7a4f}

</style>
</head>

/* ================= helpers ================= */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  if(v==null)return NaN;
  var s=String(v).trim().replace(/[−]/g,'-');
  if(!s||/^[-–—]$/.test(s)||/^n\/?a$/i.test(s))return NaN;
  var neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  s=s.replace(/[\s%$ ]/g,'');
  if(/,\d{1,2}$/.test(s)&&s.indexOf('.')<0)s=s.replace(',','.'); else s=s.replace(/,/g,'');
  var n=parseFloat(s);
  if(isNaN(n))return NaN;
  return neg?-n:n;
}
function fmt(n,d){d=d||0;return isNaN(n)?'–':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fpct(n,d,sign){
  if(isNaN(n))return '–'; d=d||0;
  var r=+n.toFixed(d); if(r===0)r=0;
  return (sign&&r>0?'+':'')+r.toFixed(d)+'%';
}
function fpctSmart(n){return isNaN(n)?'–':fpct(n,n%1===0?0:1)}
function cls(n){return isNaN(n)?'':(n<0?'neg':(n>0?'pos':''))}
function chg(a,b){a=num(a);b=num(b);return (isFinite(a)&&isFinite(b)&&a>0)?(b/a-1)*100:NaN}
function sum(arr){return arr.reduce(function(s,v){return s+(isNaN(v)?0:v)},0)}
function trim(s){return String(s==null?'':s).trim()}
function paras(t){
  return trim(t).split(/\n\s*\n|\n/).filter(function(x){return trim(x)}).map(function(x){return '<p>'+esc(x)+'</p>'}).join('');
}
function todayDays(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5}
function pdate(s){
  var m=String(s||'').trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(!m)return NaN; var y=+m[3]; if(y<100)y+=2000;
  return Date.UTC(y,+m[2]-1,+m[1])/864e5;
}
function debounce(f,ms){var t;return function(){clearTimeout(t);t=setTimeout(f,ms)}}
function yearOf(m){var y=(String(m.period).match(/20\d\d/)||[])[0];return y?+y:new Date().getFullYear()}

var ckey=function(s){return nk(s).replace(/(the|and|for|to|be|of)/g,'')};

  var wa=nice(a).toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w.length>2}),wb=nice(b).toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w.length>2});
  if(!wa.length||!wb.length)return 0;var s=0;wa.forEach(function(w){if(wb.indexOf(w)>=0)s++});return s/Math.max(wa.length,wb.length);
}
function mergeCapex(m,budget,firstTime){
  var rowsNow=m.capex||[],used={};
  budget.forEach(function(b){
    var i=-1;
    rowsNow.forEach(function(r,j){if(i<0&&!used[j]&&(ckey(r.project)===ckey(b.project)))i=j});
    if(i<0)rowsNow.forEach(function(r,j){if(i<0&&!used[j]&&simil(r.project,b.project)>=0.6)i=j});
    if(i>=0){used[i]=1;rowsNow[i].bgt=b.bgt==null?rowsNow[i].bgt:b.bgt;rowsNow[i]._b=1}
    else{rowsNow.push({project:b.project,bgt:b.bgt==null?'':b.bgt,deadline:'',status:firstTime?'Hidden (not in report)':'',comment:trim(b.notes)});used[rowsNow.length-1]=1}

var FLOORS=['LG','GF','L1','L2','L3','L4'];
var TYPES=['Leasing GLA','Pop Up','DS','iPlay'];
function isExcluded(o){var f=trim(o.floor).toUpperCase(),c=trim(o.code).toUpperCase();return o.type==='Additional'||/^B\d+$/.test(f)||/^[A-Z0-9]{1,3}-S\d+$/.test(c)}
var UST=['Active','Terminated','Vacant','Fit out'];
var MOVES=['','Opened YTD','Closed YTD'];
var uidc=0;
function newUnit(o){
  return {id:'u'+(++uidc),floor:trim(o.floor),code:trim(o.code),brand:trim(o.brand),type:TYPES.indexOf(o.type)>=0?o.type:'Leasing GLA',dept:trim(o.dept),sqm:o.sqm==null?'':o.sqm,status:UST.indexOf(o.status)>=0?o.status:'Active',move:MOVES.indexOf(o.move)>=0?o.move:'',note:trim(o.note),contract:trim(o.contract),exp:trim(o.exp),hubStatus:o.hubStatus||'',unitId:o.unitId||0};

function nk(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function nice(s){
  s=trim(s);
  if(s&&s===s.toUpperCase()&&/[A-Z]/.test(s))return s.toLowerCase().replace(/(^|[\s\-\/(&.])([a-z])/g,function(_,a,b){return a+b.toUpperCase()});
  return s;
}
function floorRank(f){var i=FLOORS.indexOf(f);return i>=0?i:100+(f?f.charCodeAt(0):0)}
function floorList(m){
  var s={};m.units.forEach(function(u){if(trim(u.floor))s[trim(u.floor)]=1});
  return Object.keys(s).sort(function(a,b){return floorRank(a)-floorRank(b)});
}
function fin(b){b.cur=b.gla>0?b.act/b.gla*100:NaN;b.exp=b.gla>0?(b.act+b.term+b.fit)/b.gla*100:NaN;return b}
function calcOcc(m){
  var by={},tot={gla:0,act:0,term:0,vac:0,fit:0};

    var b=by[f]||(by[f]={gla:0,act:0,term:0,vac:0,fit:0});
    var k=u.status==='Active'?'act':(u.status==='Terminated'?'term':(u.status==='Fit out'?'fit':'vac'));
    b.gla+=s;b[k]+=s;tot.gla+=s;tot[k]+=s;
  });
  var order=Object.keys(by).sort(function(a,b){return floorRank(a)-floorRank(b)});

}
function unitIssues(m){return m.units.filter(function(u){return isNaN(num(u.sqm))&&(trim(u.code)||trim(u.brand)||trim(u.floor))})}
function uName(u){var c=trim(u.code),n=trim(u.note);return c?(n?c+' - '+n:c):(n||nice(u.brand))}
function sortedNames(map){return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1})}
function movesList(m){
  var op={},cl={};
  m.units.forEach(function(u){
    if(u.move==='Opened YTD'){var n=nice(u.brand)||trim(u.code);if(n)op[nk(n)]=n}
    if(u.move==='Closed YTD'||u.status==='Terminated'){
      var ex=(!trim(u.brand)||/^vacant$/i.test(trim(u.brand)));
      var n=ex?nice(trim(u.note).replace(/^ex[\s\-–]*/i,'')):nice(u.brand);
      n=n||trim(u.code);if(n)cl[nk(n)]=n;
    }
  });

  (m._autoClosed||[]).forEach(function(n){n=nice(n);if(n&&!cl[nk(n)])cl[nk(n)]=n});
  rows(m,'opened').forEach(function(r){var n=trim(r.name);if(n&&!op[nk(n)])op[nk(n)]=n});
  rows(m,'closed').forEach(function(r){var n=trim(r.name);if(n&&!cl[nk(n)])cl[nk(n)]=n});

}
function contractList(m){
  var out=[],seen={};

    h+='<tr><th>Current occupancy</th>'+oc.order.map(function(f){var v=oc.by[f].cur;return '<td class="c '+heat(v)+'"><b>'+fpct(v,0)+'</b></td>'}).join('')+'<td class="c '+heat(oc.tot.cur)+'"><b>'+fpct(oc.tot.cur,0)+'</b></td></tr>';
    h+='<tr><th>Expected occupancy (new joiners / terminations)</th>'+oc.order.map(function(f){var v=oc.by[f].exp;return '<td class="c '+heat(v)+'">'+fpct(v,0)+'</td>'}).join('')+'<td class="c '+heat(oc.tot.exp)+'"><b>'+fpct(oc.tot.exp,0)+'</b></td></tr></tbody></table></div>';
    var body='';

      var n=Math.max(us.length,1);

        body+='<td>'+(u?esc(uName(u)):'N/A')+'</td><td class="r">'+(u?fmt(num(u.sqm)):'N/A')+'</td>';
        if(i===0)body+='<td rowspan="'+n+'" class="r">'+fmt(b.vac)+'</td><td rowspan="'+n+'" class="r">'+fmt(b.gla)+'</td><td rowspan="'+n+'" class="c '+heat(b.exp)+'"><b>'+fpct(b.exp,0)+'</b></td>';

function secLease(m){
  var mv=movesList(m),o=mv.opened,c=mv.closed,k=contractList(m);

    h+='<h3>Opening / closing '+esc(trim(m.ytd)||'YTD')+' &nbsp;<span class="badge '+(net<0?'b-cancelled':'b-completed')+'">Net '+(net>0?'+':'')+net+'</span></h3><div class="tw keep"><table class="t"><thead><tr><th>OPENED ('+o.length+')</th><th>CLOSED ('+c.length+')</th></tr></thead><tbody>';
    for(var i=0;i<n;i++)h+='<tr><td>'+esc(o[i]||'')+'</td><td>'+esc(c[i]||'')+'</td></tr>';
    h+='</tbody></table></div>';
  }
  if(k.length){
    var td=todayDays(),tn=new Date();
    h+='<h3>Contracts signed &amp; fit-out tenants</h3><div class="tw"><table class="t"><thead><tr><th>Floor</th><th>Tenant</th><th>Contract opening date</th><th>Exp. opening date</th><th class="r">Days vs contract opening</th></tr></thead><tbody>';

      h+='<tr><td><b>'+esc(r.floor)+'</b></td><td>'+esc(r.tenant)+'</td><td>'+esc(r.contract)+'</td><td>'+esc(r.exp)+'</td><td class="r '+c+'"><b>'+txt+'</b></td></tr>';
    });
    h+='</tbody></table></div><div class="foot">Days vs contract opening are calculated against today ('+tn.getDate()+' '+MN[tn.getMonth()].slice(0,3)+' '+tn.getFullYear()+'): overdue = the contract opening date has passed.</div>';
  }
  if(trim(m.leaseNote))h+='<div class="note">'+paras(m.leaseNote)+'</div>';

function secSales(m){
  var y=yearOf(m),ff=ffRows(m),dec=rows(m,'decline'),grp=rows(m,'groups'),nt=rows(m,'newt'),lo=rows(m,'low');
  var st=totalSales(m,ff),lfl=lflSales(m);
  if(!ff.length&&!dec.length&&!grp.length&&!nt.length&&!lo.length&&!trim(m.salesNote)&&!m._sales)return '';
  var cur=trim(m.currency)?' ('+esc(m.currency)+')':'';
  var h='<section class="sec"><h2>Footfall &amp; Sales</h2>';
  if(ff.length){
    var a=sum(ff.map(function(r){return num(r.ff25)})),b=sum(ff.map(function(r){return num(r.ff26)}));
    h+='<h3>Footfall and sales analysis</h3>';
    h+='<div class="tw"><table class="t"><thead><tr><th>Footfall</th><th class="r">'+(y-1)+'</th><th class="r">'+y+'</th><th class="r">FF '+String(y).slice(2)+' vs '+String(y-1).slice(2)+'</th><th class="r">Sales % '+String(y).slice(2)+' vs '+String(y-1).slice(2)+'</th></tr></thead><tbody>';
    ff.forEach(function(r){
      var c=chg(r.ff25,r.ff26),s=rowSales(r);
      h+='<tr><td><b>'+esc(r.month)+'</b></td><td class="r">'+fmt(num(r.ff25))+'</td><td class="r">'+fmt(num(r.ff26))+'</td><td class="r '+cls(c)+'"><b>'+fpct(c,0,true)+'</b></td><td class="r '+cls(s)+'"><b>'+fpct(s,0,true)+'</b></td></tr>';
    });
    var tc=chg(a,b);
    h+='</tbody><tfoot><tr><td>TOTAL</td><td class="r">'+fmt(a)+'</td><td class="r">'+fmt(b)+'</td><td class="r '+cls(tc)+'">'+fpct(tc,0,true)+'</td><td class="r '+cls(st)+'">'+fpct(st,0,true)+(isNaN(lfl)?'':' <small>(LFL '+fpct(lfl,0,true)+')</small>')+'</td></tr></tfoot></table></div>';
  }
  h+=localBlocks(m,y);
  var gTot=grp[0],mallDrop=gTot?(num(gTot.s26)-num(gTot.s25)):NaN;
  if(dec.length){
    var base=Math.abs(num(m.declineBase));
    var ds=dec.map(function(r){return {t:r.tenant,d:-Math.abs(num(r.drop))}}).sort(function(p,q){return p.d-q.d});
    var hasBase=!isNaN(base)&&base>0;
    var mxc=hasBase?Math.max.apply(null,ds.map(function(r){return isNaN(r.d)?0:Math.abs(r.d)/base*100}).concat([1])):1;
    h+='<h3>YTD top contributors to sales decline</h3><div class="tw"><table class="t"><thead><tr><th>'+esc(trim(m.declineTitle)||m.name)+'</th><th class="r">Drop'+cur+'</th><th>Contribution from mall drop</th></tr></thead><tbody>';
    ds.forEach(function(r){
      var c=hasBase?Math.abs(r.d)/base*100:NaN;
      h+='<tr><td>'+esc(r.t)+'</td><td class="r neg">'+fmt(r.d)+'</td><td>'+(hasBase?'<div class="bar-c"><i style="width:'+(c/mxc*90)+'px;max-width:60%"></i><b>'+fpct(c,0)+'</b></div>':'–')+'</td></tr>';
    });
    h+='</tbody></table></div><div class="foot">'+(hasBase?'Contribution = tenant drop divided by the property sales drop ('+fmt(base)+').':'Enter the Property Sales Drop in Edit data to calculate the contribution.')+'</div>';
  }
  if(grp.length){
    h+='<h3>YTD mall performance analysis &amp; groups drop contribution</h3><div class="tw"><table class="t"><thead><tr><th></th><th class="r">'+(y-1)+'</th><th class="r">'+y+'</th><th class="r">'+String(y).slice(2)+' vs '+String(y-1).slice(2)+'</th><th class="r">Sales drop'+cur+'</th><th class="r">Cont.</th></tr></thead><tbody>';
    var accDrop=0;
    grp.forEach(function(r,i){
      var s25=num(r.s25),s26=num(r.s26),d=s26-s25,c=chg(s25,s26);
      var ct=(i>0&&mallDrop<0)?d/mallDrop*100:NaN;
      if(i>0&&!isNaN(d))accDrop+=d;
      h+='<tr'+(i===0?' class="tot"':'')+'><td><b>'+esc(r.group)+'</b></td><td class="r">'+fmt(s25)+'</td><td class="r">'+fmt(s26)+'</td><td class="r '+cls(c)+'">'+fpct(c,0,true)+'</td><td class="r '+cls(d)+'">'+fmt(d)+'</td><td class="r">'+(i>0?fpct(ct,0):'')+'</td></tr>';
    });
    if(grp.length>1&&mallDrop<0){
      var od=mallDrop-accDrop;
      h+='<tr class="sub"><td>All other tenants</td><td></td><td></td><td></td><td class="r neg">'+fmt(od)+'</td><td class="r">'+fpct(od/mallDrop*100,0)+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  if(nt.length){
    h+='<h3>'+y+' new tenant performance '+esc(trim(m.ytd)||'YTD')+'</h3><div class="tw"><table class="t"><thead><tr><th>Tenant</th><th class="r">Space (sqm)</th><th class="r">Annualized sales / sqm</th></tr></thead><tbody>';
    nt.forEach(function(r){h+='<tr><td><b>'+esc(r.tenant)+'</b></td><td class="r">'+fmt(num(r.space))+'</td><td class="r">'+fmt(num(r.ann))+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  if(lo.length){
    var sorted=lo.slice().sort(function(p,q){var a=num(p.ann),b=num(q.ann);return (isNaN(a)?1e12:a)-(isNaN(b)?1e12:b)}).slice(0,10);
    h+='<h3>Top 10 low performer tenants '+esc(trim(m.ytd)||'YTD')+'</h3><div class="tw"><table class="t"><thead><tr><th>#</th><th>Tenant</th><th class="r">'+(y-1)+'</th><th class="r">'+y+'</th><th class="r">'+String(y).slice(2)+' vs '+String(y-1).slice(2)+'</th><th class="r">Annualized sales / sqm</th></tr></thead><tbody>';
    sorted.forEach(function(r,i){
      var c=chg(r.s25,r.s26);
      h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(r.tenant)+'</b></td><td class="r">'+fmt(num(r.s25))+'</td><td class="r">'+fmt(num(r.s26))+'</td><td class="r '+cls(c)+'">'+fpct(c,0,true)+'</td><td class="r">'+fmt(num(r.ann))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  if(trim(m.salesNote))h+='<div class="note">'+paras(m.salesNote)+'</div>';
  return h+'</section>';
}

function badgeClass(s){
  s=trim(s).toLowerCase();
  if(!s)return '';
  if(s.indexOf('complete')===0)return 'b-completed';
  if(s.indexOf('exec')===0)return 'b-execution';
  if(s.indexOf('procure')===0)return 'b-procurement';
  if(s.indexOf('boq')===0)return 'b-boq';
  if(s.indexOf('await')===0)return 'b-awaiting';
  if(s.indexOf('cancel')===0)return 'b-cancelled';
  if(s.indexOf('merge')===0)return 'b-merged';
  return '';
}
function secCapex(m){
  var cx=rows(m,'capex').filter(function(r){return !/^hidden/i.test(trim(r.status))});
  if(!cx.length&&!trim(m.capexNote))return '';
  var cur=trim(m.currency)?' ('+esc(m.currency)+')':'';
  var h='<section class="sec"><h2>CAPEX Projects</h2>';
  if(cx.length){
    var tot=sum(cx.map(function(r){return num(r.bgt)}));
    var can=sum(cx.filter(function(r){return /^(cancel|merge)/i.test(trim(r.status))}).map(function(r){return num(r.bgt)}));
    var done=cx.filter(function(r){return /^complete/i.test(trim(r.status))}).length;
    h+='<div class="mini"><div>Projects <b>'+cx.length+'</b></div><div>Total budget'+cur+' <b>'+fmt(tot)+'</b></div><div>Active budget <b>'+fmt(tot-can)+'</b></div><div>Cancelled / merged <b>'+fmt(can)+'</b></div><div>Completed <b>'+done+'</b></div></div>';
    h+='<div class="tw"><table class="t"><thead><tr><th>Project description</th><th class="r">Annual BGT</th><th>Deadline</th><th>Status</th><th>Comment</th></tr></thead><tbody>';
    cx.forEach(function(r){
      h+='<tr><td>'+esc(r.project)+'</td><td class="r">'+fmt(num(r.bgt))+'</td><td>'+esc(r.deadline)+'</td><td>'+(trim(r.status)?'<span class="badge '+badgeClass(r.status)+'">'+esc(r.status)+'</span>':'')+'</td><td>'+esc(r.comment)+'</td></tr>';

  if(trim(m.capexNote))h+='<div class="note">'+paras(m.capexNote)+'</div>';
  return h+'</section>';
}
function secQC(m){

function secHighlights(m){

function renderMall(m){

function missing(m){
  var out=[];
  if(!secOcc(m))out.push('Occupancy');
  if(!secLease(m))out.push('Leasing');
  if(!secSales(m))out.push('Footfall & Sales');
  if(!secCapex(m))out.push('CAPEX');
  if(!secQC(m))out.push('Quality Control');
  return out;
}

function parseDecline(grid){

async function inflate(u8){
  var ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();
  w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function readZip(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),i=buf.byteLength-22;
  while(i>=0&&dv.getUint32(i,true)!==0x06054b50)i--;
  if(i<0)throw new Error('zip');
  var n=dv.getUint16(i+10,true),off=dv.getUint32(i+16,true),files={},dec=new TextDecoder();
  for(var k=0;k<n;k++){
    var method=dv.getUint16(off+10,true),csz=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lo=dv.getUint32(off+42,true);
    var name=dec.decode(u8.subarray(off+46,off+46+nl));
    files[name]={method:method,csz:csz,lo:lo};
    off+=46+nl+el+cl;
  }
  return {files:files,get:async function(name){
    var f=files[name];if(!f)return null;
    var l=f.lo,ln=dv.getUint16(l+26,true),le=dv.getUint16(l+28,true),data=u8.subarray(l+30+ln+le,l+30+ln+le+f.csz);
    return dec.decode(f.method===0?data:await inflate(data));
  }};
}
function colIdx(ref){var s=ref.replace(/[0-9]/g,''),n=0;for(var i=0;i<s.length;i++)n=n*26+s.charCodeAt(i)-64;return n-1}
function sheetGrid(xml,ss,dp){
  var doc=dp.parseFromString(xml,'text/xml'),grid=[];
  Array.prototype.forEach.call(doc.getElementsByTagName('row'),function(row){
    var r=[];
    Array.prototype.forEach.call(row.getElementsByTagName('c'),function(c){
      var ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0],val='';
      if(ty==='inlineStr')val=Array.prototype.map.call(c.getElementsByTagName('t'),function(x){return x.textContent}).join('');
      else if(v){val=v.textContent;if(ty==='s')val=ss[+val]||''}
      r[colIdx(c.getAttribute('r')||'A1')]=val;
    });
    for(var q=0;q<r.length;q++)if(r[q]==null)r[q]='';
    grid.push(r);
  });
  return grid;
}
async function readWorkbook(buf){
  var z=await readZip(buf),ss=[],dp=new DOMParser(),sheets=[];
  var sx=await z.get('xl/sharedStrings.xml');
  if(sx){Array.prototype.forEach.call(dp.parseFromString(sx,'text/xml').getElementsByTagName('si'),function(si){
    ss.push(Array.prototype.map.call(si.getElementsByTagName('t'),function(x){return x.textContent}).join(''))})}
  var wbx=await z.get('xl/workbook.xml'),rl=await z.get('xl/_rels/workbook.xml.rels');
  if(wbx&&rl){
    var rmap={};
    Array.prototype.forEach.call(dp.parseFromString(rl,'text/xml').getElementsByTagName('Relationship'),function(r){rmap[r.getAttribute('Id')]=r.getAttribute('Target')});
    var shs=dp.parseFromString(wbx,'text/xml').getElementsByTagName('sheet');
    for(var i=0;i<shs.length;i++){
      var tg=rmap[shs[i].getAttribute('r:id')];if(!tg)continue;
      tg=tg.replace(/^\//,'');if(tg.indexOf('xl/')!==0)tg='xl/'+tg;
      var xml=await z.get(tg);if(!xml)continue;
      sheets.push({name:shs[i].getAttribute('name'),grid:sheetGrid(xml,ss,dp)});
    }
  }
  if(!sheets.length)throw new Error('sheet');
  return sheets;
}
async function xlsxToGrid(buf){return (await readWorkbook(buf))[0].grid}
function parseGla(sheets){
  var out=[];
  sheets.forEach(function(sh){
    if(/^totals?$/i.test(trim(sh.name)))return;
    var hi=-1;
    for(var i=0;i<sh.grid.length&&i<8;i++){if(sh.grid[i].some(function(c){return /^level$/i.test(trim(c))})){hi=i;break}}
    if(hi<0)return;
    var hdr=sh.grid[hi].map(function(c){return trim(c).toLowerCase()});
    function ix(re){for(var k=0;k<hdr.length;k++)if(re.test(hdr[k]))return k;return -1}
    var iL=ix(/^level/),iT=ix(/^type/),iC=ix(/area\s*code/),iB=ix(/^brand/),iS=ix(/operating|^status/),iD=ix(/^dept/),iA=ix(/area\s*sqm|^sqm/);
    if(iL<0||iT<0||iA<0)return;
    for(var r=hi+1;r<sh.grid.length;r++){
      var row=sh.grid[r],lv=trim(row[iL]).toUpperCase(),ty=trim(row[iT]).toLowerCase();
      if(!lv||!ty||/^TOTAL/.test(lv))continue;
      var sq=num(row[iA]);if(isNaN(sq))continue;
      var floor=lv==='LGF'?'LG':lv;
      var type=/leasing/.test(ty)?'Leasing GLA':(/pop/.test(ty)?'Pop Up':(/^ds/.test(ty)?'DS':(/iplay/.test(ty)?'iPlay':'Leasing GLA')));
      var brand=trim(iB>=0?row[iB]:''),st=iS>=0?trim(row[iS]).toLowerCase():'active';
      var status=(/vacant/.test(st)||/^vacant$/i.test(brand))?'Vacant':(/fit/.test(st)?'Fit out':(/terminat/.test(st)?'Terminated':'Active'));
      var o={floor:floor,code:trim(iC>=0?row[iC]:''),brand:brand,type:type,dept:trim(iD>=0?row[iD]:''),sqm:sq,status:status};
      if(isExcluded(o))continue;
      out.push(o);
    }
  });
  return out;
}
