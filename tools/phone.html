<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Phone · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Hub Phone + Hub Chat — see docs/FEATURE-hub-phone.md and docs/FEATURE-hub-chat.md.
     The calls run in the hub (tools/phone-core.js); this page dials and chats. -->
<style>
.ph{max-width:620px;margin:0 auto}
.me{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.me .ext{font-size:.82rem;font-weight:800;color:var(--brand-2);background:rgba(123,75,176,.12);padding:4px 10px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:#2EB872;box-shadow:0 0 0 3px rgba(46,184,114,.2)}
.tabs{width:100%;margin-bottom:14px}.tabs button{flex:1;position:relative}
.tabs u{position:absolute;top:3px;right:6px;min-width:17px;height:17px;border-radius:9px;background:#E5484D;color:#fff;font-size:.66rem;text-decoration:none;display:grid;place-items:center;padding:0 4px}
.tabs u.g{background:#2EB872}
/* keypad */
.disp{height:64px;display:flex;align-items:center;justify-content:center;font-size:2.3rem;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.disp:empty::before{content:"Dial an extension";font-size:1rem;font-weight:600;letter-spacing:0;color:var(--muted)}
.hit{min-height:62px;margin-bottom:8px}
.hit .r{cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:330px;margin:4px auto 16px}
.pad button{aspect-ratio:1.25;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:1.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pad button small{font-size:.58rem;letter-spacing:.14em;color:var(--muted);margin-top:4px;font-weight:700;min-height:.7em}
.pad button:active{background:var(--paper);transform:scale(.97)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:330px;margin:0 auto;align-items:center;justify-items:center}
.ca{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#2EB872;box-shadow:0 8px 20px rgba(46,184,114,.32)}
.ca svg{width:30px;height:30px}
.ca.v{width:52px;height:52px;background:var(--brand);box-shadow:none}.ca.v svg{width:24px;height:24px}
.ca[disabled]{opacity:.35}
.bk{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:1.4rem}
/* lists */
.flt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 10px}
.flt span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--muted)}
.flt span.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 4px 6px}
.r{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
.av{background-size:cover;background-position:center;position:relative}
.r .av{width:42px;height:42px;font-size:.85rem}
.av .dot{position:absolute;right:-1px;bottom:-1px;border:2px solid var(--surface)}
.r .tx{flex:1;min-width:0}
.r .tx b{display:block;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .tx small{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .xt{font-weight:800;color:var(--brand-2);font-size:.86rem;font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--brand-2);background:var(--paper)}
.ib.g{color:#fff;background:#2EB872}
.ib svg{width:18px;height:18px}
.ib.st{font-size:1.1rem;color:var(--gold)}
.miss b{color:var(--alert)}
.note{font-size:.76rem;color:var(--muted);line-height:1.5;margin-top:16px}
.warnb{background:rgba(192,122,18,.12);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.82rem;font-weight:600;margin-bottom:12px}
/* chats list */
.cr{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;cursor:pointer}
.cr:hover{border-color:var(--brand-2)}
.cav{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.9rem;flex:none;background-size:cover;background-position:center;position:relative}
.cr .tx{flex:1;min-width:0}
.cr .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cr .l1 b{font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .l1 em{font-style:normal;font-size:.72rem;color:var(--muted);white-space:nowrap}
.cr .l1 em.u{color:#1E9E5E;font-weight:800}
.cr .l2{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}
.cr .l2 span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{min-width:20px;height:20px;border-radius:10px;background:#2EB872;color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 6px;flex:none}
.nb.at{background:var(--brand)}
.mut{font-size:.8rem;opacity:.6}
.newb{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:56px;height:56px;border-radius:18px;background:#2EB872;color:#fff;font-size:1.7rem;display:grid;place-items:center;box-shadow:0 10px 24px rgba(46,184,114,.35);z-index:20}
/* conversation */
#cv{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column}
#cv.on{display:flex}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--surface);border-bottom:1px solid var(--line)}
.ch .back{width:36px;height:36px;border-radius:10px;font-size:1.3rem;color:var(--text)}
.ch .cav{width:40px;height:40px;font-size:.8rem}
.ch .tt{flex:1;min-width:0;cursor:pointer}
.ch .tt b{display:block;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .tt small{display:block;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ms{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(var(--paper),var(--paper))}
.day{align-self:center;background:var(--surface);color:var(--muted);font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:999px;margin:10px 0 6px;border:1px solid var(--line)}
.sys{align-self:center;color:var(--muted);font-size:.74rem;text-align:center;max-width:86%;margin:4px 0;background:rgba(123,75,176,.08);padding:4px 10px;border-radius:10px}
.m{max-width:80%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 9px 4px;font-size:.88rem;line-height:1.38;position:relative;cursor:pointer;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:#DCF5E5;border-color:#C2EBD2;border-radius:14px 14px 4px 14px}
:root[data-theme="dark"] .m.me{background:#1E4A33;border-color:#2A5E42}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .m.me{background:#1E4A33;border-color:#2A5E42} }
.m.cont{margin-top:-1px}
.m .w{font-size:.74rem;font-weight:800;margin-bottom:1px}
.m .tm{font-size:.66rem;color:var(--muted);text-align:right;margin-top:1px;white-space:nowrap}
.m .tm .ck{font-weight:800;letter-spacing:-.15em;margin-left:3px}
.m .tm .ck.rd{color:#2F8FD8}
.m.del{font-style:italic;color:var(--muted)}
.m .rq{border-left:3px solid var(--brand-2);background:rgba(123,75,176,.08);border-radius:6px;padding:3px 7px;font-size:.76rem;color:var(--muted);margin-bottom:4px;max-height:3.2em;overflow:hidden}
.m .rq b{display:block;color:var(--brand-2);font-size:.72rem}
.m img.ph2{display:block;max-width:240px;max-height:280px;width:100%;border-radius:10px;margin:2px 0;object-fit:cover;background:var(--paper);min-height:80px}
.m audio{width:230px;max-width:100%;height:36px;display:block;margin:2px 0}
.fc{display:flex;gap:9px;align-items:center;background:var(--paper);border-radius:10px;padding:7px 9px;margin:2px 0;text-decoration:none;color:inherit;min-width:190px}
.fc i{width:34px;height:40px;border-radius:6px;color:#fff;font-style:normal;font-size:.62rem;font-weight:800;display:grid;place-items:center;flex:none}
.fc b{display:block;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.fc small{font-size:.7rem;color:var(--muted)}
.men{color:var(--brand-2);font-weight:800}
.m a.lk{color:var(--brand-2);text-decoration:underline}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rx span{background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:.72rem;padding:0 7px;cursor:pointer}
.rx span.mine{border-color:#2EB872;background:rgba(46,184,114,.12)}
.more{align-self:center;font-size:.78rem;font-weight:700;color:var(--brand-2);padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.cb{background:var(--surface);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.rpb{display:flex;align-items:center;gap:8px;background:var(--paper);border-left:3px solid var(--brand-2);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:.78rem}
.rpb div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.rpb b{color:var(--brand-2)}
.rpb button{color:var(--muted);font-size:1rem}
.cl{display:flex;align-items:flex-end;gap:6px}
.cl textarea{flex:1;resize:none;max-height:120px;min-height:40px;height:40px;border-radius:20px;padding:9px 14px;line-height:1.35;font-size:.92rem}
.cbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--brand-2);background:var(--paper);font-size:1.1rem}
.cbtn.go{background:#2EB872;color:#fff}
.cbtn svg{width:19px;height:19px}
.rec{display:flex;align-items:center;gap:10px;height:40px}
.rec .rd{width:10px;height:10px;border-radius:50%;background:#E5484D;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec b{flex:1;font-variant-numeric:tabular-nums}
.ro{text-align:center;font-size:.8rem;color:var(--muted);padding:8px}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:6px 0;max-height:160px;overflow:auto}
.emo button{font-size:1.35rem;height:38px;border-radius:8px}
.emo button:hover{background:var(--paper)}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;max-height:180px;overflow:auto}
.sug div{padding:7px 10px;font-size:.84rem;cursor:pointer;display:flex;gap:8px;align-items:center}
.sug div:hover,.sug div.on{background:var(--paper)}
.att{display:flex;gap:8px;padding:6px 0}
.att button{flex:1;padding:10px;border-radius:12px;background:var(--paper);font-weight:700;font-size:.82rem}
/* dialogs */
.sh{width:min(520px,calc(100% - 20px))}
.sh .dlg-b{max-height:min(62dvh,560px);overflow:auto}
.pk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pk .av{width:34px;height:34px;font-size:.72rem}
.pk .tx{flex:1;min-width:0}.pk .tx b{display:block;font-size:.88rem}.pk .tx small{font-size:.74rem;color:var(--muted)}
.pk input{width:20px;height:20px;accent-color:#2EB872}
.tag{font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(46,184,114,.13);color:#1E9E5E}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.tgl input{width:20px;height:20px;accent-color:#2EB872}
.mrow{display:flex;gap:6px;justify-content:space-between;padding:6px 0 12px}
.mrow button{font-size:1.6rem;width:48px;height:48px;border-radius:12px;background:var(--paper)}
.mact button{display:block;width:100%;text-align:left;padding:12px 4px;border-top:1px solid var(--line);font-weight:600;font-size:.9rem}
.mact button.bad{color:var(--alert)}
#iv{background:#000;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;display:none;align-items:center;justify-content:center}
#iv[open]{display:flex}
#iv img{max-width:100%;max-height:100%}
#iv button{position:absolute;top:14px;right:14px;color:#fff;font-size:1.6rem;width:44px;height:44px}
#iv a{position:absolute;top:18px;left:16px;color:#fff;font-weight:700;font-size:.9rem}
@media (min-width:900px){ #cv{left:50%;transform:translateX(-50%);max-width:820px;border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>
</head>
<body>
<div class="top"><h1>📞 Hub Phone <small id="sub">calls and chats between hub users</small></h1></div>
<div class="wrap"><div class="ph">
  <div id="warn"></div>
  <div class="me"><span class="dot" id="conn"></span><b id="meName">…</b><span class="ext" id="meExt">ext …</span><span class="muted" style="font-size:.78rem" id="connT"></span></div>
  <div class="tabs" id="tabs"><button data-t="chats">Chats<u id="chatN" class="hidden g"></u></button><button data-t="rec">Calls<u id="missN" class="hidden"></u></button><button data-t="con">Contacts</button><button data-t="pad">Keypad</button></div>
  <div id="v"></div>
  <p class="note" id="note"></p>
</div></div>
<button class="newb hidden" id="newb" title="New chat" aria-label="New chat">＋</button>

<!-- the conversation (full screen) -->
<div id="cv" role="dialog" aria-modal="true">
  <div class="ch"><button class="back" id="cvBack" aria-label="Back">←</button><span class="cav" id="cvAv"></span><div class="tt" id="cvTt"><b id="cvName"></b><small id="cvSub"></small></div><span id="cvActs" style="display:flex;gap:6px"></span></div>
  <div id="ms"></div>
  <div class="cb" id="cb"></div>
</div>
<dialog id="dlg" class="sh"></dialog>
<dialog id="iv"><a id="ivDl" href="#" download>⤓ Save</a><button id="ivX" aria-label="Close">✕</button><img id="ivImg" alt=""></dialog>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fAny" hidden>
<div class="toast" id="toast"></div>
<script src="common.js"></script>
<script>
const SVG = {
  call: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
  vid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>',
  msg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21 11-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6L15.5 6"/></svg>'
};
const GROUPS = [["VRM", "ABC Verdun Mall"], ["ACM", "ABC Achrafieh Mall"], ["DBS", "Dbayeh Department Store"], ["VRS", "Verdun Department Store"], ["ACS", "Achrafieh Department Store"], ["LEAD", "Leadership & administration"]];
const EMO_R = ["👍", "❤️", "😂", "😮", "🙏", "✅"];
const EMO = "😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😅 😢 😡 🙏 👍 👎 👏 🙌 💪 👌 ✌️ 🤝 👋 ❤️ 💚 🔥 ⭐ ✅ ❌ ⚠️ 🚨 📢 📌 📷 📄 🧾 🔧 🧹 🚧 🛠️ 💡 🕒 📅 🎉 ☕ 🚗 🏬 🔑".split(" ");
const P = (() => { try { return window.parent !== window && window.parent.HubPhone ? window.parent.HubPhone : null; } catch { return null; } })();
const PX = (() => { try { return window.parent !== window ? window.parent.HUBX : null; } catch { return null; } })();
const CAN_CHAT = !PX || !PX.can || PX.can("chat");
const QS = new URLSearchParams(location.search);
let BOOK = null, REC = null, CHATS = null, TAB = (QS.getAll("tab").pop() || (CAN_CHAT ? "chats" : "rec")), DIAL = "", Q = "", CQ = "", GF = "ALL", ONLY = false, FAVF = false;
if (TAB === "calls") TAB = "rec";
if (TAB === "chats" && !CAN_CHAT) TAB = "rec";
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let FAV = store.get("hub.phoneFav", []);
if (!CAN_CHAT) document.querySelector('#tabs [data-t="chats"]').remove();

function dial(p, video){
  if (!P) return toast("Open Hub Phone from the hub to call", true);
  if (p.email === BOOK.me.email) return toast("That is your own extension", true);
  P.call(p.email, !!video, p.name);
}
const photo = (email, at) => at ? `background-image:url('/api/profile/photo?u=${encodeURIComponent(email)}&v=${encodeURIComponent(at)}');color:transparent;` : "";
const av = p => `<span class="av" style="${photo(p.email, p.photoAt)}">${esc(initials(p.name))}<span class="dot ${p.online ? "on" : ""}"></span></span>`;
const row = (p, extra = "") => `<div class="r" data-e="${esc(p.email)}">${av(p)}<div class="tx"><b>${esc(p.name)}${p.email === BOOK.me.email ? " <span class='muted'>(you)</span>" : ""}</b><small>${esc(p.position || "")}${p.siteName ? " · " + esc(p.siteName) : ""}${p.online ? " · online" : ""}</small></div>
  ${extra}<span class="xt">${esc(p.ext || "")}</span>${p.email === BOOK.me.email ? "" : `<button class="ib st" data-f="${esc(p.email)}" title="Favourite">${FAV.includes(p.email) ? "★" : "☆"}</button>${CAN_CHAT ? `<button class="ib" data-m="${esc(p.email)}" title="Message">${SVG.msg}</button>` : ""}<button class="ib" data-v="${esc(p.email)}" title="Video call">${SVG.vid}</button><button class="ib g" data-c="${esc(p.email)}" title="Call">${SVG.call}</button>`}</div>`;
const byEmail = e => BOOK && BOOK.people.find(p => p.email === e);
function wire(root){
  root.querySelectorAll("[data-c]").forEach(b => b.onclick = ev => { ev.stopPropagation(); dial(byEmail(b.dataset.c), false); });
  root.querySelectorAll("[data-v]").forEach(b => b.onclick = ev => { ev.stopPropagation(); dial(byEmail(b.dataset.v), true); });
  root.querySelectorAll("[data-m]").forEach(b => b.onclick = ev => { ev.stopPropagation(); openDm(b.dataset.m); });
  root.querySelectorAll("[data-f]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const e = b.dataset.f;
    FAV = FAV.includes(e) ? FAV.filter(x => x !== e) : [...FAV, e]; store.set("hub.phoneFav", FAV); paint(); });
}

/* ---------- keypad ---------- */
function paintPad(){
  const hits = DIAL ? BOOK.people.filter(p => p.ext && p.ext.startsWith(DIAL)).sort((a, b) => a.ext.localeCompare(b.ext)).slice(0, 3) : [];
  const exact = BOOK.people.find(p => p.ext === DIAL);
  $("#v").innerHTML = `<div class="disp" id="disp">${esc(DIAL)}</div>
    <div class="hit">${hits.map(p => row(p)).join("") || (DIAL ? `<p class="muted" style="text-align:center;font-size:.86rem">No one has extension ${esc(DIAL)}</p>` : "")}</div>
    <div class="pad">${[["1", ""], ["2", "ABC"], ["3", "DEF"], ["4", "GHI"], ["5", "JKL"], ["6", "MNO"], ["7", "PQRS"], ["8", "TUV"], ["9", "WXYZ"], ["*", ""], ["0", "+"], ["#", ""]]
      .map(([k, s]) => `<button data-k="${k}">${k}<small>${s}</small></button>`).join("")}</div>

const tz = { timeZone: "Asia/Beirut" };
const dayOf = s => new Date(s).toLocaleDateString("en-CA", tz);
const hm = iso => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", ...tz });
const when = iso => { const today = dayOf(Date.now()), y = dayOf(Date.now() - 864e5);
  return dayOf(iso) === today ? "Today " + hm(iso) : dayOf(iso) === y ? "Yesterday " + hm(iso) : new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", ...tz }) + " " + hm(iso); };
const shortWhen = iso => { if (!iso) return ""; const today = dayOf(Date.now()), y = dayOf(Date.now() - 864e5);
  return dayOf(iso) === today ? hm(iso) : dayOf(iso) === y ? "Yesterday" : new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", ...tz }); };
const dur = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

    return `<div class="r ${missed ? "miss" : ""}">${av(p)}<div class="tx"><b>${esc(p.name)}</b><small>${esc(what)}</small></div><span class="xt">${esc(p.ext || "")}</span>

/* ---------- messages ---------- */
const FT = { pdf: ["PDF", "#C0392B"], xlsx: ["XLS", "#1D6F42"], xls: ["XLS", "#1D6F42"], csv: ["CSV", "#2E6B4F"], docx: ["DOC", "#1B5E9E"], doc: ["DOC", "#1B5E9E"], pptx: ["PPT", "#C4501E"], zip: ["ZIP", "#555"] };
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const fileUrl = (id, dl) => `/api/chat/file?id=${id}${dl ? "&dl=1" : ""}`;
const nameOf = e => { const m = MEM.find(x => x.email === e) || byEmail(e); return m ? m.name : e; };
const colorOf = e => { let h = 0; for (const ch of e) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return ["#B0562A", "#1E9E5E", "#2F6F73", "#7B4BB0", "#C07A12", "#B8456B", "#3C4F8A"][h % 7]; };
function textHtml(m){
  let t = esc(m.body);
  t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a class="lk" href="$1" target="_blank" rel="noopener">$1</a>');
  for (const e of m.mentions || []) { const n = esc(nameOf(e)); t = t.split("@" + n).join(`<span class="men">@${n}</span>`); }
  return t.replace(/\n/g, "<br>");
}
const preview = m => m.deleted ? "Message deleted" : m.kind === "photo" ? "📷 Photo" : m.kind === "voice" ? "🎤 Voice note" : m.kind === "file" ? "📄 " + (m.file ? m.file.name : "File") : m.body;
function readByAll(m){ const others = MEM.filter(x => x.email !== m.by); return others.length && others.every(x => x.lastRead >= m.id); }
function bubble(m, prev){
  const me = BOOK && m.by === BOOK.me.email;
  if (m.kind === "system") return `<div class="sys">${esc(m.body)}</div>`;
  const cont = prev && prev.by === m.by && prev.kind !== "system" && dayOf(prev.at) === dayOf(m.at) && (Date.parse(m.at) - Date.parse(prev.at)) < 300000;
  const who = CONV.kind === "group" && !me && !cont ? `<div class="w" style="color:${colorOf(m.by)}">${esc(m.name)}${(() => { const x = MEM.find(y => y.email === m.by); return x && x.position ? ` · <span style="font-weight:600;opacity:.8">${esc(x.position)}</span>` : ""; })()}</div>` : "";
  if (m.deleted) return `<div class="m del ${me ? "me" : ""} ${cont ? "cont" : ""}" data-id="${m.id}">${who}🚫 This message was deleted<div class="tm">${hm(m.at)}</div></div>`;
  const rq = m.reply ? (() => { const r = MSGS.find(x => x.id === m.reply) || REPL.get(m.reply); return r ? `<div class="rq"><b>${esc(r.name)}</b>${esc(preview(r))}</div>` : ""; })() : "";
  let body = "";
  if (m.kind === "photo") body = `<img class="ph2" loading="lazy" src="${fileUrl(m.id)}" data-img="${m.id}" alt="Photo">` + (m.body ? `<div>${textHtml(m)}</div>` : "");
  else if (m.kind === "voice") body = `<audio controls preload="none" src="${fileUrl(m.id)}"></audio><small class="muted" style="font-size:.7rem">🎤 ${dur(m.dur || 0)}</small>`;
  else if (m.kind === "file" && m.file) { const ext = (m.file.name.split(".").pop() || "").toLowerCase(), f = FT[ext] || [ext.slice(0, 4).toUpperCase() || "FILE", "#6D6479"];
    body = `<a class="fc" href="${fileUrl(m.id, true)}" download="${esc(m.file.name)}" target="_blank" rel="noopener"><i style="background:${f[1]}">${esc(f[0])}</i><span><b>${esc(m.file.name)}</b><small>${kb(m.file.size)} · tap to download</small></span></a>` + (m.body ? `<div>${textHtml(m)}</div>` : ""); }
  else body = textHtml(m);
  const rx = Object.entries(m.reactions || {}).filter(([, l]) => l.length);
  const ck = me ? `<span class="ck ${readByAll(m) ? "rd" : ""}">${m.id < 0 ? "🕓" : readByAll(m) ? "✓✓" : "✓"}</span>` : "";
  return `<div class="m ${me ? "me" : ""} ${cont ? "cont" : ""}" data-id="${m.id}">${who}${rq}${body}
    ${rx.length ? `<div class="rx">${rx.map(([e, l]) => `<span data-rx="${e}" class="${BOOK && l.includes(BOOK.me.email) ? "mine" : ""}" title="${esc(l.map(nameOf).join(", "))}">${e} ${l.length}</span>`).join("")}</div>` : ""}
    <div class="tm">${hm(m.at)}${ck}</div></div>`;
}
function paintMsgs(toBottom){
  const box = $("#ms"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;

  let prev = null, lastDay = "";
  for (const m of MSGS) {

    html += bubble(m, prev); prev = m;

    if (a === "seen"){ try { const r = await api("chat/seen?id=" + id);
      openSheet(`<div class="dlg-h"><b>Seen by</b><small>${esc(preview(m)).slice(0, 80)}</small></div><div class="dlg-b">
        <div class="grp" style="margin-top:0">✓✓ Read · ${r.read.length}</div>${r.read.map(n => `<div class="pk"><span class="tx"><b>${esc(n)}</b></span></div>`).join("") || `<p class="muted">Nobody yet.</p>`}
        <div class="grp">✓ Not read yet · ${r.waiting.length}</div>${r.waiting.map(n => `<div class="pk"><span class="tx"><b>${esc(n)}</b></span></div>`).join("") || `<p class="muted">Everyone has read it.</p>`}</div>
        <div class="dlg-f"><button class="btn ghost" onclick="this.closest('dialog').close()">Close</button></div>`); } catch (e){ toast(e.message, true); } }
    if (a === "del"){ if (!confirm("Delete this message for everyone?")) return; try { await api("chat/delete", { id }); dlg.close(); m.deleted = true; paintMsgs(false); } catch (e){ toast(e.message, true); } }
  });
}
async function react(id, e){
  const m = MSGS.find(x => x.id === id); if (!m) return;
  try { const r = await api("chat/react", { id, emoji: e }); m.reactions = r.reactions; paintMsgs(false); } catch (x){ toast(x.message, true); }
}

/* ---------- composer ---------- */
function paintComposer(){
  const cb = $("#cb");
  if (!CONV.canSend){ cb.innerHTML = `<div class="ro">📢 Only the group admins can send messages here.</div>`; return; }
  if (REC_ST){
    cb.innerHTML = `<div class="rec"><span class="rd"></span><b id="recT">0:00</b><span class="muted" style="font-size:.8rem">Recording…</span><button class="cbtn" id="recX" title="Cancel">✕</button><button class="cbtn go" id="recS" title="Send">${SVG.send}</button></div>`;
    $("#recX").onclick = () => stopRec(true); $("#recS").onclick = () => stopRec(false); return;
  }
  const keep = $("#tx") ? $("#tx").value : "";
  cb.innerHTML = `${REPLY ? `<div class="rpb"><div><b>↩ ${esc(REPLY.name)}</b> · ${esc(preview(REPLY))}</div><button id="rpX">✕</button></div>` : ""}
    <div id="sug" class="sug hidden"></div><div id="emo" class="emo hidden">${EMO.map(e => `<button data-emo="${e}">${e}</button>`).join("")}</div><div id="att" class="att hidden"><button id="aCam">📷 Camera</button><button id="aPh">🖼 Photo</button><button id="aFile">📄 File</button></div>
    <div class="cl"><button class="cbtn" id="bAtt" title="Attach">${SVG.clip}</button><button class="cbtn" id="bEmo" title="Emoji">😊</button>
      <textarea id="tx" rows="1" placeholder="Message${CONV.kind === "group" ? " · @ to mention" : ""}">${esc(keep)}</textarea><button class="cbtn go" id="bGo" title="Send"></button></div>`;
  const tx = $("#tx"), go = $("#bGo");
  const setGo = () => { const has = tx.value.trim().length > 0; go.innerHTML = has ? SVG.send : SVG.mic; go.title = has ? "Send" : "Hold a voice note: tap to record"; };
  const grow = () => { tx.style.height = "40px"; tx.style.height = Math.min(120, tx.scrollHeight) + "px"; };
  setGo(); grow();
  tx.oninput = () => { setGo(); grow(); suggest(); };
  tx.onkeydown = ev => {
    const s = $("#sug");
    if (!s.classList.contains("hidden")){
      const items = [...s.querySelectorAll("[data-me]")], on = s.querySelector(".on"), i = items.indexOf(on);
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){ ev.preventDefault(); const n = items[(i + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]; on && on.classList.remove("on"); n && n.classList.add("on"); return; }
      if ((ev.key === "Enter" || ev.key === "Tab") && (on || items[0])){ ev.preventDefault(); pickMention((on || items[0]).dataset.me); return; }
      if (ev.key === "Escape"){ s.classList.add("hidden"); return; }
    }
    if (ev.key === "Enter" && !ev.shiftKey && matchMedia("(pointer:fine)").matches){ ev.preventDefault(); sendText(); }
  };
  go.onclick = () => tx.value.trim() ? sendText() : startRec();
  $("#bEmo").onclick = () => { $("#emo").classList.toggle("hidden"); $("#att").classList.add("hidden"); };
  $("#bAtt").onclick = () => { $("#att").classList.toggle("hidden"); $("#emo").classList.add("hidden"); };
  cb.querySelectorAll("[data-emo]").forEach(b => b.onclick = () => { const p = tx.selectionStart ?? tx.value.length; tx.value = tx.value.slice(0, p) + b.dataset.emo + tx.value.slice(p); tx.focus(); tx.setSelectionRange(p + b.dataset.emo.length, p + b.dataset.emo.length); setGo(); });
  $("#aCam").onclick = () => $("#fCam").click(); $("#aPh").onclick = () => { $("#fAny").accept = "image/*"; $("#fAny").click(); };
  $("#aFile").onclick = () => { $("#fAny").accept = ".pdf,.xlsx,.xls,.csv,.docx,.doc,.pptx,.zip,.txt,image/*"; $("#fAny").click(); };
  const rx = $("#rpX"); if (rx) rx.onclick = () => { REPLY = null; paintComposer(); };
}
/* @mentions: type @ and pick a member */
function suggest(){
  const tx = $("#tx"), s = $("#sug"); if (CONV.kind !== "group"){ s.classList.add("hidden"); return; }
  const before = tx.value.slice(0, tx.selectionStart), m = /(^|\s)@([^\s@]{0,20})$/.exec(before);
  if (!m){ s.classList.add("hidden"); return; }
  const q = m[2].toLowerCase(), L = MEM.filter(x => BOOK && x.email !== BOOK.me.email && x.name.toLowerCase().includes(q)).slice(0, 6);
  if (!L.length){ s.classList.add("hidden"); return; }
  s.innerHTML = L.map((x, i) => `<div data-me="${esc(x.email)}" class="${i ? "" : "on"}"><span class="av" style="width:26px;height:26px;font-size:.6rem;${photo(x.email, x.photoAt)}">${esc(initials(x.name))}</span><b>${esc(x.name)}</b><small class="muted">${esc(x.position || "")}</small></div>`).join("");
  s.classList.remove("hidden");
  s.querySelectorAll("[data-me]").forEach(d => d.onmousedown = ev => { ev.preventDefault(); pickMention(d.dataset.me); });
}
function pickMention(email){
  const tx = $("#tx"), x = MEM.find(y => y.email === email); if (!x) return;
  const p = tx.selectionStart, before = tx.value.slice(0, p).replace(/@([^\s@]{0,20})$/, "@" + x.name + " ");
  tx.value = before + tx.value.slice(p); tx.focus(); tx.setSelectionRange(before.length, before.length);
  MENT.set(email, x.name); $("#sug").classList.add("hidden"); tx.oninput();
}
let TMP = -1;
async function send(payload, local){
  const tmp = { id: TMP--, c: CUR, by: BOOK.me.email, name: BOOK.me.name, kind: local.kind || "text", body: payload.text || "", file: local.file || null, dur: payload.dur || 0, reply: payload.reply || 0,
    mentions: payload.mentions || [], reactions: {}, at: new Date().toISOString() };
  MSGS.push(tmp); paintMsgs(true);
  try {
    const r = await api("chat/send", { c: CUR, ...payload });
    const i = MSGS.indexOf(tmp);
    if (MSGS.some(x => x.id === r.msg.id)) MSGS.splice(i, 1); else MSGS[i] = r.msg;
    paintMsgs(true);
  } catch (e){ MSGS.splice(MSGS.indexOf(tmp), 1); paintMsgs(false); toast(e.message, true); throw e; }
}
async function sendText(){
  const tx = $("#tx"), text = tx.value.trim(); if (!text) return;
  const mentions = [...MENT].filter(([, n]) => text.includes("@" + n)).map(([e]) => e);
  const reply = REPLY ? REPLY.id : 0;
  tx.value = ""; REPLY = null; MENT = new Map(); paintComposer(); $("#tx").focus();
  try { await send({ text, mentions, reply }, { kind: "text" }); } catch { const t = $("#tx"); if (t && !t.value) { t.value = text; t.oninput(); } }
}
/* photos are made smaller before sending (max 1600 px, JPEG) */
async function shrink(file){
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .82);
  } catch { return null; } finally { URL.revokeObjectURL(url); }
}
const readData = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
async function sendFile(file, asPhoto){
  if (!file || !CUR) return;
  if (file.size > 15 * 1024 * 1024) return toast("The file is larger than 15 MB", true);
  $("#att") && $("#att").classList.add("hidden");
  const reply = REPLY ? REPLY.id : 0; REPLY = null; paintComposer();
  try {
    if (asPhoto && /^image\//.test(file.type)){
      const data = (await shrink(file)) || await readData(file);
      await send({ kind: "photo", data, name: (file.name || "photo").replace(/\.\w+$/, "") + ".jpg", reply }, { kind: "photo" });
    } else {
      const data = await readData(file);
      await send({ kind: "file", data, name: file.name || "file", reply }, { kind: "file", file: { name: file.name, size: file.size } });
    }
  } catch {}
}
$("#fCam").onchange = ev => { const f = ev.target.files[0]; ev.target.value = ""; sendFile(f, true); };
$("#fAny").onchange = ev => { const f = ev.target.files[0]; ev.target.value = ""; sendFile(f, /^image\//.test(f && f.type || "") && ev.target.accept === "image/*"); };
/* voice notes */
async function startRec(){
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("This browser cannot record voice notes", true);
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); } catch { return toast("Allow the microphone for the hub", true); }
  const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [];
  rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  REC_ST = { rec, stream, chunks, t0: Date.now(), cancel: false, timer: 0 };
  rec.onstop = async () => {
    const st = REC_ST; REC_ST = null; clearInterval(st.timer); st.stream.getTracks().forEach(t => t.stop()); paintComposer();
    if (st.cancel || !chunks.length) return;
    const secs = Math.max(1, Math.round((Date.now() - st.t0) / 1000));
    const blob = new Blob(chunks, { type: rec.mimeType || type || "audio/webm" });
    const ext = /mp4/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";
    const reply = REPLY ? REPLY.id : 0; REPLY = null;
    try { await send({ kind: "voice", data: await readData(blob), name: `voice-note.${ext}`, dur: secs, reply }, { kind: "voice" }); } catch {}
  };
  rec.start(); paintComposer();
  REC_ST.timer = setInterval(() => { const t = $("#recT"); if (t && REC_ST) t.textContent = dur(Math.round((Date.now() - REC_ST.t0) / 1000)); if (REC_ST && Date.now() - REC_ST.t0 > 300000) stopRec(false); }, 500);
}
function stopRec(cancel){ if (!REC_ST) return; REC_ST.cancel = cancel; try { REC_ST.rec.stop(); } catch {} }

/* ---------- chat info (groups: name, members, admins, settings; everyone: mute) ---------- */

  const c = CONV, me = BOOK ? BOOK.me.email : "";

    ${m.role === "admin" ? '<span class="tag">Group admin</span>' : ""}${c.canEdit && m.email !== me ? `<button class="btn ghost small" data-mm="${esc(m.email)}">⋯</button>` : ""}</div>`;
  openSheet(`<div class="dlg-h"><b>${c.kind === "dm" ? "Chat info" : "Group info"}</b><small>${c.kind === "dm" ? esc(c.name) : `${MEM.length} members${c.auto ? " · follows People & roles" : ""}`}</small></div><div class="dlg-b">
    ${c.kind === "group" && c.canEdit ? `<label class="lbl">Group name</label><input class="inp" id="gName" style="width:100%" value="${esc(c.name)}">` : ""}
    <label class="tgl">🔕 Mute notifications<input type="checkbox" id="gMute" ${c.muted ? "checked" : ""}></label>
    ${c.kind === "group" && c.canEdit ? `<label class="tgl">📢 Only admins can send<input type="checkbox" id="gAnn" ${c.announce ? "checked" : ""}></label>
      ${c.auto ? "" : `<label class="tgl">Members can add people<input type="checkbox" id="gAdd" ${c.membersAdd ? "checked" : ""}></label>`}` : ""}
    ${c.kind === "group" ? `<div class="grp" style="display:flex;justify-content:space-between;align-items:center">Members · ${MEM.length}${c.canAdd ? `<button class="btn small" id="gAddP">＋ Add people</button>` : ""}</div>${MEM.map(mrow).join("")}` : ""}
    ${c.kind === "group" && c.auto ? `<p class="note">The hub keeps this group's members in step with People &amp; roles. People added by hand stay until removed.</p>` : ""}
  </div><div class="dlg-f">${c.kind === "group" && !c.auto ? `<button class="btn ghost danger" id="gLeave" style="margin-right:auto">Exit group</button>` : ""}<button class="btn ghost" id="gX">Close</button>${c.kind === "group" && c.canEdit ? `<button class="btn" id="gSave">Save</button>` : ""}</div>`);
  $("#gX").onclick = () => dlg.close();
  $("#gMute").onchange = async ev => { try { await api("chat/mute", { c: CUR, muted: ev.target.checked }); CONV.muted = ev.target.checked; paintHead(); P && P.refresh && P.refresh(); toast(ev.target.checked ? "Muted — @mentions still notify you" : "Notifications on"); } catch (e){ toast(e.message, true); } };
  const sv = $("#gSave"); if (sv) sv.onclick = async () => {
    try { await api("chat/group", { c: CUR, name: $("#gName").value.trim(), announce: $("#gAnn").checked, ...($("#gAdd") ? { membersAdd: $("#gAdd").checked } : {}) }); dlg.close(); toast("Saved"); loadConv(); } catch (e){ toast(e.message, true); } };
  const lv = $("#gLeave"); if (lv) lv.onclick = async () => { if (!confirm("Exit this group?")) return; try { await api("chat/leave", { c: CUR }); dlg.close(); closeChat(); } catch (e){ toast(e.message, true); } };
  const ap = $("#gAddP"); if (ap) ap.onclick = () => pickPeople("Add people", MEM.map(m => m.email), async list => { await api("chat/group", { c: CUR, add: list }); toast("Added"); loadConv(); });
  dlg.querySelectorAll("[data-mm]").forEach(b => b.onclick = () => {
    const m = MEM.find(x => x.email === b.dataset.mm);
    openSheet(`<div class="dlg-h"><b>${esc(m.name)}</b><small>${esc(m.position || "")}</small></div><div class="dlg-b"><div class="mact">
      <button data-a="admin">${m.role === "admin" ? "Remove as group admin" : "Make group admin"}</button>${m.auto ? "" : `<button data-a="rm" class="bad">Remove from the group</button>`}</div>
      ${m.auto ? `<p class="note">${esc(m.name.split(" ")[0])} is in this group through People &amp; roles.</p>` : ""}</div><div class="dlg-f"><button class="btn ghost" data-a="x">Back</button></div>`);
    dlg.querySelectorAll("[data-a]").forEach(x => x.onclick = async () => {
      try {
        if (x.dataset.a === "admin") await api("chat/group", { c: CUR, roles: { [m.email]: m.role === "admin" ? "member" : "admin" } });
        if (x.dataset.a === "rm"){ if (!confirm(`Remove ${m.name}?`)) return; await api("chat/group", { c: CUR, remove: [m.email] }); }
        if (x.dataset.a !== "x") toast("Saved");
        await loadConv(); info();
      } catch (e){ toast(e.message, true); }
    });
  });
}

/* ---------- people picker (new group, add people) ---------- */
function pickPeople(title, exclude, done, extraHtml = "", onExtra){
  const sel = new Set(); let q = "";
  const teams = [["", "Add a whole team…"], ...GROUPS.filter(g => g[0] !== "LEAD").map(([c, n]) => [c, n + " · everyone"]), ["MGR", "All flagship managers"], ["LEAD", "Leadership & administration"]];
  const draw = () => {
    const L = BOOK.people.filter(p => p.email !== BOOK.me.email && !exclude.includes(p.email) && (!q || (p.name + " " + p.position + " " + p.siteName + " " + p.ext).toLowerCase().includes(q.toLowerCase())));
    $("#pkL").innerHTML = L.map(p => `<label class="pk"><input type="checkbox" value="${esc(p.email)}" ${sel.has(p.email) ? "checked" : ""}>${av(p)}<span class="tx"><b>${esc(p.name)}</b><small>${esc(p.position || "")}${p.siteName ? " · " + esc(p.siteName) : ""}</small></span><span class="muted" style="font-size:.78rem">${esc(p.ext || "")}</span></label>`).join("") || `<p class="muted">No one found.</p>`;
    $("#pkL").querySelectorAll("input").forEach(i => i.onchange = () => { i.checked ? sel.add(i.value) : sel.delete(i.value); $("#pkN").textContent = sel.size + " selected"; });
    $("#pkN").textContent = sel.size + " selected";
  };
  openSheet(`<div class="dlg-h"><b>${esc(title)}</b><small id="pkN">0 selected</small></div><div class="dlg-b">${extraHtml}
    <input class="inp" id="pkQ" placeholder="Search people" style="width:100%;margin-bottom:6px"><select class="sel" id="pkT" style="width:100%;margin-bottom:6px">${teams.map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join("")}</select><div id="pkL"></div></div>
    <div class="dlg-f"><button class="btn ghost" id="pkX">Cancel</button><button class="btn" id="pkGo">Done</button></div>`);
  $("#pkQ").oninput = ev => { q = ev.target.value; draw(); };
  $("#pkT").onchange = ev => { const v = ev.target.value; if (!v) return;
    BOOK.people.filter(p => p.email !== BOOK.me.email && !exclude.includes(p.email) && (v === "LEAD" ? p.lead : v === "MGR" ? /Manager/.test(p.position) : p.site === v && !p.lead)).forEach(p => sel.add(p.email));
    ev.target.value = ""; draw(); };
  $("#pkX").onclick = () => dlg.close();
  $("#pkGo").onclick = async () => { if (!sel.size) return toast("Choose at least one person", true); const b = $("#pkGo"); b.disabled = true;
    try { await done([...sel]); if (dlg.open && $("#pkGo")) dlg.close(); } catch (e){ toast(e.message, true); b.disabled = false; } };
  onExtra && onExtra();
  draw();
}
/* ＋ : new chat (anyone) · new group (leadership & administrators) */
$("#newb").onclick = () => {
  if (!BOOK) return;
  let q = "";
  const draw = () => {
    const L = BOOK.people.filter(p => p.email !== BOOK.me.email && (!q || (p.name + " " + p.position + " " + p.siteName + " " + p.ext).toLowerCase().includes(q.toLowerCase())));

function newGroup(){

/* ---------- live events from the hub (Hub Phone connection) ---------- */
function onChat(m){
  if (m.ev === "msg"){
    if (CUR && m.c === CUR){
      if (!MSGS.some(x => x.id === m.msg.id)){
        if (BOOK && m.msg.by === BOOK.me.email && MSGS.some(x => x.id < 0)) return;   // my own message: the send answer places it
        MSGS.push(m.msg); paintMsgs(false); markRead();
        const box = $("#ms"); if (box.scrollHeight - box.scrollTop - box.clientHeight < 240) box.scrollTop = box.scrollHeight;
      }
    }
    loadChatsSoon(); return;
  }
  if (m.ev === "read" && CUR && m.c === CUR){ const x = MEM.find(y => y.email === m.email); if (x){ x.lastRead = Math.max(x.lastRead, m.upTo); paintMsgs(false); } return; }
  if (m.ev === "react" && CUR && m.c === CUR){ const x = MSGS.find(y => y.id === m.id); if (x){ x.reactions = m.reactions; paintMsgs(false); } return; }
  if (m.ev === "del" && CUR && m.c === CUR){ const x = MSGS.find(y => y.id === m.id); if (x){ x.deleted = true; paintMsgs(false); } loadChatsSoon(); return; }
  if (m.ev === "conv"){ if (CUR && m.c === CUR) loadConv(); loadChatsSoon(); }
}
/* without the hub around this page (opened on its own): check every few seconds */
setInterval(async () => {
  if (P || document.hidden) return;
  if (CUR && MSGS.length){ try { const r = await api(`chat/msgs?c=${encodeURIComponent(CUR)}&after=${Math.max(...MSGS.map(x => x.id))}`); if (r.msgs.length){ MSGS.push(...r.msgs); paintMsgs(false); markRead(); } } catch {} }
  else if (TAB === "chats") loadChats();
}, 6000);

if (P){ paintConn(P.state()); const off = P.on(s => { paintConn(s); if (!s.inCall) setTimeout(loadRecent, 1500); }); const off2 = P.onChat ? P.onChat(onChat) : () => {};
  addEventListener("pagehide", () => { off(); off2(); P.viewing && P.viewing(""); }); }
paint();
loadBook().then(() => { if (CUR && CONV){ paintHead(); paintMsgs(false); } }); loadRecent(); loadChats();
if (QS.get("c") && CAN_CHAT){ TAB = "chats"; paint(); openChat(QS.get("c")); }
setInterval(() => { if (!document.hidden) loadBook(); }, 30000);
