<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventive Maintenance · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
/* Preventive Maintenance (Upcoming - Testing) — docs/FEATURE-pm.md */
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font:inherit;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--text)}
.tabs2 button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs2 .n{display:inline-block;min-width:18px;border-radius:9px;background:#E5484D;color:#fff;font-size:.68rem;padding:1px 5px;margin-left:5px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.78rem;color:var(--muted)}
.kp b{display:block;font-size:1.4rem;color:var(--text)}
.kp .warn b{color:#B8740F}.kp .bad b{color:#C2283C}
.sec{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cy{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.cy:hover{border-color:var(--brand-2)}
.cy b{font-size:1rem;display:block}.cy small{color:var(--muted);font-size:.78rem}
.prog{height:8px;border-radius:4px;background:var(--paper);overflow:hidden;margin:10px 0 6px}.prog i{display:block;height:100%;background:#2E9E5B}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.ch{font-size:.7rem;font-weight:800;border-radius:99px;padding:3px 8px}
.c-missing{background:#EEE9F4;color:#6B5F80}.c-pending{background:#FFF1D6;color:#8A6200}.c-approved{background:#E3F4EA;color:#1E7A4F}.c-rejected{background:#FDECEC;color:#B0283C}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:.82rem;min-width:640px}
.t th{text-align:left;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t td .inp,.t td .sel{height:34px;width:100%;min-width:120px}
.q{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.q .m{flex:1;min-width:200px}.q b{display:block}.q small{color:var(--muted);font-size:.78rem}
.q .rj{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.nx{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap}
.nx .m{flex:1;min-width:180px}.nx .m b{display:block}.nx small{color:var(--muted);font-size:.78rem}
.warnbox{background:rgba(224,168,46,.12);border:1px solid rgba(224,168,46,.4);border-radius:12px;padding:10px 12px;font-size:.84rem;margin-bottom:12px}
.muted2{color:var(--muted);font-size:.82rem}
.risk{font-size:.7rem;font-weight:800;border-radius:6px;padding:2px 6px}.r-High{background:#FDECEC;color:#B0283C}.r-Medium{background:#FFF1E2;color:#B85C00}.r-Low{background:#FFF9D9;color:#8A6E00}
</style>
</head>
<body>
<div class="top">
  <h1>Preventive Maintenance <small id="sub"></small></h1>
  <span id="siteBox"></span>
</div>
<div class="wrap">
  <div class="tabs2" id="tabs"></div>
  <div id="view"><p class="muted">Loading…</p></div>
</div>
<input type="file" id="xl" accept=".xlsx,.csv,.xls" hidden>
<script src="common.js"></script>
<script>
let CTX = null, H = null, TAB = "home", CY = null;
const CATS = { charcoal: "F&B with charcoal", nocharcoal: "F&B without charcoal", retail: "Retail" };
const ST = { missing: "Missing", pending: "Pending review", approved: "Approved", rejected: "Rejected" };
const MN = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fd = d => d ? new Date(d.length > 10 ? d : d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: d.length > 10 ? "Asia/Beirut" : "UTC" }) : "";

async function boot(site){
  CTX = await api("ops/context" + (site ? "?site=" + site : ""));
  $("#siteBox").innerHTML = siteSelect(CTX, s => { CY = null; boot(s); });
  await load();
}
async function load(){
  H = await api(`ops/pm/home?site=${CTX.site}`);
  $("#sub").textContent = H.siteName;
  tabs(); show();
}
function tabs(){
  const T = [["home", "Overview"], ["review", "Review", H.pendingReview], ["tenants", "Tenants"], ["setup", "Setup"], ["breach", "Breaches"]];
  $("#tabs").innerHTML = T.map(([k, n, c]) => `<button data-t="${k}" class="${TAB === k ? "on" : ""}">${n}${c ? `<span class="n">${c}</span>` : ""}</button>`).join("");
  $("#tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { TAB = b.dataset.t; CY = null; tabs(); show(); });
}
const V = h => { $("#view").innerHTML = h; };
async function show(){
  if (TAB === "home") return CY ? cycleView(CY) : home();
  if (TAB === "review") return review();
  if (TAB === "tenants") return tenants();
  if (TAB === "setup") return setup();
  if (TAB === "breach") return breaches();
}

/* ---------- overview ---------- */
function home(){
  const t = H.tenants || {};
  const warn = [!H.setup && "The setup is empty — import the Technical team's Excel in <b>Setup</b>.", !t.n && "No tenant yet — fill them in <b>Tenants</b>.",
    t.nocat && `${t.nocat} tenant${t.nocat === 1 ? " has" : "s have"} no category — they are skipped until it is set.`, t.nomail && `${t.nomail} tenant${t.nomail === 1 ? " has" : "s have"} no email — they get a PM but no email.`].filter(Boolean);
  V(`${warn.length ? `<div class="warnbox">${warn.join("<br>")}</div>` : ""}
    <div class="kp"><div><b>${H.setup}</b>Certificates in the setup</div><div><b>${t.n || 0}</b>Tenants</div><div class="${H.pendingReview ? "warn" : ""}"><b>${H.pendingReview}</b>Waiting for review</div>
      <div class="${H.ext.length ? "warn" : ""}"><b>${H.ext.length}</b>Extensions to approve</div></div>
    ${H.ext.length ? `<div class="sec">Deadline extensions to approve</div>${H.ext.map(e => `<div class="nx"><div class="m"><b>${esc(e.month)} · <span class="risk r-${e.risk}">${e.risk}</span> → ${esc(fd(e.deadline))}</b><small>Asked by ${esc(e.requested_by)}${e.note ? " · " + esc(e.note) : ""}</small></div>
      ${H.boss ? `<button class="btn small" data-ex="${e.id}" data-d="approve">Approve</button><button class="btn ghost small" data-ex="${e.id}" data-d="refuse">Refuse</button>` : `<small class="muted2">Management approves</small>`}</div>`).join("")}` : ""}
    <div class="sec">Next PM months</div>
    ${H.next.length ? H.next.map(n => { const open = H.cycles.find(c => c.month === n.month);
      return `<div class="nx"><div class="m"><b>${esc(n.label)}</b><small>Opens ${esc(fd(n.launch))} (15 days before) · deadline ${esc(fd(n.deadline))}</small></div>
        ${open ? `<span class="ch c-approved">Open</span>` : H.ops ? `<button class="btn small" data-open="${n.month}">Open now</button>` : `<small class="muted2">Opens automatically</small>`}</div>`; }).join("") : `<p class="muted2">No month in the setup for ${esc(H.siteName)} yet.</p>`}
    <div class="sec">PM months</div>
    ${H.cycles.length ? `<div class="cards">${H.cycles.map(c => `<div class="cy" data-cy="${c.id}"><b>${esc(c.label)}</b><small>Deadline ${esc(fd(c.deadline))}</small>
        <div class="prog"><i style="width:${c.tenants ? Math.round(c.done / c.tenants * 100) : 0}%"></i></div>
        <div class="chips"><span class="ch c-approved">${c.done}/${c.tenants} complete</span>${c.pending ? `<span class="ch c-pending">${c.pending} to review</span>` : ""}${c.open ? `<span class="ch c-missing">${c.open} missing</span>` : ""}${c.breach ? `<span class="ch c-rejected">${c.breach} breach</span>` : ""}</div></div>`).join("")}</div>`
      : `<p class="muted2">No PM month opened yet. Each month opens by itself 15 days before, or press “Open now”.</p>`}`);
  $("#view").querySelectorAll("[data-cy]").forEach(x => x.onclick = () => { CY = +x.dataset.cy; show(); });
  $("#view").querySelectorAll("[data-open]").forEach(b => b.onclick = async () => {
    if (!confirm(`Open ${b.closest(".nx").querySelector("b").textContent} now and email every tenant their link?`)) return;
    b.disabled = true; try { const r = await api("ops/pm/launch", { site: CTX.site, month: b.dataset.open }); toast(`Opened · ${r.records} tenants · ${r.mailed} emailed`); load(); } catch (e){ b.disabled = false; toast(e.message, true); } });
  $("#view").querySelectorAll("[data-ex]").forEach(b => b.onclick = async () => { b.disabled = true;
    try { await api("ops/pm/ext/decide", { site: CTX.site, id: +b.dataset.ex, decision: b.dataset.d }); toast(b.dataset.d === "approve" ? "Extension approved — deadlines updated" : "Extension refused"); load(); } catch (e){ b.disabled = false; toast(e.message, true); } });
}
async function cycleView(id){
  V(`<p class="muted">Loading…</p>`);
  const C = await api(`ops/pm/cycle?site=${CTX.site}&id=${id}`);
  const R = C.records, done = R.filter(r => r.done).length;
  V(`<button class="btn ghost small" id="back">‹ Back</button>
    <h2 style="margin:10px 0 2px">${esc(C.cycle.label)}</h2><p class="muted2">Deadline ${esc(fd(C.cycle.deadline))} · breach list on ${esc(fd(C.cycle.breachDay))} · ${done}/${R.length} tenants complete</p>
    ${H.ops ? `<div class="nx" style="margin-top:12px"><div class="m"><b>Ask for a deadline extension</b><small>By risk level — management approves. A tenant gets the deadline of its highest-risk certificate still open.</small></div>
      <select class="sel" id="exR" style="width:auto"><option>High</option><option>Medium</option><option>Low</option></select><input type="date" class="inp" id="exD" style="width:auto" min="${C.cycle.deadline}">
      <input class="inp" id="exN" placeholder="Reason (optional)" style="width:180px"><button class="btn small" id="exGo">Ask</button></div>` : ""}
    ${C.ext.length ? `<p class="muted2" style="margin:6px 0 10px">${C.ext.map(e => `${e.risk} → ${esc(fd(e.deadline))} · ${e.status}`).join(" · ")}</p>` : ""}
    <div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Tenant</th><th>Certificates</th><th>Deadline</th><th></th></tr></thead><tbody>
    ${R.map(r => `<tr><td><b>${esc(r.brand)}</b><br><span class="muted2">${esc(r.category)}${r.opened ? " · link opened" : ""}</span>${r.breach ? `<br><span class="ch c-rejected">Breach ${esc(fd(r.breach))}</span>` : r.done ? `<br><span class="ch c-approved">Complete</span>` : ""}</td>
      <td><div class="chips">${r.certs.map(c => `<span class="ch c-${c.status}" title="${esc(ST[c.status])}${c.reason ? " — " + esc(c.reason) : ""}">${esc(c.cert)}</span>`).join("")}</div></td>
      <td>${esc(fd(r.deadline))}</td>
      <td style="white-space:nowrap">${H.ops ? `<button class="btn ghost small" data-rs="${r.id}" data-em="${esc(r.emails)}">✉ Resend</button> <button class="btn ghost small" data-cp="${esc(r.link)}">🔗</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>`);
  $("#back").onclick = () => { CY = null; show(); };
  const eg = $("#exGo"); if (eg) eg.onclick = async () => { try { await api("ops/pm/ext/request", { site: CTX.site, cycle: id, risk: $("#exR").value, deadline: $("#exD").value, note: $("#exN").value }); toast("Sent to management for approval"); load(); } catch (e){ toast(e.message, true); } };
  $("#view").querySelectorAll("[data-cp]").forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.cp).then(() => toast("Tenant link copied"), () => toast(b.dataset.cp)));
  $("#view").querySelectorAll("[data-rs]").forEach(b => b.onclick = async () => {
    const em = prompt("Send the link again to (emails, comma-separated):", b.dataset.em || ""); if (em === null) return;
    try { await api("ops/pm/resend", { site: CTX.site, id: +b.dataset.rs, emails: em }); toast("Link sent"); } catch (e){ toast(e.message, true); } });
}

/* ---------- review ---------- */
async function review(){
  V(`<p class="muted">Loading…</p>`);
  const Q = await api(`ops/pm/queue?site=${CTX.site}`);
  if (!Q.list.length) return V(`<div class="card empty" style="padding:22px">Nothing waiting for review. ✓</div>`);
  V(Q.list.map(c => `<div class="q" id="q${c.id}"><div class="m"><b>${esc(c.brand)} · ${esc(c.cert)}</b><small>${esc(c.month)} · <span class="risk r-${c.risk}">${c.risk}</span> · uploaded ${esc(fd(c.at))} · ${esc(c.file)}</small></div>
      <a class="btn ghost small" target="_blank" href="/api/ops/pm/file?site=${CTX.site}&id=${c.id}">👁 View</a>
      ${H.ops ? `<button class="btn small" data-ok="${c.id}">✓ Approve</button><button class="btn ghost small danger" data-no="${c.id}">✗ Reject</button>
      <div class="rj hidden" id="rj${c.id}"><select class="sel" style="width:auto" id="rr${c.id}"><option value="">Reason…</option>${Q.reasons.map(r => `<option>${esc(r)}</option>`).join("")}</select>
        <input class="inp" id="rc${c.id}" placeholder="Comment for the tenant (optional)" style="flex:1;min-width:160px"><button class="btn small danger" data-rjgo="${c.id}">Reject and tell the tenant</button></div>` : ""}</div>`).join(""));
  const go = async (id, body) => { try { await api("ops/pm/review", { site: CTX.site, id, ...body }); $("#q" + id).remove(); H.pendingReview--; tabs(); toast(body.decision === "approve" ? "Approved" : "Rejected — the tenant was emailed"); } catch (e){ toast(e.message, true); } };
  $("#view").querySelectorAll("[data-ok]").forEach(b => b.onclick = () => go(+b.dataset.ok, { decision: "approve" }));
  $("#view").querySelectorAll("[data-no]").forEach(b => b.onclick = () => $("#rj" + b.dataset.no).classList.toggle("hidden"));
  $("#view").querySelectorAll("[data-rjgo]").forEach(b => b.onclick = () => { const id = +b.dataset.rjgo, reason = $("#rr" + id).value; if (!reason) return toast("Choose the reason", true); go(id, { decision: "reject", reason, comment: $("#rc" + id).value }); });
}

/* ---------- tenants ---------- */
async function tenants(){
  V(`<p class="muted">Loading…</p>`);
  const T = await api(`ops/pm/tenants?site=${CTX.site}`);
  V(`${H.ops ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn small" id="fill">⇣ Fill from GLA &amp; Directory</button><button class="btn ghost small" id="imp">Import Excel</button>
      <span class="muted2" style="align-self:center">Excel columns: Brand · Category · Email(s) · Units · Active since (optional: Flagship)</span></div>` : ""}
    <p class="muted2" style="margin-bottom:8px">${T.list.length} tenants · a tenant needs a <b>category</b> to get a PM, and an <b>email</b> to receive it. Tenants open for less than 6 months are skipped.</p>
    <div class="tw"><table class="t"><thead><tr><th>Brand</th><th>Category</th><th>Emails</th><th>Active since</th><th>Skip</th></tr></thead><tbody>
    ${T.list.map((t, i) => `<tr data-i="${i}"><td><b>${esc(t.brand)}</b><br><span class="muted2">${esc(t.units)}</span></td>
      <td><select class="sel" data-f="category" ${H.ops ? "" : "disabled"}><option value="">— choose —</option>${Object.entries(CATS).map(([k, n]) => `<option value="${k}" ${t.category === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></td>
      <td><input class="inp" data-f="emails" value="${esc(t.emails)}" placeholder="manager@brand.com" ${H.ops ? "" : "disabled"}></td>
      <td><input class="inp" type="date" data-f="since" value="${esc(t.since)}" ${H.ops ? "" : "disabled"}></td>
      <td><input type="checkbox" data-f="excluded" ${t.excluded ? "checked" : ""} ${H.ops ? "" : "disabled"}></td></tr>`).join("") || `<tr><td colspan="5" class="muted2">No tenant yet — press “Fill from GLA &amp; Directory”.</td></tr>`}
    </tbody></table></div>`);
  $("#view").querySelectorAll("tr[data-i]").forEach(tr => tr.querySelectorAll("[data-f]").forEach(el => el.onchange = async () => {
    const t = T.list[+tr.dataset.i]; t[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
    try { await api("ops/pm/tenants/save", { site: CTX.site, ...t }); toast("Saved"); } catch (e){ toast(e.message, true); } }));
  const fl = $("#fill"); if (fl) fl.onclick = async () => { fl.disabled = true; try { const r = await api("ops/pm/tenants/fill", { site: CTX.site }); toast(`${r.added} tenants from GLA`); H = await api(`ops/pm/home?site=${CTX.site}`); tenants(); } catch (e){ fl.disabled = false; toast(e.message, true); } };
  const im = $("#imp"); if (im) im.onclick = () => pickSheet("ops/pm/tenants/import", r => { toast(`${r.imported} tenants imported`); tenants(); });
}
function pickSheet(path, done){
  const f = $("#xl"); f.value = "";
  f.onchange = () => { const file = f.files[0]; if (!file) return; const fr = new FileReader();
    fr.onload = async () => { try { done(await api(path, { site: CTX.site, name: file.name, data: fr.result })); H = await api(`ops/pm/home?site=${CTX.site}`); tabs(); } catch (e){ toast(e.message, true); } };
    fr.readAsDataURL(file); };
  f.click();
}

/* ---------- setup ---------- */
async function setup(){
  V(`<p class="muted">Loading…</p>`);
  const S = await api(`ops/pm/setup?site=${CTX.site}`);
  V(`${H.ops ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"><button class="btn small" id="imp">Import the Technical team's Excel</button><button class="btn ghost small" id="tpl">⇣ Template</button>
      <span class="muted2">Columns: Certificate Name · Risk (High / Medium / Low) · Category · Branch · one column per month (✓ / x / yes). Importing replaces the setup.</span></div>` : ""}
    ${S.list.length ? `<div class="tw"><table class="t"><thead><tr><th>Certificate</th><th>Risk</th><th>Categories</th><th>Flagships</th><th>Months</th></tr></thead><tbody>
      ${S.list.map(r => `<tr><td><b>${esc(r.cert)}</b></td><td><span class="risk r-${r.risk}">${r.risk}</span></td><td>${r.cats.map(c => esc(CATS[c] || c)).join("<br>")}</td>
        <td>${r.sites.map(s => esc((CTX.sites && CTX.sites[s]) || s)).join("<br>")}</td><td>${r.months.map(m => MN[m]).join(" · ")}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty" style="padding:22px">No setup yet. Import the Technical team's Excel (the certificate matrix).</div>`}`);
  const im = $("#imp"); if (im) im.onclick = () => pickSheet("ops/pm/setup", r => { toast(`${r.imported} certificates imported`); setup(); });
  const tp = $("#tpl"); if (tp) tp.onclick = () => {
    const rows = [["Certificate Name", "Risk", "Category", "Branch", "February", "April", "June", "August", "October", "December"],
      ["Fire Alarm", "High", "Retail, F&B with Charcoal, F&B without Charcoal", "Verdun Mall, Achrafieh Mall, Dbayeh Department Store", "x", "", "x", "", "x", ""],
      ["Hood Grease and Odor filters cleaning", "High", "F&B with Charcoal, F&B without Charcoal", "Verdun Mall", "x", "x", "x", "x", "x", "x"]];
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = "PM setup template.csv"; a.click(); };
}

/* ---------- breaches ---------- */
async function breaches(){
  V(`<p class="muted">Loading…</p>`);
  const B = await api(`ops/pm/breaches?site=${CTX.site}`);
  V(`<p class="muted2" style="margin-bottom:10px">Tenants whose certificates were not all approved 5 days after their deadline. Raise each one in the portal: <b>Beneficiary's Non-Performance of preventive maintenance · $${B.penalty}</b>.</p>
    ${B.list.length ? `<button class="btn small" id="csv" style="margin-bottom:10px">⇣ Export for the portal (CSV)</button><div class="tw"><table class="t"><thead><tr><th>Tenant</th><th>PM month</th><th>Deadline</th><th>Not approved</th><th>Penalty</th></tr></thead><tbody>
      ${B.list.map(r => `<tr><td><b>${esc(r.brand)}</b><br><span class="muted2">${esc(r.category)}</span></td><td>${esc(r.month)}</td><td>${esc(fd(r.deadline))}</td><td>${esc(r.missing)}</td><td>$${r.amount}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty" style="padding:22px">No breach. ✓</div>`}`);
  const c = $("#csv"); if (c) c.onclick = () => {
    const rows = [["Flagship", "Tenant", "Category", "PM month", "Deadline", "Certificates not approved", "Violation type", "Penalty (USD)"], ...B.list.map(r => [H.siteName, r.brand, r.category, r.month, r.deadline, r.missing, r.violation, r.amount])];
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = `PM breaches ${H.siteName}.csv`; a.click(); };
}
window.hubRefresh = () => load();
boot().catch(e => V(`<p class="muted">${esc(e.message)}</p>`));
</script>
</body>
</html>
