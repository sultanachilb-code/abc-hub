<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
.list{display:grid;gap:10px;margin-top:14px}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%}
.hrow:hover{border-color:var(--brand-2)}
.hrow .main{flex:1;min-width:0}
.hrow .main small{color:var(--muted);font-size:.82rem}
.newbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.doc{max-width:980px;margin:14px auto 0;background:var(--surface);border:1.5px solid #2F3B52;border-radius:4px}
.hd{background:var(--blueHead);color:#10203F;font-weight:800;padding:8px 12px;display:flex;align-items:center;gap:10px;border-top:1.5px solid #2F3B52}
:root[data-theme="dark"] .hd{color:#E6ECFA}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hd{color:#E6ECFA} }
.hd:first-child{border-top:0}
.hd .sp{flex:1}
.add{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.55);color:#10203F}
.sub{background:var(--blueSoft);font-weight:800;padding:7px 12px;color:#1F3A73}
:root[data-theme="dark"] .sub{color:#C9D6F5}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sub{color:#C9D6F5} }
.items{padding:6px 10px 10px}
.it{display:grid;grid-template-columns:18px 1fr auto auto 30px;gap:8px;align-items:center;padding:3px 0}
.it.dated{grid-template-columns:18px 150px 1fr auto 30px}
.it .dot{width:7px;height:7px;background:#4472C4;border-radius:1px;justify-self:center}
.it input[type=text],.it textarea{border:0;border-bottom:1px dashed transparent;background:transparent;padding:5px 2px;outline:none;width:100%;color:#2F5597;font-size:.92rem;resize:none;line-height:1.35;border-radius:0}
:root[data-theme="dark"] .it input[type=text],:root[data-theme="dark"] .it textarea{color:#9DB8EE}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .it input[type=text], :root:not([data-theme="light"]) .it textarea{color:#9DB8EE} }
.it input[type=text]:focus,.it textarea:focus{border-bottom-color:var(--brand-2)}
.it.cctv textarea{font-weight:700}
.it.done textarea{text-decoration:line-through;opacity:.6}
.tg{font-size:.7rem;font-weight:800;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tg.on.c{background:#E5484D;border-color:#E5484D;color:#fff}
.tg.on.d{background:var(--ok);border-color:var(--ok);color:#fff}
.x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:1.05rem}
.x:hover{background:var(--paper);color:var(--alert)}
.emptyrow{color:var(--muted);font-size:.85rem;padding:6px 4px}
table.t{width:100%;border-collapse:collapse}
.t th{background:var(--blueSoft);font-size:.82rem;padding:7px 8px;text-align:left;border:1px solid var(--line)}
.t td{border:1px solid var(--line);padding:0}
.t td input,.t td select{width:100%;border:0;background:transparent;padding:8px;outline:none;font-size:.88rem;min-width:0}
.t td.xx{width:34px;text-align:center}
.t .done{color:var(--ok);font-weight:800}.t .nd{color:var(--alert);font-weight:800}
.notes{padding:10px}
.notes textarea{min-height:110px;border:0;background:transparent}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta .sel,.meta .inp{height:36px}
.banner{margin:12px auto 0;max-width:980px;padding:10px 14px;border-radius:12px;background:rgba(123,75,176,.1);color:var(--brand-2);font-size:.86rem;font-weight:600}
.bar{max-width:980px;margin:14px auto 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.saved{font-size:.8rem;color:var(--muted);margin-right:auto;align-self:center}
@media (max-width:700px){ .it{grid-template-columns:14px 1fr 30px} .it .tg{grid-column:2;justify-self:start} .it.dated{grid-template-columns:14px 1fr 30px} .it.dated input[type=date]{grid-column:2}
  .t{display:block;overflow-x:auto} .t tr{min-width:620px} }
@media print{ .doc{border:1.5px solid #000;max-width:none;margin:0} .x,.add,.tg:not(.on),.bar,.banner,#listView{display:none!important}
  .hd,.sub,.t th,.tg.on{-webkit-print-color-adjust:exact;print-color-adjust:exact} .it input[type=text],.it textarea{color:#2F5597} }
dialog.wide{width:min(760px,calc(100% - 20px))}
.impl{display:grid;gap:4px;padding-left:18px;font-size:.86rem;color:#2F5597}
.t .pr{color:var(--warn);font-weight:800}
.t.live td{padding:8px;font-size:.88rem}
.t.live{margin-bottom:-1px}
</style>
</head>
<body>
<div class="top">
  <h1>Handover <small id="sub"></small></h1>
  <span id="siteBox"></span>
</div>
<div class="wrap" id="app"></div>
<input type="file" id="impFile" accept=".xlsx,.xls,.xlsm,.csv" class="hidden">
<dialog id="dImp" class="wide"></dialog>
<dialog id="dMail"></dialog>

<script src="common.js"></script>
<script>
let CTX = null, H = null, timer = null, dirty = false;
const app = $("#app");
const SEC = [
  ["ongoing", "Scheduled works", "Ongoing follow-up until solved"],
  ["today", "Today", ""],
  ["tomorrow", "Tomorrow", ""],
  ["upcoming", "Coming up", "Dated items move into “Today” automatically on their day"]
];

async function boot(site){
  CTX = await api("ops/context" + (site ? "?site=" + site : ""));
  $("#sub").textContent = CTX.siteName;
  $("#siteBox").innerHTML = siteSelect(CTX, s => boot(s));
  list();
}
async function list(){
  H = null;
  const d = await api(`ops/handover/list?site=${CTX.site}`);
  const hr = new Date().getHours();
  app.innerHTML = `<div id="listView">
    ${CTX.can.handover ? `<div class="card" style="padding:16px"><span class="lbl">Start a handover</span>
      <div class="newbox"><input class="inp" type="date" id="nDay" value="${CTX.today}">
        <button class="btn gold" id="newBtn">Open the day's handover</button>
        <small class="muted">One handover per day, shared by every shift. A new day starts from the last one — open follow-ups, tomorrow's items and events carry over.</small></div></div>` : ""}
    <div class="list">${d.handovers.length ? d.handovers.map(h => `<button class="card hrow" data-id="${h.id}">
        <span class="main"><b>${esc(D.long(h.day))}${h.shift === "AM" ? " · Morning" : h.shift === "PM" ? " · Evening" : ""}</b><br>
        <small>${h.handoffs.length ? h.handoffs.map(x => `${esc(x.by)} ${hm(x.at)}${x.receivedBy ? ` → ${esc(x.receivedBy)}` : ""}`).join(" · ") : `started by ${esc(h.created_name || "—")}`}${h.updated_name ? ` · last edit ${esc(h.updated_name)}` : ""}</small></span>
        ${h.received_by ? `<span class="pill ok">Received</span>` : h.status === "submitted" ? `<span class="pill warn">Awaiting receipt</span>` : `<span class="pill">In progress</span>`}</button>`).join("")
      : `<div class="card empty">No handovers yet for ${esc(CTX.siteName)}.</div>`}</div></div>`;
}
app.addEventListener("click", async e => {
  if (H) return;
  if (e.target.id === "newBtn"){
    const d = await api(`ops/handover/new?site=${CTX.site}&day=${$("#nDay").value}`);
    if (d.existing){ toast("Opened the handover already started for that day"); return open(d.handover.id); }
    H = d.handover; H.can = d.can; dirty = true; LIVE = null; render(); loadLive(); return;
  }
  const r = e.target.closest(".hrow"); if (r) open(Number(r.dataset.id));
});
async function open(id){ const d = await api(`ops/handover/get?id=${id}`); H = d.handover; H.can = d.can; dirty = false; LIVE = null; render(); loadLive(); }
const hm = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
/* live rows for the checklist tracker (AM / PM checklists, restroom inspections OPS and S.S) */
let LIVE = null;
async function loadLive(){
  if (!H) return; const day = H.day;
  try { const d = await api(`ops/handover/live?site=${CTX.site}&day=${day}`); if (H && H.day === day){ LIVE = d; const b = $("#liveBox"); if (b) b.innerHTML = liveHtml(); } }
  catch (e){ LIVE = { error: e.message }; const b = $("#liveBox"); if (b) b.innerHTML = liveHtml(); }
}
function ckCell(r){ return !r ? `<span class="nd">Not done</span>` : r.status === "submitted" ? `<span class="done">Done</span> <small class="muted">${esc(r.by)} · ${hm(r.at)}${r.issues ? ` · ${r.issues} ✗` : ""}</small>` : `<span class="pr">In progress ${r.done}/${r.total}</span> <small class="muted">${esc(r.by)}</small>`; }
function liveHtml(){
  if (!LIVE) return `<div class="emptyrow" style="padding:8px 10px">Loading today's checklists and restroom inspections…</div>`;
  if (LIVE.error) return `<div class="emptyrow" style="padding:8px 10px">${esc(LIVE.error)}</div>`;
  const R = LIVE.restroom || {};
  const wrow = w => { const cls = (n) => n >= R.rooms ? "done" : w.state === "closed" ? "nd" : w.state === "open" ? "pr" : ""; const cell = (n, by) => R.rooms ? `<span class="${cls(n)}">${n}/${R.rooms}</span>${by.length ? ` <small class="muted">${esc(by.join(", "))}</small>` : ""}` : "—";
    return `<tr><td>${esc(w.label)} <small class="muted">${esc(w.time)}</small></td><td>${cell(w.ops, w.opsBy)}</td><td>${cell(w.ss, w.ssBy)}</td></tr>`; };
  return `<table class="t live"><tr><th>From the hub · live</th><th style="width:34%">Status</th><th style="width:30%"></th></tr>
    <tr><td><b>AM Checklist</b></td><td colspan="2">${ckCell(LIVE.am)}</td></tr>
    <tr><td><b>PM Checklist</b></td><td colspan="2">${ckCell(LIVE.pm)}</td></tr></table>
    <table class="t live"><tr><th>Restroom inspections${R.rooms ? ` · ${R.rooms} restrooms` : ""}</th><th style="width:34%">OPS</th><th style="width:30%">S.S</th></tr>
    ${R.error ? `<tr><td colspan="3" class="emptyrow" style="padding:8px">Restroom inspections not available right now (${esc(R.error)}).</td></tr>` : (R.windows || []).map(wrow).join("") || `<tr><td colspan="3" class="emptyrow" style="padding:8px">No inspection windows today.</td></tr>`}</table>`;
}

/* ---------------- document ---------------- */
function itemRow(k, x, i, ro){
  const dated = k === "upcoming";
  return `<div class="it ${dated ? "dated" : ""} ${x.cctv ? "cctv" : ""} ${x.done ? "done" : ""}">
    <span class="dot"></span>
    ${dated ? `<input type="date" class="inp" data-k="${k}" data-i="${i}" data-f="date" value="${esc(x.date)}" ${ro}>` : ""}
    <textarea rows="1" data-k="${k}" data-i="${i}" data-f="text" placeholder="Write the item…" ${ro}>${esc(x.text)}</textarea>
    <button class="tg c ${x.cctv ? "on" : ""}" data-tg="cctv" data-k="${k}" data-i="${i}" ${ro}>ATT CCTV</button>
    ${dated ? "" : `<button class="tg d ${x.done ? "on" : ""}" data-tg="done" data-k="${k}" data-i="${i}" ${ro}>Done</button>`}
    ${ro ? "<span></span>" : `<button class="x" data-rm="${k}" data-i="${i}" title="Remove">×</button>`}</div>`;
}
function render(){
  const d = H.doc, ro = H.can.handover ? "" : "disabled";
  const submitted = H.status === "submitted";
  app.innerHTML = `
  <div class="meta" style="max-width:980px;margin:0 auto">
    <button class="btn ghost small" id="back">‹ All handovers</button>
    <input class="inp" type="date" id="hDay" value="${esc(H.day)}" ${ro}>
    <span class="pill ${H.receivedBy ? "ok" : submitted ? "warn" : ""}">${H.receivedBy ? `Received by ${esc(H.receivedBy)}` : submitted ? "Awaiting receipt" : "In progress"}</span>
    <span style="flex:1"></span>
    ${ro ? "" : `<button class="btn ghost small" id="impBtn" title="Salesforce Handover Report (.xlsx)">⤓ Import tenant requests</button>`}
    <button class="btn ghost small" id="mailBtn">✉ Email in Outlook</button>
    <button class="btn ghost small" id="printBtn">Print / PDF</button>
  </div>
  ${!H.id && H.from ? `<div class="banner">Started from the handover of ${esc(D.fmt(H.from.day, { weekday: "short" }))} — review, then save.</div>` : ""}
  ${(H.handoffs || []).length ? `<div class="banner" style="background:var(--paper);color:var(--text);font-weight:500">Hand-offs today: ${H.handoffs.map(x => `<b>${esc(x.by)}</b> ${hm(x.at)}${x.receivedBy ? ` → received by <b>${esc(x.receivedBy)}</b> ${hm(x.receivedAt)}` : ` → <span style="color:var(--warn)">not received yet</span>`}`).join(" · ")}</div>` : ""}
  <div class="doc">
    ${SEC.map(([k, title, subtitle], si) => `
      ${si === 0 ? `<div class="hd">${esc(title)}<span class="sp"></span></div><div class="sub" style="display:flex;align-items:center">${esc(subtitle)}<span style="flex:1"></span>${ro ? "" : `<button class="add" data-add="${k}">+ Add row</button>`}</div>`
        : `<div class="hd">${esc(title)}${subtitle ? `<small style="font-weight:600;opacity:.75">· ${esc(subtitle)}</small>` : ""}<span class="sp"></span>${ro ? "" : `<button class="add" data-add="${k}">+ Add row</button>`}</div>`}
      <div class="items">${d[k].length ? d[k].map((x, i) => itemRow(k, x, i, ro)).join("") : `<div class="emptyrow">Nothing yet.</div>`}</div>`).join("")}

    <div class="hd">Marketing events<span class="sp"></span>${ro ? "" : `<button class="add" data-add="events">+ Add row</button>`}</div>
    <table class="t"><tr><th>From</th><th>To</th><th>Event / activation</th><th>Start</th><th>End</th><th></th></tr>
      ${d.events.map((x, i) => `<tr><td><input type="date" data-k="events" data-i="${i}" data-f="from" value="${esc(x.from)}" ${ro}></td>
        <td><input type="date" data-k="events" data-i="${i}" data-f="to" value="${esc(x.to)}" ${ro}></td>
        <td><input type="text" data-k="events" data-i="${i}" data-f="name" value="${esc(x.name)}" placeholder="e.g. L'Oréal booth" ${ro}></td>
        <td><input type="time" data-k="events" data-i="${i}" data-f="start" value="${esc(x.start)}" ${ro}></td>
        <td><input type="time" data-k="events" data-i="${i}" data-f="end" value="${esc(x.end)}" ${ro}></td>
        <td class="xx">${ro ? "" : `<button class="x" data-rm="events" data-i="${i}">×</button>`}</td></tr>`).join("") || `<tr><td colspan="6" class="emptyrow" style="padding:8px">No events.</td></tr>`}</table>

    <div class="hd">Daily operations checklist tracker<span class="sp"></span><button class="add" id="liveRef" title="Refresh the live rows">↻</button>${ro ? "" : `<button class="add" data-add="checklists">+ Add row</button>`}</div>
    <div id="liveBox">${liveHtml()}</div>
    <table class="t"><tr><th>Checklist name</th><th style="width:120px">AM</th><th style="width:120px">PM</th><th>Clarifications</th><th></th></tr>
      ${d.checklists.map((x, i) => `<tr><td><input type="text" data-k="checklists" data-i="${i}" data-f="name" value="${esc(x.name)}" ${ro}></td>
        ${["am", "pm"].map(f => `<td><select data-k="checklists" data-i="${i}" data-f="${f}" class="${x[f] === "Done" ? "done" : x[f] === "Not done" ? "nd" : ""}" ${ro}>${["", "Done", "Not done", "N/A"].map(o => `<option ${x[f] === o ? "selected" : ""} value="${o}">${o || "—"}</option>`).join("")}</select></td>`).join("")}
        <td><input type="text" data-k="checklists" data-i="${i}" data-f="note" value="${esc(x.note)}" ${ro}></td>
        <td class="xx">${ro ? "" : `<button class="x" data-rm="checklists" data-i="${i}">×</button>`}</td></tr>`).join("")}</table>

  </div>
  <div class="bar">
    <span class="saved" id="savedMsg">${H.id ? `Started by ${esc(H.createdName || "")}${H.updatedName && H.updatedName !== H.createdName ? ` · last edit ${esc(H.updatedName)}` : ""}` : "Not saved yet"}</span>
    ${H.can.handover && H.id && H.status === "draft" ? `<button class="btn ghost danger" id="delBtn">Delete draft</button>` : ""}
    ${H.can.handover ? `<button class="btn ghost" id="saveBtn">Save</button>` : ""}
    ${H.can.handover && (!submitted || H.receivedBy) ? `<button class="btn gold" id="submitBtn">Hand over to the next shift</button>` : ""}
    ${submitted && !H.receivedBy && lastBy() !== CTX.me.email ? `<button class="btn gold" id="recvBtn">I have received this handover</button>` : ""}
  </div>`;
  app.querySelectorAll(".it textarea").forEach(grow);
}
function lastBy(){ const L = H.handoffs || []; return L.length ? L[L.length - 1].email : H.createdBy; }
function grow(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

/* ----- editing ----- */
const blank = { ongoing: () => ({ text: "", cctv: false, done: false, date: "" }), today: () => ({ text: "", cctv: false, done: false, date: "" }),
  tomorrow: () => ({ text: "", cctv: false, done: false, date: "" }), upcoming: () => ({ text: "", cctv: false, done: false, date: D.add(CTX.today, 2) }),
  events: () => ({ from: CTX.today, to: CTX.today, name: "", start: "", end: "" }), checklists: () => ({ name: "", am: "", pm: "", note: "" }),
  docs: () => ({ label: "", url: "", task: "", updated: CTX.today, comment: "" }) };
function touch(){ dirty = true; clearTimeout(timer); if (H.id) timer = setTimeout(() => save(false, true), 2000); const m = $("#savedMsg"); if (m) m.textContent = "Unsaved changes…"; }
app.addEventListener("input", e => {
  if (!H) return;
  const t = e.target, k = t.dataset.k;
  if (t.id === "notes"){ H.doc.notes = t.value; return touch(); }
  if (t.id === "hDay"){ H.day = t.value; return touch(); }
  if (k){ H.doc[k][+t.dataset.i][t.dataset.f] = t.value; if (t.tagName === "TEXTAREA") grow(t); if (t.tagName === "SELECT") t.className = t.value === "Done" ? "done" : t.value === "Not done" ? "nd" : ""; touch(); }
});
app.addEventListener("change", e => { if (H && e.target.id === "hDay"){ LIVE = null; const b = $("#liveBox"); if (b) b.innerHTML = liveHtml(); loadLive(); } });
app.addEventListener("click", async e => {
  if (!H) return;
  const t = e.target;
  if (t.id === "back"){ if (dirty && H.can.handover && !(await confirmBox("Leave without saving?", "Your latest changes to this handover are not saved yet.", "Leave"))) return; clearTimeout(timer); return list(); }
  if (t.id === "printBtn") return print();
  if (t.id === "liveRef"){ LIVE = null; $("#liveBox").innerHTML = liveHtml(); return loadLive(); }
  if (t.id === "impBtn") return $("#impFile").click();
  if (t.id === "mailBtn") return mailDialog();
  const add = t.closest("[data-add]"); if (add){ const k = add.dataset.add; H.doc[k].push(blank[k]()); touch(); render();
    const last = app.querySelectorAll(`[data-k="${k}"][data-i="${H.doc[k].length - 1}"]`); const f = [...last].find(x => x.tagName === "TEXTAREA" || x.type === "text"); f && f.focus(); return; }
  const rm = t.closest("[data-rm]"); if (rm){ H.doc[rm.dataset.rm].splice(+rm.dataset.i, 1); touch(); return render(); }
  const tg = t.closest("[data-tg]"); if (tg){ const x = H.doc[tg.dataset.k][+tg.dataset.i]; x[tg.dataset.tg] = !x[tg.dataset.tg]; touch(); return render(); }
  if (t.id === "saveBtn") return save(false);
  if (t.id === "submitBtn"){ if (!(await confirmBox("Hand over to the next shift?", "Everyone at the flagship is notified that the handover is ready to receive. The next shift keeps working in this same handover.", "Hand over"))) return; return save(true); }
  if (t.id === "recvBtn"){ try { await api("ops/handover/receive", { site: CTX.site, id: H.id }); toast("Marked as received"); open(H.id); } catch (er){ toast(er.message, true); } return; }
  if (t.id === "delBtn"){ if (!(await confirmBox("Delete this draft?", "The draft is removed permanently.", "Delete"))) return;
    try { await api("ops/handover/delete", { site: CTX.site, id: H.id }); toast("Draft deleted"); list(); } catch (er){ toast(er.message, true); } }
});
async function save(submit, quiet){
  clearTimeout(timer);
  try {
    const r = await api("ops/handover/save", { site: CTX.site, id: H.id, day: H.day, doc: H.doc, submit });
    if (r.offline){ dirty = false; const m = $("#savedMsg"); if (m) m.textContent = "Saved on this device — sends when back online"; if (submit) toast("No signal — the hand-over will be sent when you are back online"); return; }
    const first = !H.id; H.id = r.id; dirty = false;
    if (submit){ toast("Handed over — the next shift has been notified"); return open(H.id); }
    if (!quiet) toast("Saved");
    const m = $("#savedMsg"); if (m) m.textContent = `Saved ${new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
    if (first) open(H.id);
  } catch (er){ toast(er.message, true); }
}

/* =====================================================================
   IMPORT TENANT REQUESTS — the Salesforce "Handover Report" Excel (ABC Tenant Connect requests)
   Columns: Status · Valid From · Request Name · Tenant Name · Valid To · Sub Maintenance · Contractor · Description
   Blank Status / Valid From cells repeat the row above (grouped report).
   Each request lands in this handover by its date: this day → Today, next day → Tomorrow,
   later → Coming up (dated, moves into Today on its day). Requests already in the handover (same REQ number) are skipped.
   ===================================================================== */
let IMP = null;
function loadXlsx(){
  return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "xlsx.full.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("Could not load the Excel reader")); document.head.append(sc); });
}
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function parseWhen(v){
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return { day: `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`, time: `${String(v.getHours()).padStart(2, "0")}:${String(v.getMinutes()).padStart(2, "0")}` };
  if (typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); if (d) return { day: `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`, time: `${String(d.H).padStart(2, "0")}:${String(d.M).padStart(2, "0")}` }; return null; }
  const m = String(v).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[,\sT]+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  const y = m[3].length === 2 ? "20" + m[3] : m[3];
  return { day: `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`, time: m[4] ? `${m[4].padStart(2, "0")}:${m[5]}` : "" };
}
function cleanTenant(n){
  let t = String(n || "").trim();
  const names = [CTX.siteName, ...Object.values(CTX.sites || {})].filter(Boolean).sort((a, b) => b.length - a.length);
  for (const s of names){ const re = new RegExp("\\s*(ABC\\s+)?" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*$", "i"); if (re.test(t)){ t = t.replace(re, ""); break; } }
  return t.replace(/\s+(Verdun|Achrafieh|Dbayeh)(\s+(Mall|Department Store|DS))?$/i, "").trim();
}
function readRequests(rows){
  const hi = rows.findIndex(r => r.some(c => /request name/i.test(String(c || ""))));
  if (hi < 0) throw new Error("This is not the Handover Report — the “Request Name” column is missing.");
  const H0 = rows[hi].map(c => String(c || "").toLowerCase());
  const col = re => H0.findIndex(h => re.test(h));
  const C = { status: col(/^status/), from: col(/valid from/), req: col(/request name/), tenant: col(/tenant/), to: col(/valid to/), sub: col(/sub maint|category|type/), contr: col(/contractor|supplier/), desc: col(/description/) };
  if (C.from < 0 || C.tenant < 0) throw new Error("The “Valid From” or “Tenant Name” column is missing.");
  const out = []; let status = "", from = null;
  for (const r of rows.slice(hi + 1)){
    const req = String(r[C.req] ?? "").trim();
    if (C.status >= 0 && r[C.status] != null && String(r[C.status]).trim()) status = String(r[C.status]).trim();
    if (r[C.from] != null && String(r[C.from]).trim()) from = parseWhen(r[C.from]) || from;
    if (!/^REQ-?\d+/i.test(req) || !from) continue;
    out.push({ req: req.toUpperCase(), status: status.replace(/[^\w\s]/g, "").trim(), from: { ...from }, to: parseWhen(r[C.to]),
      tenant: cleanTenant(r[C.tenant]), sub: String(r[C.sub] ?? "").trim(), contractor: String(r[C.contr] ?? "").trim(), desc: String(r[C.desc] ?? "").trim() });
  }
  return out;
}
const dm = d => `${Number(d.slice(8))} ${MON[Number(d.slice(5, 7)) - 1]}`;
function reqText(q){
  const t = q.to && q.to.day !== q.from.day ? `${q.from.time || ""} → ${dm(q.to.day)} ${q.to.time || ""}`.trim() : [q.from.time, q.to && q.to.time].filter(Boolean).join("–");
  return [`${q.tenant} — ${q.desc || q.sub}`, q.desc && q.sub ? q.sub : "", q.contractor, t, q.req + (/submitted/i.test(q.status) ? " (awaiting approval)" : "")].filter(Boolean).join(" · ");
}
function planImport(list){
  const day = H.day, next = D.add(day, 1);
  const have = new Set(), all = ["ongoing", "today", "tomorrow", "upcoming"].flatMap(k => H.doc[k].map(x => x.text));
  all.forEach(t => (t.match(/REQ-?\d+/gi) || []).forEach(r => have.add(r.toUpperCase())));
  const plan = { today: [], tomorrow: [], upcoming: [], dup: [], past: [], skipped: [] };
  for (const q of list){
    if (/reject|closed|cancel/i.test(q.status)){ plan.skipped.push(q); continue; }
    if (have.has(q.req)){ plan.dup.push(q); continue; }
    const endDay = q.to ? q.to.day : q.from.day;
    if (q.from.day === day || (q.from.day < day && endDay >= day)) plan.today.push(q);
    else if (q.from.day === next) plan.tomorrow.push(q);
    else if (q.from.day > next) plan.upcoming.push(q);
    else plan.past.push(q);
    have.add(q.req);
  }
  plan.upcoming.sort((a, b) => (a.from.day + a.from.time).localeCompare(b.from.day + b.from.time));
  return plan;
}
$("#impFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !H) return;
  try {
    await loadXlsx();
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array", cellDates: true });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
    const list = readRequests(rows);
    if (!list.length) throw new Error("No requests found in this sheet.");
    IMP = planImport(list);
    const n = IMP.today.length + IMP.tomorrow.length + IMP.upcoming.length;
    const grp = (title, L, dated) => L.length ? `<p class="lbl" style="margin:12px 0 4px">${title} · ${L.length}</p><ul class="impl">${L.map(q => `<li>${dated ? `<b>${esc(D.fmt(q.from.day, { weekday: "short" }))}</b> · ` : ""}${esc(reqText(q))}</li>`).join("")}</ul>` : "";
    const d = $("#dImp");
    d.innerHTML = `<div class="dlg-h"><b>Import tenant requests</b><small>${esc(f.name)} · ${list.length} requests · into the handover of ${esc(D.fmt(H.day, { weekday: "short" }))}</small></div>
      <div class="dlg-b" style="max-height:60vh;overflow:auto">
        ${n ? "" : `<p class="muted">Nothing new to add.</p>`}
        ${grp("Today", IMP.today)}${grp("Tomorrow", IMP.tomorrow)}${grp("Coming up", IMP.upcoming, true)}
        <p class="muted" style="font-size:.8rem;margin-top:12px">${[IMP.dup.length ? `${IMP.dup.length} already in this handover` : "", IMP.past.length ? `${IMP.past.length} finished before this day` : "", IMP.skipped.length ? `${IMP.skipped.length} rejected or closed` : ""].filter(Boolean).join(" · ") || "Nothing skipped."}</p>
      </div>
      <div class="dlg-f"><button class="btn ghost" data-v="0">Cancel</button>${n ? `<button class="btn gold" data-v="1">Add ${n} to the handover</button>` : ""}</div>`;
    d.onclick = ev => { const b = ev.target.closest("[data-v]"); if (!b && ev.target !== d) return; d.close();
      if (b && b.dataset.v === "1"){
        const mk = (q, dated) => ({ text: reqText(q), cctv: false, done: false, date: dated ? q.from.day : "" });
        IMP.today.forEach(q => H.doc.today.push(mk(q)));
        IMP.tomorrow.forEach(q => H.doc.tomorrow.push(mk(q)));
        IMP.upcoming.forEach(q => H.doc.upcoming.push(mk(q, true)));
        H.doc.upcoming.sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
        touch(); render(); toast(`${n} request${n === 1 ? "" : "s"} added — save to keep them`);
      } };
    d.showModal();
  } catch (er){ toast(er.message, true); }
});

/* =====================================================================
   EMAIL IN OUTLOOK — the handover in its usual layout as a new, unsent email
   (.eml opens in Outlook as a draft; "Copy" puts the formatted handover on the clipboard for any mail app)
   ===================================================================== */
function mailHtml(){
  const d = H.doc, F = "font-family:Calibri,Arial,sans-serif;", B = "border:1px solid #2F3B52;";
  const head = (t, sub) => `<tr><td style="${F}background:#8EAADB;color:#10203F;font-weight:bold;font-size:15px;padding:6px 10px;border-top:1.5px solid #2F3B52">${esc(t)}${sub ? ` <span style="font-weight:normal;font-size:12px">· ${esc(sub)}</span>` : ""}</td></tr>`;
  const items = (L, dated) => `<tr><td style="${F}padding:4px 10px 8px">${L.length ? `<ul style="margin:0;padding-left:20px">${L.map(x => `<li style="color:#2F5597;font-size:14px;margin:2px 0;${x.cctv ? "font-weight:bold;" : ""}${x.done ? "text-decoration:line-through;" : ""}">${dated && x.date ? `<b>${esc(D.fmt(x.date, { weekday: "short" }))}:</b> ` : ""}${esc(x.text)}${x.cctv ? ` <span style="background:#E5484D;color:#fff;font-size:11px;padding:1px 5px">ATT CCTV</span>` : ""}${x.done ? " ✓" : ""}</li>`).join("")}</ul>` : `<span style="color:#777;font-size:13px">Nothing.</span>`}</td></tr>`;
  const tbl = (cols, rows) => `<tr><td style="padding:0"><table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%">
    <tr>${cols.map(c => `<th style="${F}background:#D9E2F3;font-size:13px;text-align:left;padding:5px 8px;border:1px solid #BFBFBF">${esc(c)}</th>`).join("")}</tr>
    ${rows.length ? rows.map(r => `<tr>${r.map(v => `<td style="${F}font-size:13px;padding:5px 8px;border:1px solid #BFBFBF">${v}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cols.length}" style="${F}font-size:13px;padding:5px 8px;border:1px solid #BFBFBF;color:#777">None.</td></tr>`}</table></td></tr>`;
  const st = v => v === "Done" ? `<b style="color:#2E8B57">Done</b>` : v === "Not done" ? `<b style="color:#C0392B">Not done</b>` : esc(v || "—");
  const title = `Shift Handover — ABC ${CTX.siteName} — ${D.long(H.day)}`;
  const L2 = LIVE && !LIVE.error ? LIVE : null, R = L2 ? L2.restroom || {} : {};
  const ckM = r => !r ? `<b style="color:#C0392B">Not done</b>` : r.status === "submitted" ? `<b style="color:#2E8B57">Done</b> · ${esc(r.by)} ${hm(r.at)}${r.issues ? ` · ${r.issues} ✗` : ""}` : `<b style="color:#C07A12">In progress ${r.done}/${r.total}</b> · ${esc(r.by)}`;
  const rrM = (n, by, st) => R.rooms ? `<b style="color:${n >= R.rooms ? "#2E8B57" : st === "closed" ? "#C0392B" : st === "open" ? "#C07A12" : "#777"}">${n}/${R.rooms}</b>${by.length ? ` · ${esc(by.join(", "))}` : ""}` : "—";
  const liveM = L2 ? tbl(["Checklist", "Status"], [["AM Checklist", ckM(L2.am)], ["PM Checklist", ckM(L2.pm)]])
    + (R.windows && R.windows.length ? tbl(["Restroom inspections", "OPS", "S.S"], R.windows.map(w => [`${esc(w.label)} <span style="color:#777">${esc(w.time)}</span>`, rrM(w.ops, w.opsBy, w.state), rrM(w.ss, w.ssBy, w.state)])) : "") : "";
  return { title, html: `<div style="${F}"><p style="${F}font-size:14px">Dear team,<br><br>Please find below the shift handover.</p>
  <table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;max-width:900px;${B}">
    <tr><td style="${F}background:#2A0F45;color:#fff;font-weight:bold;font-size:16px;padding:8px 10px">${esc(title)}</td></tr>
    ${head("Scheduled works", "Ongoing follow-up until solved")}${items(d.ongoing)}
    ${head("Today")}${items(d.today)}
    ${head("Tomorrow")}${items(d.tomorrow)}
    ${head("Coming up")}${items(d.upcoming, true)}
    ${head("Marketing events")}${tbl(["From", "To", "Event / activation", "Start", "End"], d.events.map(e => [esc(D.fmt(e.from)), esc(D.fmt(e.to)), esc(e.name), esc(e.start), esc(e.end)]))}
    ${head("Daily operations checklist tracker")}${liveM}${d.checklists.length ? tbl(["Checklist name", "AM", "PM", "Clarifications"], d.checklists.map(c => [esc(c.name), st(c.am), st(c.pm), esc(c.note)])) : ""}
  </table>
  <p style="${F}font-size:14px">Best regards,<br>${esc(CTX.me.name)}</p></div>` };
}
function b64utf8(s){ const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin).replace(/.{76}/g, "$&\r\n"); }
function emlFile(){
  const { title, html } = mailHtml();
  const subj = "=?UTF-8?B?" + btoa(String.fromCharCode(...new TextEncoder().encode(title))) + "?=";
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${html}</body></html>`;
  return { title, text: ["To: ", `Subject: ${subj}`, "X-Unsent: 1", "MIME-Version: 1.0", "Content-Type: text/html; charset=UTF-8", "Content-Transfer-Encoding: base64", "", b64utf8(doc)].join("\r\n") };
}
async function mailDialog(){
  if (!LIVE || LIVE.error) await loadLive();
  const d = $("#dMail");
  d.innerHTML = `<div class="dlg-h"><b>Email this handover</b><small>Opens as a new email with the handover already inside. Add the recipients and send.</small></div>
    <div class="dlg-b" style="display:grid;gap:10px">
      <button class="btn gold" data-m="eml">Open in Outlook (desktop)</button>
      <p class="muted" style="font-size:.8rem;margin-top:-4px">Downloads <b>handover.eml</b>. Open it and Outlook shows a new, unsent email.</p>
      <button class="btn ghost" data-m="copy">Copy the handover, then open a new email</button>
      <p class="muted" style="font-size:.8rem;margin-top:-4px">For Outlook on the web or phone: a new email opens with the subject. Paste (Ctrl + V) into the body.</p>
    </div>
    <div class="dlg-f"><button class="btn ghost" data-m="x">Close</button></div>`;
  d.onclick = async ev => {
    const b = ev.target.closest("[data-m]"); if (!b && ev.target !== d) return;
    const m = b ? b.dataset.m : "x";
    if (m === "eml"){
      const f = emlFile(), a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([f.text], { type: "message/rfc822" }));
      a.download = `Handover ${CTX.siteName} ${H.day}.eml`; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Email file ready — open it to see the draft in Outlook");
    }
    if (m === "copy"){
      const { title, html } = mailHtml();
      try {
        await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([mailPlain()], { type: "text/plain" }) })]);
        toast("Handover copied — paste it into the email");
      } catch { const w = document.createElement("div"); w.innerHTML = html; w.style.position = "fixed"; w.style.left = "-9999px"; document.body.append(w);
        const r = document.createRange(); r.selectNodeContents(w); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand("copy"); sel.removeAllRanges(); w.remove(); toast("Handover copied — paste it into the email"); }
      location.href = "mailto:?subject=" + encodeURIComponent(title);
    }
    d.close();
  };
  d.showModal();
}
function mailPlain(){
  const d = H.doc, L = (t, arr, dated) => `${t}\n${arr.length ? arr.map(x => `• ${dated && x.date ? D.fmt(x.date) + ": " : ""}${x.text}${x.cctv ? " [ATT CCTV]" : ""}${x.done ? " ✓" : ""}`).join("\n") : "—"}\n`;
  return [L("SCHEDULED WORKS", d.ongoing), L("TODAY", d.today), L("TOMORROW", d.tomorrow), L("COMING UP", d.upcoming, true)].join("\n");
}
addEventListener("hub-synced", e => { const { path, body, result } = e.detail || {};
  if (path === "ops/handover/save" && H && !H.id && body.day === H.day && result && result.id) H.id = result.id; });
addEventListener("beforeunload", e => { if (H && dirty && H.can.handover){ e.preventDefault(); e.returnValue = ""; } });
boot().catch(e => { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
</script>
