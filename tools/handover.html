<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<style>
.list{display:grid;gap:10px;margin-top:14px}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%}
.hrow:hover{border-color:var(--brand-2)}
.hrow .main{flex:1;min-width:0}
.hrow .main small{color:var(--muted);font-size:.82rem}
.newbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.doc{max-width:980px;margin:14px auto 0;background:var(--surface);border:1.5px solid #2F3B52;border-radius:4px}
.hd{background:var(--blueHead);color:#10203F;font-weight:800;padding:8px 12px;display:flex;align-items:center;gap:10px;border-top:1.5px solid #2F3B52}
:root[data-theme="dark"] .hd{color:#E6ECFA}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hd{color:#E6ECFA} }
.hd:first-child{border-top:0}
.hd .sp{flex:1}
.add{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.55);color:#10203F}
.sub{background:var(--blueSoft);font-weight:800;padding:7px 12px;color:#1F3A73}
:root[data-theme="dark"] .sub{color:#C9D6F5}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sub{color:#C9D6F5} }
.items{padding:6px 10px 10px}
.it{display:grid;grid-template-columns:18px 1fr auto auto 30px;gap:8px;align-items:center;padding:3px 0}
.it.dated{grid-template-columns:18px 150px 1fr auto 30px}
.it .dot{width:7px;height:7px;background:#4472C4;border-radius:1px;justify-self:center}
.it input[type=text],.it textarea{border:0;border-bottom:1px dashed transparent;background:transparent;padding:5px 2px;outline:none;width:100%;color:#2F5597;font-size:.92rem;resize:none;line-height:1.35;border-radius:0}
:root[data-theme="dark"] .it input[type=text],:root[data-theme="dark"] .it textarea{color:#9DB8EE}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .it input[type=text], :root:not([data-theme="light"]) .it textarea{color:#9DB8EE} }
.it input[type=text]:focus,.it textarea:focus{border-bottom-color:var(--brand-2)}
.it.cctv textarea{font-weight:700}
.it.done textarea{text-decoration:line-through;opacity:.6}
.tg{font-size:.7rem;font-weight:800;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tg.on.c{background:#E5484D;border-color:#E5484D;color:#fff}
.tg.on.d{background:var(--ok);border-color:var(--ok);color:#fff}
.x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:1.05rem}
.x:hover{background:var(--paper);color:var(--alert)}
.emptyrow{color:var(--muted);font-size:.85rem;padding:6px 4px}
table.t{width:100%;border-collapse:collapse}
.t th{background:var(--blueSoft);font-size:.82rem;padding:7px 8px;text-align:left;border:1px solid var(--line)}
.t td{border:1px solid var(--line);padding:0}
.t td input,.t td select{width:100%;border:0;background:transparent;padding:8px;outline:none;font-size:.88rem;min-width:0}
.t td.xx{width:34px;text-align:center}
.t .done{color:var(--ok);font-weight:800}.t .nd{color:var(--alert);font-weight:800}
.notes{padding:10px}
.notes textarea{min-height:110px;border:0;background:transparent}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta .sel,.meta .inp{height:36px}
.banner{margin:12px auto 0;max-width:980px;padding:10px 14px;border-radius:12px;background:rgba(123,75,176,.1);color:var(--brand-2);font-size:.86rem;font-weight:600}
.bar{max-width:980px;margin:14px auto 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.saved{font-size:.8rem;color:var(--muted);margin-right:auto;align-self:center}
@media (max-width:700px){ .it{grid-template-columns:14px 1fr 30px} .it .tg{grid-column:2;justify-self:start} .it.dated{grid-template-columns:14px 1fr 30px} .it.dated input[type=date]{grid-column:2}
  .t{display:block;overflow-x:auto} .t tr{min-width:620px} }
@media print{ .doc{border:1.5px solid #000;max-width:none;margin:0} .x,.add,.tg:not(.on),.bar,.banner,#listView{display:none!important}
  .hd,.sub,.t th,.tg.on{-webkit-print-color-adjust:exact;print-color-adjust:exact} .it input[type=text],.it textarea{color:#2F5597} }
dialog.wide{width:min(760px,calc(100% - 20px))}
.impl{display:grid;gap:4px;padding-left:18px;font-size:.86rem;color:#2F5597}
.t .pr{color:var(--warn);font-weight:800}
.t.live td{padding:8px;font-size:.88rem}
.t.live{margin-bottom:-1px}
#dMail{width:min(460px,calc(100vw - 24px));box-sizing:border-box}
/* manual items (typed by the team) red · portal items (Tenant Connect import) black */
.it.manual textarea{color:#C00000}
.it.portal textarea{color:#111}
:root[data-theme="dark"] .it.manual textarea{color:#FF8A80} :root[data-theme="dark"] .it.portal textarea{color:#EFEAF5}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .it.manual textarea{color:#FF8A80} :root:not([data-theme="light"]) .it.portal textarea{color:#EFEAF5} }
@media print{ .it.manual textarea{color:#C00000!important} .it.portal textarea{color:#000!important} .shifts,.vtabs{display:none!important} }
.grp-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;color:#2F5597;padding:6px 2px 2px}
.grp-h .sp{flex:1}
.grp-h + .emptyrow{padding-left:22px}
.grp{padding-bottom:6px}
.grp + .grp{border-top:1px dashed var(--line);margin-top:4px}
.vtabs{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.vtabs button{height:32px;padding:0 14px;border-radius:8px;font-weight:700;font-size:.84rem;color:var(--muted)}
.vtabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.shifts{max-width:980px;margin:12px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shifts .sh-h{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;font-size:.86rem;border-bottom:1px solid var(--line)}
.shifts .sh-h .sp{flex:1}
.shr{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.shr:last-child{border-bottom:0}
.shr b.n{font-size:.92rem}
.shr .st{font-size:.84rem;color:var(--muted);min-width:0}
.shr.ok .st{color:var(--text)}
.shr.ok b.n::before{content:"✓ ";color:var(--ok)}
.shr.cur{background:rgba(200,162,74,.16);box-shadow:inset 4px 0 0 var(--gold)}
.shr .acts{display:flex;gap:6px}
@media (max-width:700px){ .shr{grid-template-columns:1fr auto} .shr .st{grid-column:1/-1;order:3} }
.hfil{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.hfil label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:.8rem;background:var(--surface)}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
#dMail .dlg-b>*{min-width:0;max-width:100%;box-sizing:border-box}
#dMail .dlg-b .btn{white-space:normal}
</style>
</head>
<body>
<div class="top">
  <h1>Shift Handover <small id="sub"></small></h1>
  <span class="vtabs" id="vtabs"><button data-view="today" class="on">Today's handover</button><button data-view="hist">Handover History</button></span>
  <span id="siteBox"></span>
</div>
<div class="wrap" id="app"></div>
<input type="file" id="impFile" accept=".xlsx,.xls,.xlsm,.csv" class="hidden">
<dialog id="dImp" class="wide"></dialog>
<dialog id="dMail"></dialog>
<dialog id="dShifts"></dialog>

<script src="common.js"></script>
<script>
let CTX = null, H = null, timer = null, dirty = false;
const app = $("#app");
const SEC = [
  ["ongoing", "Scheduled works", "Ongoing follow-up until solved"],
  ["today", "Today", ""],
  ["tomorrow", "Tomorrow", ""],
  ["upcoming", "Coming up", "Dated items move into “Today” automatically on their day"]
];

let BACK = "";                       // where "‹ back" goes: "hist" when opened from Handover History
let HF = { from: "", to: "", day: "" };  // Handover History filter
function setTabs(v){ document.querySelectorAll("#vtabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v)); }
document.getElementById("vtabs").addEventListener("click", async e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  if (H && dirty && H.can.handover && H.id) await save(false, true);
  clearTimeout(timer);
  if (b.dataset.view === "hist"){ BACK = ""; return history(); }
  BACK = ""; openDay(CTX.today);
});
async function boot(site){
  CTX = await api("ops/context" + (site ? "?site=" + site : ""));
  $("#sub").textContent = CTX.siteName;
  $("#siteBox").innerHTML = siteSelect(CTX, s => boot(s));
  /* a handover waiting for me opens straight away, so "I have received" is one tap from the badge */
  const want = Number(new URLSearchParams(location.search).get("id")) || 0;
  if (want) return open(want);
  if (!site){ try { const sm = await api("ops/summary"); if (sm.handover && sm.handover.id) return open(sm.handover.id); } catch {} }
  openDay(CTX.today);
}
/* Today's handover opens straight away — a new day starts from the last one and is saved at once, so every shift works in the same one */
async function openDay(day){
  setTabs(day === CTX.today && !BACK ? "today" : "hist");
  app.innerHTML = `<div class="card empty">Opening the handover…</div>`;
  try {
    const d = await api(`ops/handover/new?site=${CTX.site}&day=${day}`);
    if (d.existing) return open(d.handover.id);
    H = d.handover; H.can = d.can; H.shifts = d.shifts; H.shiftNames = d.shiftNames; H.admin = d.admin;
    dirty = true; LIVE = null; render(); loadLive();
    if (H.can.handover) save(false, true);
  } catch (e){ app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}
/* ---------------- Handover History ---------------- */
async function history(){
  H = null; setTabs("hist");
  if (!HF.to){ HF.to = CTX.today; HF.from = D.add(CTX.today, -30); }
  app.innerHTML = `<div class="card" style="padding:16px">
      <div class="hfil">
        <label>From<input class="inp" type="date" id="fFrom" value="${esc(HF.from)}" max="${esc(CTX.today)}"></label>
        <label>To<input class="inp" type="date" id="fTo" value="${esc(HF.to)}" max="${esc(CTX.today)}"></label>
        <span class="muted" style="align-self:center;font-size:.8rem">or</span>
        <label>Specific date<input class="inp" type="date" id="fDay" value="${esc(HF.day)}" max="${esc(CTX.today)}"></label>
      </div>
      <div class="chips" style="margin-top:10px">${[["7", "Last 7 days"], ["30", "Last 30 days"], ["month", "This month"], ["90", "Last 3 months"]].map(([k, l]) => `<button data-q="${k}">${l}</button>`).join("")}</div>
    </div>
    <div class="list" id="hList"><div class="card empty">Loading…</div></div>`;
  const run = async () => {
    const from = HF.day || HF.from, to = HF.day || HF.to;
    try {
      const d = await api(`ops/handover/list?site=${CTX.site}&from=${from}&to=${to}`);
      $("#hList").innerHTML = d.handovers.length ? d.handovers.map(h => `<button class="card hrow" data-id="${h.id}">
        <span class="main"><b>${esc(D.long(h.day))}</b><br>
        <small>${h.handoffs.length ? h.handoffs.map(x => `${x.shift ? `<b>${esc((x.shift === "MID" ? "Mid" : x.shift === "NIGHT" ? "Night" : x.shift))}</b> ` : ""}${esc(x.by)} ${hm(x.at)}${x.receivedBy ? ` → ${esc(x.receivedBy)}` : ""}`).join(" · ") : `started by ${esc(h.created_name || "—")}`}${h.updated_name ? ` · last edit ${esc(h.updated_name)}` : ""}</small></span>
        ${h.received_by === "Auto-closed" ? `<span class="pill">Closed</span>` : h.received_by ? `<span class="pill ok">Received</span>` : h.status === "submitted" ? `<span class="pill warn">Awaiting receipt</span>` : `<span class="pill">In progress</span>`}</button>`).join("")
        : `<div class="card empty">No handovers ${HF.day ? "on " + esc(D.long(HF.day)) : "between " + esc(D.fmt(from, { year: "numeric" })) + " and " + esc(D.fmt(to, { year: "numeric" }))}.</div>`;
    } catch (e){ $("#hList").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
  };
  $("#fFrom").onchange = e => { HF.from = e.target.value; HF.day = ""; $("#fDay").value = ""; run(); };
  $("#fTo").onchange = e => { HF.to = e.target.value; HF.day = ""; $("#fDay").value = ""; run(); };
  $("#fDay").onchange = e => { HF.day = e.target.value; run(); };
  app.querySelector(".chips").onclick = e => { const b = e.target.closest("[data-q]"); if (!b) return;
    HF.day = ""; HF.to = CTX.today; HF.from = b.dataset.q === "month" ? CTX.today.slice(0, 8) + "01" : D.add(CTX.today, -Number(b.dataset.q));
    $("#fFrom").value = HF.from; $("#fTo").value = HF.to; $("#fDay").value = ""; run(); };
  $("#hList").onclick = e => { const r = e.target.closest(".hrow"); if (r){ BACK = "hist"; open(Number(r.dataset.id)); } };
  run();
}
async function open(id){
  const d = await api(`ops/handover/get?id=${id}`); H = d.handover; H.can = d.can; H.shifts = d.shifts; H.shiftNames = d.shiftNames; H.admin = d.admin;
  setTabs(BACK === "hist" || H.day !== CTX.today ? "hist" : "today");
  dirty = false; LIVE = null; render(); loadLive();
}
const hm = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Beirut" }) : "";
const dmy = iso => iso ? new Date(iso).toLocaleString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Beirut" }).replace(",", "") : "";
const shName = c => (H && H.shiftNames && H.shiftNames[c]) || c;
/* live rows for the checklist tracker (AM / PM checklists, restroom inspections OPS and S.S) */
let LIVE = null;
async function loadLive(){
  if (!H) return; const day = H.day;
  try { const d = await api(`ops/handover/live?site=${CTX.site}&day=${day}`); if (H && H.day === day){ LIVE = d; const b = $("#liveBox"); if (b) b.innerHTML = liveHtml(); const c = $("#calRows"); if (c && H.doc) c.innerHTML = calRowsHtml(H.doc); applyGateMarks(d.gateMarks); } }
  catch (e){ LIVE = { error: e.message }; const b = $("#liveBox"); if (b) b.innerHTML = liveHtml(); }
}
/* Loading Gate feature: "— ✓ Attended 20:04 · 1 worker" written by the gate on the line of the same REQ.
   The open page adds the marks to its own copy (so a save never removes them) and shows them; refreshed every minute. */
const GATE_MARK_RE = /\s+— (✓ Attended|✕ Refused at gate|→ Left)[^\n]*$/;
const reqKey = x => (String(x.req || "").replace(/\D/g, "") || ((String(x.text || "").match(/\bREQ-?(\d{3,})\b/i) || [])[1] || "")).replace(/^0+/, "");
function applyGateMarks(marks){
  if (!H || !H.doc || !marks || !Object.keys(marks).length) return;
  let changed = false;
  for (const k of ["today", "ongoing", "tomorrow"]) for (const x of H.doc[k] || []) {
    const m = marks[reqKey(x)]; if (!m) continue;
    const t = x.text.replace(GATE_MARK_RE, "") + m;
    if (t !== x.text){ x.text = t; changed = true; }
  }
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable);
  if (changed && !typing) render();
}
setInterval(() => { if (H && H.day === CTX.today && document.visibilityState === "visible") loadLive(); }, 60000);
document.addEventListener("visibilitychange", () => { if (H && document.visibilityState === "visible") loadLive(); });
function ckCell(r){ return !r ? `<span class="nd">Not done</span>` : r.status === "submitted" ? `<span class="done">Done</span> <small class="muted">${esc(r.by)} · ${hm(r.at)}${r.issues ? ` · ${r.issues} ✗` : ""}</small>` : `<span class="pr">In progress ${r.done}/${r.total}</span> <small class="muted">${esc(r.by)}</small>`; }
/* Operations Calendar: the day's marketing events come from the calendar (not typed twice) */
function calEvents(d){ const have = new Set((d.events || []).map(e => String(e.name).trim().toLowerCase())); return (LIVE && !LIVE.error && LIVE.calendar || []).filter(e => !have.has(String(e.name).trim().toLowerCase())); }
function calRowsHtml(d){ return calEvents(d).map(x => `<tr class="calrow"><td>${esc(D.fmt(x.from))}</td><td>${esc(D.fmt(x.to))}</td><td><b>${esc(x.name)}</b> <small class="muted">📅 calendar${x.location ? " · " + esc(x.location) : ""}</small></td><td>${esc(x.start)}</td><td>${esc(x.end)}</td><td></td></tr>`).join(""); }
function liveHtml(){
  if (!LIVE) return `<div class="emptyrow" style="padding:8px 10px">Loading today's incidents, tenant feedback, loading gate, checklists and restroom inspections…</div>`;
  if (LIVE.error) return `<div class="emptyrow" style="padding:8px 10px">${esc(LIVE.error)}</div>`;
  const R = LIVE.restroom || {};
  const I = LIVE.incidents || {}, FB = LIVE.feedback || [];
  const incT = `<table class="t live"><tr><th>Incident reports today${I.list ? ` · ${I.list.length}` : ""}</th><th style="width:34%">Type / severity</th><th style="width:30%">Status</th></tr>
    ${I.error ? `<tr><td colspan="3" class="emptyrow" style="padding:8px">Incident Report System not available right now (${esc(I.error)}).</td></tr>`
      : (I.list || []).length ? I.list.map(i => `<tr><td><b>${esc(i.ref)}</b> <small class="muted">${esc(i.time)}${i.location ? " · " + esc(i.location) : ""}</small></td><td>${esc(i.type)}${i.severity ? ` <small class="${/major|high|critical/i.test(i.severity) ? "nd" : "muted"}">· ${esc(i.severity)}</small>` : ""}</td><td>${esc(i.status)}</td></tr>`).join("")
      : `<tr><td colspan="3" class="emptyrow" style="padding:8px">No incident reported today.</td></tr>`}</table>`;
  const fbT = `<table class="t live"><tr><th>Tenant feedback today${FB.length ? ` · ${FB.length}` : ""}</th><th style="width:34%">Feedback</th><th style="width:30%">Action</th></tr>
    ${FB.length ? FB.map(f => `<tr><td><b>${esc(f.tenant)}</b> <small class="muted">${esc(f.time)}${f.category ? " · " + esc(f.category) : ""}</small></td><td>${esc(f.description)}</td><td>${esc([f.action, f.actionDesc].filter(Boolean).join(" — "))}</td></tr>`).join("")
      : `<tr><td colspan="3" class="emptyrow" style="padding:8px">No tenant feedback logged today.</td></tr>`}</table>`;
  /* Loading Gate feature: every QR scan at the loading area — approved in (green) / rejected out (red) */
  const G = LIVE.gate, gl = G ? G.list.filter(x => x.decision !== "leave") : [];
  const gateT = G ? `<table class="t live"><tr><th>Loading area gate${gl.length ? ` · <span class="done">${G.counts.in} in</span> · <span class="nd">${G.counts.out} rejected</span>` : ""}</th><th style="width:34%">Tenant · request</th><th style="width:30%">Decision</th></tr>
    ${gl.length ? gl.map(x => `<tr><td><b>${esc(x.contractor || x.tenant || x.req)}</b> <small class="muted">${hm(x.at)} · ${esc(x.by)}</small></td><td>${esc(x.tenant)}${x.req ? ` <small class="muted">· ${esc(x.req)}</small>` : ""}</td>
      <td>${x.decision === "in" ? `<span class="done">Approved in</span>${x.workers ? ` <small class="muted">· ${x.workers} workers</small>` : ""}${x.override ? ` <small class="nd">· override: ${esc(x.reason)}</small>` : ""}` : `<span class="nd">Rejected out</span> <small class="muted">· ${esc(x.reason)}</small>`}</td></tr>`).join("")
      : `<tr><td colspan="3" class="emptyrow" style="padding:8px">No QR scanned at the loading gate today.</td></tr>`}</table>` : "";
  const wrow = w => { const cls = (n) => n >= R.rooms ? "done" : w.state === "closed" ? "nd" : w.state === "open" ? "pr" : ""; const cell = (n, by) => R.rooms ? `<span class="${cls(n)}">${n}/${R.rooms}</span>${by.length ? ` <small class="muted">${esc(by.join(", "))}</small>` : ""}` : "—";
    return `<tr><td>${esc(w.label)} <small class="muted">${esc(w.time)}</small></td><td>${cell(w.ops, w.opsBy)}</td><td>${cell(w.ss, w.ssBy)}</td></tr>`; };
  return incT + fbT + gateT + `<table class="t live"><tr><th>Checklists · live</th><th style="width:34%">Status</th><th style="width:30%"></th></tr>
    <tr><td><b>AM Checklist</b></td><td colspan="2">${ckCell(LIVE.am)}</td></tr>
    <tr><td><b>PM Checklist</b></td><td colspan="2">${ckCell(LIVE.pm)}</td></tr></table>
    <table class="t live"><tr><th>Restroom inspections${R.rooms ? ` · ${R.rooms} restrooms` : ""}</th><th style="width:34%">OPS</th><th style="width:30%">S.S</th></tr>
    ${R.error ? `<tr><td colspan="3" class="emptyrow" style="padding:8px">Restroom inspections not available right now (${esc(R.error)}).</td></tr>` : (R.windows || []).map(wrow).join("") || `<tr><td colspan="3" class="emptyrow" style="padding:8px">No inspection windows today.</td></tr>`}</table>`;
}

/* ---------------- document ---------------- */
function itemRow(k, x, i, ro){
  const dated = k === "upcoming";
  return `<div class="it ${dated ? "dated" : ""} ${x.cctv ? "cctv" : ""} ${x.done ? "done" : ""} ${x.src === "portal" ? "portal" : "manual"}" ${x.req ? `title="${esc(x.req)} · imported from Tenant Connect"` : ""}>
    <span class="dot"></span>

/* =====================================================================
   IMPORT TENANT REQUESTS — the Salesforce "Handover Report" Excel (ABC Tenant Connect requests)
   Columns: Status · Valid From · Request Name · Tenant Name · Valid To · Sub Maintenance · Contractor · Description
   Blank Status / Valid From cells repeat the row above (grouped report).
   Each request lands in this handover by its date: this day → Today, next day → Tomorrow,
   later → Coming up (dated, moves into Today on its day). Requests already in the handover (same REQ number) are skipped.
   ===================================================================== */
let IMP = null;
function loadXlsx(){
  return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "xlsx.full.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("Could not load the Excel reader")); document.head.append(sc); });
}
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function parseWhen(v){
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) v = new Date(Math.round(v.getTime() / 60000) * 60000);   // Excel times can be a few ms short (09:59:59.999 → 10:00)
  if (v instanceof Date && !isNaN(v)) return { day: `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`, time: `${String(v.getHours()).padStart(2, "0")}:${String(v.getMinutes()).padStart(2, "0")}` };
  if (typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); if (d) return { day: `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`, time: `${String(d.H).padStart(2, "0")}:${String(d.M).padStart(2, "0")}` }; return null; }
  const m = String(v).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[,\sT]+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  const y = m[3].length === 2 ? "20" + m[3] : m[3];
  return { day: `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`, time: m[4] ? `${m[4].padStart(2, "0")}:${m[5]}` : "" };
}
function cleanTenant(n){
  let t = String(n || "").trim();
  const names = [CTX.siteName, ...Object.values(CTX.sites || {})].filter(Boolean).sort((a, b) => b.length - a.length);
  for (const s of names){ const re = new RegExp("\\s*(ABC\\s+)?" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*$", "i"); if (re.test(t)){ t = t.replace(re, ""); break; } }
  return t.replace(/\s+(Verdun|Achrafieh|Dbayeh)(\s+(Mall|Department Store|DS))?$/i, "").trim();
}
function readRequests(rows){
  const hi = rows.findIndex(r => r.some(c => /request name/i.test(String(c || ""))));
  if (hi < 0) throw new Error("This is not the Handover Report — the “Request Name” column is missing.");
  const H0 = rows[hi].map(c => String(c || "").toLowerCase());
  const col = re => H0.findIndex(h => re.test(h));
  const C = { status: col(/^status/), from: col(/valid from/), req: col(/request name/), tenant: col(/tenant/), to: col(/valid to/), sub: col(/sub maint|category|type/), contr: col(/contractor|supplier/), desc: col(/description/) };
  if (C.from < 0 || C.tenant < 0) throw new Error("The “Valid From” or “Tenant Name” column is missing.");
  if (C.status < 0) throw new Error("The “Status” column is missing — only Approved requests can be imported.");
  const out = []; let status = "", from = null;
  for (const r of rows.slice(hi + 1)){
    const req = String(r[C.req] ?? "").trim();
    if (C.status >= 0 && r[C.status] != null && String(r[C.status]).trim()) status = String(r[C.status]).trim();
    if (r[C.from] != null && String(r[C.from]).trim()) from = parseWhen(r[C.from]) || from;
    if (!/^REQ-?\d+/i.test(req) || !from) continue;
    out.push({ req: req.toUpperCase(), status: status.replace(/[^\w\s]/g, "").trim(), from: { ...from }, to: parseWhen(r[C.to]),
      tenant: cleanTenant(r[C.tenant]), sub: String(r[C.sub] ?? "").trim(), contractor: String(r[C.contr] ?? "").trim(), desc: String(r[C.desc] ?? "").trim() });
  }
  return out;
}
const dm = d => `${Number(d.slice(8))} ${MON[Number(d.slice(5, 7)) - 1]}`;
/* Portal handover line: Phil & Joe : Electrical job by Dany from 01/10/2026 06:00 to 02/10/2026 09:45 [Checking UPS Issue] (REQ-008717) */
const dmyDay = d => `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}`;
const nice = t => /[a-z]/.test(t) ? t : t.toLowerCase().replace(/(^|[\s\-\/&(.'])([a-z\u00C0-\u024F])/g, (m, a, b) => a + b.toUpperCase());   // ALL CAPS → Title Case
function reqText(q){
  const at = w => `${dmyDay(w.day)}${w.time ? " " + w.time : ""}`;
  const to = q.to ? (q.to.day === q.from.day ? (q.to.time || "") : at(q.to)) : "";
  return `${nice(q.tenant)} : ${q.sub ? q.sub + " job" : "Job"}${q.contractor ? " by " + q.contractor : ""} from ${at(q.from)}${to ? " to " + to : ""}${q.desc ? ` [${q.desc}]` : ""} (${q.req})`;
}
function planImport(list){
  const day = H.day, next = D.add(day, 1);
  const have = new Set(["ongoing", "today", "tomorrow", "upcoming"].flatMap(k => H.doc[k].map(x => x.req).filter(Boolean))), all = ["ongoing", "today", "tomorrow", "upcoming"].flatMap(k => H.doc[k].map(x => x.text));
  all.forEach(t => (t.match(/REQ-?\d+/gi) || []).forEach(r => have.add(r.toUpperCase())));
  const plan = { today: [], tomorrow: [], upcoming: [], later: [], dup: [], past: [], skipped: [] };
  for (const q of list){
    if (!/^approved/i.test(q.status)){ plan.skipped.push(q); continue; }   // only Approved ✔️ requests go into the handover
    if (have.has(q.req)){ plan.dup.push(q); continue; }
    const endDay = q.to ? q.to.day : q.from.day;
    if (q.from.day === day || (q.from.day < day && endDay >= day)) plan.today.push(q);
    else if (q.from.day === next) plan.tomorrow.push(q);
    else if (q.from.day > next){ plan.later.push(q); continue; }   // only today's and tomorrow's requests are imported — later ones come in with that day's import
    else plan.past.push(q);
    have.add(q.req);
  }
  plan.upcoming.sort((a, b) => (a.from.day + a.from.time).localeCompare(b.from.day + b.from.time));
  return plan;
}

  const f = e.target.files[0]; e.target.value = ""; if (!f || !H) return;

        ${n ? "" : `<p class="muted">Nothing new to add.</p>`}
        ${grp("Today", IMP.today)}${grp("Tomorrow", IMP.tomorrow)}${grp("Coming up", IMP.upcoming, true)}
        <p class="muted" style="font-size:.8rem;margin-top:12px">${[IMP.dup.length ? `${IMP.dup.length} already in this handover` : "", IMP.past.length ? `${IMP.past.length} finished before this day` : "", IMP.later.length ? `${IMP.later.length} after tomorrow — not imported (they come in when you import on their day)` : "", IMP.skipped.length ? `${IMP.skipped.length} not approved (submitted, rejected or closed) — left out` : ""].filter(Boolean).join(" · ") || "Nothing skipped."}</p>
      </div>
      <div class="dlg-f"><button class="btn ghost" data-v="0">Cancel</button>${n ? `<button class="btn gold" data-v="1">Add ${n} to the handover</button>` : ""}</div>`;
    d.onclick = ev => { const b = ev.target.closest("[data-v]"); if (!b && ev.target !== d) return; d.close();
      if (b && b.dataset.v === "1"){
        const mk = (q, dated) => ({ text: reqText(q), cctv: false, done: false, date: dated ? q.from.day : "", src: "portal", req: q.req });
        IMP.today.forEach(q => H.doc.today.push(mk(q)));
        IMP.tomorrow.forEach(q => H.doc.tomorrow.push(mk(q)));
        IMP.upcoming.forEach(q => H.doc.upcoming.push(mk(q, true)));
        H.doc.upcoming.sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
        touch(); render(); toast(`${n} request${n === 1 ? "" : "s"} added — save to keep them`);
      } };
    d.showModal();
  } catch (er){ toast(er.message, true); }
});

/* =====================================================================
   EMAIL IN OUTLOOK — the handover in its usual layout as a new, unsent email
   (.eml opens in Outlook as a draft; "Copy" puts the formatted handover on the clipboard for any mail app)
   ===================================================================== */
/* subject: ABC <Flagship> | <AM/PM> Handover <September 29th, 2026> — AM before 15:00 Beirut, PM after */
const MAIL_CUTOFF = 15;
function beirutHour(){ return Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", hour12: false }).format(new Date())) % 24; }
let MAIL_SHIFT = null;
function ordinalDate(day){
  const t = new Date(day + "T12:00:00Z"), n = t.getUTCDate();
  const suf = n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
  return `${t.toLocaleString("en-US", { month: "long", timeZone: "UTC" })} ${n}${suf}, ${t.getUTCFullYear()}`;
}
function mailSubject(){ return `ABC ${CTX.siteName} | ${MAIL_SHIFT || (beirutHour() < MAIL_CUTOFF ? "AM" : "PM")} Handover ${ordinalDate(H.day)}`; }
function mailHtml(){
  const d = H.doc, F = "font-family:Calibri,Arial,sans-serif;", B = "border:1px solid #2F3B52;";
  const head = (t, sub) => `<tr><td style="${F}background:#8EAADB;color:#10203F;font-weight:bold;font-size:15px;padding:6px 10px;border-top:1.5px solid #2F3B52">${esc(t)}${sub ? ` <span style="font-weight:normal;font-size:12px">· ${esc(sub)}</span>` : ""}</td></tr>`;
  const items = (L, dated) => `<tr><td style="${F}padding:4px 10px 8px">${L.length ? `<ul style="margin:0;padding-left:20px">${L.map(x => `<li style="color:${x.src === "portal" ? "#000000" : "#C00000"};font-size:14px;margin:2px 0;${x.cctv ? "font-weight:bold;" : ""}${x.done ? "text-decoration:line-through;" : ""}">${dated && x.date ? `<b>${esc(D.fmt(x.date, { weekday: "short" }))}:</b> ` : ""}${esc(x.text)}${x.cctv ? ` <span style="background:#E5484D;color:#fff;font-size:11px;padding:1px 5px">ATT CCTV</span>` : ""}${x.done ? " ✓" : ""}</li>`).join("")}</ul>` : `<span style="color:#777;font-size:13px">Nothing.</span>`}</td></tr>`;
  /* Today / Tomorrow: Operations Handover (typed, red) then Portal Handover (Tenant Connect, black) */
  const split = L => { const ops = L.filter(x => x.src !== "portal"), por = L.filter(x => x.src === "portal");
    const sub = (t, c) => `<tr><td style="${F}padding:6px 10px 0;font-size:14px;font-weight:bold;color:${c}">${t}</td></tr>`;
    return sub("Operations Handover:", "#C00000") + items(ops) + sub("Portal Handover:", "#000000") + items(por); };
  const tbl = (cols, rows) => `<tr><td style="padding:0"><table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%">
    <tr>${cols.map(c => `<th style="${F}background:#D9E2F3;font-size:13px;text-align:left;padding:5px 8px;border:1px solid #BFBFBF">${esc(c)}</th>`).join("")}</tr>
    ${rows.length ? rows.map(r => `<tr>${r.map(v => `<td style="${F}font-size:13px;padding:5px 8px;border:1px solid #BFBFBF">${v}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cols.length}" style="${F}font-size:13px;padding:5px 8px;border:1px solid #BFBFBF;color:#777">None.</td></tr>`}</table></td></tr>`;
  const st = v => v === "Done" ? `<b style="color:#2E8B57">Done</b>` : v === "Not done" ? `<b style="color:#C0392B">Not done</b>` : esc(v || "—");
  const title = mailSubject();
  const L2 = LIVE && !LIVE.error ? LIVE : null, R = L2 ? L2.restroom || {} : {};
  const ckM = r => !r ? `<b style="color:#C0392B">Not done</b>` : r.status === "submitted" ? `<b style="color:#2E8B57">Done</b> · ${esc(r.by)} ${hm(r.at)}${r.issues ? ` · ${r.issues} ✗` : ""}` : `<b style="color:#C07A12">In progress ${r.done}/${r.total}</b> · ${esc(r.by)}`;
  const rrM = (n, by, st) => R.rooms ? `<b style="color:${n >= R.rooms ? "#2E8B57" : st === "closed" ? "#C0392B" : st === "open" ? "#C07A12" : "#777"}">${n}/${R.rooms}</b>${by.length ? ` · ${esc(by.join(", "))}` : ""}` : "—";
  const IM = L2 && L2.incidents || {}, FM = L2 && L2.feedback || [];
  const incM = L2 ? (IM.error ? "" : tbl(["Incident report", "Time", "Type", "Severity", "Status"], (IM.list || []).map(i => [`<b>${esc(i.ref)}</b>${i.location ? ` <span style="color:#777">${esc(i.location)}</span>` : ""}`, esc(i.time), esc(i.type), esc(i.severity), esc(i.status)])))
    + tbl(["Tenant feedback", "Time", "Category", "Feedback", "Action"], FM.map(f => [`<b>${esc(f.tenant)}</b>`, esc(f.time), esc(f.category), esc(f.description), esc([f.action, f.actionDesc].filter(Boolean).join(" — "))])) : "";
  const GM = L2 && L2.gate ? L2.gate.list.filter(x => x.decision !== "leave") : null;   // Loading Gate feature
  const gateM = GM ? tbl(["Loading gate", "Time", "Tenant", "Request", "Decision"], GM.map(x => [`<b>${esc(x.contractor || x.tenant)}</b>`, hm(x.at), esc(x.tenant), esc(x.req),
    x.decision === "in" ? `<b style="color:#2E8B57">Approved in</b>${x.workers ? ` · ${x.workers} workers` : ""}${x.override ? ` <span style="color:#C0392B">· override: ${esc(x.reason)}</span>` : ""}` : `<b style="color:#C0392B">Rejected out</b> · ${esc(x.reason)}`])) : "";
  const liveM = L2 ? tbl(["Checklist", "Status"], [["AM Checklist", ckM(L2.am)], ["PM Checklist", ckM(L2.pm)]])
    + (R.windows && R.windows.length ? tbl(["Restroom inspections", "OPS", "S.S"], R.windows.map(w => [`${esc(w.label)} <span style="color:#777">${esc(w.time)}</span>`, rrM(w.ops, w.opsBy, w.state), rrM(w.ss, w.ssBy, w.state)])) : "") : "";
  return { title, html: `<div style="${F}"><p style="${F}font-size:14px">Dear team,<br><br>Please find below the shift handover.</p>
  <table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;max-width:900px;${B}">
    <tr><td style="${F}background:#2A0F45;color:#fff;font-weight:bold;font-size:16px;padding:8px 10px">${esc(title)}</td></tr>
    ${head("Scheduled works", "Ongoing follow-up until solved")}${items(d.ongoing)}
    ${head("Today")}${split(d.today)}
    ${head("Tomorrow")}${split(d.tomorrow)}
    ${head("Coming up")}${items(d.upcoming, true)}
    ${head("Incidents & tenant feedback")}${incM || `<tr><td style="${F}padding:4px 10px 8px;color:#777;font-size:13px">Not available.</td></tr>`}
    ${gateM ? head("Loading area gate", "QR scans today") + gateM : ""}
    ${head("Daily operations checklist tracker")}${liveM || `<tr><td style="${F}padding:4px 10px 8px;color:#777;font-size:13px">Live checklist status not available.</td></tr>`}
    ${head("Marketing events")}${tbl(["From", "To", "Event / activation", "Start", "End"], calEvents(d).concat(d.events).map(e => [esc(D.fmt(e.from)), esc(D.fmt(e.to)), esc(e.name), esc(e.start), esc(e.end)]))}
  </table>
  <p style="${F}font-size:14px">Best regards,<br>${esc(CTX.me.name)}</p></div>` };
}
function b64utf8(s){ const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin).replace(/.{76}/g, "$&\r\n"); }
function emlFile(){
  const { title, html } = mailHtml();
  const subj = "=?UTF-8?B?" + btoa(String.fromCharCode(...new TextEncoder().encode(title))) + "?=";
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${html}</body></html>`;
  return { title, text: ["To: ", `Subject: ${subj}`, "X-Unsent: 1", "MIME-Version: 1.0", "Content-Type: text/html; charset=UTF-8", "Content-Transfer-Encoding: base64", "", b64utf8(doc)].join("\r\n") };
}
async function mailDialog(){
  if (!LIVE || LIVE.error) await loadLive();
  { const S = H.shifts || ["AM", "PM"], L = H.handoffs || [], nx = S.find(c => !L.some(x => x.shift === c)) || S[S.length - 1]; MAIL_SHIFT = shName(nx); }
  const d = $("#dMail");
  d.innerHTML = `<div class="dlg-h"><b>Email this handover</b><small>Opens as a new email with the handover already inside. Add the recipients and send.</small></div>
    <div class="dlg-b" style="display:grid;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="muted" style="font-size:.85rem">Shift</span>
        <span class="seg" style="display:inline-flex;border:1px solid var(--line,#ccc);border-radius:10px;overflow:hidden">${(H.shifts || ["AM", "PM"]).map(shName).map(x => `<button type="button" class="btn small ${MAIL_SHIFT === x ? "gold" : "ghost"}" data-sh="${x}" style="border-radius:0;border:0">${x}</button>`).join("")}</span></div>
      <div id="mailSubj" style="font-size:.85rem;padding:8px 10px;border-radius:10px;background:var(--paper,#f5f5f5)"><span class="muted">Subject:</span> <b>${esc(mailSubject())}</b></div>
      <button class="btn gold" data-m="eml">Open in Outlook (desktop)</button>
      <p class="muted" style="font-size:.8rem;margin-top:-4px">Downloads <b>handover.eml</b>. Open it and Outlook shows a new, unsent email.</p>
      <button class="btn ghost" data-m="copy">Copy the handover, then open a new email</button>
      <p class="muted" style="font-size:.8rem;margin-top:-4px">For Outlook on the web or phone: a new email opens with the subject. Paste (Ctrl + V) into the body.</p>
    </div>
    <div class="dlg-f"><button class="btn ghost" data-m="x">Close</button></div>`;
  d.onclick = async ev => {
    const sh = ev.target.closest("[data-sh]");
    if (sh){ MAIL_SHIFT = sh.dataset.sh; d.querySelectorAll("[data-sh]").forEach(x => x.className = `btn small ${x.dataset.sh === MAIL_SHIFT ? "gold" : "ghost"}`);
      d.querySelector("#mailSubj").innerHTML = `<span class="muted">Subject:</span> <b>${esc(mailSubject())}</b>`; return; }
    const b = ev.target.closest("[data-m]"); if (!b && ev.target !== d) return;
    const m = b ? b.dataset.m : "x";
    if (m === "eml"){
      const f = emlFile(), a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([f.text], { type: "message/rfc822" }));
      a.download = `Handover ${CTX.siteName} ${H.day}.eml`; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Email file ready — open it to see the draft in Outlook");
    }
    if (m === "copy"){
      const { title, html } = mailHtml();
      try {
        await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([mailPlain()], { type: "text/plain" }) })]);
        toast("Handover copied — paste it into the email");
      } catch { const w = document.createElement("div"); w.innerHTML = html; w.style.position = "fixed"; w.style.left = "-9999px"; document.body.append(w);
        const r = document.createRange(); r.selectNodeContents(w); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand("copy"); sel.removeAllRanges(); w.remove(); toast("Handover copied — paste it into the email"); }
      location.href = "mailto:?subject=" + encodeURIComponent(title);
    }
    d.close();
  };
  d.showModal();
}
function mailPlain(){
  const d = H.doc, L = (t, arr, dated) => `${t}\n${arr.length ? arr.map(x => `• ${dated && x.date ? D.fmt(x.date) + ": " : ""}${x.text}${x.cctv ? " [ATT CCTV]" : ""}${x.done ? " ✓" : ""}`).join("\n") : "—"}\n`;
  return [L("SCHEDULED WORKS", d.ongoing), L("TODAY", d.today), L("TOMORROW", d.tomorrow), L("COMING UP", d.upcoming, true)].join("\n");
}
addEventListener("hub-synced", e => { const { path, body, result } = e.detail || {};
  if (path === "ops/handover/save" && H && !H.id && body.day === H.day && result && result.id) H.id = result.id; });
addEventListener("beforeunload", e => { if (H && dirty && H.can.handover){ e.preventDefault(); e.returnValue = ""; } });
boot().catch(e => { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
</script>
</body>
