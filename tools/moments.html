<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message of the moment · ABC</title>
<link rel="icon" type="image/png" href="/icons/abc-48.png">
<link rel="stylesheet" href="tools.css">
<!-- Message of the moment: friendly lines above Day to Day for the operations team (admin) — see docs/FEATURE-moments.md -->
<style>
.box{padding:16px 18px;margin-bottom:14px}
.row{display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input[type=time],.row input[type=text]{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.row label{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.prev{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;color:#fff;background:linear-gradient(120deg,#2A0F45 0%,#5B2A86 55%,#B08A2E 140%)}
.prev small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}.prev p{font-weight:700;margin-top:2px}
.sw{display:flex;align-items:center;gap:8px;font-weight:700}
@media (max-width:640px){.row{grid-template-columns:96px 1fr}.row label,.row .btn{justify-self:start}}
</style>
</head>
<body>
<div class="top"><h1>✦ Message of the moment</h1><label class="sw"><input type="checkbox" id="on"> Show messages</label><button class="btn" id="save">Save</button></div>
<div class="wrap" style="max-width:900px">
  <div class="card box"><p class="muted" style="font-size:.86rem;line-height:1.5">Each message shows above <b>Day to Day Operations</b> — to you (admin) only — from its time until the next message's time.
    On each person's screen it stays <b id="mins">5</b> minutes, once a day. Write in English, Lebanese Arabic or both.</p>
    <div class="prev" style="margin-top:12px"><span style="font-size:1.4rem;color:#F3D57E">✦</span><div><small id="pT">Preview</small><p id="pX" dir="auto">—</p></div></div></div>
  <div class="card box"><div id="list"></div><button class="btn ghost small" id="add" style="margin-top:10px">+ Message</button></div>
</div>
<script src="common.js"></script>
<script>
let M = null;
const row = m => `<div class="row" data-id="${esc(m.id || "")}"><input type="time" class="t" value="${esc(m.time)}"><input type="text" class="x" maxlength="220" dir="auto" value="${esc(m.text)}" placeholder="e.g. صباح الخير ☕ Have a smooth opening!">
  <label><input type="checkbox" class="a" ${m.active !== false ? "checked" : ""}> On</label><button class="btn ghost small danger rm" aria-label="Remove">✕</button></div>`;
function draw(){ $("#on").checked = M.on !== false; $("#mins").textContent = M.minutes; $("#list").innerHTML = (M.list || []).slice().sort((a, b) => a.time.localeCompare(b.time)).map(row).join(""); prev(); }
function prev(){ const now = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Beirut", hour: "2-digit", minute: "2-digit" });
  const L = [...document.querySelectorAll(".row")].map(r => ({ time: r.querySelector(".t").value, text: r.querySelector(".x").value, on: r.querySelector(".a").checked })).filter(m => m.on && m.time && m.text).sort((a, b) => a.time.localeCompare(b.time));
  const cur = [...L].reverse().find(m => m.time <= now) || L[L.length - 1];
  $("#pT").textContent = cur ? `Message of the moment · ${cur.time}${cur.time > now ? " (from yesterday's last)" : " · showing now"}` : "Preview"; $("#pX").textContent = cur ? cur.text : "—"; }
async function boot(){ try { M = await api("admin/moments"); draw(); } catch (e){ document.querySelector(".wrap").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; } }
document.addEventListener("input", prev);
document.addEventListener("click", async e => {
  if (e.target.id === "add"){ $("#list").insertAdjacentHTML("beforeend", row({ time: "", text: "", active: true })); return $("#list").lastElementChild.querySelector(".t").focus(); }
  if (e.target.classList.contains("rm")){ e.target.closest(".row").remove(); return prev(); }
  if (e.target.id === "save"){
    const list = [...document.querySelectorAll(".row")].map(r => ({ id: r.dataset.id, time: r.querySelector(".t").value, text: r.querySelector(".x").value.trim(), active: r.querySelector(".a").checked }));
    if (list.some(m => !m.time && m.text)) return toast("Give every message a time", true);
    try { M = await api("admin/moments", { on: $("#on").checked, list }); draw(); toast("Saved — the team sees it on their next refresh"); } catch (er){ toast(er.message, true); }
  }
});
boot();
</script>
</body>
</html>
