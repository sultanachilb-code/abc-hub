name: Diag triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute hub-db --remote --json --command "$1" | jq -c '.[0].results[]' ; }
          echo "== triggers"; q "SELECT site, form, item_id, data, updated_at FROM form_triggers" || true
          echo "== log"; q "SELECT site, form, day, item_id, item_text, by_name, at, result FROM form_trig_log ORDER BY id DESC LIMIT 20" || true
          echo "== today's AM/PM"; q "SELECT id, site, form, day, status, updated_at, issues FROM form_runs WHERE day >= date('now','-1 day') ORDER BY id DESC LIMIT 15" || true
