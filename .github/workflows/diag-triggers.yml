name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          Q="SELECT (SELECT COUNT(*) FROM portal_lookup) AS lookup, (SELECT v FROM meta WHERE k = 'portal:last:lookup') AS lastLookup, (SELECT COUNT(*) FROM portal_users WHERE active = 1) AS users, (SELECT COUNT(*) FROM portal_users WHERE active = 1 AND raw_account != '') AS rawSet, (SELECT group_concat(site || ':' || n, ', ') FROM (SELECT site, COUNT(*) n FROM portal_users WHERE active = 1 GROUP BY site)) AS perSite, (SELECT v FROM meta WHERE k = 'pt:lkalert') AS alert"
          npx -y wrangler@4 d1 execute hub-db --remote --json --command "$Q" > o.json 2> e.txt || true
          echo "::notice title=acm::$(node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r[r.length-1].results[0]))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,300).replace(/\n/g," "))}')"
