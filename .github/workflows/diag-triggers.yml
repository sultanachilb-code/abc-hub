name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute hub-db --remote --json --command "$1" > o.json 2> e.txt || true
            node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r[r.length-1].results).slice(0,1800))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,300).replace(/\n/g," "))}'; }
          echo "::notice title=last::$(q "SELECT k, substr(v,1,160) v FROM meta WHERE k LIKE 'portal:last%' OR k='contracts:last' OR k='mb:lastrun'")"
          echo "::notice title=mk::$(q "SELECT received, subject, files, result FROM mb_log WHERE subject LIKE '%Marketing%' OR subject LIKE '%Handover%' ORDER BY received DESC LIMIT 6")"
