name: Diag triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          n(){ echo "::notice title=$1::$(curl -s -m 15 "$2" | head -c 300 | tr ',' ' ')"; }
          n incidents-signin "https://abc-incident-system.sultanachi-lb-61f.workers.dev/api/hub-signin"
          n snaglist-signin "https://abc-snaglist.sultanalachi-work.workers.dev/api?hubsignin=1"
          n restroom-probe "https://abc-restroom-report.sultanachi-lb-61f.workers.dev/api/sso?probe=1"
          n restroom-session "https://abc-restroom-report.sultanachi-lb-61f.workers.dev/api/session"
          n restroom-data-locked "https://abc-restroom-report.sultanachi-lb-61f.workers.dev/api/report-data?from=2026-10-01&to=2026-10-31"
          n hub-policy-nokey "https://operations-hub.sultanachi-lb-61f.workers.dev/api/sso/policy?app=snaglist"
          echo "::notice title=pin-in-page::$(curl -s -m 15 https://abc-restroom-report.sultanachi-lb-61f.workers.dev/ | grep -c "const PIN")"
          curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/abc-incident-system/schedules" | jq -c '.result' | sed 's/^/::notice title=inc-crons::/' | tr ',' ' '
