name: Diag triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/builds/builds/70a9d226-4ae9-4758-a751-3dee78622492/logs" > l.json
          jq -r '.result.lines[]? | .[1]' l.json | tail -40 | while IFS= read -r l; do echo "::notice title=log::${l//,/ }"; done
          jq -c '.errors' l.json | sed 's/^/::notice title=err::/'
