name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute "$1" --remote --json --command "$2" > o.json 2> e.txt || true
            node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r[r.length-1].results).slice(0,1800))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,400).replace(/\n/g," "))}'; }
          echo "::notice title=accounts::$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | head -c 600)"
          export CLOUDFLARE_ACCOUNT_ID=61f649b35159d4a26df7dde3c09a91dd
          echo "::notice title=snagschema-hubacct::$(q abc-snaglist "SELECT sql FROM sqlite_master WHERE name='users'")"
          echo "::notice title=snaguser-hubacct::$(q abc-snaglist "SELECT email, role, site_code, sites, active, substr(hub_rights,1,200) AS r, last_login_at FROM users WHERE email LIKE 'salaachi%' OR role='ADMIN'")"
