name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 https://abc-snaglist.sultanalachi-work.workers.dev/api?health=1 > h.json
          node -e 'const j=require("./h.json");const L=j.data.fix.lists.map(r=>[r[0],r[1].replace(/[\n\r|]/g," "),r[5],r[6]].join("~"));for(let i=0;i<L.length;i+=12)console.log("::notice title=p"+String(i/12).padStart(2,"0")+"::"+L.slice(i,i+12).join(" ^ "))'
