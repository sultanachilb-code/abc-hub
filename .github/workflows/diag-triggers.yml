name: Diag triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          B=70a9d226-4ae9-4758-a751-3dee78622492
          curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/builds/builds/$B" | jq -c '.result | {status, build_outcome, stopped_on, trigger: .trigger.trigger_name}' | sed 's/^/::notice title=build::/' | tr ',' ' '
          C=""; for n in 1 2 3 4; do
            curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/builds/builds/$B/logs${C:+?cursor=$C}" > l.json
            jq -r '.result.lines[]? | .[1]' l.json | grep -iv "^$" | grep -iE "error|fail|✘|binding|service|warn" | head -20 | while IFS= read -r l; do echo "::notice title=log$n::${l//,/ }"; done
            C=$(jq -r '.result.cursor // empty' l.json); T=$(jq -r '.result.truncated' l.json); [ "$T" = "true" ] && [ -n "$C" ] || break; done
