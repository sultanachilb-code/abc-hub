name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute hub-db --remote --json --command "$1" > o.json 2> e.txt || true
            node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r[r.length-1].results).slice(0,2500))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,300).replace(/\n/g," "))}'; }
          echo "::notice title=ev::$(q "SELECT app, tone, substr(title,1,60) t, COUNT(*) n FROM hub_events WHERE app LIKE 'pm%' GROUP BY app, tone, t")"
          echo "::notice title=evcols::$(q "SELECT name FROM pragma_table_info('hub_events')") rem $(q "SELECT name FROM pragma_table_info('reminders')")"
          echo "::notice title=rem2::$(q "SELECT * FROM reminders LIMIT 3")"
          echo "::notice title=recs::$(q "SELECT r.id, r.cycle_id, r.site, r.brand, r.last_mail, r.completed_at FROM pm_records r WHERE r.cycle_id IN (3,4)")"
