    runs-on: ubuntu-latest
    steps:
      - run: |
          H=https://operations-hub.sultanachi-lb-61f.workers.dev
          echo "::notice title=page::$(curl -s -o /dev/null -w '%{http_code}' $H/tools/footfall)"
          echo "::notice title=form::$(curl -s -o /dev/null -w '%{http_code}' $H/ff/AAAAAAAAAAAAAAAAAAAAAAAA)"
          echo "::notice title=ext::$(curl -s $H/api/ff-ext/AAAAAAAAAAAAAAAAAAAAAAAA)"
