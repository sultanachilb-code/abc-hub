name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute hub-db --remote --json --command "$1" > o.json 2> e.txt || true
            node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r.map(x=>x.results&&x.results.length?x.results:x.meta&&x.meta.changes)).slice(0,1500))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,300).replace(/\n/g," "))}'; }
          echo "::notice title=sw::$(q "INSERT OR REPLACE INTO meta (k, v) VALUES ('pm:auto', 'off')")"
          echo "::notice title=del::$(q "DELETE FROM pm_certs WHERE record_id IN (SELECT r.id FROM pm_records r JOIN pm_cycles c ON c.id = r.cycle_id WHERE c.id IN (SELECT c2.id FROM pm_cycles c2 WHERE EXISTS (SELECT 1 FROM pm_records x WHERE x.cycle_id = c2.id AND x.completed_at = '') OR NOT EXISTS (SELECT 1 FROM pm_records y WHERE y.cycle_id = c2.id))); DELETE FROM pm_ext WHERE cycle_id IN (SELECT c2.id FROM pm_cycles c2 WHERE EXISTS (SELECT 1 FROM pm_records x WHERE x.cycle_id = c2.id AND x.completed_at = '') OR NOT EXISTS (SELECT 1 FROM pm_records y WHERE y.cycle_id = c2.id)); DELETE FROM pm_records WHERE cycle_id IN (SELECT c2.id FROM pm_cycles c2 WHERE EXISTS (SELECT 1 FROM pm_records x WHERE x.cycle_id = c2.id AND x.completed_at = '')); DELETE FROM pm_cycles WHERE NOT EXISTS (SELECT 1 FROM pm_records y WHERE y.cycle_id = pm_cycles.id); DELETE FROM hub_events WHERE app = 'pm-ops'; UPDATE reminders SET active = 0 WHERE kind LIKE 'pm%'")"
          echo "::notice title=after::$(q "SELECT c.id, c.site, c.month, (SELECT COUNT(*) FROM pm_records r WHERE r.cycle_id = c.id) recs, (SELECT COUNT(*) FROM pm_records r WHERE r.cycle_id = c.id AND completed_at = '') open FROM pm_cycles c") certs $(q "SELECT COUNT(*) n FROM pm_certs") auto $(q "SELECT v FROM meta WHERE k = 'pm:auto'")"
