name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute "${DBN:-hub-db}" --remote --json --command "$1" > o.json 2> e.txt || true
            node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r.map(x=>x.results&&x.results.length?x.results:x.meta&&x.meta.changes)).slice(0,1500))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,300).replace(/\n/g," "))}'; }
          echo "::notice title=tpl::$(q "SELECT site, form, json_array_length(json_extract(data,'$.items')) n, substr(json_extract(data,'$.items[0].t'),1,60) first, updated_at FROM form_templates WHERE form IN ('am','pm')")"
          echo "::notice title=runs::$(q "SELECT site, form, COUNT(*) n, MAX(day) last, SUM(issues) iss FROM form_runs WHERE form IN ('am','pm') GROUP BY site, form")"
