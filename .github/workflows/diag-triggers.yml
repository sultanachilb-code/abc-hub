name: diag-triggers
on:
  push:
    branches: [diag-triggers]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - run: |
          mkdir out
          for D in hub-db abc-restroom-db abc-incidents; do
            npx -y wrangler@4 d1 execute $D --remote --json --command "$(cat src/diag/q-$D.sql)" > out/r-$D.json 2> out/r-$D.err || true
          done
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          mkdir -p repo/diag && cp out/* repo/diag/ && cd repo && git config user.name diag && git config user.email diag@users.noreply.github.com
          git add diag && git commit -qm "diag output [skip ci]" && git push -q
