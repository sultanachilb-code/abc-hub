name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          mkdir out
          for D in hub-db abc-restroom-db abc-incidents; do
            npx -y wrangler@4 d1 execute "$D" --remote --json --command "SELECT m.name AS t, p.name AS c, p.type AS ty FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type='table' AND m.name NOT LIKE 'sqlite_%' AND m.name NOT LIKE '_cf_%' ORDER BY m.name, p.cid" > out/$D.json 2> out/$D.err || true
            npx -y wrangler@4 d1 execute "$D" --remote --json --command "SELECT name, (SELECT 0) z FROM sqlite_master WHERE type='table'" > out/$D.tables.json 2>/dev/null || true
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: schemas, path: out }
