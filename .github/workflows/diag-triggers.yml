name: diag-triggers
on:
  push:
    branches: [diag-triggers]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          mkdir out
          i=0
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT kind,status,COUNT(*) n FROM portal_items WHERE active=1 GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT kind,status,COUNT(*) n FROM portal_items WHERE active=1 GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT form,status,COUNT(*) n FROM form_runs GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT form,status,COUNT(*) n FROM form_runs GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT shift,status,COUNT(*) n FROM handovers GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT shift,status,COUNT(*) n FROM handovers GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,priority,COUNT(*) n FROM mf_records GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,priority,COUNT(*) n FROM mf_records GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT role,position,COUNT(*) n FROM users GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT role,position,COUNT(*) n FROM users GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT site_code,COUNT(*) n FROM users GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT site_code,COUNT(*) n FROM users GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM cl_workers GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM cl_workers GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM mom_actions GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM mom_actions GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM qc_actions GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM qc_actions GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT stage,COUNT(*) n FROM projects GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT stage,COUNT(*) n FROM projects GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT kind,COUNT(*) n FROM cal_items GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT kind,COUNT(*) n FROM cal_items GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM contractors GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM contractors GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT decision,COUNT(*) n FROM gate_scans GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT decision,COUNT(*) n FROM gate_scans GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM patrol_scans GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM patrol_scans GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT state,COUNT(*) n FROM memo_targets GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT state,COUNT(*) n FROM memo_targets GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM works_forms GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM works_forms GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT kind,COUNT(*) n FROM reminders GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT kind,COUNT(*) n FROM reminders GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT app,COUNT(*) n FROM usage_log GROUP BY 1 ORDER BY 2 DESC LIMIT 30" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT app,COUNT(*) n FROM usage_log GROUP BY 1 ORDER BY 2 DESC LIMIT 30' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM gla_units GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM gla_units GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT status,COUNT(*) n FROM emergencies GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT status,COUNT(*) n FROM emergencies GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT site, day, created_at FROM form_runs ORDER BY id DESC LIMIT 2" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT site, day, created_at FROM form_runs ORDER BY id DESC LIMIT 2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute hub-db --remote --json --command "SELECT at FROM usage_log ORDER BY id DESC LIMIT 1" > out/v$i.json 2>out/v$i.err || true; echo 'hub-db | SELECT at FROM usage_log ORDER BY id DESC LIMIT 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-restroom-db --remote --json --command "SELECT flagship,COUNT(*) n,MAX(log_date) d, MIN(log_date) d0 FROM inspection_logs GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'abc-restroom-db | SELECT flagship,COUNT(*) n,MAX(log_date) d, MIN(log_date) d0 FROM inspection_logs GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-restroom-db --remote --json --command "SELECT gps_status,has_issues,COUNT(*) FROM inspection_logs GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'abc-restroom-db | SELECT gps_status,has_issues,COUNT(*) FROM inspection_logs GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-restroom-db --remote --json --command "SELECT log_date,log_time,created_at,window_id FROM inspection_logs ORDER BY id DESC LIMIT 2" > out/v$i.json 2>out/v$i.err || true; echo 'abc-restroom-db | SELECT log_date,log_time,created_at,window_id FROM inspection_logs ORDER BY id DESC LIMIT 2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-restroom-db --remote --json --command "SELECT report_type,status,COUNT(*) FROM shift_reports GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'abc-restroom-db | SELECT report_type,status,COUNT(*) FROM shift_reports GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-restroom-db --remote --json --command "SELECT company,COUNT(*) FROM softservices_logs GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'abc-restroom-db | SELECT company,COUNT(*) FROM softservices_logs GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-incidents --remote --json --command "SELECT category,status,severity,COUNT(*) FROM incidents GROUP BY 1,2,3" > out/v$i.json 2>out/v$i.err || true; echo 'abc-incidents | SELECT category,status,severity,COUNT(*) FROM incidents GROUP BY 1,2,3' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-incidents --remote --json --command "SELECT flagship,COUNT(*) FROM incidents GROUP BY 1" > out/v$i.json 2>out/v$i.err || true; echo 'abc-incidents | SELECT flagship,COUNT(*) FROM incidents GROUP BY 1' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-incidents --remote --json --command "SELECT access_status,person_type,COUNT(*) FROM blacklist GROUP BY 1,2" > out/v$i.json 2>out/v$i.err || true; echo 'abc-incidents | SELECT access_status,person_type,COUNT(*) FROM blacklist GROUP BY 1,2' > out/v$i.q
          i=$((i+1)); npx -y wrangler@4 d1 execute abc-incidents --remote --json --command "SELECT logged_at,incident_date FROM incidents ORDER BY rowid DESC LIMIT 2" > out/v$i.json 2>out/v$i.err || true; echo 'abc-incidents | SELECT logged_at,incident_date FROM incidents ORDER BY rowid DESC LIMIT 2' > out/v$i.q
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          mkdir -p repo/diag && cp out/* repo/diag/ && cd repo && git config user.name diag && git config user.email diag@users.noreply.github.com
          git add diag && git commit -qm "diag output [skip ci]" && git push -q
