name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute hub-db --remote --json --command "$1" > o.json 2> e.txt || true
            node -e 'try{const r=JSON.parse(require("fs").readFileSync("o.json","utf8"));console.log(JSON.stringify(r[r.length-1].results).slice(0,1800))}catch(e){console.log("ERR "+require("fs").readFileSync("e.txt","utf8").slice(0,300).replace(/\n/g," "))}'; }
          echo "::notice title=st::$(q "SELECT kind, status, site, COUNT(*) n FROM portal_items WHERE active = 1 AND kind = 'vr' GROUP BY status, site ORDER BY status")"
          echo "::notice title=ty::$(q "SELECT kind, type, COUNT(*) n FROM portal_items WHERE active = 1 AND kind IN ('nr','bp','vr') GROUP BY kind, type ORDER BY kind, n DESC")"
