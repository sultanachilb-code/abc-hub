name: diag-triggers
on:
  push:
    branches: [diag-triggers]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice title=snag::$(curl -s -m 20 https://abc-snaglist.sultanalachi-work.workers.dev/api?health=1 | head -c 200) boot $(curl -s -m 20 https://abc-snaglist.sultanalachi-work.workers.dev/ | grep -c "hadCache")"
