# ABC Operations Hub — deploy to Cloudflare on every upload to main (the hub, then the Loading Gate app)
# (and by hand: GitHub → Actions → "Deploy hub to Cloudflare" → Run workflow)
name: Deploy hub to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hub
  cancel-in-progress: true   # several uploads in a row → only the newest one deploys

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      # Policies & Procedures files (R2 bucket of the hub) — created once; the step is ignored when it already exists
      - name: Create the hub files bucket (once; ignored when it exists)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          command: r2 bucket create abc-hub-files

      # ABCON: list the account's D1 databases (names + ids) as notes on the run, to connect the right ones read-only
      - name: List D1 databases (for ABCON)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          command: d1 list --json
      - name: Show the D1 list
        continue-on-error: true
        run: |
          npx -y wrangler@4 d1 list --json > d1.json 2> d1.err || true
          node -e 'try { const a = JSON.parse(require("fs").readFileSync("d1.json","utf8")); for (const d of a) console.log(`::notice title=D1::${d.name} ${d.uuid}`); } catch (e) { console.log("::notice title=D1::could not list — " + require("fs").readFileSync("d1.err","utf8").slice(0,300).replace(/\n/g," ")); }'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          command: deploy

      # Loading Gate: the loading-area scanner on its own link (worker abc-loading-gate), same scanner page as the hub
      - name: Copy the scanner into the Loading Gate app
        run: sh gate-worker/build.sh

      - name: Deploy the Loading Gate app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          workingDirectory: gate-worker
          command: deploy

      # Cleaning app: the cleaner supervisors' phones on their own link (worker abc-cleaning) — see docs/FEATURE-cleaning-app.md
      # The hub is already live at this point: a problem here (e.g. R2 not enabled yet) never stops the hub.
      - name: Create the photo bucket for the cleaning app (once; ignored when it exists)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          command: r2 bucket create abc-cleaning-photos

      - name: Copy the icons into the cleaning app
        run: sh cleaning-worker/build.sh

      - name: Deploy the cleaning app
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          workingDirectory: cleaning-worker
          command: deploy
