# ABC Operations Hub — deploy to Cloudflare on every upload to main (the hub, then the Loading Gate app)
# (and by hand: GitHub → Actions → "Deploy hub to Cloudflare" → Run workflow)
name: Deploy hub to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hub
  cancel-in-progress: true   # several uploads in a row → only the newest one deploys

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          command: deploy

      # Loading Gate: the loading-area scanner on its own link (worker abc-loading-gate), same scanner page as the hub
      - name: Copy the scanner into the Loading Gate app
        run: sh gate-worker/build.sh

      - name: Deploy the Loading Gate app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          workingDirectory: gate-worker
          command: deploy

      # Cleaning app: the cleaner supervisors' phones on their own link (worker abc-cleaning) — see docs/FEATURE-cleaning-app.md
      # The hub is already live at this point: a problem here (e.g. R2 not enabled yet) never stops the hub.
      - name: Create the photo bucket for the cleaning app (once; ignored when it exists)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          command: r2 bucket create abc-cleaning-photos

      - name: Copy the icons into the cleaning app
        run: sh cleaning-worker/build.sh

      - name: Deploy the cleaning app
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 61f649b35159d4a26df7dde3c09a91dd
          wranglerVersion: "4"
          workingDirectory: cleaning-worker
          command: deploy
