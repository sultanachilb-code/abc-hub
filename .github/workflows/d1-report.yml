# D1 usage report — which queries read the most rows (Cloudflare query insights), per database.
# Run by hand: GitHub → Actions → "D1 usage report" → Run workflow. The results appear as notes on the run.
name: D1 usage report

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Period (1d, 7d, 31d)"
        default: "1d"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
      PERIOD: ${{ github.event.inputs.period || '1d' }}
    steps:
      - name: List the databases
        run: npx -y wrangler@4 d1 list --json > d1.json 2> d1.err || (cat d1.err; exit 0)
      - name: Top queries (one note group per database)
        run: |
          cat > rep.js <<'EOF'
          const { execSync } = require("child_process"), fs = require("fs");
          let dbs = []; try { dbs = JSON.parse(fs.readFileSync("d1.json", "utf8")); } catch { console.log("::warning title=D1::could not list databases"); }
          const idx = Number(process.argv[2]), d = dbs[idx]; if (!d) process.exit(0);
          let out = "", rows = [];
          try { out = execSync(`npx -y wrangler@4 d1 insights ${d.name} --timePeriod ${process.env.PERIOD} --sort-type sum --sort-by reads --sort-direction DESC --limit 9 --json`, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }); rows = JSON.parse(out); }
          catch (e) { console.log(`::warning title=${d.name}::insights failed — ${String((e.stderr || e.message || "")).slice(0, 300).replace(/\n/g, " ")}`); process.exit(0); }
          const tot = rows.reduce((a, r) => a + (Number(r.totalRowsRead) || 0), 0);
          console.log(`::notice title=${d.name} · TOTAL::top ${rows.length} queries read ${tot.toLocaleString("en-US")} rows in ${process.env.PERIOD}`);
          for (const r of rows.slice(0, 9)) {
            const q = String(r.query || "").replace(/\s+/g, " ").slice(0, 330);
            console.log(`::notice title=${d.name} · ${Number(r.totalRowsRead || 0).toLocaleString("en-US")} rows · ${r.numberOfTimesRun || "?"} runs · ${Math.round(Number(r.avgRowsRead || 0))} avg::${q}`);
          }
          EOF
          echo ok
      - name: Database 1
        continue-on-error: true
        run: node rep.js 0
      - name: Database 2
        continue-on-error: true
        run: node rep.js 1
      - name: Database 3
        continue-on-error: true
        run: node rep.js 2
      - name: Database 4
        continue-on-error: true
        run: node rep.js 3
      - name: Database 5
        continue-on-error: true
        run: node rep.js 4
      - name: Database 6
        continue-on-error: true
        run: node rep.js 5
