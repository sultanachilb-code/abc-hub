# One-off check of the Cloudflare GraphQL fields used by Admin → Storage → Database usage (run by hand)
name: D1 analytics check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T: ${{ secrets.CF_ANALYTICS_TOKEN }}
    steps:
      - run: |
          cat > q.js <<'EOF2'
          const acc = "61f649b35159d4a26df7dde3c09a91dd", now = new Date(), day = now.toISOString().slice(0, 10), wk = new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10);
          const run = async (name, query, variables) => {
            const r = await fetch("https://api.cloudflare.com/client/v4/graphql", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + process.env.T }, body: JSON.stringify({ query, variables }) });
            const j = await r.json().catch(() => ({}));
            const msg = j.errors && j.errors.length ? "ERROR " + j.errors.map(e => e.message).join(" | ") : JSON.stringify(j.data).slice(0, 900);
            console.log(`::notice title=${name}::${msg.replace(/\n/g, " ")}`);
          };
          (async () => {
            await run("daily", `query($acc: String!, $f: Date!, $t: Date!) { viewer { accounts(filter: { accountTag: $acc }) { d1AnalyticsAdaptiveGroups(limit: 100, filter: { date_geq: $f, date_leq: $t }) { sum { rowsRead rowsWritten readQueries writeQueries } dimensions { date databaseId } } } } }`, { acc, f: wk, t: day });
            await run("top", `query($acc: String!, $f: Time!, $t: Time!) { viewer { accounts(filter: { accountTag: $acc }) { d1QueriesAdaptiveGroups(limit: 5, filter: { datetimeHour_geq: $f, datetimeHour_leq: $t }, orderBy: [sum_rowsRead_DESC]) { sum { rowsRead rowsWritten } count dimensions { query databaseId } } } } }`, { acc, f: new Date(Date.now() - 864e5).toISOString(), t: now.toISOString() });
          })();
          EOF2
          node q.js
