# One-off, read-only: Loading Gate phones and pairing history (run by hand)
name: Gate pairing check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 61f649b35159d4a26df7dde3c09a91dd
    steps:
      - run: |
          q(){ npx -y wrangler@4 d1 execute hub-db --remote --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s)[0].results;for(const x of r.slice(0,40))console.log("::notice title='"$2"'::"+JSON.stringify(x).slice(0,600))}catch(e){console.log("::warning title='"$2"'::"+s.slice(0,400).replace(/\n/g," "))}})'; }
          q "SELECT id, site, name, revoked, paired_at, last_seen, last_agent, created_at, (token_hash <> '') AS has_token, (pair_hash <> '') AS has_code, pair_exp FROM gate_devices ORDER BY id" devices
          q "SELECT at, site, title, body FROM hub_events WHERE app = 'gate' AND title LIKE '%paired%' ORDER BY at DESC LIMIT 40" pairings
          q "SELECT k, v FROM meta WHERE k >= 'gate:pairfail:' AND k < 'gate:pairfail;' LIMIT 20" pairfails
